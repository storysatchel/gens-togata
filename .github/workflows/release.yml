name: Build & Release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install WeasyPrint system libraries + fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libpangoft2-1.0-0 \
            libharfbuzz0b libharfbuzz-subset0 fonts-dejavu-core
          sudo fc-cache -f

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install "weasyprint>=60" "ruamel.yaml"

      - name: Render HTML + narration from content.yaml
        run: python render.py

      - name: Build PDF
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME:-dev}"
          weasyprint build/book.html "dist/The-Eternal-City-${VERSION}.pdf"
          cp audio/transcript.txt "dist/The-Eternal-City-${VERSION}-transcript.txt" || true
          ls -la dist

      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.pdf
            dist/*-transcript.txt
          generate_release_notes: true

      - name: Upload build artifact (non-tag runs)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: the-eternal-city-pdf
          path: dist/*.pdf
