name: Build & Release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "auto_release=false" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]] \
               && ! git tag --points-at HEAD | grep -q '^v'; then
            LATEST=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
            LATEST="${LATEST:-v0.0.0}"
            IFS=. read -r MAJOR MINOR PATCH <<< "${LATEST#v}"
            echo "version=v${MAJOR}.${MINOR}.$((PATCH + 1))" >> "$GITHUB_OUTPUT"
            echo "auto_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev" >> "$GITHUB_OUTPUT"
            echo "auto_release=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check renderer
        run: bun run typecheck

      - name: Build PDFs and narration
        run: |
          mkdir -p dist
          VERSION="${{ steps.version.outputs.version }}"
          INPUT="dist/Gens-Togata-${VERSION}.pdf"
          bun run src/render.tsx content.yaml "$INPUT"
          bun run src/render.tsx styleguide.yaml "dist/Gens-Togata-Style-Guide-${VERSION}.pdf"
          bun run src/impose.ts "$INPUT" "dist/Gens-Togata-${VERSION}-folio.pdf" --signature=16
          cp audio/transcript.txt "dist/Gens-Togata-${VERSION}-transcript.txt"
          ls -la dist

      - name: Publish GitHub Release (tag push, or auto patch on green main)
        if: startsWith(github.ref, 'refs/tags/') || steps.version.outputs.auto_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.pdf
            dist/*-transcript.txt
          generate_release_notes: true

      - name: Upload build artifact (non-release runs)
        if: "!startsWith(github.ref, 'refs/tags/') && steps.version.outputs.auto_release != 'true'"
        uses: actions/upload-artifact@v4
        with:
          name: gens-togata-pdf
          path: dist/*.pdf
