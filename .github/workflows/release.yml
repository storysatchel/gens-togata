name: Build & Release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install WeasyPrint system libraries + fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libpangoft2-1.0-0 \
            libharfbuzz0b libharfbuzz-subset0 fonts-dejavu-core \
            texlive-extra-utils texlive-latex-recommended
          sudo fc-cache -f

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install "weasyprint>=60" "ruamel.yaml"

      - name: Render HTML (rulebook + style guide) + narration
        run: |
          python render.py
          python render.py styleguide.yaml build/styleguide.html

      - name: Build PDFs
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME:-dev}"
          INPUT="dist/Gens-Togata-${VERSION}.pdf"
          weasyprint build/book.html "$INPUT"
          pdfbook2 --short-edge --no-crop --paper=letterpaper "$INPUT"
          mv "dist/Gens-Togata-${VERSION}-book.pdf" \
            "dist/Gens-Togata-${VERSION}-folio.pdf"
          weasyprint build/styleguide.html "dist/Gens-Togata-Style-Guide-${VERSION}.pdf"
          cp audio/transcript.txt "dist/Gens-Togata-${VERSION}-transcript.txt" || true
          ls -la dist

      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.pdf
            dist/*-transcript.txt
          generate_release_notes: true

      - name: Upload build artifact (non-tag runs)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: gens-togata-pdf
          path: dist/*.pdf
