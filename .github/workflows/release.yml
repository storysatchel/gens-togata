name: Build & Release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check renderer
        run: bun run typecheck

      - name: Install PDF imposition tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-extra-utils texlive-latex-recommended

      - name: Build PDFs and narration
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME:-dev}"
          INPUT="dist/Gens-Togata-${VERSION}.pdf"
          bun run src/render.tsx content.yaml "$INPUT"
          bun run src/render.tsx styleguide.yaml "dist/Gens-Togata-Style-Guide-${VERSION}.pdf"
          pdfbook2 --short-edge --no-crop --paper=letterpaper "$INPUT"
          mv "dist/Gens-Togata-${VERSION}-book.pdf" \
            "dist/Gens-Togata-${VERSION}-folio.pdf"
          cp audio/transcript.txt "dist/Gens-Togata-${VERSION}-transcript.txt"
          ls -la dist

      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.pdf
            dist/*-transcript.txt
          generate_release_notes: true

      - name: Upload build artifact (non-tag runs)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: gens-togata-pdf
          path: dist/*.pdf
