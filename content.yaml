        **Sacrosanct** and **Keeper of Wills** (as *Vestal Virgin*). **Suspended:** from clock 2 she loses *Sacral Authority* and cannot free or sell her slaves. **Will Not Plead:** checks to make her beg, flatter, or confess suffer [[setback setback]]. A written statement in her own words, if the PCs earn it, becomes an [[boost boost]] *Ethos* appeal for the defense.
    - label: Equipment
      text: White stola and woollen fillets; a ring of bronze keys to the will-chests; a lictor (not present after suspension).
    - label: Look
