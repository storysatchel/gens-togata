  - type: statblock
    name: Vestal Virgin
    kind: Nemesis
    desc: 'One of the six priestesses of Vesta — legally free of father and husband
      alike, keeper of the sacred flame and of Rome''s most important wills. Her person
      is sacrosanct: to lay hands on her is death.'
    chars:
      Br: '1'
      Ag: '2'
      Int: '3'
      Cun: '3'
      Will: '4'
      Pr: '4'
    derived:
      Soak: '2'
      W.T.: '12'
      S.T.: '20'
      Def (M/R): 1/1
    fields:
    - label: Motivations
      text: 'Desire: Rome''s safety & the *pax deorum*. Fear: pollution of the sacred.
        Strength: unassailable standing. Flaw: the terror of the living-burial penalty
        for unchastity.'
    - label: Skills
      text: Charm 2, Cool 2, Discipline 3, Knowledge (the Gods) 3, Knowledge (Law)
        2, Knowledge (Rome) 3, Vigilance 2.
    - label: Talents
      text: Adversary 2; Nobody's Fool 2; Patronus.
    - label: Abilities
      text: '**Sacrosanct:** any attempt to coerce, seize, or harm her suffers [[setback
        setback]] and courts ruin; violence against her is a capital sacrilege. **Keeper
        of Wills:** she safeguards the sealed wills and treasures of the great (Caesar''s,
        later Antony''s), and so knows secrets coin cannot reach — call it a Web-of-Letters
        Favor once per session. **Sacral Authority:** her reading of an omen or the
        *pax deorum* can feed a [[Fated]] party''s Story Points or halt a public act
        as surely as an augur''s, and her testimony is accepted without the oath required
        of others.'
  - type: statblock
    name: Mithraic Pater
    kind: Rival
    desc: 'A senior initiate of a *mithraeum*, often a legionary veteran or a customs
      official — the seventh grade of the brotherhood and keeper of its cave. He
      asks no questions of a brother and answers none of a stranger.'
    chars:
      Br: '3'
      Ag: '2'
      Int: '3'
      Cun: '3'
      Will: '4'
      Pr: '2'
    derived:
      Soak: 4
      W.T.: '14'
      S.T.: '16'
      Def (M/R): 0/1
    fields:
    - label: Motivations
      text: 'Desire: the brotherhood kept, and his oath kept with it. Fear: a
        member who talks. Strength: the trust of soldiers and customs men
        on both banks of the river. Flaw: he will shelter a brother who
        does not deserve it.'
    - label: Skills
      text: 'Discipline 4, Knowledge (the Gods) 3, Melee 2, Coercion 2,
        Vigilance 3, Knowledge (Rome) 2.'
    - label: Talents
      text: 'Adversary 1; Initiate of the Mysteries; Nobody''s Fool.'
    - label: Abilities
      text: '**Sevenfold Seal:** while he is engaged with fellow initiates he
        is immune to fear and to Coercion. **The Cave''s Silence:** within
        his *mithraeum* he grants a hunted man sanctuary, food, and
        silence for a night; no member will speak of who entered, and the
        seal of the grade binds even those who would sell him.'
    - label: Equipment
      text: 'A short sword, the ritual mask and torch of his grade, and a key
        to the shrine.'
