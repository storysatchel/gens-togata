    fields:
    - label: Motivations
      text: "Desire: family — his father's name and debts. Fear: loss of face — to be the second tribune unmade by the tribes. Strength: gravitas. Flaw: loyalty — to a creditor who has never had to ask."
    - label: Skills
      text: Cool 3, Discipline 3, Knowledge (Law) 2, Knowledge (Rome) 2, Leadership 2, Negotiation 2, Resilience 2.
    - label: Talents
      text: Adversary 1; Filibuster 2.
    - label: Abilities
      text: |-
        **Intercessio:** forbids the reading of the bill; nothing may be voted while the veto stands, and only he can lift it — until the principium is called (see *Procedural Trump Cards*). **Sacrosanct:** anyone who lays hands on him in anger loses 1 Dignitas, and Heat rises by 2. **The Open Door:** he may not turn a citizen away at night; at his own house, social checks against him suffer no [[setback]] for his higher Dignitas.
    - label: Equipment
      text: Plain toga (a tribune wears no purple and has no lictors), a wax copy of the bill annotated in his hand, one *viator* (use *Lictor*, without the fasces).
    - label: Look
      text: Close-cropped dark hair thinning early; a long, serious, clean-shaven face; slight build; plain undyed toga worn exactly; ink-stained fingers turning a bronze stylus.
  - type: statblock
    name: Gaius Titinius Calvus
    kind: Nemesis
    desc: |-
      Thirty-eight, the first of his family on the tribunes' bench, a fine speaker in the open air and a poor listener indoors. Built on the *Popularis Tribune*. **Wants:** the bill, and to be the man who finished what the Gracchi began — and lived. **Stance:** wants the PCs as custodes, witnesses, and messengers; generous, impatient, bad at hearing no. **Secret:** the deposition motion was drafted a week ago, and his freedman Philargyrus keeps three hundred cudgels below the Aventine “to keep order.” **Voice:** “The People gave him the office. The People can take it back. Tell me which part of that is not Roman.”
    chars:
      Br: '3'
      Ag: '2'
      Int: '3'
      Cun: '3'
