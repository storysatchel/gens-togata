    fields:
    - label: Motivations
      text: 'Desire: gloria. Fear: obscurity — ending his year with nothing to show. Strength: eloquence. Flaw: pride — cannot bear to be seen to yield.'
    - label: Skills
      text: Charm 3, Coercion 2, Knowledge (Law) 2, Knowledge (Rome) 2, Leadership 3, Negotiation 2, Streetwise 1.
    - label: Talents
