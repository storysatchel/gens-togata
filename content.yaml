  - type: h3
    text: Historical Nemeses
  - type: p
    text: The titanic personalities of the late Republic and early Empire — leaders
      whose individual ambitions, speeches, and military genius reshaped the Mediterranean
      world. These statblocks are designed to serve as supreme campaign nemeses, patrons,
      or rivals in late Republican or Augustan scenarios.
  - type: statblock
    name: Gaius Julius Caesar
    kind: Nemesis
    desc: 'The colossus: a patrician *popularis* of terrifying energy and charm whose
      oratory was merely the springboard for the fastest, boldest career Rome ever
      saw. The people adore him; the optimates are right to be afraid.'
    chars:
      Br: '3'
      Ag: '3'
      Int: '4'
      Cun: '4'
      Will: '3'
      Pr: '4'
    derived:
      Soak: '4'
      W.T.: '18'
      S.T.: '18'
      Def (M/R): 1/1
    fields:
    - label: Motivations
      text: 'Desire: Dignitas above all — to be first in everything. Fear: to be any
        man''s second. Strength: speed, genius, and the common people''s love. Flaw:
        ambition, and a clemency that spares his killers.'
    - label: Skills
      text: Melee 3, Ranged 2, Athletics 2, Charm 3, Coercion 3, Deception 3, Knowledge
        (Rome) 3, Knowledge (Warfare) 4, Leadership 4, Negotiation 3.
    - label: Talents
      text: Adversary 3; Master Orator; Commanding Presence; Patronus.
    - label: Abilities
      text: '**Celeritas:** Caesar takes two actions on his turn where another takes
        one, in war and in politics alike. **The People''s Champion:** against any
        attempt to check or shame him publicly, the plebs rally — add [[success]]
        and [[boost]] to his social checks before a crowd. **The Legions Are His:**
        his veterans'' loyalty is to him, not the state.'
    - label: At the Table
      text: The rising threat behind every late-Republican scene; a patron whose favor
        is intoxicating and ruinous. The event-horizon the whole setting bends toward.
  - type: statblock
    name: Gnaeus Pompeius Magnus
    kind: Nemesis
    desc: “The Great” — Rome's conquering hero, who reached unheard-of commands on
      military glory and patronage, not words. A reactive, uneasy public speaker who
      lets his reputation do the talking.
    chars:
      Br: '3'
      Ag: '3'
      Int: '3'
      Cun: '3'
      Will: '3'
      Pr: '3'
    derived:
      Soak: '4'
      W.T.: '20'
      S.T.: '16'
      Def (M/R): 1/1
    fields:
    - label: Motivations
      text: 'Desire: to be first citizen, and loved for it. Fear: a rival greater
        than himself (and there is one). Strength: an unmatched military record and
        a vast clientela. Flaw: vanity and indecision when the crowd is cold.'
    - label: Skills
      text: Melee 2, Ranged 2, Leadership 4, Knowledge (Warfare) 4, Coercion 2, Cool
        2, Negotiation 2.
    - label: Talents
      text: Adversary 3; Field Commander; Patronus.
    - label: Abilities
      text: '**Reputation Precedes Him:** Pompey''s Dignitas argues for him — add
        an automatic [[success]] to Leadership and first-impression checks. **But
        No Orator:** he is a reactive speaker; he suffers [[setback]] on improvised
        oratory before a hostile crowd, and must rely on spectacle, patronage, and
        his record instead.'
    - label: At the Table
      text: The model of the general-statesman — proof that in Rome standing, not
        eloquence, often wins the Forum. A patron, a rival, or the looming power behind
        a command.
  - type: statblock
    name: Marcus Porcius Cato (the Younger)
    kind: Nemesis
    desc: 'The incorruptible Stoic, great-grandson of the Censor: rigid, fearless,
      and theatrically principled — yet capable of cold pragmatic alliance when the
      Republic needs it.'
    chars:
      Br: '2'
      Ag: '2'
      Int: '3'
      Cun: '2'
      Will: '5'
      Pr: '3'
    derived:
      Soak: '3'
      W.T.: '15'
      S.T.: '18'
      Def (M/R): 0/1
    fields:
    - label: Motivations
      text: 'Desire: the *mos maiorum* restored. Fear: tyranny and corruption. Strength:
        integrity no coin can touch. Flaw: rigidity — he will break before he bends.'
    - label: Skills
      text: Coercion 2, Cool 3, Discipline 4, Knowledge (Law) 2, Knowledge (Rome)
        3, Leadership 2, Vigilance 2.
    - label: Talents
      text: Adversary 2; Stoic Discipline 2; Filibuster; Consular Gravitas.
    - label: Abilities
      text: '**Unbuyable:** immune to bribery and to strain inflicted by insult, temptation,
        or flattery (*things indifferent*). **The Filibuster:** may talk out the Senate''s
        clock to kill a motion without a vote. **The Good Death:** cornered, he will
        take his own life rather than submit — and the gesture only raises his Dignitas.'
    - label: At the Table
      text: The conscience of the Senate and the hardest bloc to move (The Theater
        of Power). Use him to make the players *earn* a vote, or as the Stoic adversary
        given a name.
  - type: statblock
    name: Marcus Tullius Cicero
    kind: Nemesis
    desc: The Republic's greatest orator — a *novus homo* who climbed to the consulship
      on his voice alone, and never lets anyone forget it. Vain, brilliant, and politically
      brave in bursts.
    chars:
      Br: '1'
      Ag: '2'
      Int: '4'
      Cun: '3'
      Will: '2'
      Pr: '4'
    derived:
      Soak: '2'
      W.T.: '13'
      S.T.: '16'
      Def (M/R): 0/1
    fields:
    - label: Motivations
      text: 'Desire: the Republic (and his own glory). Fear: obscurity and exile.
        Strength: unmatched eloquence. Flaw: vanity — flatter him and he talks.'
    - label: Skills
      text: Charm 3, Coercion 2, Deception 3, Knowledge (Law) 3, Knowledge (Rome)
        3, Leadership 2, Negotiation 3, Vigilance 2.
    - label: Talents
      text: Adversary 2; Master Orator; Nobody's Fool; Captatio Benevolentiae.
    - label: Abilities
      text: '**The Superweapon of Eloquence:** once per encounter, when Cicero wins
        an oratorical appeal he may upgrade its effect twice; on a [[triumph]] he
        sways the entire audience at a stroke. **Appeal to Pity:** he wins trials
        with weeping families and bared scars — add [[boost boost]] to a Pathos appeal.'
    - label: At the Table
      text: The advocate for — or against — the PCs in any courtroom (Scenario II);
        the consul racing to expose Catiline (Scenario I). A dangerous ally whose
        pride is a handle.
  - type: statblock
    name: Publius Clodius Pulcher
    kind: Nemesis
    desc: The infamous patrician renegade who had himself adopted by a plebeian to
      seize the tribunate, organizing armed collegia gangs to dominate the streets
      and terrorize the Senate.
    chars:
      Br: '3'
      Ag: '3'
      Int: '3'
      Cun: '4'
      Will: '3'
      Pr: '4'
    derived:
      Soak: '4'
      W.T.: '15'
      S.T.: '15'
      Def (M/R): 1/0
    fields:
    - label: Skills
      text: Charm 3, Coercion 4, Cool 3, Deception 4, Leadership 4, Melee 2, Skulduggery
        3, Streetwise 4
    - label: Talents
      text: Adversary 2 (upgrade combat checks against this target twice); Demagogue;
        Mob Rule (once per round, may spend 2 Advantage from a Coercion or Leadership
        check to command an allied street tough minion group to make an immediate
        free attack).
    - label: Equipment
      text: Fine plebeian tunic, concealed pugio dagger (Melee; Dam 5; Crit 3; Pierce
        1), heavy cudgel (Melee; Dam 6; Crit 4; Disorient 2), leather arm-guards (+1
        soak, included), purse of bribe coin.
  - type: statblock
    name: Marcus Antonius (Mark Antony)
    kind: Nemesis
    desc: 'The soldier''s soldier and crisis careerist: blunt, brave, hard-drinking,
      a reactive orator who sways troops and mobs with spectacle and plain speech
      rather than polished rhetoric.'
    chars:
      Br: '4'
      Ag: '3'
      Int: '2'
      Cun: '3'
      Will: '3'
      Pr: '4'
    derived:
      Soak: '5'
      W.T.: '20'
      S.T.: '16'
      Def (M/R): 1/1
    fields:
    - label: Motivations
      text: 'Desire: glory, pleasure, and a great man''s favor. Fear: being sidelined.
        Strength: soldiers love him. Flaw: his appetites — wine, women, and loyalty
        to the wrong patron.'
    - label: Skills
      text: Melee 3, Ranged 3, Brawl 2, Athletics 2, Charm 2, Coercion 3, Leadership
        3, Knowledge (Warfare) 2.
    - label: Talents
      text: Adversary 2; Field Commander; a rousing, reactive speaker.
    - label: Abilities
      text: '**The Soldier''s Friend:** add [[boost boost]] to rally troops or a crowd
        with blunt words and spectacle (the funeral oration that turned Rome). **Hard
        to Keep Down:** reduce Critical Injury results against him by 10 (minimum
        1).'
    - label: At the Table
      text: Muscle with a name — a dangerous ally or enforcer, and the model of the
        general who leads by swagger rather than Senate-craft.
  - type: statblock
    name: Lucius Cornelius Sulla
    kind: Nemesis
    desc: The dictator who first marched a Roman army on Rome and proscribed his enemies
      by name — the precedent that haunts every civil war to come. Charming, cruel,
      and convinced of his own luck.
    chars:
      Br: '3'
      Ag: '2'
      Int: '3'
      Cun: '4'
      Will: '4'
      Pr: '3'
    derived:
      Soak: '4'
      W.T.: '18'
      S.T.: '18'
      Def (M/R): 1/1
    fields:
    - label: Motivations
      text: 'Desire: to restore the aristocracy''s rule — by terror if need be. Fear:
        the mob and chaos. Strength: ruthlessness and uncanny fortune. Flaw: cruelty
        that outlives its usefulness.'
    - label: Skills
      text: Melee 3, Ranged 2, Coercion 4, Deception 3, Knowledge (Warfare) 3, Leadership
        3, Knowledge (Rome) 2.
    - label: Talents
      text: Adversary 3; Commanding Presence; fearsome reputation.
    - label: Abilities
      text: '**Felix (the Fortunate):** once per session Sulla may reroll any one
        check, trusting his luck. **Proscription:** he can post a name to a public
        list and make murder legal — terror that adds [[setback setback]] to anyone
        who would oppose him openly.'
    - label: At the Table
      text: The dark precedent and a towering past (or present) menace for Republican
        play — the man who proved the army could take the city.
  - type: statblock
    name: Gaius Marius
    kind: Nemesis
    desc: The new man from Arpinum who held the consulship an unheard-of seven times,
      reformed the army, and saved Rome from the northern tribes — a military genius
      and a political blunt instrument.
    chars:
      Br: '4'
      Ag: '3'
      Int: '2'
      Cun: '3'
      Will: '4'
      Pr: '2'
    derived:
      Soak: '5'
      W.T.: '22'
      S.T.: '16'
      Def (M/R): 1/1
    fields:
    - label: Motivations
      text: 'Desire: recognition the nobles deny him. Fear: being despised as a jumped-up
        peasant. Strength: the legions are his creation and his own. Flaw: no gift
        for politics or speech — clumsy and resentful in the Forum.'
    - label: Skills
      text: Melee 3, Ranged 2, Athletics 2, Leadership 4, Knowledge (Warfare) 4, Discipline
        3, Resilience 3.
    - label: Talents
      text: Adversary 3; Field Commander; Commanding Presence.
    - label: Abilities
      text: '**Third Founder of Rome:** in command of an army Marius is nearly unbeatable
        — add [[success]] to his Knowledge (Warfare) and Leadership checks in the
        field. **The New-Model Army:** his landless recruits are loyal to *him*, not
        the state — the seed of every civil war to follow. **No Orator:** [[setback
        setback]] to formal oratory.'
    - label: At the Table
      text: The template of the people's general whose soldiers outrank the Senate
        — and living proof that Rome can be ruled with a sword and almost no rhetoric
        at all.
  - type: statblock
    name: Imperator Caesar Augustus
    kind: Nemesis
    desc: The first citizen — model for every emperor who follows. He rules absolutely
      while seeming to rule not at all, having rebuilt one-man power behind the restored
      forms of the Republic. Patient, cold, and almost impossible to out-wait.
    chars:
      Br: '1'
      Ag: '2'
      Int: '4'
      Cun: '5'
      Will: '4'
      Pr: '4'
    derived:
      Soak: '3'
      W.T.: '16'
      S.T.: '22'
      Def (M/R): 1/2
    fields:
    - label: Motivations
      text: 'Desire: a stable order — with himself at its centre. Fear: a return to
        the chaos of the civil wars. Strength: patience and concealment. Flaw: he
        must control everything, and trusts almost no one.'
    - label: Skills
      text: Charm 3, Coercion 3, Deception 4, Negotiation 4, Knowledge (Rome) 4, Knowledge
        (Law) 3, Leadership 3, Vigilance 3, Cool 3.
    - label: Talents
      text: Adversary 3; Nobody's Fool 2; Plausible Deniability; Consular Gravitas;
        Pater Patriae.
    - label: Abilities
      text: '**The Mask of the Republic:** Augustus''s *known wish* is law — against
        any faction he opposes, every check suffers [[setback]] (the Emperor''s trump
        card, made flesh). **The Long Game:** immune to being out-waited or pressured;
        he can defer any decision without losing face. **Auctoritas Without Equal:**
        no one in Rome may raise their Dignitas against his in a public contest.'
    - label: At the Table
      text: 'In the default Imperial era his heirs sit the throne — use Augustus as
        the template for *your* princeps: the distant, all-seeing power whose favor
        makes careers and whose suspicion ends them.'
- title: 'Chapter 6: The Game Master'
  blocks:
  - type: p
    text: Running a campaign in Rome means managing a world that is simultaneously
      deeply alien and strikingly familiar. Like players in any modern metropolis,
      characters in Rome navigate corrupt bureaucracies, high-stakes legal battles,
      organized street gangs, and soaring economic inequality. Yet beneath this urban
      surface lies a culture governed by sacred taboos, blood sacrifice, institutionalized
      slavery, and absolute social hierarchy.
  - type: h3
    text: Depicting Life in Imperial Rome
  - type: p
    text: To bring Rome to life at the table, immerse the players in its raw sensory
      reality. Rome is not a quiet museum of white marble statues; ancient marble
      is vividly painted in bright reds, blues, and golds, while the streets are a
      riot of sound and smell. Describe the smoke of bakeries and bronze foundries,
      the pungency of fish sauce (*garum*) bubbling in cookshops, the sulfurous steam
      of public baths, and the rank stench of open gutters in the Subura.
  - type: p
    text: '**Filth, Fire, and Falling Timber.** City life is precarious. There is
      no municipal sanitation service; chamber pots are routinely emptied from top-floor
      tenement windows into the street, and rotting refuse lines alleyways. High-rise
      *insulae*, erected quickly by speculative landlords using unbaked brick and
      cheap mortar, frequently collapse without warning. Open braziers and oil lamps
      make fire an ever-present terror: a kitchen accident in a butcher''s shop can
      consume three entire city blocks before bucket-lines can form.'
  - type: p
    text: '**The Roar of the Night.** By law, commercial freight wagons are banned
      from Rome''s streets during daylight hours to prevent total gridlock. Consequently,
      sundown brings an explosion of noise: iron-shod wheels rumble over basalt paving
      stones, drovers shout at stubborn oxen, and watch dogs bark from every entryway.
      As Juvenal famously complained, only the wealthy can afford sleep in Rome.'
  - type: p
    text: '**Spectacle and Division.** Highlight the stark visual contrast between
      classes. While wealthy *honestiores* retreat behind the thick blank stone walls
      of their Palatine *domus* into silent peristyle courtyards cooled by mountain
      water, *humiliores* live in sweltering, windowless garrets under the roof tiles.
      Yet both classes share the city''s public pleasures: the communal thermal baths,
      free public grain distributions, and the deafening roar of chariot races in
      the Circus Maximus.'
  - type: h3
    text: A Living World
  - type: p
    text: 'The city of Rome is never static; events unfold constantly without waiting
      for the player characters. When the party walks down to the Forum, introduce
      ongoing background developments: news of a Dacian counter-offensive on the Danube,
      the sudden bankruptcy of a major shipping magnate, or an acrimonious treason
      trial before the Senate.'
  - type: p
    text: '**News, Rumors, and the Acta Diurna.** Citizens gather news at barber shops
      (*tonstrinae*), tavern counters, and the public baths. In the Forum, scribes
      read the *Acta Diurna* — the daily public record carved into whitewashed wooden
      boards, reporting magistrate decrees, high-society divorces, gladiatorial outcomes,
      and miraculous portents. Satirical poems and slanderous epigrams are scratched
      overnight in red ochre onto plaster walls throughout the Subura.'
  - type: p
    text: '**Omens and Religious Crisis.** Rome runs on divine consent (*pax deorum*).
      If a two-headed calf is born in the Forum Boarium or lightning strikes the Temple
      of Mars Ultor, public business freezes. The Senate meets behind closed doors
      to consult the Sibylline Books, and superstitious dread grips the plebeian quarters
      until public expiation (*procuratio prodigiorum*) is conducted. In a game, an
      unexpiated omen can impose setback dice on public or military checks across
      the city.'
  - type: p
    text: Keep in mind how remarkably thin the formal imperial administrative apparatus
      actually is. {{sidebar}}
    sidebar:
      type: sidebar
      title: The Thin Empire
      body:
      - 'Remember how *few* Romans actually governed Rome. An empire of perhaps sixty
        million people was run, at the top, by only a few hundred senior officials
        — a governor might administer a province of millions with a personal staff
        you could seat at one dinner-table. The Empire held together not through bureaucracy
        but through **local elites, patronage, religion, and sheer bluff.** This is
        why the reputation economy matters so much: in a thin state, who you know
        and how you are regarded *is* the government. It also hands the GM a sandbox
        — out in the provinces the PCs may be the only arm of Rome for a hundred miles,
        and what they decide simply becomes Roman policy.'
  - type: h3
    text: Choosing a Campaign Frame
  - type: p
    text: 'A campaign frame gives the party a unified reason to work together, defines
      their initial patron or organizational base, and establishes their relationship
      to the state. Choose one of the following six iconic frames:'
  - type: p
    text: '**The Contubernium.** The player characters are soldiers of an eight-man
      mess unit (*contubernium*) in a frontier legion on the Rhine, Danube, or in
      Britannia. Sharing a tent, cooking together, and surviving brutal discipline
      under a centurion''s vine-staff, they face border skirmishes, scout beyond the
      limes, and become entangled in their legate''s political ambitions.'
  - type: p
    text: '**The Familia Gladiatoria.** The party belongs to a gladiatorial training
      school (*ludus*), bound by oath to a lanista. The characters include gladiators,
      animal-trainers, doctors, and armorers. Together they navigate brutal arena
      politics, prepare for championship games, arrange clandestine bets, and plot
      their eventual purchase of freedom.'
  - type: p
    text: '**The Cohortes Vigilum.** The characters serve in the *vigiles*, Rome''s
      seven-thousand-man corps of night watchmen and firefighters. Patrolling the
      pitch-black streets of the Subura and Aventine with water pumps, axes, and lanterns,
      they investigate suspected arson, chase burglars, clash with private aristocratic
      bodyguards, and uncover conspiracies in the dark.'
  - type: p
    text: '**The Domus.** The party forms the trusted inner circle of an ambitious
      patrician senator or wealthy equestrian. Composed of trusted family members,
      freedman secretaries, bodyguards, and legal advocates, they manage their patron''s
      election campaigns, negotiate marriage alliances, secure grain shipments, and
      foil rival senatorial plots.'
  - type: p
    text: '**The Negotiatores.** The characters are partners in a commercial mercantile
      enterprise: shipping merchants, Greek navigators, money-lenders, and security
      guards. They transport Egyptian grain, Spanish olive oil, and Syrian luxury
      silks across the Mediterranean, confronting harbor pirates, corrupt customs
      officials, and treacherous debt-collectors.'
  - type: p
    text: '**The Mysteries.** The characters are fellow initiates in a clandestine
      foreign mystery cult — the brotherhood of Mithras among soldiers, the devotees
      of Isis among merchants, or the ecstatic rites of Bacchus. Bound across class
      lines by sacred oaths and esoteric rituals, they carry out secret missions for
      their sanctuary.'
  - type: h3
    text: Status Is the Real Rulebook
  - type: p
    text: 'In Rome, legal status is not background flavor; it directly determines
      what options exist, who can speak, and what rules apply. The fundamental divide
      is between **honestiores** (the higher orders: senators, equestrians, decurions,
      and military veterans) and **humiliores** (common citizens, freedmen, and non-citizen
      provincials). Under imperial law, *honestiores* enjoy immunity from judicial
      torture, cannot be sentenced to the arena or the mines, and suffer only exile
      or property confiscation for capital offenses. *Humiliores* face flogging, torture
      in court, and execution by crucifixion or wild beasts.'
  - type: p
    text: '**Slavery at the Table.** Roman slavery is total property ownership under
      civil law (*servitus*), yet it is complex and urban. Slaves serve not only as
      field hands but as doctors, tutors, bankers, and trusted household managers.
      A slave has no legal rights and their testimony in a criminal trial is admissible
      only when extracted under judicial torture. Yet an enslaved accountant of the
      emperor often commands more real power than a poor freeborn citizen. Handle
      slavery with historical honesty: let its legal helplessness and moral cruelty
      be felt, but reward clever players who leverage informal influence and the hope
      of legal manumission (*libertas*).'
  - type: p
    text: '**Patronage and the Salutatio.** Society is bound together by the reciprocal
      bond between patron (*patronus*) and client (*cliens*). Every morning at dawn,
      clients gather in the vestibule of their patron''s mansion for the formal morning
      greeting (*salutatio*), wearing formal togas and receiving a small cash gift
      or food basket (*sportula*). In return, clients escort their patron to the Forum,
      cheer his court speeches, and vote for his candidates. In Genesys terms, an
      active patron provides boost dice, social cover, and legal defense, but demands
      absolute loyalty and dangerous political favors in return.'
  - type: h3
    text: Dialing the Supernatural
  - type: p
    text: 'Before launching a campaign, the GM and players should agree on which of
      three supernatural dials will govern the setting:'
  - type: list
    items:
    - '**Grounded Rome.** Pure historical reality. The gods exist entirely in the
      minds and rituals of the people. Curses and omens have psychological and political
      power over superstitious Romans, but no magical energy exists. Poisons kill
      by biology, swords by physics, and history plays out without divine intervention.'
    - '**Fated Rome.** Destiny and the gods are real, subtle forces. Prophecies, curses
      inscribed on lead tablets (*defixiones*), and augural omens genuinely reflect
      the will of Jupiter and Fortuna. Story Points represent divine favor; unexpiated
      portents bring real misfortune, and unholy acts incur genuine curses.'
    - '**Mythic Rome.** The full mythic reality of classical antiquity. Gods walk
      the earth in mortal guise, sirens sing off the Campanian headlands, nymphs guard
      sacred springs, and terrifying mythic beasts prowl the edges of the provinces.
      Characters may utilize the Genesys magic rules, styling spells as divine prayers,
      Etruscan sorceries, or augural divinations.'
  - type: h3
    text: The Arena and the Races
  - type: p
    text: '**Staging the Munera.** Gladiatorial games (*munera*) are staged by a political
      sponsor (*editor*) to win the crowd''s goodwill. Encounters in the amphitheater
      should emphasize crowd psychology as much as combat mechanics. Establish a **Crowd
      Favor** track from 1 to 5: successful flashy combat maneuvers, spending Advantage
      to appeal to spectators, or striking down a hated opponent increases Favor.
      When a fighter is brought to 0 Wounds, the *editor* consults the crowd: high
      Favor grants release (*missio*), while low Favor brings the thumbs down and
      death.'
  - type: p
    text: '**Chariot Races in the Circus.** Running a chariot race utilizes the Genesys
      chase mechanics. The track is divided into four zones per lap, punctuated by
      hair-raising turns around the turning posts (*metae*). The four factions — Blues
      (*Veneti*), Greens (*Prasini*), Reds (*Russati*), and Whites (*Albati*) — engage
      in ruthless tactics: cutting opponents off, whipping rival drivers, and forcing
      wrecks (*naufragia*). Drivers make Driving checks opposed by rivals, while navigating
      the roaring, partisan stadium crowd.'
  - type: h3
    text: Competing Factions in One Room
  - type: p
    style: body
    text: 'An imperial procurator, a senatorial legate, and an equestrian publican sit
      in the same brick office at Alburnus Maior, arguing over how the silver of a
      Dacian mine is divided. The procurator wants the output entered in the
      imperial ledger before the governor can see it, and can offer the party an
      armed escort and a sealed warrant. The legate wants the mine''s surplus
      credited to his province''s roads, and can offer access to the governor''s
      court and a blind eye to their methods. The publican wants the lease renewed
      at the old rate, and can offer credit, wagons, and the mine''s own clerks.
      Refuse the procurator and his report follows the party to Rome; refuse the
      legate and the roads close to them; refuse the publican and the carts leave
      without them.'
  - type: p
    style: body
    text: 'Run every faction scene on three questions. For each faction present, decide
      what it wants from the scene, what it can offer the party, and what it will
      do if refused. Then let the factions react to each other: an offer made to
      the party is also an insult to a rival, and a favor granted in the open
      changes who will speak to them next. The party''s own faction ties set the
      opening stance — who is greeted first, who is watched, and who is treated as
      a threat.'
  - type: p
    style: body
    text: 'Adjudicate it with the social-encounter tools from *The Theater of Power*.
      Each faction''s agenda is a separate social opponent in the scene, with its
      own stance and its own threshold; appeals are aimed at a particular faction
      rather than at the room, and the oratory structure and the Senate-bloc
      commitment rules apply unchanged. Spending a Favor on a faction, or a Story
      Point under the Step 6 faction rule, shifts one agenda''s stance; the rest of
      the room watches and remembers.'
  - type: p
    style: body
    text: 'A faction the party burns does not vanish. It becomes an adversary: its
      agents appear among the profiles in Chapter 5, its clerks refuse the party''s
      drafts, and it may call in the obligation the party ignored — the same lever
      the GM holds under the Step 6 Story Point rule. Treat a burned faction as a
      standing complication with a name, not a closed door, and let the party earn
      their way back with a favor they will not enjoy paying.'
  - type: h3
    text: Roman Adventure Builder
  - type: p
    text: The following adventure builder allows the Game Master to rapidly construct
      adventures steeped in the authentic political, military, and urban themes of
      ancient Rome. To build an adventure, select or roll one entry each from **Hooks**,
      **Escalations**, and **Climaxes**. Combining these modular elements produces
      an adventure with clear initial stakes, sudden dramatic twists, and a memorable
      moral or social dilemma.
  - type: p
    text: 'Every entry below turns on a collision between two of the six faction types
      described in the earlier chapters — a tax syndicate and a senatorial house, a
      priestly college and a ward, one circus color and its rival. Name both
      factions before play begins, note which one the party''s current obligations
      already favor, and record which faction the party ends up owing when the
      adventure closes; that debt is the next session''s opening.'
  - type: h4
    text: Hooks
  - type: p
    text: Hooks provide the starting premise and initial goals that draw the characters
      into the action. Each hook outlines the Primary Goals, Challenges, and an unexpected
      Twist.
  - type: p
    text: '**1. The Stolen Will (Testamentum).** A wealthy equestrian merchant dies
      suddenly at his villa, leaving secret wax tablets that grant freedom to his
      household slaves and substantial bequests to loyal clients. His estranged patrician
      heirs claim the will was forged and hire thugs to seize the original tablets
      before they can be deposited with the Vestal Virgins.


      *Primary Goals:* Retrieve the true wax will from the deceased''s study and safely
      deposit it in the Temple of Vesta.

      *Challenges:* Breaking into the sealed estate without alerting vigiles; deciphering
      Greek shorthand notes; dodging hired street toughs.

      *Twist:* The deceased secretly bequeathed a large share of his estate to the
      Emperor, meaning anyone concealing or altering the will commits high treason
      (*maiestas*).'
  - type: p
    text: '**2. The Provincial Shakedown (Repetundae).** Provincial delegates from
      Asia arrive in Rome carrying ledgers and witness affidavits documenting millions
      of sesterces extorted by their former governor. The governor, now back in Rome
      running for the consulship, deploys assassins to eliminate the delegates before
      they can lodge an indictment.


      *Primary Goals:* Protect the provincial envoys and deliver their evidence to
      the presiding praetor.

      *Challenges:* Protecting foreign provincials who speak broken Latin in hostile
      Subura inns; avoiding paid lictors; resisting bribery.

      *Twist:* The governor''s chief accuser among the delegates was actually his
      primary accomplice, seeking to eliminate his former master to keep the stolen
      provincial tax funds.'
  - type: p
    text: '**3. The Grain Fleet Mutiny (Annona).** Sailors and stevedores of the Alexandrian
      grain fleet at Portus have staged a strike over withheld wages, halting grain
      deliveries to Rome. Bread prices in the Subura are skyrocketing, and bread riots
      are hours away from exploding.


      *Primary Goals:* Travel to Portus, negotiate an end to the dock strike, and
      release the grain convoys.

      *Challenges:* De-escalating violent waterfront brawls; uncovering harbor officials
      skimming wheat; navigating hostile guild politics.

      *Twist:* The grain in the locked warehouses is rotting with black ergot mold;
      shipping officials staged the strike as an excuse to avoid disclosing that the
      shipment is lethally contaminated.'
  - type: p
    text: '**4. Blood in the Subura.** A favored freedman secretary belonging to an
      influential senatorial patron is discovered with his throat slit in a squalid
      Subura brothel. The local urban cohorts threaten to arrest and crucify every
      slave in the insula unless the real killer is produced by sunset.


      *Primary Goals:* Investigate the murder scene and capture the killer before
      the innocent tenement residents are executed.

      *Challenges:* Questioning terrified brothel workers; tracking bloodstains across
      rain-slick rooftops; evading Subura gang patrols.

      *Twist:* The freedman was murdered by his own patron to prevent him from revealing
      a secret illegal grain monopoly.'
  - type: p
    text: '**5. The Runaway Slave (Fugitivus).** A skilled Greek physician slave has
      escaped from a prominent senatorial domus, taking with him private medical journals
      containing senatorial secrets and poison formulas. The party is hired as professional
      slave-catchers (*fugitivarii*) to retrieve him unharmed.


      *Primary Goals:* Track the fugitive doctor through the underworld of Rome and
      recover his medical codex.

      *Challenges:* Infiltrating Transtiberim safe-houses; dealing with corrupt slave-dealers;
      navigating foreign religious sanctuaries.

      *Twist:* The physician fled because his master commanded him to administer a
      fatal poison to a blameless Vestal Virgin; capturing him condemns the innocent
      priestess to death.'
  - type: p
    text: '**6. The Sacred Prodigy (Prodigium).** On the eve of consular elections,
      a violent thunderbolt strikes the statue of Jupiter on the Capitoline Hill.
      Conservator augurs declare the elections polluted by religious impurity, while
      popularis demagogues claim the omen was fabricated with hidden chemical pitch
      pots.


      *Primary Goals:* Investigate the lightning strike site and determine whether
      the prodigy was genuine or manufactured.

      *Challenges:* Gaining access to the cordoned Capitoline sanctuary; interrogating
      secretive priests; calming panicked plebeian mobs.

      *Twist:* The prodigy was engineered by a cabal of high priests who discovered
      an actual military coup was planned for election day.'
  - type: p
    text: '**7. The Stolen Tax Ledger (Tabulae Publicanorum).** A syndicate clerk has
      fled the *Basilica Aemilia* with the duplicate ledgers of a five-year tax
      lease, and the Financial Interest wants them back before a senatorial
      extortion court can read them. The senator prosecuting the syndicate for
      *repetundae* offers the party a share of the recovered estate; the
      syndicate''s factor offers twice as much and a debt cancelled.


      *Primary Goals:* Recover the ledgers before either side''s agents reach the
      clerk, and decide which copy to hand over.


      *Challenges:* Tracing a frightened clerk through the Subura''s lodging
      houses; reading abbreviated entries in two hands; keeping the ledgers out
      of the hands of the urban cohorts.


      *Twist:* The ledgers are genuine, and they show that the prosecuting
      senator held shares in the same lease under a freedman''s name.'
  - type: p
    text: '**8. The Circus Conspiracy (Factiones Circenses).** The Blues and the
      Greens each claim the coming consular race was sold before the starting
      gates opened, and each faction''s agent wants the party to prove the other
      side did it. The Blues offer seats near the imperial box and the ear of a
      senator; the Greens offer stables, drivers, and the goodwill of the crowd.


      *Primary Goals:* Discover who bought the race, and keep the discovery from
      becoming a street war between the colors.


      *Challenges:* Getting into the stables and the drivers'' quarters; reading
      a betting book without its owner''s leave; surviving the arcades when the
      colors meet.


      *Twist:* Both factions paid the same driver through different agents, and
      neither knows the other did.'
  - type: p
    text: '**9. The Vestal''s Vow (Crimen Incesti).** The pontifical college has
      opened an inquiry into a Vestal''s chastity, and the senatorial house that
      raised her will do anything to keep the verdict from reaching the
      pontifex. The college offers the party the temple records and the
      protection of its sacral authority; the family offers money, a marriage,
      and a debt forgiven.


      *Primary Goals:* Establish what the inquiry can prove, and keep the Vestal
      alive until the college rules.


      *Challenges:* Reading the temple''s sealed records without a priest''s
      leave; finding witnesses willing to speak against a senatorial house;
      keeping the family''s men from reaching the Vestal''s attendants.


      *Twist:* A rival house brought the charge to ruin the family''s election
      chances, and the Vestal knows it.'
  - type: p
    text: '**10. The Underground Cell (Coetus Nocturnus).** The Praetorian Guard has
      orders to break a clandestine congregation — a Christian *titulus* in a
      Transtiberim insula, or a Mithraic cell beneath a customs station — and
      the ward (*vicus*) that shelters it will be searched house by house. The
      Guard offers the party a warrant and a share of the confiscations; the
      congregation''s elders offer silence, shelter, and a road out of the city
      for anyone the party names.


      *Primary Goals:* Reach the meeting place before the Guard does, and decide
      who is warned and who is left to the raid.


      *Challenges:* Moving through a ward where every doorway is watched;
      keeping a congregation from scattering into the raid; hiding a name that
      will be tortured out of someone else.


      *Twist:* The informer who gave the Guard the address is a ward-master
      settling a private quarrel, and the Guard knows it.'
  - type: h4
    text: Escalations
  - type: p
    text: Escalations introduce a sudden surge in opposition, expand the scale of
      the conflict, or complicate the party's alliances mid-adventure.
  - type: p
    text: '**1. Imperial Frumentarii Intervene.** The emperor''s secretive military
      intelligence officers (*frumentarii*) arrive with warrants. They seize key witnesses,
      cordon off streets, and demand the player characters surrender all evidence
      under threat of treason.

      *New Challenges:* Operating under constant surveillance; hiding witnesses from
      imperial agents; discovering whether the frumentarii are loyal to Caesar or
      working for a rival faction.'
  - type: p
    text: '**2. Mob in the Streets.** Rumors spark a riot in the plebeian quarters.
      The Forum Boarium and Subura are blocked by burning carts and enraged crowds
      hurling roof tiles at magistrates. All travel checks increase in difficulty,
      and the party must cross the city through chaos.

      *New Challenges:* Surviving charging mobs; navigating burning barricades; protecting
      vulnerable allies from crowd violence.'
  - type: p
    text: '**3. Patron''s Ultimatum.** The party''s own aristocratic patron summons
      them to his Palatine atrium. He reveals that their current investigation threatens
      his closest senatorial ally and commands them to drop the case or plant fabricated
      evidence.

      *New Challenges:* Resolving conflicting loyalties; finding a way to obey the
      letter of their patron''s orders while pursuing the truth; risking loss of social
      standing and legal protection.'
  - type: p
    text: '**4. The Poisoned Banquet.** During a tense dinner negotiation at an elite
      villa, the host or a key witness suddenly collapses into convulsions from poisoned
      wine. The villa gates are locked by armed bodyguards, and the party is accused
      of the crime.

      *New Challenges:* Administering emergency medicine to keep the victim alive;
      exposing the true poisoner before guards draw steel; escaping a fortified suburban
      estate.'
  - type: p
    text: '**5. Ward Mobilization (Secessio Vicana).** The ward-masters shutter the
      shops and barricade the Subura, and the *vicomagistri* of three *vici*
      refuse to open the streets until their grievance is heard. The party''s
      route, their informants, and their supplies all run through ground the
      wards now hold.


      *New Challenges:* Crossing a barricaded district without a ward-master''s
      leave; finding the one grievance that will reopen the streets; keeping the
      urban cohorts from forcing the barricades and turning a protest into a
      massacre.'
  - type: p
    text: '**6. The Tribune''s Veto (Intercessio).** A tribune bought by the party''s
      opponents interposes his *sacrosanctitas* and halts the proceeding they
      need — a vote, a prosecution, a magistrate''s order. The tribune cannot be
      touched, sued, or compelled, and he knows it.


      *New Challenges:* Finding what the tribune actually wants, since the money
      was only a retainer; persuading him to withdraw without humiliating him;
      working around a veto that stops every lawful route at once.'
  - type: h4
    text: Climaxes
  - type: p
    text: Climaxes bring the adventure to an intense, high-stakes conclusion, presenting
      players with a dramatic challenge and a moral or social decision.
  - type: p
    text: '**1. Showdown in the Basilica.** The conflict culminates in a public trial
      before the praetor''s tribunal in the packed *Basilica Julia*. Surrounded by
      hundreds of shouting spectators, jury members, and armed lictors, the party
      must deliver a decisive speech or produce conclusive physical proof while rival
      advocates use legal filibusters and bribed claqueurs to silence them.

      *New Challenges:* Winning a complex social encounter against skilled advocates;
      swaying a hostile jury; weathering public slander.'
  - type: p
    text: '**2. Into the Arena.** Betrayed and framed, the party is cast into the
      arena sand during the afternoon games at the Colosseum. Faced with imported
      beasts and veteran gladiators before an audience of thousands, they must survive
      the combat and use their oratorical skills to win the favor of the crowd and
      emperor.

      *New Challenges:* Fighting for survival against beasts and rivals; rallying
      spectators to demand their release (*missio*); turning the spectacle against
      their enemies.'
  - type: p
    text: '**3. The Midnight Purge.** The villain dispatches an armed force of gladiators,
      street thugs, and corrupt guards to exterminate the party and burn their safehouse.
      The climax becomes a running tactical battle across the darkened streets and
      rooftops of the city.

      *New Challenges:* Fortifying an insula against assault; fighting in darkness;
      setting traps in narrow alleyways; escaping across the Tiber by boat.'
  - type: p
    text: '**4. The Emperor''s Audience.** The characters secure a private nocturnal
      audience with the Princeps himself in the Palatine palace. In the presence of
      the emperor and his closest advisors, the party has one chance to present the
      unvarnished truth, knowing that a single false step will result in immediate
      execution for treason.

      *New Challenges:* Overcoming consular gravitas and royal intimidation; navigating
      dynastic rivalries; accepting a morally painful imperial compromise.'
  - type: p
    text: '**5. Night Run to Portus.** The evidence must reach the grain harbours
      before dawn, and the only road is the Tiber. The party runs a fast boat
      downriver past the river patrols, the customs cutters, and the chains at
      Ostia, with the men who want the evidence sunk close behind.


      *New Challenges:* Navigating the Tiber at night past sandbars and bridges;
      passing a customs inspection with a sealed cargo; keeping the boat afloat
      when the pursuit begins; landing the evidence with the grain prefect''s own
      clerks before the harbour opens.'
  - type: p
    text: '**6. Sanctuary on the Capitoline.** The party''s quarry — or the party
      itself — takes refuge on the steps of the Temple of Jupiter Optimus
      Maximus, where the law stops at the threshold. A lictor troop waits below
      with the magistrate''s warrant, the priests refuse to give up anyone
      inside, and the crowd on the Clivus watches to see which authority yields
      first.


      *New Challenges:* Holding a sanctuary against armed men without beginning
      a sacrilege; negotiating with a magistrate who cannot afford to lose face;
      deciding whether to hand over the fugitive, fight on sacred ground, or
      find a third road out of the temple precinct.'
  - type: h2
    text: Starter Scenarios
  - type: p
    style: lead
    text: 'Six ready-to-run scenarios, each drawn from a real episode of Roman history,
      and each built in the three-act shape of a published one-shot: a **synopsis**
      for the GM, **acts** broken into scenes with *read-aloud* boxes, GM notes on
      “what''s really going on,” suggested skill checks, and a **conclusion** with
      rewards. Adversaries refer to the stat blocks earlier in this book; a scenario''s
      named villain gets a quick custom profile. Together they exercise the whole
      toolkit — intrigue and the Senate, the law-court, the burning city, the pontifical
      college, the treasury''s seals, and the voting assembly — and lean hard on the
      social engine in *The Theater of Power.*'
  - type: p
    style: small
    text: '**On era:** scenarios I–III belong to the late Republic and early Empire
      (70–63 BCE and 64 CE); IV is set under Domitian (*c.* 90 CE), V under Trajan
      (*c.* 103 CE), and VI in the Republic (117 BCE), because only a Republican assembly
      voted on laws. IV–VI use original characters against a documented background.
      Run each in its own period, or shift the older ones into the default High Empire
      by swapping “consul” for “Prefect,” “Senate vote” for “the Emperor''s council,”
      and the named historicals for original figures — the bones work in any Roman
      century. **Rewards** assume 15–20 XP per scenario and note Dignitas/Favor changes
      that feed the reputation economy.'
  - type: scenario
    text: I. The Enemy Within
  - type: synopsis
    text: Rome, 63 BCE. A bankrupt, charismatic aristocrat — Lucius Sergius **Catilina**
      — is plotting to murder the consuls, burn the city, and cancel all debts in
      the chaos. The consul Cicero knows something is afoot but cannot prove it. The
      PCs are his agents (or the city's *tresviri*/watch). Over three acts they survive
      an assassination, spring a trap to seize written proof, and then win — or lose
      — the **Senate debate** that decides whether captured conspirators die without
      trial. A showcase for investigation, intrigue, and the Senate rules.
  - type: p
    style: act
    text: Act I — The Knock at Dawn
  - type: readaloud
    text: 'Before cock-crow, a hammering at the door. Your patron''s man is breathless:
      “Two strangers came to kill the consul in his bed this very hour — turned away
      at the door. The master wants you. There is a plot, and he must have proof before
      the Senate will believe a word of it.”'
  - type: p
    style: body
    text: 'The PCs are set to uncover Catiline''s conspiracy. Starting threads: question
      the would-be assassins'' contacts in the Subura; shadow known malcontents —
      indebted nobles and Sulla''s dispossessed veterans; trace a rumor that the plotters
      mean to rise in **Etruria** under the old centurion **Manlius**.'
  - type: p
    style: body
    text: '**What''s going on:** Catiline is real, the plot is real, but he is untouchable
      — a senator with friends — until the PCs produce *physical, written* evidence.
      Combat here is a street ambush by hired muscle (*Street Tough* minions, 1 *Bandit/Latro*
      rival) meant to scare the PCs off.'
  - type: p
    style: body
    text: '**A clue you cannot buy.** A **Vestal Virgin** carries an omen no bribe
      can reach: at a December sacrifice the altar-flame suddenly flares, and she
      reads it as a warning — word goes to a sympathetic magistrate (or the PCs) to
      strike *now*. In a [[Fated]] Rome the portent feeds the party''s Story Point
      pool. (Historically, Vestals including Fabia — once tried for *incestum* with
      Catiline himself, and acquitted — did exactly this in 63 BCE.)'
  - type: p
    style: act
    text: Act II — The Trap at the Bridge
  - type: p
    style: body
    text: 'The PCs learn the conspirators are courting a visiting embassy of the Gallic
      **Allobroges** — promising them debt relief for a rebellion in Gaul. The envoys
      are wavering. The play: persuade the Allobroges to turn double-agent and demand
      *signed letters* from the plotters as “proof of good faith,” then intercept
      those letters as the envoys leave the city by night over the **Mulvian Bridge**.'
  - type: readaloud
    text: The torches of the envoys' escort bob toward the Mulvian Bridge. Somewhere
      in a saddlebag ride letters sealed with the rings of men who dine at the best
      tables in Rome — enough to hang them all. Across the span, you hear the escort's
      hooves slow. It is time.
  - type: p
    style: body
    text: '**What''s going on:** this is the historical masterstroke — the plot was
      broken by paperwork, not swords. Reward clever capture of the sealed letters;
      a botched grab means the PCs must testify on their own word in Act III, with
      every check upgraded.'
  - type: p
    style: act
    text: Act III — The Senate Decides
  - type: p
    style: body
    text: 'With ringleaders arrested and the letters read aloud, one question remains
      and it tears the Senate apart: **execute Roman citizens without trial?** Run
      this as the Senate contest from *The Theater of Power.* Blocs: the *Hardliners*
      (behind Cato, for death), the *Moderates* (behind Caesar, for life imprisonment),
      and the *Undecided*. The PCs speak, sway blocs, and manage the trump cards.'
  - type: readaloud
    text: 'Cicero yields the floor. A young Gaius Julius Caesar rises: “Death is a
      release from suffering, not a punishment… I propose their property be seized
      and their persons confined.” A cold silence — then Marcus Cato, on his feet,
      voice like a hammer: “We have talked long enough. While we debate, the enemy
      is at the gates. These men are traitors. Let them die as traitors.” Every eye
      turns to you.'
  - type: p
    style: body
    text: '**The choice:** there is no “correct” outcome. Execution ends the crisis
      but stains everyone who voted for it (history hounded Cicero into exile for
      exactly this). Clemency is lawful but leaves live enemies. Let the PCs own the
      consequence.'
  - name: Lucius Sergius Catilina
    kind: Nemesis
    desc: Ruined nobility turned revolutionary — magnetic, fearless, genuinely dangerous.
      If cornered in Rome he flees to Manlius's army in Etruria, to die sword in hand
      at **Pistoria** (a climactic battle, if your group wants one).
    chars:
      Br: '3'
      Ag: '3'
      Int: '3'
      Cun: '3'
      Will: '3'
      Pr: '4'
    derived:
      Soak: '5'
      W.T.: '16'
      S.T.: '16'
      Def: 1/1
    fields:
    - label: Motivations
      text: 'Desire: power / to remake Rome. Fear: obscurity & debt. Strength: courage.
        Flaw: pride.'
    - label: Skills
      text: Charm 3, Coercion 3, Cool 2, Deception 2, Leadership 3, Melee 3, Knowledge
        (Rome) 2.
    - label: Talents
      text: Adversary 2; Demagogue; Scathing Tirade.
    - label: Equipment
      text: gladius, the loyalty of desperate men.
    - label: Dignitas 3
      text: (falling fast).
    type: statblock
  - type: p
    style: small
    text: '**Rewards:** 20 XP. Exposing the plot with hard proof: +1 Dignitas and
      a powerful Favor from Cicero. Botching the proof or siding with the losing Senate
      bloc: no Dignitas, and a watchful enemy among the survivors.'
  - type: scenario
    text: II. The Trial of the Governor
  - type: synopsis
    text: '70 BCE. **Gaius Verres** has returned from three years as governor of Sicily,
      having stripped the province of its art, its grain, and its justice — crucifying
      even a Roman citizen who dared appeal. The wronged Sicilians have hired the
      PCs (or an advocate they serve) to bring him to court. But Verres is rich, his
      jury is buyable, and his agents are already silencing witnesses. Two acts: build
      the case, then win the trial. A pure showcase for the **courtroom** rules and
      the social engine. This is the archetypal *repetundae* (provincial-extortion)
      case before the *quaestio de repetundis*, brought — as such cases were — the
      year after his command ended. Cicero''s real victory came not from a grand oration
      but from burying Verres under witnesses and documents before the delaying tricks
      could push the trial into next year''s friendlier court; the jury''s composition
      (senators vs *equites*) was itself a political prize.'
  - type: p
    style: act
    text: Act I — Building the Case
  - type: readaloud
    text: Sicily remembers. In a dim Syracusan portico a shipowner shows you the whip-scars;
      a priest weeps over an empty plinth where a god once stood in bronze; a widow
      presses a tally-stick of stolen grain into your hand. “He took everything,”
      she says. “Make them listen in Rome.”
  - type: p
    style: body
    text: 'The PCs gather witnesses, documents, and stolen treasures to exhibit. Verres''s
      men work against them: bribing officials to “lose” records, intimidating or
      buying off witnesses, and — if that fails — arranging accidents.'
  - type: p
    style: body
    text: '**What''s going on:** every secured witness and exhibit is banked [[advantage]]
      for Act II; every one lost or discredited becomes a [[setback]] the defense
      will wield. Verres''s strategy is delay — drag the trial past the holidays and
      into next year''s friendlier court.'
  - type: p
    style: act
    text: Act II — The Court
  - type: p
    style: body
    text: Run the trial as the **courtroom** set-piece. The jury (Hard audience, strain
      threshold 14; raise it for every juror Verres has bribed) must be driven past
      its threshold to convict. Verres's defense is led by the most famous advocate
      in Rome; the PCs (or their patron) prosecute.
  - type: readaloud
    text: 'The benches are packed; half of Rome has come to watch the great advocate
      defend the indefensible. He smiles at you across the court, utterly confident.
      Then you do the unexpected: instead of a grand opening oration, you simply call
      your first witness, and let Sicily speak for itself.'
  - type: p
    style: body
    text: '**What''s going on:** as in history, overwhelming evidence can break a
      defendant''s nerve before the verdict — if the PCs land a [[triumph]] Critical
      Remark or drive Verres himself past a personal strain threshold, he may bolt
      into **voluntary exile** (to Massilia, with his loot) rather than face the vote.
      A full conviction is possible but harder.'
  - name: Gaius Verres
    kind: Nemesis
    desc: A plump, pleasure-loving plunderer who believes money can buy anything —
      because so far it always has.
    chars:
      Br: '2'
      Ag: '2'
      Int: '3'
      Cun: '4'
      Will: '2'
      Pr: '3'
    derived:
      Soak: '2'
      W.T.: '12'
      S.T.: '14'
      Def: 0/1
    fields:
    - label: Motivations
      text: 'Desire: wealth & comfort. Fear: poverty / ruin. Strength: cunning. Flaw:
        avarice.'
    - label: Skills
      text: Charm 2, Coercion 2, Deception 3, Negotiation 3, Knowledge (Law) 2, Knowledge
        (Rome) 2.
    - label: Abilities
      text: Deep Purse — may spend a Story Point to pre-bribe one juror (+[[setback]]
        to a prosecution appeal) or to buy a thug.
    - label: Dignitas 3.
      text: Defended by a Stoic Philosopher-style advocate (use that stat block as
        the opposing orator).
    type: statblock
  - type: p
    style: small
    text: '**Rewards:** 15 XP. A conviction or a flight-into-exile: +1 Dignitas for
      the lead prosecutor and the gratitude (Favors) of a whole province. Losing a
      bought jury: the Sicilians are ruined, and the PCs have made a rich, vindictive
      enemy.'
  - type: scenario
    text: III. The City Burns
  - type: synopsis
    text: 'Rome, July 64 CE. Fire erupts near the Circus Maximus and races through
      the tinder-dry tenements. For six days and seven nights it devours the city.
      The PCs — *vigiles*, or simply people caught in it — fight the flames, save
      who they can, and then confront the ugly aftermath: a terrified city demanding
      someone to blame, an Emperor under suspicion, and a convenient scapegoat in
      a small, strange sect. Three fast acts of disaster, investigation, and moral
      weight; a showcase for the watch, crowds, and hard choices.'
  - type: p
    style: act
    text: Act I — The Red Night
  - type: readaloud
    text: You smell it before you see it — then the sky over the Circus goes orange,
      and the screaming starts. The fire is already in the shops under the stands,
      running on the wind faster than a man. Narrow streets choke with people and
      carts. Somewhere above you, a tenement block of five storeys begins to burn,
      and it is full of families.
  - type: p
    style: body
    text: 'A disaster set-piece: the PCs fight fire and save lives. Use skill challenges,
      not a monster to kill — the enemy is the blaze, the crowd, and the clock.'
  - type: p
    style: act
    text: Act II — Ash and Rumor
  - type: p
    style: body
    text: 'The fire dies. In the smoking ruin, the city gropes for a reason. Three
      rumors spread like a second fire: that it was an accident (lamp-oil and wind);
      that criminals set it to loot; and — most dangerous — that the **Emperor himself**
      ordered it, to clear ground for a golden palace. The authorities need another
      answer, fast.'
  - type: readaloud
    text: A magistrate's man finds you in the ash. “The Prefect wants the truth —
      or something that will pass for it before the mob turns on the Palatine. There's
      a sect down by the river. Foreigners. They talk of the world ending in fire
      and a kingdom not of Rome. People are already saying it was them. Go and… confirm
      it.”
  - type: p
    style: body
    text: '**What''s going on:** the PCs will find the Christians are innocent. The
      pressure to say otherwise — from a frightened Prefect, a *Delator* smelling
      reward, and a mob that wants blood — is enormous.'
  - type: p
    style: act
    text: Act III — The Scapegoats
  - type: p
    style: body
    text: The choice lands. The sect is to be rounded up and butchered in the arena
      and the imperial gardens — burned as living torches — “as if they were to blame
      for the great fire.” The PCs can go along with the lie (safe, rewarded, complicit);
      expose the truth (dangerous — it points back at the Palatine); or try to get
      innocents out of the city before the arrests (a tense extraction).
  - type: p
    style: body
    text: '**What''s going on:** there is no clean win, which is the point. History
      records the slaughter went ahead, and even bloodthirsty Romans came to pity
      the victims. Let the PCs'' courage or complicity echo — in their Dignitas, in
      who owes them, and in who now watches them.'
  - type: p
    style: small
    text: '**Adversaries:** the fire (environmental), *Street Tough* looters and *Urban
      Cohort* watchmen, a *Delator*, and a crowd run with the *Demagogue*/mob rules.
      **Rewards:** 15–20 XP scaled to lives saved in Act I. Saving the innocent at
      real risk: +1 Dignitas with those who value honor (and a dangerous secret about
      the fire''s true cause). Taking the safe, complicit path: coin and a Favor from
      the Prefect — and a quiet 1-point loss of Dignitas among those who know what
      you did.'
  - type: scenario
    text: IV. The Lightning Girl
  - type: synopsis
    text: 'Rome and the Alban Hills, autumn, c. 90 CE, in the reign of Domitian —
      who is also *Pontifex Maximus*, head of the college that judges the Vestal Virgins.
      A storm on the Via Appia below Bovillae kills a knight''s fourteen-year-old
      daughter as she rides a horse loosed from the family carriage. The bolt strips
      her body bare and kills the horse. The priests read the omen as their predecessors
      did in 114 BCE: a virgin''s vow has been broken, and a knight shares the guilt.{{1}}
      Two days later a slave comes forward and offers to swear that his own master
      and the Vestal **Numisia Procula** have been lovers, and he names others, among
      them the PCs'' patron. **Stakes:** if the charge stands, a Vestal is buried
      alive by the Colline Gate and the men are beaten to death with rods. If it is
      false, an informer has used the city''s fear of the gods to take rich men''s
      estates. **Hook:** find out who coached the slave before he swears his statement
      to the college. **Tone:** grim and paranoid. Nobody can be trusted, and fear
      of the emperor decides as much as the evidence does. **Length:** one long session,
      or two if Act II is played in full. **Showcases:** investigation against a clock,
      the Favor economy, Cross-Examine, and the sacral trial from *The Theater of
      Power* (a courtroom where the pontifical college is the audience). Several endings
      are possible, and none is clean. The Chief Vestal Cornelia stays off-stage.
      She has been acquitted once already, and this affair can lead into her own second
      trial.'
  - type: p
    style: act
    text: Act I — The Road Below Alba
  - type: readaloud
    text: The storm has passed by the time you reach the twelfth milestone. A carriage
      stands in the ditch with its traces cut. Twenty paces off, under a cloak someone
      has thrown over her, lies a girl. Her clothes, her sandals, and the gold at
      her throat were torn from her and scattered across the paving. Near her is a
      dead bay mare, its harness split and burnt. A haruspex in a fringed cloak is
      pacing out a square around the place with cord and stakes. A man in a knight's
      narrow-striped tunic kneels in the mud and does not look up. On the road behind
      you a rider is already heading for Rome.
  - type: p
    style: body
    text: '**What''s going on:** the strike was a real accident. The use being made
      of it was planned in advance. **Gaius Turpilius Naso**, an informer (*delator*)
      who prosecutes for a share of condemned men''s estates, has kept a coached witness
      ready for months and was waiting for a public sign to use him. When word came
      from the Appia, Naso''s freedman reported the prodigy to the consuls'' office
      before the girl''s own father could, and he handed the priests the 114 BCE precedent
      written out on a tablet. A second rider reached the body before the haruspex
      and took the girl''s scattered ornaments. Naso wants them in case he needs a
      “sign” to show the college later. The girl is **Herennia Paulla**, and her father
      is the knight **Lucius Herennius Macer**. He is broken with grief and wants
      someone to pay for it.'
  - type: p
    style: body
    text: '**The informer.** At dusk on the second day, **Phileros**, door-slave (*ostiarius*)
      to the knight **Aulus Mettius Varus**, presents himself at the house of the
      promagister of the pontiffs. He says his master has visited the House of the
      Vestals at night for two years and lain with Numisia Procula, and that other
      men came too. He names the PCs'' patron, the praetorian senator **Lucius Sabidius
      Gallus**, who is also Numisia''s cousin. Under Roman law a slave could not ordinarily
      give evidence against his master, but incest was the exception.{{2}} His sworn
      statement to the college is set for the Nones, three days off.'
  - type: p
    style: body
    text: '**Routes in:** *the patron* — Sabidius Gallus calls the PCs in before dawn:
      “I am named. Find who taught that slave his lines before the pontiffs hear them.”
      *A named PC* — a PC of Dignitas 2–3 is one of the men Phileros named, and their
      own neck is at stake. *The father* — Herennius Macer hires the PCs to find “who
      defiled the gods.” They start on the prosecution''s side and find the frame
      from the inside. *The Atrium* — the Vestal''s steward calls in a Favor the PCs
      owe the order. *The watch* — *Urban Cohort* PCs are posted to guard the lightning-ground,
      or to escort the informer to the promagister.'
  - type: p
    style: body
    text: '**Checks.** *At the road:* an **Average** ([[difficulty difficulty]]) Medicine
      check reads the body. The branching burns and the shredded seams are the work
      of lightning, and of nothing else. With [[advantage advantage]], the PC sees
      that her necklace, ear-drops, and bulla are missing; they were picked up, not
      blown away. A **Hard** ([[difficulty difficulty difficulty]]) Perception check
      finds the second rider''s hoofprints, which come and go before the haruspex''s.
      An **Average** ([[difficulty difficulty]]) Knowledge (the Gods) check predicts
      the reading the priests will give: nakedness means a broken vow, and the horse
      means a knight. A [[triumph]] notices that the haruspex is reading the old precedent
      off a tablet someone handed him. *In the city:* an **Average** ([[difficulty
      difficulty]]) Streetwise or Knowledge (Rome) check finds out who reported the
      prodigy first. A **Hard** ([[difficulty difficulty difficulty]]) Charm check
      with Herennius Macer gets him to talk instead of strike. He says a well-dressed
      stranger offered him “justice for the girl” that same night.'
  - type: p
    style: body
    text: '**Complications:** a [[despair]] at the road makes Macer take the PCs for
      agents of the polluted. He is then a hostile witness in Act III, and he adds
      a [[setback]] to every defense appeal. Country people gather at the stakes,
      and pushing through them in a hurry provokes a *Street Tough*-grade crowd.'
  - type: procedure
    title: The Expiation Clock (start at 1; Act III opens at 6)
    steps:
    - '**Ticks:** +1 for each day that passes (a major investigative scene takes half
      a day). +1 for each [[despair]] on a public-facing check. +1 when Naso learns
      the PCs are working against him. +1 when the GM reports a new prodigy (a mule
      foaling, blood in a spring at Lanuvium). **−1, once:** a PC arranges and pays
      for a public expiatory sacrifice through a friendly pontiff. This takes a **Hard**
      ([[difficulty difficulty difficulty]]) Knowledge (the Gods) check and a Favor
      of senatorial weight.'
    - '**2 — Suspension.** The college suspends Numisia from the rites and orders
      her to keep her household under her own authority, so that none of her slaves
      can be sold or freed out of reach of torture.{{3}} Lictors watch the Atrium.
      From now on her slaves can be put to the question.'
    - '**3 — The Question.** Phileros is examined under torture to “confirm” his statement,
      since Roman courts valued a slave''s evidence only when it was taken that way.
      If the PCs have not reached him yet, he keeps to the coached story through the
      pain, and every later attempt to shake it is upgraded once.'
    - '**4 — The Turn.** The emperor moves the hearing from the Regia to his villa
      at Alba (see the Midpoint Turn).'
    - '**5 — Arrests.** Mettius Varus is seized. Sabidius Gallus''s house is watched,
      and he must decide whether to stay or leave Rome. The Atrium is searched.'
    - '**6 — The college sits.** Act III begins whether or not the PCs are ready.'
  - type: p
    style: body
    text: '**Advances:** finding the missing ornaments or the early report points
      the PCs at Naso''s household, and they skip the first lead in Act II. If they
      also get the precedent tablet, it is banked as a [[boost]] for Act III, because
      it proves the omen was interpreted for the priests in advance. Failing every
      check means the PCs reach Rome with the clock at 2 and Naso aware of them.'
  - type: p
    style: act
    text: Act II — The Porter's Story
  - type: readaloud
    text: 'The room is a storeroom behind the promagister''s kitchen, and it smells
      of lamp-oil and onions. The slave sits on a grain jar with his hands folded.
      His tunic is new and much too clean. He recites without being asked: “My master
      went out after the second hour of night. I kept the door. He came home before
      the bakers'' fires. He told me, ''You saw nothing.'' But I saw.” He stops, then
      goes on, as if picking up a line he had dropped. “Her coverlet was saffron.
      The lamp was shaped like a ship.”'
  - type: p
    style: body
    text: '**What''s going on:** Phileros has never been inside the House of the Vestals.
      He is telling the truth about his master''s late returns, but the bedchamber
      details were taught to him. They came from **Callityche**, a former hairdresser
      of the Atrium whom Numisia freed and dismissed last year, and whom Naso now
      keeps on a farm near Fidenae on the Via Salaria. Mettius Varus did go to the
      Atrium after dark, because he manages the leases on the order''s shops along
      the Via Sacra and the Nova Via and settles the rents at the end of the day.{{4}}
      Phileros has his own reasons: his master sold his woman to a fuller in Ostia.
      Naso has promised him his freedom and a purse. Under Domitian, slaves who accused
      their masters were encouraged and paid.{{5}}'
  - type: p
    style: body
    text: '**Threads (any order; each costs half a day):** *The informer* — the PCs
      need access to Phileros. They can spend a Favor of a pontiff or senator, pass
      a **Hard** ([[difficulty difficulty difficulty]]) Negotiation check with the
      promagister **Aulus Didius Pollio**, or bribe a guard with a **Daunting** ([[difficulty
      difficulty difficulty difficulty]]) Deception or Skulduggery check. Questioning
      him uses *Cross-Examine* against his rehearsed story. The tell is that he can
      describe the inside of her chamber but not the Atrium''s own porter''s lodge,
      which he would have had to pass. *The Atrium* — Numisia''s household receives
      callers by day. An **Average** ([[difficulty difficulty]]) Charm check with
      a slave girl brings out that Callityche came by last month asking after her
      old mistress''s rooms. *The master* — Mettius Varus is terrified and close to
      running. With an **Average** ([[difficulty difficulty]]) Negotiation or **Hard**
      ([[difficulty difficulty difficulty]]) Skulduggery check the PCs get his rent
      tablets, which date every night visit to a settlement day. *The money* — a banker
      in the Basilica Julia (use *Caecilia Attica*) shows that Phileros''s savings
      (*peculium*) doubled this month, paid in by one of Naso''s freedmen. That takes
      a **Hard** ([[difficulty difficulty difficulty]]) Streetwise check, or a Favor.
      *Fidenae* — the farm is guarded by four *Street Tough* minions. Callityche is
      frightened and badly fed. A **Hard** ([[difficulty difficulty difficulty]])
      Charm check, together with a real promise of safety, persuades her to say who
      taught her what to tell.'
  - type: p
    style: body
    text: '**Naso''s offer.** Once the clock reaches 3, or as soon as Naso notices
      the PCs, he invites them to dinner and speaks plainly. He wants Mettius Varus''s
      estate. The Vestal is “the price the gods have set.” The patron can be “forgotten”
      if the PCs give the college one more piece of corroboration, or hand him whatever
      the Atrium search would have turned up. This is how the complicit ending begins.
      Run it as a social encounter in which he tries to learn each PC''s Desire.'
  - type: p
    style: body
    text: '**The Midpoint Turn (clock 4, or after the PCs crack their first thread):**
      two things happen together. *First*, a rumor arrives from the Palatine. The
      emperor will not let the college meet in the Regia, and has summoned it to his
      Alban villa, where the accused will be judged in her absence. Historically,
      this was how Cornelia was condemned.{{6}} *Second*, Sabidius Gallus admits something
      to the PCs. He did go to the Atrium at night once, to collect letters Numisia
      had written him. In them she mourned the Vestals Domitian condemned at the start
      of his reign and called the emperor''s justice impious. Some letters are still
      hidden in her rooms. They prove nothing about incest, but they could be read
      as treason against the emperor (*maiestas*). From here on, saving the patron
      and saving the Vestal may pull in different directions. Gallus suggests two
      ways out. He could confess to something and take exile, as a man of praetorian
      rank once did in the Cornelia affair.{{7}} Or the PCs could break into the House
      of the Vestals and burn the letters. That is a **Daunting** ([[difficulty difficulty
      difficulty difficulty]]) Stealth or Skulduggery check and a sacrilege if they
      are caught.'
  - type: p
    style: body
    text: '**Advances:** each thread that is cracked is banked for Act III. Callityche''s
      testimony is worth [[boost boost]] and flips the informer, so Phileros becomes
      a [[setback]] for the prosecution. The rent tablets and the banker''s entries
      are worth [[boost]] each. A recantation obtained from Phileros himself is worth
      [[success]] on the first defense appeal, but the PCs must keep him alive until
      the hearing. Each thread left unworked is a [[setback]] the prosecution can
      use. If the letters are still in the Atrium at clock 5, Naso has them, and that
      opens his Act III trump.'
  - type: p
    style: act
    text: Act III — The College at Alba
  - type: readaloud
    text: The villa sits above the lake on the slope of the Alban Mount, and from
      its terrace you can see the Appia running down toward Bovillae. The pontiffs
      have come in their purple-bordered togas. Some have come from Rome by litter,
      and others from their own villas nearby, and none of them wants to be here.
      There is no chair for the accused. A freedman of the household reads out the
      slave's statement from a tablet. At the head of the room the emperor's chair
      stands empty, but nobody in the room acts as though it were.
  - type: p
    style: body
    text: '**What''s going on:** run the hearing as the courtroom set-piece in its
      sacral form. The audience is the college, a **Daunting** body with a strain
      threshold of 18, and Knowledge (the Gods) is the *Logos* skill. Naso presents
      the witness. The emperor wants an example; he is the kind of ruler who believes
      that “exemplary severities of this kind conferred lustre upon his reign.”{{8}}
      *The Emperor''s known wish* adds a [[setback]] to every defense check until
      the PCs break it, either with a [[triumph]] Critical Remark or by producing
      proof the college cannot pretend not to have heard. **Getting in:** Praetorians
      guard the villa. The PCs can get in with Pollio''s goodwill (a Favor, or his
      capitulation in Act II), as the patron''s companions if he chooses to appear,
      or with a **Daunting** ([[difficulty difficulty difficulty difficulty]]) Deception
      check. **Numisia cannot speak**, because she is not there. A written statement
      from her, obtained in Act II, is an [[boost boost]] *Ethos* appeal read aloud.
      By old custom, Vestals were heard in person in the Forum and the courts whenever
      they gave evidence. Under Tiberius, a woman of the palace who refused to come
      to court still had a praetor sent to her house to take her evidence. Those precedents
      give a PC a **Hard** ([[difficulty difficulty difficulty]]) Knowledge (Law)
      argument that the accused must at least be heard.{{9}} **Naso''s trump:** if
      he has the letters, he reads them, and the college''s strain threshold rises
      by 4 against the defense. **Filibuster** buys time but nothing else, since an
      empty chair cannot be talked into going home.'
  - type: p
    style: body
    text: '**Endings.** *Testimony broken:* Callityche testifies, or Phileros recants
      before the college. The college finds Numisia “not proven” and returns her to
      the fire. Naso is not punished; under this emperor, informers seldom were. He
      notes the PCs'' names, and Phileros is sent back to the master he accused. Unless
      the PCs buy him and get him out of Rome, he will be crucified. *Vestal saved,
      patron sacrificed:* Sabidius Gallus takes the letters on himself and goes into
      exile on an island. Without a senator to frame, Naso drops the slave''s statement
      for a share of Gallus''s confiscated estate, and the incest charge collapses.
      *Complicit:* the PCs give Naso what he asked for. Numisia is carried bound in
      a closed litter to the field by the Colline Gate and goes down a ladder into
      a chamber with a lamp, bread, and water. The entrance is then filled in.{{10}}
      Cornelia, carried the same way, kept calling out: “Is it possible that Cæsar
      can think me polluted, under the influence of whose sacred functions he has
      conquered and triumphed?”{{11}} Mettius Varus is beaten with rods in the Comitium
      and cries out, as a knight once did there: “What have I done?—I have done nothing.”{{12}}
      The patron survives and owes the PCs, and he knows the price they paid. *The
      clock runs out:* if the PCs never reach the college, everyone Phileros named
      is condemned without being present or heard.'
  - type: p
    style: body
    text: 'In a [[Fated]] or [[Mythic]] Rome, the omen may have been true and simply
      misread. Another Vestal really has broken her vow, and the prodigies continue
      whatever the college decides. Whether the gods accept the wrong victim is left
      to the GM. The record of Cornelia''s own case is no clearer: the man who wrote
      it down could not say whether the woman buried was innocent or guilty.{{8}}'
  - type: statblock
    name: Gaius Turpilius Naso
    kind: Nemesis
    desc: A knight who prosecutes for profit and has never lost a case brought under
      a sign from the gods. **Wants:** Mettius Varus's estate, and the emperor's attention,
      which is worth more. **Toward the PCs:** polite and generous; he would rather
      buy them than fight them. **Secret:** the bedchamber details in Phileros's story
      came from Callityche, whom he keeps at Fidenae, and his freedman took the dead
      girl's ornaments. **Voice:** “I accuse no one. I only make sure the gods are
      heard.”
    chars:
      Br: '2'
      Ag: '2'
      Int: '3'
      Cun: '4'
      Will: '3'
      Pr: '3'
    derived:
      Soak: '2'
      W.T.: '12'
      S.T.: '16'
      Def (M/R): 0/1
