- title: The Theater of Power
  blocks:
  - type: p
    style: lead
    text: |-
      Genesys models a conversation as a kind of combat — opposed social checks, **strain** as the health bar of an argument, and **Motivations** as the soft points in a target's guard. No historical setting rewards that framework like Rome, a civilization where a man could be destroyed in the Forum without a blade being drawn, and where the Senate, the law-court, and the dinner-couch were the real battlefields. This chapter supplies Roman tools that plug directly into the Social Encounters rules (Core Rulebook, Chapter 7): a reputation economy, four set-piece encounter structures (the **speech**, the **Senate**, the **court**, and the **salutatio**), Roman Motivation tables, new talents and gear, and purely social adversaries to be beaten with words.
  - type: p
    style: body
    text: |-
      *Everything here is an overlay on the standard rules.* Inflicting strain, compromise at half the strain threshold, capitulation above it, the [[advantage]]/[[triumph]] and [[threat]]/[[despair]] spends, learning a Motivation facet, and the group-size difficulty table all work exactly as written. The Roman flavor is in *which* skill fits, *which* Motivation is exposed, and *what the stakes are.*
  - type: h3
    text: 'Dignitas & Auctoritas: The Reputation Economy'
  - type: p
    style: body
    text: |-
      A Roman was his reputation. **Dignitas** is a character's public standing — the accumulated weight of ancestry, offices held, favors owed, and victories won. It is an optional setting trait rated **0–5**, set at creation by status and changed in play.
  - type: table
    style: gear
    columns:
    - Starting Dignitas
    - Who
    - Dignitas
    rows:
    - - Slave / outlaw / infamis
      - No standing in law; an actor or gladiator is *infamis*
      - '0'
    - - Commoner / freedman / provincial
      - A free plebeian, a *libertus*, a *peregrinus*
      - '1'
    - - Equestrian / notable
      - A wealthy knight, officer, or respected local
      - '2'
    - - Senatorial family
      - A senator or his heir
      - '3'
    - - Ex-magistrate (consular)
      - One who has held the great offices; a famous general
      - '4'
    - - First men of the state
      - The *princeps senatus*, the imperial house
      - '5'
  - type: p
    style: body
    text: '**What Dignitas does:**'
  - type: list
    items:
    - |-
      **It armors your reputation.** When another character makes a social check to *shame, discredit, insult, or publicly coerce* your character, they add [[setback]] equal to the amount your Dignitas exceeds theirs (to a maximum of two [[setback]]). The high and mighty are simply harder to bring low.
    - |-
      **It lends weight to authority.** When your character makes an *Ethos* appeal (see Oratory) or any social check that leans on their standing, add [[boost]] if their Dignitas is 3+, or [[boost boost]] if it is 5.
    - |-
      **It funds Auctoritas.** At the start of any social set-piece, your character gains a pool of **Auctoritas** equal to their Dignitas (minimum 1). Each point may be spent as an incidental to add [[boost]] to a social check, to a crowd/vote track, or to a favor — the influence their name buys in the room. The pool refreshes each set-piece.
    - |-
      **Revelatory Appeal** (*Logos*) — claim privileged knowledge the audience cannot check (Cicero's ever-wakeful “I know their every plan”): add [[boost boost]] to the appeal, but a [[despair]] exposes the bluff and costs you Dignitas for the scene.
  - type: p
    style: body
    text: |-
      **Gaining and losing it.** The GM raises a character's Dignitas by 1 for a landmark public success — winning a notorious trial, election to a great office, sponsoring magnificent games, a military triumph, saving a citizen's life (the *corona civica*). It falls by 1 for *infamia*: losing such a trial, public cowardice or bankruptcy, a ruinous scandal, or conviction for a crime. Dignitas is slow to earn and ruinous to lose — which is precisely why Romans killed for it. **Optional — the hunger of prestige.** Pedigree alone never sustained a Roman house; standing had to be renewed each generation (by the early Empire, idle heirs of the Fabii were mocked for coasting on ancestral glory). A high-Dignitas character who wins no landmark success across a long stretch of play slowly loses a point of Dignitas, unless renewed by office, magnificent games, or martial glory.
  - type: h3
    text: Roman Motivations
  - type: p
    style: body
    text: |-
      Give every recurring Roman NPC (and encourage players to give their characters) Motivations from the lists below, used exactly as in the Core Rulebook: work *with* a Strength or Flaw to add [[boost]]; work *with* a Desire or Fear to add [[boost boost]]; work against them to add [[setback]] or [[setback setback]]. Players learn an NPC's Strength/Flaw by spending [[advantage advantage]], a Desire/Fear with [[advantage advantage advantage]], or any facet with a [[triumph]].
  - type: table
    style: motiv
    columns:
    - d10
    - Desire (what they chase)
    - Fear (what they dread)
    rows:
    - - '1'
      - '**Gloria** — fame that outlives them'
      - '**Obscurity** — to be forgotten, a nobody'
    - - '2'
      - '**The consulship** / high office'
      - '**Exile** — banishment from Rome'
    - - '3'
      - '**Wealth** — estates, slaves, silver'
      - '**Poverty & debt** — the shame of the ruined'
    - - '4'
      - '**Vengeance** on a rival house'
      - "**A powerful enemy's malice**"
    - - '5'
      - '**Freedom** / citizenship (for the enslaved)'
      - '**The mob** — riot, lynching, the arena'
    - - '6'
      - '**Pleasure** — luxury, love, the table'
      - "**The Emperor's suspicion**"
    - - '7'
      - '**The old Republic** / restoring virtue'
      - '**Impiety** — angering the gods, bad omens'
    - - '8'
      - "**Family** — heirs, the line's honor"
      - '**Betrayal** by a friend or freedman'
    - - '9'
      - '**Knowledge** — philosophy, the mysteries'
      - "**Loss of face** before one's peers"
    - - '10'
      - '**Power** for its own sake — the purple itself'
      - '**Death without a good name**'
  - type: table
    style: motiv
    columns:
    - d10
    - Strength (what steadies them)
    - Flaw (what undoes them)
    rows:
    - - '1'
      - '**Gravitas** — unshakeable dignity'
      - '**Pride** — cannot bear a slight'
    - - '2'
      - '**Eloquence** — a golden tongue'
      - '**Avarice** — greed clouds judgment'
    - - '3'
      - '**Loyalty** — to patron, legion, or friend'
      - '**Lust** / appetite — a notorious weakness'
    - - '4'
      - '**Piety** — the gods on their side'
      - '**Superstition** — ruled by omens'
    - - '5'
      - '**Cunning** — the long game'
      - '**Cruelty** — overreaches, makes enemies'
    - - '6'
      - '**Discipline** — Stoic self-command'
      - '**Rashness** — acts before thinking'
    - - '7'
      - '**Generosity** — a famous patron'
      - '**Vanity** — easily flattered'
    - - '8'
      - '**Industry** — tireless, competent'
      - '**Drink / the dice** — a vice to exploit'
    - - '9'
      - '**Courage** — faces down the mob'
      - '**A guilty secret** — a lever for blackmail'
    - - '10'
      - '**Nobility** — the weight of ancestors'
      - '**Naivety** — trusts the wrong people'
  - type: h3
    text: 'Oratory: The Set-Piece Speech'
  - type: p
    style: body
    text: |-
      Trained oratory was a Roman's sharpest tool — but only one of several. Ancestry, wealth, patronage, military glory, and sheer *dignitas* carried as many arguments as eloquence did: Marius won seven consulships with almost no gift for speech, and Pompey and Antony leaned on reputation and spectacle over rhetoric. So treat a great speech as a force-multiplier for a strong position, not a substitute for one — a character rich in standing and connections can rule the Forum on a middling check. The Republican model is the **contio**, the non-voting public meeting a magistrate called to work the People before a vote; only a magistrate could summon one, so a private citizen needed a friendly magistrate's invitation to speak — contio-access as a currency of alliance. Run a major speech as a short structured social encounter (3–5 rounds) against an **audience**, treated as a single target with a **strain threshold** set by its size and mood. Exceed the threshold and the audience is *won*; exceed half for a **partial** result. *(Under the emperors the contio and the voting assemblies lose their teeth; the imperial stages for this same mechanic are the crowd's acclamation at the games and the Circus, and a general's address to his troops.)*
  - type: table
    style: gear
    columns:
    - Audience
    - Size
    - Check difficulty
    - Strain threshold
    rows:
    - - A dinner-table, a handful of senators
      - 2–5
      - Average ( ●● )
      - '10'
    - - A jury, a committee, a cohort
      - 6–15
      - Hard ( ●●● )
      - '14'
    - - The full Senate, a theatre
      - 16–50
      - Daunting ( ●●●● )
      - '18'
    - - The Forum mob, the Circus
      - 51+
      - Formidable ( ●●●●● )
      - '22'
  - type: p
    style: body
    text: |-
      Adjust the threshold by ±4 for an audience already hostile or already sympathetic. On each of the orator's turns they make **one appeal** — a social check that inflicts strain as normal (1, plus 1 per uncanceled [[advantage]]). The three classical appeals map cleanly to Genesys social skills:
  - type: list
    items:
    - |-
      **Ethos — authority and character.** *Leadership* or *Charm.* “I, who have served Rome for thirty years, tell you…” Add the Dignitas bonus.
    - |-
      **Pathos — emotion.** *Charm* (to inspire love, hope, pity) or *Coercion* (to rouse fear, anger, hatred). The crowd's favorite.
    - |-
      **Logos — reason and proof.** *Negotiation*, or first spend a maneuver on a *Knowledge (Law)* or *Knowledge (Rome)* check to marshal evidence and **upgrade** the following appeal.
  - type: p
    style: body
    text: |-
      **Working the audience's Motivation** (give a crowd a collective Desire and Fear — the plebs *desire* grain and games, and *fear* hunger and foreign kings) adds [[boost boost]] as usual. A hostile orator may spend their turn **heckling** (an opposed Coercion or Deception check) to inflict strain back on the speaker and add [[setback]] to their next appeal.
  - type: procedure
    title: The Five Parts (optional maneuvers & once-per-speech beats)
    steps:
    - |-
      **Exordium** (opening): a maneuver — a disarming *captatio benevolentiae*. Add [[boost]] to the first appeal.
    - '**Narratio** (the facts): a *Knowledge* maneuver that upgrades the next *Logos* appeal.'
    - '**Confirmatio** (proof): your strongest *Logos* appeal.'
    - |-
      **Refutatio** (rebuttal): an action that removes an opposing orator's banked [[advantage]] / crowd goodwill, or adds [[setback setback]] to their next appeal.
    - |-
      **Peroratio** (climax): a final *Pathos* appeal. If it generates a [[triumph]] or [[advantage advantage advantage advantage]], it lands as a **Critical Remark** (5 strain) — the moment the hall erupts.
  - type: example
    text: |-
      Example — Marcus before the mob. The aedile Marcus (Dignitas 2) must calm a bread-riot (Forum mob: Formidable, threshold 22). **Round 1 — Exordium + Ethos:** he opens humbly (maneuver: [[boost]]) then invokes his record feeding them (Charm, +[[boost]] from exordium). He rolls 2 [[success]], 2 [[advantage]] → 3 strain, and spends the [[advantage advantage]] to learn the crowd's Fear: *hunger*. **Round 2 — Narratio + Logos:** a Knowledge (Rome) maneuver recalls the grain-fleet's arrival (upgrade), then Negotiation promising a distribution, now adding [[boost boost]] for playing to their Fear. The upgraded pool throws a [[triumph]] → a Critical Remark, 5 strain, “the ships are in the Tiber *tonight!*” Total 8+ strain, past half-threshold — the riot sags into a wary cheer. One more good round and they are his.
  - type: h3
    text: 'The Senate: A Contest of Blocs'
  - type: p
    style: body
    text: |-
      A Senate debate is a tug-of-war over a motion (a *senatus consultum*). Model the undecided house as 2–4 **bloc** minion groups — e.g., the *Old Guard* (traditionalists), the *Novi Homines* (ambitious new men), the *Military Clique*, and the *Emperor's Men* — each with a vote-weight and a Discipline/Cool to resist. Speakers (PC and NPC) take turns delivering appeals (as Oratory, above) aimed at a chosen bloc; inflicting strain past that bloc's wound threshold **commits** its votes to that side. When every bloc has committed (or the session ends), tally the votes.
  - type: procedure
    title: Procedural Trump Cards
    steps:
    - |-
      **Relatio & sententiae.** The presiding consul sets the motion and calls senators for their *sententiae* — the consuls-designate and senior *consulares* first, not by raw seniority. High standing literally speaks first and frames the debate (add [[boost]] to the opening side); under the Empire the consuls, and the emperor's wishes, set the order.
    - |-
      **Intercessio — the Tribune's veto.** In the Republic a Tribune of the Plebs may, once per session, veto the motion outright: a hard stop, answered only by winning him over, out-waiting him, or arranging his absence. *(By the High Empire this is a dead letter — the* princeps *himself holds* tribunicia potestas *and sacrosanctity, and the real veto is simply his known wish, below.)*
    - |-
      **Obnuntiatio & the auspices — the omens.** Most Romans believed the auspices truly spoke Jupiter's will, so this is a weapon of faith, not mere theatre, and a man caught fabricating a sign faced ruin. Two moves: a magistrate who **“watches the sky”** (Knowledge (the Gods)) declares the day's omens foul and *suspends all business for the day* (Bibulus paralysed Caesar's consulship this way); an **augur's formal ruling** that an act was taken *vitio* (flawed) can void a law already passed or compel a magistrate's abdication — a harder check and a graver blow. Faking either is a desperate, capital gamble, and a fine plot hook.
    - |-
      **Filibuster.** Talk until nightfall ends the session with no vote (Cato's trick). Resolve as an endurance contest — repeated Discipline or Resilience checks against rising difficulty.
    - |-
      **The Emperor's known wish.** If the *princeps* is believed to favor a side, every check for the other side suffers [[setback]] — and generating a [[despair]] may earn a *delator's* whispered report (see below).
  - type: example
    text: |-
      Example — swinging the Old Guard. The PCs back a motion to grant a frontier command. The Old Guard bloc (threshold 12) leans against. A PC with Senatorial Connections opens with Ethos, inflicts 4, then spends [[advantage advantage advantage]] to learn the bloc's collective Fear: *a new Caesar*. Next round, Logos reframes the command as temporary and defensive — [[boost boost]] for the Fear — 5 more strain, bloc committed. But a hostile Tribune raises *intercessio*; the party must spend a scene persuading (or compromising) him before the *discessio* (division) can be called.
  - type: h3
    text: 'The Courtroom: Advocacy'
  - type: p
    style: body
    text: |-
      Run a Roman trial as a speech-contest with the **jury** (*iudices*) as the audience. Prosecutor and defender alternate appeals against the jury's strain threshold; exceed it to carry the verdict. Roman advocacy was gloriously dirty — the law mattered less than the performance.
  - type: p
    style: body
    text: |-
      **Which court?** Roman justice ran across several tribunals, each a different flavour of this set-piece: the standing criminal courts (*quaestiones perpetuae*, the model for most trials), trials before the people (*iudicia populi*), and religious courts — a priest or a Vestal accused of *incestum* answered to the pontifical college, not a lay jury. In a sacral trial, swap **Knowledge (Law)** for **Knowledge (the Gods)** as the *Logos* skill and make the college the audience.
  - type: list
    items:
    - |-
      **Knowledge (Law)** as a maneuver marshals statute and precedent, upgrading the next appeal (your *Logos*).
    - |-
      **Witnesses & evidence** are banked [[boost]] (helpful) or [[setback]] (hostile) the GM hands out; discrediting a witness (opposed Coercion/Deception) flips one.
    - |-
      **Character assassination** — attack the opposing party's reputation directly, targeting a known Flaw (Coercion/Deception) to inflict strain on *their* advocate and lower their Dignitas for the scene.
    - |-
      **Appeal to pity** — the weeping family, the old general baring his scars — is a *Pathos* appeal with a prop, adding [[boost boost]]. Cicero won cases this way.
  - type: h3
    text: The Salutatio & the Favor Economy
  - type: p
    style: body
    text: |-
      Every morning, clients call on their patron (the *salutatio*) to pay respects and ask favors; the patron hands out the *sportula* (a dole of coin or food) and banks their loyalty. Mechanize this web with **Favors**: tradeable tokens representing a specific obligation owed.
  - type: p
    style: body
    text: |-
      **Two kinds of bond.** Favors run *down* **clientela** (patron over client) and *across* **amicitia** — reciprocal “friendship” between near-equals that was itself a political institution: letters of recommendation, invitations, a magistrate's leave to address a meeting. An *amicitia* Favor is called in between equals with no Dignitas-gap limit, but breaking one costs extra reputation, because it shames both parties.
  - type: procedure
    title: Using Favors
    steps:
    - |-
      A character **banks a Favor** by doing a meaningful service, winning one in a social encounter (a capitulation can be “you owe me”), or via the *Client Network* / *Patronus* talents.
    - |-
      **Spend a Favor** to call in a concrete, bounded help from that person: a letter of introduction, a sum of coin, a door opened, a witness produced, a vote in the Senate, a blind eye turned.
    - |-
      Favors have a **face**: a Favor from a senator is worth more than one from a shopkeeper. The GM caps what any single Favor can buy by the grantor's Dignitas and the risk involved.
    - |-
      **Breaking faith** — refusing a reasonable call on a Favor you owe — costs 1 Dignitas and makes an enemy. Rome remembered.
  - type: p
    style: body
    text: |-
      The same frame runs the **convivium** (dinner party), where seating is position — the place of honor (*locus consularis*) grants its occupant [[boost]] to social checks — and the intimacy lets guests learn one another's Motivations a step cheaper; and the **election**, a canvass that targets the voting tribes as blocs, won with promises, games, the *sportula*, and (illegally) outright bribery — *ambitus*, a [[triumph]]-worthy gamble that courts a ruinous prosecution if a [[despair]] turns up.
- title: Starter Scenarios
  blocks:
  - type: p
    style: lead
    text: |-
      Three ready-to-run scenarios, each drawn from a real episode of Roman history, and each built in the three-act shape of a published one-shot: a **synopsis** for the GM, **acts** broken into scenes with *read-aloud* boxes, GM notes on “what's really going on,” suggested skill checks, and a **conclusion** with rewards. Adversaries refer to the stat blocks earlier in this book; a scenario's named villain gets a quick custom profile. Together they exercise the whole toolkit — intrigue and the Senate, the law-court, and the burning city — and lean hard on the social engine in *The Theater of Power.*
  - type: p
    style: small
    text: |-
      **On era:** these events belong to the late Republic and early Empire (70–63 BCE and 64 CE). Run them in their own period, or shift them into the default High Empire by swapping “consul” for “Prefect,” “Senate vote” for “the Emperor's council,” and the named historicals for original figures — the bones work in any Roman century. **Rewards** assume 15–20 XP per scenario and note Dignitas/Favor changes that feed the reputation economy.
  - type: scenario
    text: I. The Enemy Within
  - type: synopsis
    text: |-
      Rome, 63 BCE. A bankrupt, charismatic aristocrat — Lucius Sergius **Catilina** — is plotting to murder the consuls, burn the city, and cancel all debts in the chaos. The consul Cicero knows something is afoot but cannot prove it. The PCs are his agents (or the city's *tresviri*/watch). Over three acts they survive an assassination, spring a trap to seize written proof, and then win — or lose — the **Senate debate** that decides whether captured conspirators die without trial. A showcase for investigation, intrigue, and the Senate rules.
  - type: p
    style: act
    text: Act I — The Knock at Dawn
  - type: readaloud
    text: |-
      Before cock-crow, a hammering at the door. Your patron's man is breathless: “Two strangers came to kill the consul in his bed this very hour — turned away at the door. The master wants you. There is a plot, and he must have proof before the Senate will believe a word of it.”
  - type: p
    style: body
    text: |-
      The PCs are set to uncover Catiline's conspiracy. Starting threads: question the would-be assassins' contacts in the Subura; shadow known malcontents — indebted nobles and Sulla's dispossessed veterans; trace a rumor that the plotters mean to rise in **Etruria** under the old centurion **Manlius**.
  - type: p
    style: body
    text: |-
      **What's going on:** Catiline is real, the plot is real, but he is untouchable — a senator with friends — until the PCs produce *physical, written* evidence. Combat here is a street ambush by hired muscle (*Street Tough* minions, 1 *Bandit/Latro* rival) meant to scare the PCs off.
  - type: p
    style: body
    text: |-
      **A clue you cannot buy.** A **Vestal Virgin** carries an omen no bribe can reach: at a December sacrifice the altar-flame suddenly flares, and she reads it as a warning — word goes to a sympathetic magistrate (or the PCs) to strike *now*. In a [[Fated]] Rome the portent feeds the party's Story Point pool. (Historically, Vestals including Fabia — once tried for *incestum* with Catiline himself, and acquitted — did exactly this in 63 BCE.)
  - type: p
    style: act
    text: Act II — The Trap at the Bridge
  - type: p
    style: body
    text: |-
      The PCs learn the conspirators are courting a visiting embassy of the Gallic **Allobroges** — promising them debt relief for a rebellion in Gaul. The envoys are wavering. The play: persuade the Allobroges to turn double-agent and demand *signed letters* from the plotters as “proof of good faith,” then intercept those letters as the envoys leave the city by night over the **Mulvian Bridge**.
  - type: readaloud
    text: |-
      The torches of the envoys' escort bob toward the Mulvian Bridge. Somewhere in a saddlebag ride letters sealed with the rings of men who dine at the best tables in Rome — enough to hang them all. Across the span, you hear the escort's hooves slow. It is time.
  - type: p
    style: body
    text: |-
      **What's going on:** this is the historical masterstroke — the plot was broken by paperwork, not swords. Reward clever capture of the sealed letters; a botched grab means the PCs must testify on their own word in Act III, with every check upgraded.
  - type: p
    style: act
    text: Act III — The Senate Decides
  - type: p
    style: body
    text: |-
      With ringleaders arrested and the letters read aloud, one question remains and it tears the Senate apart: **execute Roman citizens without trial?** Run this as the Senate contest from *The Theater of Power.* Blocs: the *Hardliners* (behind Cato, for death), the *Moderates* (behind Caesar, for life imprisonment), and the *Undecided*. The PCs speak, sway blocs, and manage the trump cards.
  - type: readaloud
    text: |-
      Cicero yields the floor. A young Gaius Julius Caesar rises: “Death is a release from suffering, not a punishment… I propose their property be seized and their persons confined.” A cold silence — then Marcus Cato, on his feet, voice like a hammer: “We have talked long enough. While we debate, the enemy is at the gates. These men are traitors. Let them die as traitors.” Every eye turns to you.
  - type: p
    style: body
    text: |-
      **The choice:** there is no “correct” outcome. Execution ends the crisis but stains everyone who voted for it (history hounded Cicero into exile for exactly this). Clemency is lawful but leaves live enemies. Let the PCs own the consequence.
  - name: Lucius Sergius Catilina
    kind: Nemesis
    desc: |-
      Ruined nobility turned revolutionary — magnetic, fearless, genuinely dangerous. If cornered in Rome he flees to Manlius's army in Etruria, to die sword in hand at **Pistoria** (a climactic battle, if your group wants one).
    chars:
      Br: '3'
      Ag: '3'
      Int: '3'
      Cun: '3'
      Will: '3'
      Pr: '4'
    derived:
      Soak: '5'
      W.T.: '16'
      S.T.: '16'
      Def: 1/1
    fields:
    - label: Motivations
      text: 'Desire: power / to remake Rome. Fear: obscurity & debt. Strength: courage. Flaw: pride.'
    - label: Skills
      text: Charm 3, Coercion 3, Cool 2, Deception 2, Leadership 3, Melee 3, Knowledge (Rome) 2.
    - label: Talents
      text: Adversary 2; Demagogue; Scathing Tirade.
    - label: Equipment
      text: gladius, the loyalty of desperate men.
    - label: Dignitas 3
      text: (falling fast).
    type: statblock
  - type: p
    style: small
    text: |-
      **Rewards:** 20 XP. Exposing the plot with hard proof: +1 Dignitas and a powerful Favor from Cicero. Botching the proof or siding with the losing Senate bloc: no Dignitas, and a watchful enemy among the survivors.
  - type: scenario
    text: II. The Trial of the Governor
  - type: synopsis
    text: |-
      70 BCE. **Gaius Verres** has returned from three years as governor of Sicily, having stripped the province of its art, its grain, and its justice — crucifying even a Roman citizen who dared appeal. The wronged Sicilians have hired the PCs (or an advocate they serve) to bring him to court. But Verres is rich, his jury is buyable, and his agents are already silencing witnesses. Two acts: build the case, then win the trial. A pure showcase for the **courtroom** rules and the social engine. This is the archetypal *repetundae* (provincial-extortion) case before the *quaestio de repetundis*, brought — as such cases were — the year after his command ended. Cicero's real victory came not from a grand oration but from burying Verres under witnesses and documents before the delaying tricks could push the trial into next year's friendlier court; the jury's composition (senators vs *equites*) was itself a political prize.
  - type: p
    style: act
    text: Act I — Building the Case
  - type: readaloud
    text: |-
      Sicily remembers. In a dim Syracusan portico a shipowner shows you the whip-scars; a priest weeps over an empty plinth where a god once stood in bronze; a widow presses a tally-stick of stolen grain into your hand. “He took everything,” she says. “Make them listen in Rome.”
  - type: p
    style: body
    text: |-
      The PCs gather witnesses, documents, and stolen treasures to exhibit. Verres's men work against them: bribing officials to “lose” records, intimidating or buying off witnesses, and — if that fails — arranging accidents.
  - type: p
    style: body
    text: |-
      **What's going on:** every secured witness and exhibit is banked [[advantage]] for Act II; every one lost or discredited becomes a [[setback]] the defense will wield. Verres's strategy is delay — drag the trial past the holidays and into next year's friendlier court.
  - type: p
    style: act
    text: Act II — The Court
  - type: p
    style: body
    text: |-
      Run the trial as the **courtroom** set-piece. The jury (Hard audience, strain threshold 14; raise it for every juror Verres has bribed) must be driven past its threshold to convict. Verres's defense is led by the most famous advocate in Rome; the PCs (or their patron) prosecute.
  - type: readaloud
    text: |-
      The benches are packed; half of Rome has come to watch the great advocate defend the indefensible. He smiles at you across the court, utterly confident. Then you do the unexpected: instead of a grand opening oration, you simply call your first witness, and let Sicily speak for itself.
  - type: p
    style: body
    text: |-
      **What's going on:** as in history, overwhelming evidence can break a defendant's nerve before the verdict — if the PCs land a [[triumph]] Critical Remark or drive Verres himself past a personal strain threshold, he may bolt into **voluntary exile** (to Massilia, with his loot) rather than face the vote. A full conviction is possible but harder.
  - name: Gaius Verres
    kind: Nemesis
    desc: |-
      A plump, pleasure-loving plunderer who believes money can buy anything — because so far it always has.
    chars:
      Br: '2'
      Ag: '2'
      Int: '3'
      Cun: '4'
      Will: '2'
      Pr: '3'
    derived:
      Soak: '2'
      W.T.: '12'
      S.T.: '14'
      Def: 0/1
    fields:
    - label: Motivations
      text: 'Desire: wealth & comfort. Fear: poverty / ruin. Strength: cunning. Flaw: avarice.'
    - label: Skills
      text: Charm 2, Coercion 2, Deception 3, Negotiation 3, Knowledge (Law) 2, Knowledge (Rome) 2.
    - label: Abilities
      text: |-
        Deep Purse — may spend a Story Point to pre-bribe one juror (+[[setback]] to a prosecution appeal) or to buy a thug.
    - label: Dignitas 3.
      text: |-
        Defended by a Stoic Philosopher-style advocate (use that stat block as the opposing orator).
    type: statblock
  - type: p
    style: small
    text: |-
      **Rewards:** 15 XP. A conviction or a flight-into-exile: +1 Dignitas for the lead prosecutor and the gratitude (Favors) of a whole province. Losing a bought jury: the Sicilians are ruined, and the PCs have made a rich, vindictive enemy.
  - type: scenario
    text: III. The City Burns
  - type: synopsis
    text: |-
      Rome, July 64 CE. Fire erupts near the Circus Maximus and races through the tinder-dry tenements. For six days and seven nights it devours the city. The PCs — *vigiles*, or simply people caught in it — fight the flames, save who they can, and then confront the ugly aftermath: a terrified city demanding someone to blame, an Emperor under suspicion, and a convenient scapegoat in a small, strange sect. Three fast acts of disaster, investigation, and moral weight; a showcase for the watch, crowds, and hard choices.
  - type: p
    style: act
    text: Act I — The Red Night
  - type: readaloud
    text: |-
      You smell it before you see it — then the sky over the Circus goes orange, and the screaming starts. The fire is already in the shops under the stands, running on the wind faster than a man. Narrow streets choke with people and carts. Somewhere above you, a tenement block of five storeys begins to burn, and it is full of families.
  - type: p
    style: body
    text: |-
      A disaster set-piece: the PCs fight fire and save lives. Use skill challenges, not a monster to kill — the enemy is the blaze, the crowd, and the clock.
  - type: p
    style: act
    text: Act II — Ash and Rumor
  - type: p
    style: body
    text: |-
      The fire dies. In the smoking ruin, the city gropes for a reason. Three rumors spread like a second fire: that it was an accident (lamp-oil and wind); that criminals set it to loot; and — most dangerous — that the **Emperor himself** ordered it, to clear ground for a golden palace. The authorities need another answer, fast.
  - type: readaloud
    text: |-
      A magistrate's man finds you in the ash. “The Prefect wants the truth — or something that will pass for it before the mob turns on the Palatine. There's a sect down by the river. Foreigners. They talk of the world ending in fire and a kingdom not of Rome. People are already saying it was them. Go and… confirm it.”
  - type: p
    style: body
    text: |-
      **What's going on:** the PCs will find the Christians are innocent. The pressure to say otherwise — from a frightened Prefect, a *Delator* smelling reward, and a mob that wants blood — is enormous.
  - type: p
    style: act
    text: Act III — The Scapegoats
  - type: p
    style: body
    text: |-
      The choice lands. The sect is to be rounded up and butchered in the arena and the imperial gardens — burned as living torches — “as if they were to blame for the great fire.” The PCs can go along with the lie (safe, rewarded, complicit); expose the truth (dangerous — it points back at the Palatine); or try to get innocents out of the city before the arrests (a tense extraction).
  - type: p
    style: body
    text: |-
      **What's going on:** there is no clean win, which is the point. History records the slaughter went ahead, and even bloodthirsty Romans came to pity the victims. Let the PCs' courage or complicity echo — in their Dignitas, in who owes them, and in who now watches them.
  - type: p
    style: small
    text: |-
      **Adversaries:** the fire (environmental), *Street Tough* looters and *Urban Cohort* watchmen, a *Delator*, and a crowd run with the *Demagogue*/mob rules. **Rewards:** 15–20 XP scaled to lives saved in Act I. Saving the innocent at real risk: +1 Dignitas with those who value honor (and a dangerous secret about the fire's true cause). Taking the safe, complicit path: coin and a Favor from the Prefect — and a quiet 1-point loss of Dignitas among those who know what you did.
- title: Running Imperial Rome
  blocks:
  - type: p
    style: lead
    text: |-
      A historical setting is a gift and a trap. The gift is that players already know Rome — legions, togas, gladiators, “hail Caesar.” The trap is that they know the *movie* Rome, and will bring every assumption with them. Lean into the familiar iconography, then surprise them with the real strangeness: a world where the gods are in the gutters and the Senate, where a man's name tells you who owns him, and where a bad omen can stop an army.
  - type: h3
    text: Choosing a Campaign Frame
  - type: p
    style: body
    text: |-
      Rome is too big to “play Rome.” Pick a lens — a group with a reason to adventure together — the way the setting this book is modeled on gathers its heroes into a single unit.
  - type: list
    items:
    - |-
      **The Contubernium (Soldiers).** A tent-group of eight legionaries and their specialists on the frontier: patrols, skirmishes, building roads and forts, and the long boredom between terrors. Great for tactical play and the *band-of-brothers* tone. The legion is also a political animal — who does the army back?
    - |-
      **The Familia Gladiatoria (The Arena).** Fighters, a trainer, a doctor, and a sponsor in one gladiator school. Survival, rivalry, celebrity, and the dream of the wooden sword (*rudis*) of freedom. Combine spectacle with the intrigue of who bets on whom.
    - |-
      **The Cohortes Vigilum (Roman ‘Police’).** The nearest thing to the setting this book honors: the watch and the fire brigade of a great city. Investigate murders, arson, missing persons, and conspiracies in the tenements — a procedural, but one where the detectives have almost no forensic science and a great deal of politics. The *frumentarii* and a provincial governor's staff serve the same role for imperial-level intrigue.
    - |-
      **The Domus (Household & Intrigue).** A senator's extended household — heirs, freedmen, clients, slaves — navigating the *cursus honorum*, the courts, and the knife-work of high politics. Social combat is the main event.
    - |-
      **The Negotiatores (Trade & Travel).** Merchants, ship-owners, and their guards crossing the Empire and beyond — Egypt, Parthia, and the western end of the Silk Road, where fortunes ride on pepper, incense, and bolts of Chinese silk worth their weight in gold. A caravan pressing east toward rumored *Serica* (see *The Edge of the World*) turns a trade game into an odyssey past Parthian tolls, bandit passes, and the limits of the known map. Sandbox exploration with cargo manifests, pirates, and the lure of the unreachable East.
    - |-
      **The Mysteries (Supernatural).** In a [[Fated]] or [[Mythic]] Rome, investigators of cults, curses, and the old powers under the new marble — the Roman answer to cosmic horror or sword-and-sandal fantasy.
  - type: h3
    text: Status Is the Real Rulebook
  - type: p
    style: body
    text: |-
      Let legal status do heavy narrative lifting. A **citizen** can demand a proper trial and appeal to the Emperor (*Civis Romanus sum*); a **slave**'s testimony was legally admissible only under torture, and a slave who struck a citizen could be crucified. These are not die rolls — they are the stakes. The most Roman dramas come from characters trapped by their status and clawing to change it: the slave earning manumission, the freedman buying respectability, the provincial grasping for the citizenship that makes him untouchable.
  - type: h3
    text: Patron and Client
  - type: p
    style: body
    text: |-
      Nobody in Rome stands alone. Every character should know who their **patron** is (who protects and funds them, and expects loyalty, votes, and the morning *salutatio*) and who their **clients** are. Favors flow up and down this web constantly — the *Client Network* and *Client of a Great House* abilities model it, but the GM should make the web a living thing. A patron's enemy is your enemy; a patron's fall can drag you down with him.
  - type: p
    style: body
    text: |-
      **Adoption and the household.** A great family is a going concern — a name, its cults, and its capital — and adoption was the tool used to preserve it; the age this book defaults to is the era of the *adoptive emperors* (Nerva to Hadrian). An heirless senator who adopts a PC (or a rival's son) transfers Dignitas and obligations at a stroke, and a contested adoption or a disputed will is a whole campaign frame. Within the *domus*, the working household has its own offices — the *vilicus* (overseer) and *vilica* (housekeeper) run the estate and its cult under a quasi-moral code — ready-made authority, and ready-made friction, for Slave and Freedman characters.
  - type: sidebar
    title: The Thin Empire
    body:
    - |-
      Remember how *few* Romans actually governed Rome. An empire of perhaps sixty million people was run, at the top, by only a few hundred senior officials — a governor might administer a province of millions with a personal staff you could seat at one dinner-table. The Empire held together not through bureaucracy but through **local elites, patronage, religion, and sheer bluff.** This is why the reputation economy matters so much: in a thin state, who you know and how you are regarded *is* the government. It also hands the GM a sandbox — out in the provinces the PCs may be the only arm of Rome for a hundred miles, and what they decide simply becomes Roman policy. (Grounded in Scheidel, *Rome and China*.)
  - type: h3
    text: Story Points as the Will of the Gods
  - type: p
    style: body
    text: |-
      In a [[Fated]] Rome, re-skin the Story Point economy as divine favor. When players spend a Story Point, something goes *right* because the gods smiled — a timely omen, a lucky gust, a rival's stumble. When the GM spends one, the gods are displeased: an ill omen manifests. Tie omen-reading (Knowledge (the Gods), above) to the pool, and let a [[triumph]] at a sacrifice feed the players' side. It makes Roman religion mechanically present without any spellcasting.
  - type: h3
    text: The Arena & the Races
  - type: p
    style: body
    text: |-
      Run a gladiatorial bout as a duel with the crowd as a third participant: track the audience's mood as a pool of [[advantage]]/[[threat]] the fighters spend on *Arena Showmanship* and on the final appeal for mercy (*missio*) — the editor of the games grants life or death partly on the crowd's roar. For chariot racing, use chase/structured rules: a long track, *Driving* checks each round, [[advantage]] to gain position and [[threat]] toward the dreaded wreck (*naufragium*). Remember Roman drivers lashed the reins around their waists and carried a knife to cut free — a failed check at speed can be lethal.
  - type: h3
    text: Keeping It Roman
  - type: list
    items:
    - |-
      **No clocks, no minutes.** Time is told by sun, water-clock, and the watch; appointments are “at the third hour.”
    - |-
      **Money is coin and credit.** No paper; wealth is land, slaves, and chests of silver — and a web of IOUs (*nomina*) among the elite.
    - |-
      **The streets are lethal.** Rome had no street lighting and emptied its chamber-pots from windows; wheeled traffic was banned by day. Night in the Subura is its own adventure.
    - |-
      **Religion is everywhere — but belief varies.** The gods are woven into every public act, and *open* denial is socially radioactive; yet philosophically-grounded disbelief existed — educated Epicureans held the gods indifferent and the soul mortal (Lucretius) and still performed the civic rites. Christians and Jews stand out because they will *not*. The auspices are consulted before almost anything that matters.
  - type: h3
    text: Sources & Further Reading
  - type: p
    style: body
    text: |-
      This supplement stands on real scholarship. For GMs who want to dig deeper — or settle a table argument — these are good next steps, Imperial sources starred where the setting's own era is best served.
  - type: list
    items:
    - |-
      **Republic & its fall** — Mommsen, *The History of Rome*; Watts, *Mortal Republic*; Marin, *Blood in the Forum*; Beard, *SPQR* ★.
    - |-
      **Oratory, the contio & assemblies** — Morstein-Marx, *Mass Oratory and Political Power*; van der Blom, *Oratory and Political Career in the Late Roman Republic*; Botsford, *The Roman Assemblies*.
    - |-
      **Senate & magistracies** — Piña Polo, *The Consul at Rome*; Sandberg, *Magistrates and Assemblies*; Talbert, *The Senate of Imperial Rome* ★.
    - |-
      **Law & the courts** — Alexander, *Trials in the Late Roman Republic*; Robinson, *The Criminal Law of Ancient Rome* ★.
    - |-
      **Religion & augury** — Driediger-Murphy, *Roman Republican Augury*; Wildfang, *Rome's Vestal Virgins*; Beard, North & Price, *Religions of Rome* ★.
    - |-
      **Philosophy** — Seneca (Hadas, ed.), *Stoic Philosophy of Seneca*; Lucretius, *On the Nature of Things*.
    - |-
      **Household, slavery & family** — Draycott, *Roman Domestic Medical Practice*; Cato & Varro, *Roman Farm Management*; Bradley, *Slavery and Society at Rome* ★; McCall, *Clan Fabius*.
    - |-
      **Empire, patronage & informers** — Millar, *The Emperor in the Roman World* ★; Saller, *Personal Patronage under the Early Empire* ★; Rutledge, *Imperial Inquisitions* ★ (the *delatores*).
    - |-
      **Arena & games** — Fagan, *The Lure of the Arena* ★; Futrell, *Blood in the Arena* ★.
    - |-
      **Comparative empire** — Scheidel (ed.), *Rome and China* ★.
- title: A Gazetteer of the Roman World
  blocks:
  - type: p
    style: lead
    text: |-
      Rome is two geographies at once: the city within the walls, carved into *regiones* and *vici*, and the empire beyond, carved into *provinciae*. This gazetteer gives you both at a glance — enough to place a scene, name a street, or send the party to the edge of the world.
  - type: h3
    text: 'The City: Regiones & Quarters'
  - type: p
    style: body
    text: |-
      Augustus divided the city into **fourteen *regiones*** (numbered regions), each cut into **_vici_** (neighborhood wards with their own local officials and crossroads shrines). Romans still navigate by the older landmarks, though — the seven hills, the Forum, and the river. Use *regio* as the in-world word for “district” and *vicus* for “neighborhood.”
  - type: p
    style: body
    text: |-
      **Forum Romanum (*the Forum*).** The paved heart of the city, in the valley below the Palatine and Capitoline. Temples, law-courts, shops, and senators jostle along the Via Sacra; at its head stand the *curia* (senate house), the *comitium*, and the *rostra* from which speakers work the crowd. *Every public drama happens here — elections, *contiones*, trials, the funerals of the great — and so does the bloodshed: more than one Roman generation has seen the Forum run red. Stage speeches, riots, and assassinations here.*
  - type: statblock
    name: Caecilia Attica
    kind: Nemesis
    desc: |-
      A freedwoman grown into one of the Forum's great *argentarii* (bankers). She lends to senators against their next province and keeps their secrets as collateral; her ledger is a map of who truly owns Rome.
    chars:
      Br: '1'
      Ag: '2'
      Int: '4'
      Cun: '4'
      Will: '3'
      Pr: '3'
    derived:
      Soak: '2'
      W.T.: '13'
      S.T.: '16'
      Def (M/R): 0/1
    fields:
    - label: Motivations
      text: |-
        Desire: security no patron can revoke. Fear: a defaulted magnate dragging her down. Strength: half the Senate is in her debt. Flaw: she cannot resist a profitable risk.
    - label: Skills
      text: Negotiation 4, Knowledge (Law) 3, Knowledge (Rome) 3, Deception 3, Coercion 2, Charm 2.
    - label: Talents
      text: Adversary 2; Morning Clients; a dossier on every client.
    - label: Abilities
      text: |-
        **The Ledger:** she knows the true finances of the great, and can call a debt at the worst possible moment — add [[boost boost]] to any social check against a man who owes her. **Credit as a Weapon:** she can bankroll the party, or quietly cut off their rival's line of credit.
  - type: p
    style: body
    text: |-
      **The Palatine (*Palatium*).** The hill above the Forum, the most fashionable address in Rome — dense with senatorial *domus* rather than tenements, and hung with the myth of Romulus, whose reed hut was piously preserved here. *Under the emperors this is *the* imperial residence (the word *palace* is its name); in the default era it is the seat of the ruling house. A PC invited up the Palatine has arrived — or is walking into a trap.*
  - type: statblock
    name: Hyacinthus
    kind: Nemesis
    desc: |-
      An imperial freedman, born a slave, who keeps the emperor's accounts as *a rationibus* — and therefore holds the purse of the world. Smooth, tireless, richer than most senators, and hated by all of them.
    chars:
      Br: '1'
      Ag: '2'
      Int: '4'
      Cun: '4'
      Will: '3'
      Pr: '3'
    derived:
      Soak: '2'
      W.T.: '13'
      S.T.: '18'
      Def (M/R): 0/1
    fields:
    - label: Motivations
      text: |-
        Desire: to be indispensable to the throne. Fear: a new emperor, a new favourite. Strength: he controls access and money. Flaw: a freedman's hunger for the respect birth denies him.
    - label: Skills
      text: |-
        Knowledge (Rome) 4, Knowledge (Law) 3, Negotiation 3, Deception 3, Charm 2, Vigilance 3, Cool 2.
    - label: Talents
      text: Adversary 2; Plausible Deniability; Nobody's Fool.
    - label: Abilities
      text: |-
        **The Keys to the Purse:** he can fund or ruin an enterprise with a stroke of the stylus, and adds [[success]] to any check turning on money or palace access. **The Emperor's Ear:** a word from him carries the weight of the princeps — treat as the *Emperor's known wish* against those he opposes.
  - type: p
    style: body
    text: |-
      **The Capitoline (*Capitolium & the arx*).** The steep citadel-hill looming over the Forum, crowned by the great Temple of Jupiter Optimus Maximus and the Temple of Concord; its northern summit, the *arx*, holds the *auguraculum* where the augurs read the sky. *The religious summit of the state: consuls take office and triumphs end here with a sacrifice to Jupiter. It has also been a killing-ground. A natural site for an omen, a vow, or a last stand.*
  - type: p
    style: body
    text: |-
      **The Subura (*Subura*).** The crowded, low-lying warren between the Esquiline, Viminal, and Quirinal: teetering *insulae*, workshops, taverns, brothels, and markets, loud and filthy and perpetually about to catch fire. Even Caesar grew up here. *Rome's great slum and underworld — the place for a fence, a hired knife, a safe house, or a chase across the rooftops. Fire is always one spark away.*
  - type: statblock
    name: Rufio Scaeva
    kind: Nemesis
    desc: |-
      A scarred freedman who runs a *collegium* — nominally a burial-club and crossroads shrine, in truth the organized muscle of the quarter. He delivers votes, protection, arson, and silence, and the aediles look the other way.
    chars:
      Br: '3'
      Ag: '3'
      Int: '2'
      Cun: '4'
      Will: '3'
      Pr: '3'
    derived:
      Soak: '4'
      W.T.: '16'
      Def (M/R): 1/0
    fields:
    - label: Motivations
      text: |-
        Desire: to be the man the quarter needs. Fear: a rival collegium. Strength: a hundred clients who owe him. Flaw: pride in his own legend.
    - label: Skills
      text: Brawl 3, Melee 2, Coercion 3, Streetwise 4, Deception 2, Knowledge (Rome) 2, Vigilance 3.
    - label: Talents
      text: Adversary 2; Morning Clients; a standing minion group of *Street Toughs*.
    - label: Abilities
      text: |-
        **The Quarter Is His:** anywhere in the Subura, Rufio adds [[boost boost]] to social and Streetwise checks and always knows who is new; strangers who cross him draw his toughs within a scene. **Fire as Argument:** he can arrange a “accidental” tenement fire as a threat or a distraction.
  - type: p
    style: body
    text: |-
      **The Aventine (*Mons Aventinus*).** The hill south of the Forum, outside the old pomerium — Marin's sources call it flatly “the region of the plebs.” Home to the cults of Ceres and Diana and to the long memory of plebeian revolt; Gaius Gracchus made his last armed stand here. *The people's hill, the counterweight to the Palatine. Where a tribune raises the mob, where a secession begins, where the poor have numbers on their side.*
  - type: p
    style: body
    text: |-
      **The Esquiline, Quirinal, Viminal & Caelian (*the lesser hills*).** The remaining canonical hills: the Esquiline a place of contrasts (old paupers' graveyards on its edge, luxury *horti* within); the Quirinal a respectable temple-dotted ridge; the Viminal the quiet, small one; the Caelian a mixed quarter growing ever more aristocratic toward the Colosseum valley. *Good “filler” districts — residential, mixed, each with a different social flavour. Drop a patron's *domus*, a philosopher's rented rooms, or a quiet murder here.*
  - type: statblock
    name: Verax the Thracian
    kind: Nemesis
    desc: |-
      A captured warrior turned champion of the arena — the finest blade in the ludus, one great bout from the wooden sword of freedom. Courteous, patient, and lethal; the crowd screams his name.
    chars:
      Br: '4'
      Ag: '4'
      Int: '2'
      Cun: '3'
      Will: '4'
      Pr: '2'
    derived:
      Soak: '5'
      W.T.: '18'
      Def (M/R): 1/1
    fields:
    - label: Motivations
      text: |-
        Desire: the *rudis* — freedom. Fear: dying unremembered. Strength: unmatched skill of arms. Flaw: a debt of honour to a fellow fighter.
    - label: Skills
      text: Melee 4, Brawl 3, Athletics 3, Coordination 2, Cool 3, Resilience 3.
    - label: Talents
      text: Adversary 3; Gladiatorial Training; Parry 3; Feint.
    - label: Abilities
      text: |-
        **Showman's Kill:** when he wins a melee check he may spend [[advantage]]/[[triumph]] to work the crowd, swinging the race-day/arena mood and the editor's *missio* vote. **The Crowd's Favourite:** so long as the mob loves him, even his master dares not simply dispose of him.
  - type: statblock
    name: Hermogenes
    kind: Rival
    desc: |-
      A Greek physician of the Hippocratic schools, a freedman attached to a great house — and thus privy to every illness, pregnancy, poisoning, and deathbed secret under its roof. Indispensable, and therefore dangerous.
    chars:
      Br: '1'
      Ag: '3'
      Int: '4'
      Cun: '3'
      Will: '3'
      Pr: '2'
    derived:
      Soak: '2'
      W.T.: '12'
      Def (M/R): 0/1
    fields:
    - label: Motivations
      text: |-
        Desire: knowledge, and a patron worth serving. Fear: being blamed for a death. Strength: his masters' lives are in his hands. Flaw: intellectual vanity.
    - label: Skills
      text: Medicine 4, Knowledge (the Gods) 2, Knowledge (Rome) 2, Deception 2, Vigilance 2, Cool 2.
    - label: Talents
      text: Adversary 1; superb Medicine; knows every house's secrets.
    - label: Abilities
      text: |-
        **The Healer's Hand:** removes [[setback]] from Medicine and may heal strain or wounds beyond a kit's normal use. **He Knows What Ails the House:** a reservoir of intimate secrets — and the quiet skill to make a death look natural, should he choose.
  - type: p
    style: body
    text: |-
      **The Campus Martius (*the Field of Mars*).** The broad Tiber-bend plain *outside* the pomerium, sacred to Mars: muster-ground and drill-field, the *ovile* where the centuriate assembly votes, and the temples (Apollo, Bellona) where the Senate meets generals who may not enter the city under arms. *The threshold between war and the city. Armies assemble here, triumphs form up here, and a general who wants his triumph waits here — barred, like his soldiers, from crossing the sacred line.*
  - type: p
    style: body
    text: |-
      **Transtiberim (*Trans Tiberim*).** The working quarter on the right bank, across the river: docks, warehouses, tanneries, and a mixed immigrant population — Jews, Syrians, and sailors — connected by the bridges and the island. Augustus's fourteenth region. *The “wrong side of the river”: the port economy, foreign cults, smuggling, and communities that keep their own customs. A place to land cargo quietly or vanish into a crowd.*
  - type: statblock
    name: Thaïs of the Iseum
    kind: Nemesis
    desc: |-
      A freedwoman priestess of Isis who presides over the dockside temple and, through it, the right-bank trade in secrets, contraband, and foreign gods. Serene, generous, and utterly informed.
    chars:
      Br: '1'
      Ag: '2'
      Int: '3'
      Cun: '4'
      Will: '4'
      Pr: '4'
    derived:
      Soak: '2'
      W.T.: '14'
      S.T.: '16'
      Def (M/R): 0/1
    fields:
    - label: Motivations
      text: |-
        Desire: a sanctuary for her people and her goddess. Fear: a crackdown on “foreign superstition.” Strength: a web of dockers, sailors, and devotees. Flaw: she will risk much for a fellow worshipper.
    - label: Skills
      text: |-
        Charm 3, Deception 3, Knowledge (the Gods) 3, Knowledge (Rome) 2, Streetwise 3, Vigilance 2.
    - label: Talents
      text: Adversary 2; Nobody's Fool; a Web-of-Letters among the docks.
    - label: Abilities
      text: |-
        **What Comes Ashore:** once per session she can tell you who shipped what, and when — or make a cargo quietly disappear. **The Goddess Sees:** in a [[Fated]] Rome her omens feed the party's Story Points; her devotees will hide a hunted man.
  - type: p
    style: body
    text: |-
      **The Markets: Boarium, Velabrum & Argiletum (*the trade quarters*).** The commercial connective tissue of the lower city: the Forum Boarium (cattle market and river port beside the ancient temples of Hercules and Portunus), the Velabrum (a corridor of food- and oil-sellers), and the Argiletum (the “book street” of booksellers and craftsmen running up toward the Subura). *Where goods and gossip change hands. Shops, warehouses, a bookseller who copies more than he should, and the river wharves where everything enters the city.*
  - type: p
    style: body
    text: |-
      **The Circus Maximus (*Circus Maximus*).** The vast chariot-racing arena in the valley between Palatine and Aventine, ringed by shops, food-stalls, and bars, seating a crowd that can be counted in the hundreds of thousands. *The one place the whole city gathers and the ruler must show his face. Run the races (see *The Arena & the Races*), and remember that a crowd this size is a political force — acclamation here is the Imperial *contio*.*
  - type: statblock
    name: Eutyches the Green
    kind: Rival
    desc: |-
      The reigning charioteer of the Green faction — a slave-born idol worth more than a senator's estate, cheered by tens of thousands who would riot at his death. Fearless to the point of madness.
    chars:
      Br: '3'
      Ag: '4'
      Int: '2'
      Cun: '3'
      Will: '3'
      Pr: '3'
    derived:
      Soak: '3'
      W.T.: '15'
      Def (M/R): 1/1
    fields:
    - label: Motivations
      text: |-
        Desire: freedom, and to be remembered. Fear: the fall that cripples. Strength: the adoration of the mob. Flaw: recklessness.
    - label: Skills
      text: Driving 4, Athletics 3, Coordination 3, Cool 2, Charm 2.
    - label: Talents
      text: Adversary 1; Full Throttle; Defensive Driving.
    - label: Abilities
      text: |-
        **Darling of the Crowd:** at the Circus the faithful are his — his word can calm or inflame a crowd of thousands (feed or spend the race-day mood pool). **No Fear of the Turn:** he may suffer strain to attempt driving stunts no sane man would.
  - type: sidebar
    title: "The Pomerium: Rome's Sacred Line"
    body:
    - |-
      The **pomerium** is not a wall but a line — the augurally-defined sacred boundary that separates the *urbs* (the holy city) from the *ager* (the land outside). It is the master rule of Roman space. Inside it, military *imperium* cannot be exercised: soldiers may not march under arms, weapons are set aside, a general lays down his command, and the dead may not be buried. Crossing it changes a magistrate's powers and his dress. This is why a triumph-seeking general and his army wait on the Campus Martius, why the Senate meets commanders in temples outside the line, and why an armed intrusion into the city is not a mere crime but a sacrilege — a fact worth a whole adventure.
  - type: h3
    text: The Provinces of the Empire
  - type: p
    style: body
    text: |-
      To a Roman of the Republic, a *provincia* was not a place but a **task** — a sphere of command the Senate handed a magistrate: an army, a named enemy, an enemy homeland. Only slowly did the word harden into *territory*. By the age of the emperors the empire is a collection of provinces, and they come in two kinds, plus one that is neither.
  - type: list
    items:
    - |-
      **Imperial provinces** — the frontier commands where the legions stand. They are the emperor's, run for him by a *legatus Augustus pro praetore* who serves at his pleasure. Power, danger, and armies live here.
    - |-
      **Senatorial provinces** — the pacified interior, allotted by the Senate to an ex-consul or ex-praetor as *proconsul* for a single year, usually with no legion. Wealth and prestige, little force.
    - |-
      **Aegyptus (Egypt)** — neither: the emperor's private domain, run by an equestrian prefect. No senator may even enter without his leave, for whoever holds Egypt's grain holds Rome by the throat.
  - type: p
    style: body
    text: |-
      **Italia** — *the core, not a province.* The citizen heartland — no tribute, no governor, source of soldiers and legitimacy. Inside it lies Rome, and inside Rome the pomerium. **Rome wants:** Soldiers, legitimacy, grain, and the senatorial class itself.
  - type: statblock
    name: Fortunata
    kind: Nemesis
    desc: |-
      The *vilica* — slave-manageress — of a senator's vast country estate. She runs the storehouses, the cult, the slave gangs, and the accounts while the master is in Rome; nothing enters or leaves without her tally.
    chars:
      Br: '2'
      Ag: '2'
      Int: '3'
      Cun: '4'
      Will: '4'
      Pr: '2'
    derived:
      Soak: '3'
      W.T.: '15'
      Def (M/R): 0/0
    fields:
    - label: Motivations
      text: |-
        Desire: to make the estate (and herself) indispensable. Fear: a new overseer. Strength: she holds the keys and the rationing. Flaw: she rules the slave quarters as her own fief.
    - label: Skills
      text: Knowledge (Rome) 2, Coercion 3, Negotiation 2, Survival 3, Vigilance 3, Discipline 3.
    - label: Talents
      text: Adversary 2; Morning Clients (among the estate's hands and freedmen).
    - label: Abilities
      text: |-
        **Keeper of the Stores:** she controls food, tools, and the slave gangs — on her ground, nothing is done without her leave. **The Estate's Memory:** she knows every debt, grudge, and hidden cache on the land, and rations both grain and mercy as tools.
  - type: p
    style: body
    text: |-
      **Sicilia** — *senatorial.* Rome's first overseas conquest, a quiet grain-island of old Greek and Punic cities, long past its war-front days — but it remembers its slave revolts. **Rome wants:** Grain for the city, and the quiet corruption of the grain fleet.
  - type: p
    style: body
    text: |-
      **Sardinia et Corsica** — *imperial/senatorial.* Mountainous islands whose interior tribes — the *Barbaria* — were never truly subdued; a place of banditry, mines, and exiles. **Rome wants:** Grain, minerals, and a hold on the western sea.
  - type: p
    style: body
    text: |-
      **Hispania** — *imperial (Tarraconensis, Lusitania) & senatorial (Baetica).* Rome's hardest school of empire; two centuries of Celtiberian guerrilla war and legendary sieges. Now the greatest mines in the empire honeycomb its hills. **Rome wants:** Silver and gold above all, oil from Baetica, and hard northern soldiers.
  - type: p
    style: body
    text: |-
      **Gallia** — *senatorial (Narbonensis) & imperial (the Three Gauls).* Narbonensis is “Italy outside Italy”; beyond it Caesar's conquered Three Gauls face the Rhine, their druids driven under and their tribes gathered yearly at the great altar of Lugdunum. **Rome wants:** Manpower, grain and wine, and the roads to the Rhine and Britain.
  - type: p
    style: body
    text: |-
      **Africa** — *senatorial (with an imperial legion in Numidia).* The land of destroyed Carthage — ritually cursed, then refounded — now booming with oil-rich estates, with desert nomads raiding the frontier road. **Rome wants:** Grain and olive oil on a vast scale; the breadbasket beside Egypt.
  - type: p
    style: body
    text: |-
      **Asia** — *senatorial.* Rich western Anatolia, willed to Rome by the last king of Pergamon: a glittering string of proud Greek cities (Ephesus, Pergamon, Smyrna) that still remember the tax-farmers' extortions. **Rome wants:** Tax revenue, trade wealth, and the prestige of the richest proconsulship.
  - type: p
    style: body
    text: |-
      **Macedonia et Achaea** — *senatorial.* Greece: a land living on its glorious past — philosophy, the Games, and the great sanctuaries — with a still-restless northern frontier against Thracian raiders. **Rome wants:** Cultural prestige, tourists and students, and a northern buffer.
  - type: p
    style: body
    text: |-
      **Aegyptus** — *the emperor's domain.* Ancient, bureaucratic, and polyglot along the Nile, crowned by seething Alexandria and temples older than Rome. No senator enters without the emperor's word. **Rome wants:** Grain — a huge share of the city's dole — plus papyrus, glass, and the Red Sea trade.
  - type: statblock
    name: Zenon of Alexandria
    kind: Nemesis
    desc: |-
      A Greek *navicularius* (shipping magnate) whose grain fleet is a sizeable share of the dole that keeps Rome fed and quiet. Suave, cosmopolitan, and keenly aware that he holds the city's hunger in his holds.
    chars:
      Br: '1'
      Ag: '2'
      Int: '4'
      Cun: '4'
      Will: '3'
      Pr: '3'
    derived:
      Soak: '2'
      W.T.: '13'
      S.T.: '16'
      Def (M/R): 0/1
    fields:
    - label: Motivations
      text: |-
        Desire: profit and standing in two worlds. Fear: the emperor's prefect, who can ruin him. Strength: he can speed or stall the grain fleet. Flaw: he plays Rome and Alexandria against each other.
    - label: Skills
      text: Negotiation 4, Knowledge (Rome) 3, Deception 3, Charm 3, Coordination 2, Vigilance 2.
    - label: Talents
      text: Adversary 2; a web of factors in every eastern port.
    - label: Abilities
      text: |-
        **Hold of the City's Hunger:** by hastening or delaying his fleet he can ease or inflame the Roman grain price — and the mob's temper with it. **Two Worlds:** equally at home in the Museum and the Forum, he adds [[boost]] to cross-cultural social checks.
  - type: p
    style: body
    text: |-
      **Syria** — *imperial (great command).* The eastern military command facing Parthia — several legions far from Rome, every ambitious general's dream and every emperor's fear — astride the caravan trade through Palmyra. **Rome wants:** A strong frontier army, the eastern luxury trade, and the revenues of ancient cities.
  - type: statblock
    name: Zabdibel of Palmyra
    kind: Nemesis
    desc: |-
      A caravan-prince of the desert city, lord of the routes that bring silk, spice, and incense from the East. He commands his own armed caravan-guard and treats with Rome and Parthia as a power, not a subject.
    chars:
      Br: '3'
      Ag: '3'
      Int: '3'
      Cun: '4'
      Will: '3'
      Pr: '4'
    derived:
      Soak: '4'
      W.T.: '16'
      Def (M/R): 1/1
    fields:
    - label: Motivations
      text: |-
        Desire: to keep Palmyra free and rich between two empires. Fear: a frontier war that closes the routes. Strength: wealth, his caravan-guard, and both empires' need of him. Flaw: he trusts no empire, and both know it.
    - label: Skills
      text: |-
        Negotiation 3, Knowledge (Rome) 2, Streetwise 3, Ranged 3, Coordination 2, Leadership 3, Survival 3.
    - label: Talents
      text: Adversary 2; Field Commander (his caravan-guard are a trained minion group).
    - label: Abilities
      text: |-
        **Lord of the Routes:** he can move goods — or people — across the eastern desert where Rome's writ fades, and knows what crosses the Parthian line. **A Prince, Not a Subject:** on his own ground his standing rivals a governor's; slight him and the caravans simply stop coming.
  - type: p
    style: body
    text: |-
      **Britannia** — *imperial.* The wild northwestern frontier at the edge of the world: a three-legion island of mist, druids, and the burnt memory of Boudica's revolt. Hadrian's Wall is coming. **Rome wants:** Prestige and conquest-glory, metals, hides, slaves — though many doubt it ever pays for its legions.
  - type: statblock
    name: Esico
    kind: Rival
    desc: |-
      A druid of the old faith, hunted since Rome put the sacred groves to the torch. He keeps the memory of free Britain and the old gods alive among the tribes, and a Roman column has never yet caught him.
    chars:
      Br: '2'
      Ag: '3'
      Int: '3'
      Cun: '4'
      Will: '4'
      Pr: '3'
    derived:
      Soak: '3'
      W.T.: '14'
      S.T.: '16'
      Def (M/R): 1/1
    fields:
    - label: Motivations
      text: |-
        Desire: to drive Rome back into the sea. Fear: the last grove felled. Strength: the tribes' faith and the land itself. Flaw: he will spend lives — others' and his own — for the cause.
    - label: Skills
      text: Knowledge (the Gods) 3, Survival 4, Stealth 3, Charm 2, Coercion 2, Vigilance 3.
    - label: Talents
      text: Adversary 1; Master of the land; a hidden network of believers.
    - label: Abilities
      text: |-
        **The Old Gods Watch:** in a [[Fated]] or [[Mythic]] Britannia his curses and omens bite — inflict fear or bank [[threat]] against those who defile the groves. **He Knows the Land:** on his own ground Rome's soldiers suffer [[setback]] to track or corner him, and the tribes shelter him.
  - type: p
    style: body
    text: |-
      **The Rhine & Danube Frontier** — *imperial (Germania, the Danube provinces).* The empire's armed edge and densest concentration of legions since the lost eagles of Teutoburg: a continuous line of forts facing Germans and Sarmatians, with Trajan's gold-rich Dacia freshly won. **Rome wants:** Defense above all — this is where the army lives — plus Dacian gold and frontier recruits.
  - type: statblock
    name: Lucius Petronius
    kind: Nemesis
    desc: |-
      The *primus pilus* — first-spear centurion — of a frontier legion: thirty years under arms, the iron spine of the camp, more feared and obeyed than the young senators who nominally command him.
    chars:
      Br: '4'
      Ag: '3'
      Int: '2'
      Cun: '3'
      Will: '4'
      Pr: '3'
    derived:
      Soak: '5'
      W.T.: '20'
      Def (M/R): 1/1
    fields:
    - label: Motivations
      text: |-
        Desire: the honour of the eagle, and a rich retirement. Fear: a broken line. Strength: the legionaries obey him before any tribune. Flaw: contempt for soft city politics.
    - label: Skills
      text: |-
        Melee 3, Ranged 3, Discipline 4, Leadership 3, Coercion 3, Knowledge (Warfare) 3, Resilience 3.
    - label: Talents
      text: Adversary 2; Field Commander; Commanding Presence.
    - label: Abilities
      text: |-
        **The Spine of the Legion:** troops under his eye gain [[boost]] and resist fear; he turns a wavering line. **The Soldiers Are His:** in a crisis the men look to Petronius, not the aristocrat in the fine cloak — a quiet, dangerous fact on a frontier far from Rome.
  - type: p
    style: body
    text: |-
      **Iudaea** — *imperial (equestrian governor, backed by Syria).* A small, turbulent province whose people will die rather than set the emperor's image in their Temple; the Great Revolt ended with that Temple in ashes. **Rome wants:** Order and the security of the east, taxes and balsam — and above all, quiet.
  - type: p
    style: small
    text: |-
      **At the table.** Provinces are where careers are made and lost: a governorship is a licence to grow rich (and a *repetundae* trial waiting to happen — see Scenario II), a frontier command is a springboard to the purple (and to civil war), and the edge of the map is where a campaign can leave the city behind entirely.
- title: Dramatis Personae
  blocks:
  - type: p
    style: lead
    text: |-
      The great names of the age — ready to walk into the Republican scenarios in this book, drop in as cameos, or serve as models for the patrons and rivals of your own cast. They are drawn from the research wiki's figures; several make the book's own point that eloquence is only one road to power (Pompey and Marius ruled with almost none).
  - type: statblock
    name: Marcus Tullius Cicero
    kind: Nemesis
    desc: |-
      The Republic's greatest orator — a *novus homo* who climbed to the consulship on his voice alone, and never lets anyone forget it. Vain, brilliant, and politically brave in bursts.
    chars:
      Br: '1'
      Ag: '2'
      Int: '4'
      Cun: '3'
      Will: '2'
      Pr: '4'
    derived:
      Soak: '2'
      W.T.: '13'
      S.T.: '16'
      Def (M/R): 0/1
    fields:
    - label: Motivations
      text: |-
        Desire: the Republic (and his own glory). Fear: obscurity and exile. Strength: unmatched eloquence. Flaw: vanity — flatter him and he talks.
    - label: Skills
      text: |-
        Charm 3, Coercion 2, Deception 3, Knowledge (Law) 3, Knowledge (Rome) 3, Leadership 2, Negotiation 3, Vigilance 2.
    - label: Talents
      text: Adversary 2; Master Orator; Nobody's Fool; Captatio Benevolentiae.
    - label: Abilities
      text: |-
        **The Superweapon of Eloquence:** once per encounter, when Cicero wins an oratorical appeal he may upgrade its effect twice; on a [[triumph]] he sways the entire audience at a stroke. **Appeal to Pity:** he wins trials with weeping families and bared scars — add [[boost boost]] to a Pathos appeal.
    - label: At the Table
      text: |-
        The advocate for — or against — the PCs in any courtroom (Scenario II); the consul racing to expose Catiline (Scenario I). A dangerous ally whose pride is a handle.
  - type: statblock
    name: Marcus Porcius Cato (the Younger)
    kind: Nemesis
    desc: |-
      The incorruptible Stoic, great-grandson of the Censor: rigid, fearless, and theatrically principled — yet capable of cold pragmatic alliance when the Republic needs it.
    chars:
      Br: '2'
      Ag: '2'
      Int: '3'
      Cun: '2'
      Will: '5'
      Pr: '3'
    derived:
      Soak: '3'
      W.T.: '15'
      S.T.: '18'
      Def (M/R): 0/1
    fields:
    - label: Motivations
      text: |-
        Desire: the *mos maiorum* restored. Fear: tyranny and corruption. Strength: integrity no coin can touch. Flaw: rigidity — he will break before he bends.
    - label: Skills
      text: |-
        Coercion 2, Cool 3, Discipline 4, Knowledge (Law) 2, Knowledge (Rome) 3, Leadership 2, Vigilance 2.
    - label: Talents
      text: Adversary 2; Stoic Discipline 2; Filibuster; Consular Gravitas.
    - label: Abilities
      text: |-
        **Unbuyable:** immune to bribery and to strain inflicted by insult, temptation, or flattery (*things indifferent*). **The Filibuster:** may talk out the Senate's clock to kill a motion without a vote. **The Good Death:** cornered, he will take his own life rather than submit — and the gesture only raises his Dignitas.
    - label: At the Table
      text: |-
        The conscience of the Senate and the hardest bloc to move (The Theater of Power). Use him to make the players *earn* a vote, or as the Stoic adversary given a name.
  - type: statblock
    name: Gaius Julius Caesar
    kind: Nemesis
    desc: |-
      The colossus: a patrician *popularis* of terrifying energy and charm whose oratory was merely the springboard for the fastest, boldest career Rome ever saw. The people adore him; the optimates are right to be afraid.
    chars:
      Br: '3'
      Ag: '3'
      Int: '4'
      Cun: '4'
      Will: '3'
      Pr: '4'
    derived:
      Soak: '4'
      W.T.: '18'
      S.T.: '18'
      Def (M/R): 1/1
    fields:
    - label: Motivations
      text: |-
        Desire: Dignitas above all — to be first in everything. Fear: to be any man's second. Strength: speed, genius, and the common people's love. Flaw: ambition, and a clemency that spares his killers.
    - label: Skills
      text: |-
        Melee 3, Ranged 2, Athletics 2, Charm 3, Coercion 3, Deception 3, Knowledge (Rome) 3, Knowledge (Warfare) 4, Leadership 4, Negotiation 3.
    - label: Talents
      text: Adversary 3; Master Orator; Commanding Presence; Patronus.
    - label: Abilities
      text: |-
        **Celeritas:** Caesar takes two actions on his turn where another takes one, in war and in politics alike. **The People's Champion:** against any attempt to check or shame him publicly, the plebs rally — add [[success]] and [[boost]] to his social checks before a crowd. **The Legions Are His:** his veterans' loyalty is to him, not the state.
    - label: At the Table
      text: |-
        The rising threat behind every late-Republican scene; a patron whose favour is intoxicating and ruinous. The event-horizon the whole setting bends toward.
  - type: statblock
    name: Gnaeus Pompeius Magnus
    kind: Nemesis
    desc: |-
      “The Great” — Rome's conquering hero, who reached unheard-of commands on military glory and patronage, not words. A reactive, uneasy public speaker who lets his reputation do the talking.
    chars:
      Br: '3'
      Ag: '3'
      Int: '3'
      Cun: '3'
      Will: '3'
      Pr: '3'
    derived:
      Soak: '4'
      W.T.: '20'
      S.T.: '16'
      Def (M/R): 1/1
    fields:
    - label: Motivations
      text: |-
        Desire: to be first citizen, and loved for it. Fear: a rival greater than himself (and there is one). Strength: an unmatched military record and a vast clientela. Flaw: vanity and indecision when the crowd is cold.
    - label: Skills
      text: Melee 2, Ranged 2, Leadership 4, Knowledge (Warfare) 4, Coercion 2, Cool 2, Negotiation 2.
    - label: Talents
      text: Adversary 3; Field Commander; Patronus.
    - label: Abilities
      text: |-
        **Reputation Precedes Him:** Pompey's Dignitas argues for him — add an automatic [[success]] to Leadership and first-impression checks. **But No Orator:** he is a reactive speaker; he suffers [[setback]] on improvised oratory before a hostile crowd, and must rely on spectacle, patronage, and his record instead.
    - label: At the Table
      text: |-
        The model of the general-statesman — proof that in Rome standing, not eloquence, often wins the Forum. A patron, a rival, or the looming power behind a command.
  - type: statblock
    name: Lucius Cornelius Sulla
    kind: Nemesis
    desc: |-
      The dictator who first marched a Roman army on Rome and proscribed his enemies by name — the precedent that haunts every civil war to come. Charming, cruel, and convinced of his own luck.
    chars:
      Br: '3'
      Ag: '2'
      Int: '3'
      Cun: '4'
      Will: '4'
      Pr: '3'
    derived:
      Soak: '4'
      W.T.: '18'
      S.T.: '18'
      Def (M/R): 1/1
    fields:
    - label: Motivations
      text: |-
        Desire: to restore the aristocracy's rule — by terror if need be. Fear: the mob and chaos. Strength: ruthlessness and uncanny fortune. Flaw: cruelty that outlives its usefulness.
    - label: Skills
      text: |-
        Melee 3, Ranged 2, Coercion 4, Deception 3, Knowledge (Warfare) 3, Leadership 3, Knowledge (Rome) 2.
    - label: Talents
      text: Adversary 3; Commanding Presence; fearsome reputation.
    - label: Abilities
      text: |-
        **Felix (the Fortunate):** once per session Sulla may reroll any one check, trusting his luck. **Proscription:** he can post a name to a public list and make murder legal — terror that adds [[setback setback]] to anyone who would oppose him openly.
    - label: At the Table
      text: |-
        The dark precedent and a towering past (or present) menace for Republican play — the man who proved the army could take the city.
  - type: statblock
    name: Marcus Antonius (Mark Antony)
    kind: Nemesis
    desc: |-
      The soldier's soldier and crisis careerist: blunt, brave, hard-drinking, a reactive orator who sways troops and mobs with spectacle and plain speech rather than polished rhetoric.
    chars:
      Br: '4'
      Ag: '3'
      Int: '2'
      Cun: '3'
      Will: '3'
      Pr: '4'
    derived:
      Soak: '5'
      W.T.: '20'
      S.T.: '16'
      Def (M/R): 1/1
    fields:
    - label: Motivations
      text: |-
        Desire: glory, pleasure, and a great man's favour. Fear: being sidelined. Strength: soldiers love him. Flaw: his appetites — wine, women, and loyalty to the wrong patron.
    - label: Skills
      text: |-
        Melee 3, Ranged 3, Brawl 2, Athletics 2, Charm 2, Coercion 3, Leadership 3, Knowledge (Warfare) 2.
    - label: Talents
      text: Adversary 2; Field Commander; a rousing, reactive speaker.
    - label: Abilities
      text: |-
        **The Soldier's Friend:** add [[boost boost]] to rally troops or a crowd with blunt words and spectacle (the funeral oration that turned Rome). **Hard to Keep Down:** reduce Critical Injury results against him by 10 (minimum 1).
    - label: At the Table
      text: |-
        Muscle with a name — a dangerous ally or enforcer, and the model of the general who leads by swagger rather than Senate-craft.
  - type: statblock
    name: Gaius Marius
    kind: Nemesis
    desc: |-
      The new man from Arpinum who held the consulship an unheard-of seven times, reformed the army, and saved Rome from the northern tribes — a military genius and a political blunt instrument.
    chars:
      Br: '4'
      Ag: '3'
      Int: '2'
      Cun: '3'
      Will: '4'
      Pr: '2'
    derived:
      Soak: '5'
      W.T.: '22'
      S.T.: '16'
      Def (M/R): 1/1
    fields:
    - label: Motivations
      text: |-
        Desire: recognition the nobles deny him. Fear: being despised as a jumped-up peasant. Strength: the legions are his creation and his own. Flaw: no gift for politics or speech — clumsy and resentful in the Forum.
    - label: Skills
      text: |-
        Melee 3, Ranged 2, Athletics 2, Leadership 4, Knowledge (Warfare) 4, Discipline 3, Resilience 3.
    - label: Talents
      text: Adversary 3; Field Commander; Commanding Presence.
    - label: Abilities
      text: |-
        **Third Founder of Rome:** in command of an army Marius is nearly unbeatable — add [[success]] to his Knowledge (Warfare) and Leadership checks in the field. **The New-Model Army:** his landless recruits are loyal to *him*, not the state — the seed of every civil war to follow. **No Orator:** [[setback setback]] to formal oratory.
    - label: At the Table
      text: |-
        The template of the people's general whose soldiers outrank the Senate — and living proof that Rome can be ruled with a sword and almost no rhetoric at all.
  - type: statblock
    name: Imperator Caesar Augustus
    kind: Nemesis
    desc: |-
      The first citizen — model for every emperor who follows. He rules absolutely while seeming to rule not at all, having rebuilt one-man power behind the restored forms of the Republic. Patient, cold, and almost impossible to out-wait.
    chars:
      Br: '1'
      Ag: '2'
      Int: '4'
      Cun: '5'
      Will: '4'
      Pr: '4'
    derived:
      Soak: '3'
      W.T.: '16'
      S.T.: '22'
      Def (M/R): 1/2
    fields:
    - label: Motivations
      text: |-
        Desire: a stable order — with himself at its centre. Fear: a return to the chaos of the civil wars. Strength: patience and concealment. Flaw: he must control everything, and trusts almost no one.
    - label: Skills
      text: |-
        Charm 3, Coercion 3, Deception 4, Negotiation 4, Knowledge (Rome) 4, Knowledge (Law) 3, Leadership 3, Vigilance 3, Cool 3.
    - label: Talents
      text: Adversary 3; Nobody's Fool 2; Plausible Deniability; Consular Gravitas; Pater Patriae.
    - label: Abilities
      text: |-
        **The Mask of the Republic:** Augustus's *known wish* is law — against any faction he opposes, every check suffers [[setback]] (the Emperor's trump card, made flesh). **The Long Game:** immune to being out-waited or pressured; he can defer any decision without losing face. **Auctoritas Without Equal:** no one in Rome may raise their Dignitas against his in a public contest.
    - label: At the Table
      text: |-
        In the default Imperial era his heirs sit the throne — use Augustus as the template for *your* princeps: the distant, all-seeing power whose favour makes careers and whose suspicion ends them.
- title: Common Terms
  blocks:
  - type: p
    style: body
    text: 'A sprinkling of Latin brings the table to Rome. A few of the most useful:'
  - type: list
    items:
    - |-
      **SPQR** — *Senatus Populusque Romanus*, “the Senate and People of Rome,” the state itself; stamped on standards, coins, and buildings.
    - |-
      **Serica / Seres** — the distant land of silk at the eastern edge of the world (China), and its people; known to Rome only through Parthian middlemen and wild rumor.
    - "**Princeps** — “first citizen,” the Emperor's polite title; he pretends not to be a king."
    - |-
      **Cursus honorum** — the “course of offices,” the fixed ladder of political posts (quaestor, aedile, praetor, consul) an ambitious man climbs.
    - |-
      **Patronus / Cliens** — patron and client; the bond of protection and loyalty that structures all society.
    - |-
      **Salutatio** — the dawn reception where clients call on their patron to pay respects and ask favors.
    - |-
      **Civis Romanus sum** — “I am a Roman citizen”; the phrase that demands legal protection and the right of appeal.
    - |-
      **Legio / Centuria / Contubernium** — legion (~5,000 men) / century (~80, led by a centurion) / tent-group (8, the squad).
    - "**Pilum / Gladius / Scutum** — javelin / short sword / shield: the legionary's core kit."
    - '**Testudo** — “tortoise,” the shield formation that covers a unit front and top.'
    - '**Limes** — the fortified frontier of the Empire.'
    - '**Auxilia** — non-citizen support troops; earn citizenship on discharge.'
    - |-
      **Denarius / Sesterce / As / Aureus** — the silver, brass, copper, and gold of Roman coinage (1 aureus = 25 denarii = 100 sesterces = 400 asses).
    - |-
      **Panem et circenses** — “bread and circuses”: the grain dole and public games that kept the mob content.
    - |-
      **Editor** — the sponsor who pays for and presides over the games; he decides *missio* (mercy) with the crowd.
    - |-
      **Missio / Rudis** — the reprieve of a defeated gladiator / the wooden sword awarded at his freedom.
    - '**Lanista / Familia / Ludus** — the owner-trainer / the troupe / the gladiator school.'
    - |-
      **Collegium** — a guild or association (trade, burial, religious) — and often a front for a street gang.
    - |-
      **Vigiles / Cohortes Urbanae** — the night-watch/fire-brigade and the city military police.
    - |-
      **Frumentarius** — a soldier-courier who doubled as the Empire's nearest thing to a secret agent.
    - '**Libertus / Peregrinus** — a freed slave / a free non-citizen provincial.'
    - '**Pater familias** — the male head of a household, with legal power over its members.'
    - |-
      **Toga / Tunica / Stola** — the citizen's formal wrap / everyday garment / a married woman's dress.
    - |-
      **Haruspex / Augur** — a reader of entrails / a reader of birds and omens; official diviners of the state.
    - |-
      **Imperium** — the formal power to command (armies, the law); held by consuls, praetors, governors, and the Emperor.
    - '**Ave / Vale / Salve** — “hail” / “farewell” / “be well” (a common greeting).'
  - type: p
    style: body
    text: — *Roma invicta.* —
- title: 'Appendix: Sources & Resources'
  blocks:
  - type: p
    style: lead
    text: |-
      This setting is built on real scholarship and the words of the Romans themselves. Everything here was drawn from the texts below — the same shelf a GM can raid to go deeper, settle an argument, or steal a plot. The digital tools at the end turn that reading into maps, journeys, and props at the table.
  - type: h3
    text: Primary Sources (the Ancient Voices)
  - type: list
    items:
    - |-
      **Cato & Varro** — *Roman Farm Management*.
    - |-
      **Cicero** — *De Amicitia, Scipio's Dream*.
    - |-
      **Lucretius** — *On the Nature of Things*.
    - |-
      **Seneca** — *Stoic Philosophy of Seneca*.
    - |-
      **Virgil** — *The Aeneid*.
  - type: h3
    text: Modern Scholarship
  - type: list
    items:
    - |-
      **Alexander, Michael C.** — *Trials in the Late Roman Republic, 149 BC to 50 BC (Phoenix Supplementary Volumes 26)*.
    - |-
      **Armstrong, Jeremy; Fronda, Michael P. (eds.)** — *Romans at War: Soldiers, Citizens, and Society in the Roman Republic*.
    - |-
      **Astin, A.E.** — *Cato the Censor*.
    - |-
      **Bang, Peter Fibiger** — *The Roman Bazaar: A Comparative Study of Trade and Markets in a Tributary Empire*.
    - |-
      **Botsford, George Willis** — *The Roman Assemblies from their Origin to the End of the Republic*.
    - |-
      **Campbell** — *The Ancient World (From the Dawn of History to the Conversion of Constantine)*.
    - |-
      **Casson, Lionel** — *Travel in the Ancient World*.
    - |-
      **DiLuzio, Meghan J.** — *A Place at the Altar: Priestesses in Republican Rome*.
    - |-
      **Draycott, Jane** — *Roman Domestic Medical Practice in Central Italy: From the Middle Republic to the Early Empire*.
    - |-
      **Driediger-Murphy, Lindsay G.** — *Roman Republican Augury: Freedom and Control*.
    - |-
      **Gargola, Daniel J.** — *The Shape of the Roman Order: The Republic and Its Space*.
    - |-
      **Golyzniak, Pawel** — *Engraved Gems and Propaganda in the Roman Republic and under Augustus*.
    - |-
      **Goodman, Penelope J.** — *The Roman City and its Periphery: From Rome to Gaul*.
    - |-
      **Greenidge, A.H.J.** — *A History of Rome During the Later Republic and Early Principate*.
    - |-
      **Gruen, Erich S.** — *Culture and National Identity in Republican Rome*.
    - |-
      **Hudson, Jared** — *The Rhetoric of Roman Transportation: Vehicles in Latin Literature*.
    - |-
      **Marin, Pamela** — *Blood in the Forum: The Struggle for the Roman Republic*.
    - |-
      **Marquardt, Joachim (transl. Victor Henry)** — *La Vie Privée des Romains (Manuel des Antiquités Romaines, vol. XIV)*.
    - |-
      **McCall, Jeremiah** — *Clan Fabius, Defenders of Rome: A History of the Republic's Most Illustrious Family*.
    - |-
      **Mommsen, Theodor** — *The History of Rome (Books 1-5)*.
    - |-
      **Morstein-Marx, Robert** — *Mass Oratory and Political Power in the Late Roman Republic*.
    - |-
      **Pearson, Elizabeth H.** — *Exploring the Mid-Republican Origins of Roman Military Administration: With Stylus and Spear*.
    - |-
      **Pennell, Robert Franklin** — *Ancient Rome: From the Earliest Times Down to 476 A.D.*.
    - |-
      **Pina Polo, Francisco** — *The Consul at Rome: The Civil Functions of the Consuls in the Roman Republic*.
    - |-
      **Roselaar, Saskia T.** — *Public Land in the Roman Republic: A Social and Economic History of Ager Publicus in Italy, 396-89 BC*.
    - |-
      **Rosenstein, Nathan** — *Rome and the Mediterranean 290 to 146 BC: The Imperial Republic*.
    - |-
      **Sage, Michael M.** — *The Republican Roman Army: A Sourcebook*.
    - |-
      **Sandberg, Kaj** — *Magistrates and Assemblies: A Study of Legislative Practice in Republican Rome (Acta Instituti Romani Finlandiae)*.
    - |-
      **Scarre, Chris** — *The Penguin Historical Atlas of Ancient Rome*.
    - |-
      **van der Blom, Henriette; Gray, Christa; Steel, Catherine (eds.)** — *Institutions and Ideology in Republican Rome: Speech, Audience and Decision*.
    - |-
      **van der Blom, Henriette** — *Oratory and Political Career in the Late Roman Republic*.
    - |-
      **Watts, Edward J.** — *Mortal Republic: How Rome Fell into Tyranny*.
    - |-
      **Wildfang, Robin Lorsch** — *Rome's Vestal Virgins*.
  - type: h3
    text: Digital Tools & Resources
  - type: list
    items:
    - |-
      **Itiner-e** (*itiner-e.org*) — A digital gazetteer of the roads of the Roman Empire — map a journey, province to province, along the roads your characters would actually walk.
    - |-
      **ORBIS** (*orbis.stanford.edu*) — Stanford's geospatial network model of the Roman world: the time and cost of travel between cities by road, river, and sea, season by season.
    - |-
      **Pleiades** (*pleiades.stoa.org*) — The community gazetteer of ancient places — the canonical reference for where a town, road, or river actually was.
    - |-
      **Digital Atlas of the Roman Empire (DARE)** (*dh.gu.se/dare*) — A zoomable map of the empire's cities, roads, and provinces, layered over modern geography.
    - |-
      **ToposText** (*topostext.org*) — Ancient texts geo-linked to every place they mention — read the sources and see the map at once.
    - |-
      **LacusCurtius** (*penelope.uchicago.edu/Thayer/E/Roman*) — A deep online library of Roman texts and topography, including Platner & Ashby's *Topographical Dictionary of Ancient Rome*.
    - |-
      **Perseus Digital Library** (*perseus.tufts.edu*) — Greek and Latin primary texts with translations and commentary — the originals behind the quotations in this book.
    - |-
      **Vici.org** (*vici.org*) — A crowd-sourced archaeological atlas of classical antiquity: find the fort, villa, or temple nearest any point.
    - |-
      **OCRE: Online Coins of the Roman Empire** (*numismatics.org/ocre*) — Every imperial coin type, searchable — ready-made portraits, propaganda, and props for the table.
