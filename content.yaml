- title: Game Mastering Rome
  part: { label: Part II, title: Running Imperial Rome }
  blocks:
  - type: p
    style: lead
    text: |-
      A historical setting is a gift and a trap. The gift is that players already know Rome — legions, togas, gladiators, “hail Caesar.” The trap is that they know the *movie* Rome, and will bring every assumption with them. Lean into the familiar iconography, then surprise them with the real strangeness: a world where the gods are in the gutters and the Senate, where a man's name tells you who owns him, and where a bad omen can stop an army.
  - type: h3
    text: Choosing a Campaign Frame
  - type: p
    style: body
    text: |-
      Rome is too big to “play Rome.” Pick a lens — a group with a reason to adventure together — the way the setting this book is modeled on gathers its heroes into a single unit.
  - type: list
    items:
    - |-
      **The Contubernium (Soldiers).** A tent-group of eight legionaries and their specialists on the frontier: patrols, skirmishes, building roads and forts, and the long boredom between terrors. Great for tactical play and the *band-of-brothers* tone. The legion is also a political animal — who does the army back?
    - |-
      **The Familia Gladiatoria (The Arena).** Fighters, a trainer, a doctor, and a sponsor in one gladiator school. Survival, rivalry, celebrity, and the dream of the wooden sword (*rudis*) of freedom. Combine spectacle with the intrigue of who bets on whom.
    - |-
      **The Cohortes Vigilum (Roman ‘Police’).** The nearest thing to the setting this book honors: the watch and the fire brigade of a great city. Investigate murders, arson, missing persons, and conspiracies in the tenements — a procedural, but one where the detectives have almost no forensic science and a great deal of politics. The *frumentarii* and a provincial governor's staff serve the same role for imperial-level intrigue.
    - |-
      **The Domus (Household & Intrigue).** A senator's extended household — heirs, freedmen, clients, slaves — navigating the *cursus honorum*, the courts, and the knife-work of high politics. Social combat is the main event.
    - |-
      **The Negotiatores (Trade & Travel).** Merchants, ship-owners, and their guards crossing the Empire and beyond — Egypt, Parthia, and the western end of the Silk Road, where fortunes ride on pepper, incense, and bolts of Chinese silk worth their weight in gold. A caravan pressing east toward rumored *Serica* (see *The Edge of the World*) turns a trade game into an odyssey past Parthian tolls, bandit passes, and the limits of the known map. Sandbox exploration with cargo manifests, pirates, and the lure of the unreachable East.
    - |-
      **The Mysteries (Supernatural).** In a [[Fated]] or [[Mythic]] Rome, investigators of cults, curses, and the old powers under the new marble — the Roman answer to cosmic horror or sword-and-sandal fantasy.
  - type: h3
    text: Status Is the Real Rulebook
  - type: p
    style: body
    text: |-
      Let legal status do heavy narrative lifting. A **citizen** can demand a proper trial and appeal to the Emperor (*Civis Romanus sum*); a **slave**'s testimony was legally admissible only under torture, and a slave who struck a citizen could be crucified. These are not die rolls — they are the stakes. The most Roman dramas come from characters trapped by their status and clawing to change it: the slave earning manumission, the freedman buying respectability, the provincial grasping for the citizenship that makes him untouchable.
  - type: h3
    text: Patron and Client
  - type: p
    style: body
    text: |-
      Nobody in Rome stands alone. Every character should know who their **patron** is (who protects and funds them, and expects loyalty, votes, and the morning *salutatio*) and who their **clients** are. Favors flow up and down this web constantly — the *Client Network* and *Client of a Great House* abilities model it, but the GM should make the web a living thing. A patron's enemy is your enemy; a patron's fall can drag you down with him.
  - type: p
    style: body
    text: |-
      **Adoption and the household.** A great family is a going concern — a name, its cults, and its capital — and adoption was the tool used to preserve it; the age this book defaults to is the era of the *adoptive emperors* (Nerva to Hadrian). An heirless senator who adopts a PC (or a rival's son) transfers Dignitas and obligations at a stroke, and a contested adoption or a disputed will is a whole campaign frame. Within the *domus*, the working household has its own offices — the *vilicus* (overseer) and *vilica* (housekeeper) run the estate and its cult under a quasi-moral code — ready-made authority, and ready-made friction, for Slave and Freedman characters.
  - type: sidebar
    title: The Thin Empire
    body:
    - |-
      Remember how *few* Romans actually governed Rome. An empire of perhaps sixty million people was run, at the top, by only a few hundred senior officials — a governor might administer a province of millions with a personal staff you could seat at one dinner-table. The Empire held together not through bureaucracy but through **local elites, patronage, religion, and sheer bluff.** This is why the reputation economy matters so much: in a thin state, who you know and how you are regarded *is* the government. It also hands the GM a sandbox — out in the provinces the PCs may be the only arm of Rome for a hundred miles, and what they decide simply becomes Roman policy.
  - type: h3
    text: Story Points as the Will of the Gods
  - type: p
    style: body
    text: |-
      In a [[Fated]] Rome, re-skin the Story Point economy as divine favor. When players spend a Story Point, something goes *right* because the gods smiled — a timely omen, a lucky gust, a rival's stumble. When the GM spends one, the gods are displeased: an ill omen manifests. Tie omen-reading (Knowledge (the Gods), above) to the pool, and let a [[triumph]] at a sacrifice feed the players' side. It makes Roman religion mechanically present without any spellcasting.
  - type: h3
    text: The Arena & the Races
  - type: p
    style: body
    text: |-
      Run a gladiatorial bout as a duel with the crowd as a third participant: track the audience's mood as a pool of [[advantage]]/[[threat]] the fighters spend on *Arena Showmanship* and on the final appeal for mercy (*missio*) — the editor of the games grants life or death partly on the crowd's roar. For chariot racing, use chase/structured rules: a long track, *Driving* checks each round, [[advantage]] to gain position and [[threat]] toward the dreaded wreck (*naufragium*). Remember Roman drivers lashed the reins around their waists and carried a knife to cut free — a failed check at speed can be lethal.
  - type: h3
    text: Keeping It Roman
  - type: list
    items:
    - |-
      **No clocks, no minutes.** Time is told by sun, water-clock, and the watch; appointments are “at the third hour.”
    - |-
      **Money is coin and credit.** No paper; wealth is land, slaves, and chests of silver — and a web of IOUs (*nomina*) among the elite.
    - |-
      **The streets are lethal.** Rome had no street lighting and emptied its chamber-pots from windows; wheeled traffic was banned by day. Night in the Subura is its own adventure.
    - |-
      **Religion is everywhere — but belief varies.** The gods are woven into every public act, and *open* denial is socially radioactive; yet philosophically-grounded disbelief existed — educated Epicureans held the gods indifferent and the soul mortal (Lucretius) and still performed the civic rites. Christians and Jews stand out because they will *not*. The auspices are consulted before almost anything that matters.
