  - type: statblock
    name: Aulus Fadius Crispinus
    kind: Nemesis
    desc: |-
      A quaestorian senator of forty, co-accuser (*subscriptor*) beside the province's advocates, and a man who learned his trade under Domitian. Use the *Delator (Informer)* as his base. **Wants:** an informer's share of Varus's estate, to clear his own debts. **Stance:** courteous to the PCs and quietly building a case that they are Varus's accessories. **Secret:** he prosecuted two senators under Domitian, and under Trajan that record could finish him. **Voice:** “I accuse no one. I only ask the House to count what is in the strongroom before it walks to the river.”
