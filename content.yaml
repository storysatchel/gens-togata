  - type: h3
    text: Elites and Magistrates
  - type: p
    text: 'The ruling aristocracy of Rome: senators who command armies, tribunes who
      stir plebeian assemblies, lictors who enforce magisterial decrees with the rods
      and axes, and priestesses who maintain the sacred flame of the state.'
  - name: Lictor
    kind: Rival
    desc: The magistrate's official attendant and enforcer, bearing the *fasces* —
      the bundle of rods and axe that is the naked symbol of the state's power to
      flog and behead.
    chars:
      Br: '3'
      Ag: '2'
      Int: '2'
      Cun: '2'
      Will: '2'
      Pr: '2'
    derived:
      Soak: '4'
      W.T.: '12'
      Def (M/R): 0/0
