      text: The curved augural staff (*lituus*), broad-striped senatorial tunic and
        red senator's shoes, a signet whose impression is all over Otacilius's tablet.
    - label: Look
      text: White hair cropped to the skull; heavy-lidded eyes in a lined, clean-shaven
        face; tall and stooped; broad purple stripe under a heavy toga; red shoes;
        the curled lituus in his left hand.
  - type: statblock
    name: Gnaeus Otacilius Eros
    kind: Rival
    desc: A freedman hide-dealer of forty with friends in every rural tribe that sends
      men to market in Rome. **Wants:** his tenth of every purse, and to stay out
      of court. **Stance:** friendly to anyone with coin; sells what he knows to both
      sides, once each. **Secret:** he keeps a wax tablet of names, sums, and the
      seal under which each purse came, as insurance against his patron — and has
      kept back a third of the money. **Voice:** “Nobody is buying votes, sir. The
      ballot is secret now. I am paying for a cart ride home.”
