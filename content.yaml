  - type: statblock
    name: Theochrestos son of Philon
    kind: Rival
    desc: |-
      Councillor of Cyrene, envoy of the province, and brother of the dead Aristion. **Wants:** Varus to say, in the Curia, that the sentence was bought. **Stance:** courteous, unbribable, and willing to deal with PCs who deal honestly — money for the city, never for him. **Secret:** his council wants restitution more than it wants Varus ruined, and has told him to settle if he can. **Voice:** “My brother was worth exactly two hundred and fifty thousand sesterces to your patron. I would like the Senate to hear the figure.”
