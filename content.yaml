  - type: statblock
    name: Phileros
    kind: Rival
    desc: |-
      A Bithynian-born door-slave who has spent eleven years at Mettius Varus's door, chained to it for the first three. **Wants:** his freedom, and the woman his master sold to Ostia. **Toward the PCs:** frightened and stubborn; he thinks they serve the people he has accused. **Secret:** he has never set foot in the House of the Vestals. Everything he says about the inside of it he learned word for word at Fidenae. **Voice:** “I keep the door. I see who comes and goes. That is what a door-slave is for.”
    chars:
      Br: '2'
      Ag: '2'
      Int: '2'
      Cun: '2'
      Will: '1'
      Pr: '2'
