  - type: h2
    text: 'Step 6: Determine Status & Favors'
  - type: p
    style: lead
    text: In Rome, power is personal. Survival and advancement rely on the favor economy
      (*beneficium* and *officium*) and public standing (*dignitas*). During character
      creation, your character establishes their place in this web of mutual obligation.
  - type: p
    style: body
    text: '**Starting Dignitas:** Your character begins with a Dignitas score determined
      by their archetype (0 for a Slave or Barbarian, 1 for a Freedman or Provincial,
      2 for a Plebeian, 3 for an Equestrian, and 4 for a Patrician). Dignitas affects
      the difficulty of social encounters, the deference shown by strangers, and the
      weight of your word in public assemblies (see Chapter 3: The Theater of Power).'
  - type: p
    style: body
    text: '**Starting Favors:** During character creation, you may choose to have
      your character start the game owing a favor to an influential patron, faction,
      or colleague in exchange for starting resources, or begin with a favor owed
      to them by another party:


      • **Small Favor:** Your character begins owing a small favor (or is owed one)
      for an additional 100 sesterces of starting gear.


      • **Regular Favor:** Your character begins owing a substantial favor to a magistrate,
      merchant, or tribune for an additional 500 sesterces of starting gear or 10
      starting XP.


      • **Big Favor:** Your character begins owing a life-altering favor to a high-ranking
      patrician, general, or imperial freedman for an additional 1,500 sesterces of
      gear or 20 starting XP.'
  - type: p
    style: body
    text: '**Story Points and Factions:** Obligations and influence are active forces
      at the game table. Players and the Game Master may tap into faction networks
      through the Story Point economy:


      • **Player Benefit:** A player may spend 1 Story Point to call in a Small or
      Regular favor from an affiliated faction or patron immediately during a scene,
      without expending any banked favors already recorded on their character sheet.


      • **GM Leverage:** The Game Master may flip 1 Story Point to introduce an urgent,
      inconvenient demand from an affiliated faction or patron that requires immediate
      attention, complicating the party’s current plans or placing competing duties
      upon the character.'
  - type: h2
    text: "Factions & Roman Orders"
  - type: p
    style: lead
    text: "No Roman stands alone. Formal legal orders, imperial bureaus, commercial syndicates, and religious sodalities form the true power blocs of the empire. Like the diverse institutions of a modern metropolis, Roman factions divide broadly into six distinct types of faction. Characters interact with these bodies through the favor economy, anchoring their backgrounds, debts, and alliances in the social realities of the Mediterranean."
  - type: h3
    text: "Financial & Commercial Syndicates (Societates Publicanorum & Corpora)"
  - type: p
    style: body
    text: "Financial and commercial syndicates are joint-stock corporations and chartered trade bodies organized to deploy private capital for state operations. Unlike ordinary private partnerships (*societates*) that legally dissolve upon the death of any partner, state contracting syndicates (*societates publicanorum*) possess corporate continuity. Equestrian financiers invest capital in exchange for tradable shares (*partes*) negotiated near the Basilica Aemilia in the Forum. These syndicates bid before the censors in Rome for lucrative five-year leases, collecting provincial direct taxes, managing customs dues (*portoria*) at ports like Puteoli and Ostia, operating state gold and silver mines at Alburnus Maior and Hispania, and provisioning frontier legions. Their aggressive revenue agents (*vectigaliarii*) frequently clash with provincial subjects and senatorial governors who attempt to check extortion."
  - type: p
    style: body
    text: "Chartered maritime transport corporations coordinate the overseas grain supply (*annona*), operating under imperial contract with the grain prefect (*praefectus annonae*). These shipowners (*corpora naviculariorum*) maintain permanent trading offices (*stationes*) in the Piazzale delle Corporazioni at Ostia alongside grain measurers (*mensores frumentarii*) and sack porters (*saccarii*). In manufacturing and municipal services, three chartered corporations dominate: the builders and carpenters (*fabri tignuarii*), who control municipal construction and engineering; the clothiers (*centonarii*), whose heavy soaked woolen blankets serve as the municipal fire brigades of Italian cities; and the timber transporters (*dendrophori*), who haul structural wood and bathhouse fuel while serving as ritual escorts during the March rites of Cybele."
  - type: p
    style: body
    text: "**At the Table:** Syndicates provide capital, logistics, and legal protection. A **Small Favor** secures passage on a grain freighter or expedited customs clearance. A **Regular Favor** secures a commercial loan of 500 sesterces, insider advance notice on tax leases, or guild muscle from the builders. A **Big Favor** secures an imperial mining lease or quashes a governor's inquiry into private ledgers. When dealing with syndicates and trade corporations, characters add [[boost]] to Negotiation and Knowledge (Commerce) checks concerning commerce or state contracts, but face [[setback]] on social checks with aggrieved provincial subjects or austere senatorial traditionalists."
  - type: table
    style: gear
    columns:
    - Tier
    - Value / Scope
    - Examples
    rows:
    - - Small
      - 100 HS
      - Grain-freighter passage; expedited customs clearance (*portorium*).
    - - Regular
      - 500 HS
      - Commercial loan; notice of tax leases; guild muscle (*fabri*).
    - - Big
      - 1,500 HS
      - Imperial mining lease; quashing a governor's audit.
  - type: h3
    text: "Neighborhood Wards & Urban Associations (Vici, Compitalia, Sodalitates)"
  - type: p
    style: body
    text: "Neighborhood and urban associations form the grassroots fabric of plebeian civic life. Rome is partitioned into 265 municipal neighborhood wards (*vici*), each centered on a crossroads shrine (*compitum*) honoring the guardian spirits (*Lares Compitales*) alongside the protective spirit of the ruler (*Genius Augusti*). Each ward is governed by four elected ward-masters (*vicomagistri*), almost always wealthy freedmen, assisted by enslaved attendants (*vicoministri*). During the winter festival of the *Compitalia*, these wards unite shopkeepers, craftsmen, and tenement dwellers in public games, feasting, and neighborhood sacrifice."
  - type: p
    style: body
    text: "Beneath this peaceful civic routine lies a potent mechanism for street mobilization. Late Republican politicians armed the neighborhood associations (*collegia compitalicia*) into street gangs to disrupt courts and burn opposing meeting places. In response, imperial law (*Lex Iulia de collegiis*) disbanded unauthorized assemblies, permitting only chartered mutual-aid burial funds (*collegia tenuiorum*) that meet monthly to collect modest dues (*stips*) and ensure every member receives a decent pyre. Yet the wards remain volatile: covert election clubs (*sodalitates*) employ distribution agents (*divisores*) to deliver bribes and direct voting blocs, while ward-masters can shutter artisan shops and mobilize crowds whenever grain shipments fail."
  - type: p
    style: body
    text: "**At the Table:** Neighborhood associations provide street knowledge, concealment, and mob leverage. A **Small Favor** secures safe shelter in a tenement garret for three days or early warning of approaching watchmen. A **Regular Favor** mobilizes a ward crowd to pack a court hearing, shut down a market street, or provide neighborhood witnesses. A **Big Favor** secures an endowed tomb with an authorized burial guild or organizes citywide ward protests. Characters allied with local wards add [[boost]] to Streetwise and Skulduggery checks in their home district, but suffer [[setback]] on Stealth checks in unfamiliar wards where neighborhood lookouts watch every stranger."
  - type: table
    style: gear
    columns:
    - Tier
    - Value / Scope
    - Examples
    rows:
    - - Small
      - Up to 100 HS
      - Safe shelter in a tenement garret for three days; warning of approaching night watchmen; entry to a ward banquet.
    - - Regular
      - Up to 500 HS
      - Mobilizing a ward crowd to pack a court hearing; shuttering a market street; providing neighborhood alibi witnesses.
    - - Big
      - Up to 1,500 HS
      - Endowed family tomb with an authorized burial guild; orchestrating a citywide ward protest or bread strike.
  - type: h3
    text: "Spectacle Enterprises & Circus Factions (Factiones)"
  - type: p
    style: body
    text: "Spectacle enterprises are commercial entertainment corporations commanding massive budgets and fanatical followings. The four circus factions (*factiones circenses*)—the Whites (*Albati*), Reds (*Russati*), Blues (*Veneti*), and Greens (*Prasini*)—are private syndicates owned and managed by equestrian contractors (*domini factionum*). These enterprises own extensive stud farms across Hispania, Sicily, and Cappadocia, employ star charioteers (*aurigae*), trainers, veterinarians, and wheelwrights, and lease complete racing teams to magistrates staging public games (*ludi*). By the High Empire, the Blues and Greens dominate popular loyalty across every social rank. Packed into the Circus Maximus, 150,000 spectators use synchronized chants organized by faction leaders to demand tax relief, grain subsidies, or the dismissal of unpopular ministers directly from the emperor."
  - type: p
    style: body
    text: "Beyond the circus tracks, theatrical claques (*factiones theatrales*) are professional chanting squads hired by pantomime actors and magistrates to sway theater audiences, frequently sparking street brawls between partisan fans. Gladiatorial combat is managed by private trainers (*lanistae*) and imperial administrators directing state training barracks (*ludi*) in Rome: the Ludus Magnus (connected to the Colosseum through a subterranean tunnel), the Ludus Dacicus, the Ludus Gallicus, and the Ludus Matutinus (which specializes in animal spectacles). These gladiatorial troupes (*familiae gladiatoriae*) house disciplined fighters whose martial prowess is prized for arena glory and private bodyguard work during times of crisis."
  - type: p
    style: body
    text: "**At the Table:** Spectacle factions offer popular acclaim, martial muscle, and public visibility. A **Small Favor** secures choice seating at the Circus Maximus or a private introduction to a star gladiator. A **Regular Favor** hires a squad of gladiators as bodyguards for a dangerous expedition, or directs a theatrical claque to acclaim or heckle a speaker in the Forum. A **Big Favor** rigs a high-stakes chariot race or orchestrates a synchronized demonstration of thousands of circus spectators to sway imperial policy. Characters wearing faction colors add [[boost]] to Charm and Leadership checks among fellow supporters, but face [[setback]] and open brawls when entering taverns dominated by rival colors."
  - type: table
    style: gear
    columns:
    - Tier
    - Value / Scope
    - Examples
    rows:
    - - Small
      - Up to 100 HS
      - Reserved seating at the Circus Maximus; private introduction to a star gladiator; faction livery and tavern pass.
    - - Regular
      - Up to 500 HS
      - Squad of gladiators as bodyguards for a dangerous mission; hiring a theatrical claque to acclaim or heckle in the Forum.
    - - Big
      - Up to 1,500 HS
      - Rigging a championship chariot race; orchestrating a synchronized demonstration of circus spectators to pressure the emperor.
  - type: h3
    text: "Civic Priesthoods & Sacred Colleges (Collegia Sacerdotum)"
  - type: p
    style: body
    text: "Civic priesthoods are constitutional organs that intertwine religious ritual with state governance. The great priestly colleges (*collegia sacerdotum*) are staffed by active magistrates and senators who manage public cults alongside political offices. The Pontifical College (*Collegium Pontificum*), presided over by the *Pontifex Maximus* (an office held by the emperor), holds supreme authority over religious statutes, public calendars, funeral regulations, and the six Vestal Virgins (*Virgines Vestales*), whose sacred flame guarantees Rome's survival. Alongside them stands the College of Augurs (*Collegium Augurum*), who interpret the public auspices (*auspicia*); an augur possesses the constitutional authority to dissolve assemblies, invalidate elections, or suspend legislation by announcing unfavorable omens (*obnuntiatio*)."
  - type: p
    style: body
    text: "Other specialized colleges manage public destiny and diplomatic relations. The Fifteen Custodians (*Quindecimviri Sacris Faciundis*) guard the prophetic Sibylline Books and supervise the introduction of foreign non-Italian cults like Apollo, Ceres, and the Magna Mater. The Seven Banquet Masters (*Septemviri Epulonum*) organize the sacred feasts (*epulum Iovis*) during major public games. Ancient noble sodalities preserve archaic rites: the twelve Arval Brethren (*Fratres Arvales*) sacrifice in their sacred grove for the health (*salus*) of the emperor, the leaping Salii process in archaic bronze armor while beating Mars's sacred shields, and the Fetiales solemnize treaties and conduct ritual declarations of war."
  - type: p
    style: body
    text: "**At the Table:** The sacred colleges command sacral authority and decisive procedural vetoes. A **Small Favor** grants access to a temple archive, a private purification ritual to remove an omen, or entry to a closed ceremonial feast. A **Regular Favor** halts a court proceeding or assembly vote by declaring a public holiday (*feriae*) or adverse omen, or secures formal sanctuary within a consecrated temple. A **Big Favor** arranges a consultation of the Sibylline Books or initiates an inquiry before the pontifical college. Characters holding priestly status add [[boost]] to Discipline and social checks invoking ancestral custom (*mos maiorum*), while anyone violating sacral law suffers [[setback]] on social interactions with pious citizens."
  - type: table
    style: gear
    columns:
    - Tier
    - Value / Scope
    - Examples
    rows:
    - - Small
      - Up to 100 HS
      - Access to a temple archive; private purification ritual to avert an omen; entry to a ceremonial collegial feast.
    - - Regular
      - Up to 500 HS
      - Halting court proceedings by declaring an adverse omen (*obnuntiatio*); formal sanctuary within a consecrated temple.
    - - Big
      - Up to 1,500 HS
      - Official consultation of the Sibylline Books; pontifical inquiry declaring a rival's contract or election impious and void.
  - type: h3
    text: "Foreign Enclaves, Mystery Cults, and Dissident Cells"
  - type: p
    style: body
    text: "Foreign enclaves and non-civic religious networks provide community outside the traditional Roman pantheon. Across the river in *Trans Tiberim* (Trastevere) and around the Porta Capena, the Jewish community gathers in more than a dozen synagogues (*proseuchai*). Protected by charters tracing to Julius Caesar and Augustus, their faith is recognized as an authorized ancestral practice (*religio licita*), exempting them from military conscription and Sabbath court sessions, while remitting the annual contribution to Jerusalem (diverted after 70 CE into the imperial *Fiscus Iudaicus* tax). These synagogues operate mutual-aid treasuries and dispute arbitration courts that keep members insulated from Roman civil litigation."
  - type: p
    style: body
    text: "Mystery sodalities recruit through private devotion and hierarchical fellowship. The devotees of Isis (*Isiaci*), centered at the magnificent Iseum Campense in the Campus Martius, follow white-robed priests in daily dawn temple rituals that attract matrons, merchants, and imperial officials. Beneath the streets of Rome and Ostia, over forty subterranean shrines (*mithraea*) host the mystery brotherhood of Mithras, structured into seven initiatory grades (from *Corax* to *Pater*) that forge tight bonds among legionaries, customs officials, and imperial freedmen. In contrast, early Christian house churches (*tituli* or *domus ecclesiae*) meet in private domestic quarters; rejecting civic sacrifices and the Imperial Cult, they are classified by magistrates as an illicit superstition (*superstitio illicita*) subject to sudden denunciation."
  - type: p
    style: body
    text: "**At the Table:** Foreign enclaves offer Mediterranean-wide contacts, covert refuge, and esoteric lore. A **Small Favor** secures safe shelter in an enclave inn, translation of Greek or Aramaic documents, or discreet medical treatment. A **Regular Favor** secures concealed sanctuary in a subterranean *mithraeum* or domestic *titulus*, letters of introduction to merchant houses in Alexandria or Antioch, or financial relief from a community fund. A **Big Favor** arranges clandestine passage out of Italy on an uninspected cargo vessel or coordinates an overseas diaspora network to recover a lost heirloom. Characters allied with these groups add [[boost]] to Knowledge (the Gods) and Streetwise checks regarding overseas contacts, but suffer [[setback]] on social checks when scrutinized by suspicious city prefects."
  - type: table
    style: gear
    columns:
    - Tier
    - Value / Scope
    - Examples
    rows:
    - - Small
      - Up to 100 HS
      - Safe lodging in a diaspora inn; translation of Greek, Aramaic, or Punic documents; discreet herbal or surgical care.
    - - Regular
      - Up to 500 HS
      - Concealed sanctuary in a subterranean *mithraeum* or house church; commercial letter of credit to Antioch or Alexandria.
    - - Big
      - Up to 1,500 HS
      - Clandestine passage out of Italy on an uninspected cargo ship; mobilising overseas diaspora networks to recover lost assets.
  - type: h3
    text: "Aristocratic Patronage Blocs & Senatorial Factions"
  - type: p
    style: body
    text: "Aristocratic patronage blocs and senatorial factions steer high politics, legislative power, and state commands. The senatorial order (*ordo senatorius*) encompasses roughly six hundred families possessing the census minimum of one million sesterces. Senators compete endlessly for offices (*cursus honorum*), military commands, and provincial governorships. While formal political parties do not exist, senatorial debate divides between conservative traditionalists (*optimates*), who defend senatorial supremacy and ancestral custom, and reformist populists (*populares*), who bypass the Senate to champion land allotments, grain subsidies, and public works through popular assemblies."
  - type: p
    style: body
    text: "Overarching senatorial rivalries is the imperial court (*domus Augusta*). Centered on the Palatine Hill, the Princeps rules through personal advisers (*consilium principis*), the Praetorian Guard under its powerful prefects, and imperial freedmen who manage imperial secretariats for correspondence (*ab epistulis*) and petitions (*a libellis*). Across both imperial and senatorial houses, power is demonstrated each morning during the formal greeting (*salutatio*), when swarms of dependent clients (*clientes*) gather in the patron's atrium to offer respects and receive the daily cash gift (*sportula*). In exchange, clients provide bodyguards in the streets, pack jury benches, cheer forensic speeches, and form reliable voting blocs."
  - type: p
    style: body
    text: "**At the Table:** Aristocratic blocs control administrative influence, legal protection, and imperial favor. A **Small Favor** secures an invitation to a noble banquet (*convivium*), an official letter of recommendation (*commendatio*), or a reserved seat at a senate hearing. A **Regular Favor** secures legal representation by an eloquent advocate in a court trial, an introduction to an imperial freedman secretary, or an appointment to an equestrian officer post. A **Big Favor** secures an imperial pardon, a senatorial decree, or a private audience with the emperor. Characters backed by a senatorial patron add [[boost]] to Charm, Negotiation, and Leadership checks when dealing with civic magistrates, but face [[setback]] from the patron's jealous political adversaries."
  - type: table
    style: gear
    columns:
    - Tier
    - Value / Scope
    - Examples
    rows:
    - - Small
      - Up to 100 HS
      - Invitation to a noble banquet (*convivium*); letter of recommendation (*commendatio*); reserved seat at a senate hearing.
    - - Regular
      - Up to 500 HS
      - Legal defense by an eloquent forensic advocate; introduction to an imperial freedman secretary; appointment as equestrian officer.
    - - Big
      - Up to 1,500 HS
      - Imperial pardon from provincial exile; imperial or senatorial decree in client's favor; private audience with the Princeps.
- title: 'Chapter 2: Equipment and Vehicles'
  blocks:
  - type: h2
    text: The Economy of Rome
  - type: p
    style: lead
    text: Rome is an economy of coin, bullion, credit, and personal trust. While barter
      persists in rural hinterlands and remote frontiers, Roman urban commerce and
      international trade run on standardized coinage, banking ledgers, and promissory
      notes.
  - type: p
    style: body
    text: 'Prices throughout this chapter are listed in **sesterces** (abbreviated
      **HS**). Roman coinage functions on a decimal and fractional silver standard:


      • **As (copper):** The copper coin of the common laborer and street vendor (4
      *asses* = 1 sesterce). A loaf of bread or a cup of tavern wine costs one or
      two asses.


      • **Sesterce (brass / orichalcum):** The standard accounting unit of Rome. A
      common laborer earns about 4 sesterces (1 denarius) for a day of hard labor.


      • **Denarius (silver):** The backbone silver currency of the Mediterranean (1
      *denarius* = 4 sesterces). A legionary’s annual base pay under Domitian and
      Trajan is 1,200 sesterces (300 denarii), paid in three four-month installments.


      • **Aureus (gold):** The heavy gold coin of aristocratic wealth, state gifts,
      and bulk commerce (1 *aureus* = 25 denarii = 100 sesterces). High-ranking ransoms,
      estates, and senatorial fortunes are counted in gold.


      • **Credit & Nomina:** Beyond physical coinage, wealthy Romans and merchants
      transfer funds using *nomina* (written debt obligations) and bank drafts deposited
      with public bankers (*argentarii*), allowing large sums to travel between Rome,
      Alexandria, and Antioch without transporting tons of metal.'
  - type: h2
    text: Acquiring Goods & Favor Economy
  - type: p
    style: body
    text: 'Everyday goods and common provisions are sold openly in the markets of
      the Empire — the Macellum, forum stalls, and street-corner shops. Scarce items
      and haggled cargoes call for a **Negotiation** check, adjusted by local scarcity
      and the merchant''s temper. Military ordnance, state monopolies, and illicit
      instruments are **Restricted (R)** — imperial law forbids the civilian sale or
      carriage of legionary armor, heavy artillery, poisons, and seditious documents.'
  - type: p
    style: body
    text: 'Procuring Restricted goods means tapping the underworld with an **Average
      ([[difficulty difficulty]]) or Hard ([[difficulty difficulty difficulty]])
      Streetwise** check — through Subura craft *collegia*, corrupt quartermasters at
      the *castra*, or smugglers at Ostia and Puteoli. Peril is severe: a [[despair]]
      brings a raid by the night watch (*vigiles*), or extortion by an informer
      (*delator*).'
  - type: p
    style: body
    text: 'Often the better Roman method is not coin but the favor economy
      (*beneficia* and *officia*): a character calls in an obligation from a patron,
      faction, or syndicate to obtain equipment, vehicles, or official passes without
      liquidating wealth. The table, **Equipment Acquisition via Favors**, fixes
      what each tier buys.'
  - type: table
    style: gear
    columns:
    - Favor Tier
    - Value / Rarity Limit
    - Terms & Obligations
    - Example Gear
    rows:
    - - Small
      - 100 HS; Rarity 1–3
      - Minor reciprocal service; goods returned undamaged.
      - Common weapons, artisan tools, travel rations, a mule lent for an afternoon.
    - - Regular
      - 1,000 HS; Rarity 4–5
      - Standing obligation, repaid in political or forensic support.
      - Quality armor, a standard warhorse, a carriage for several days, uninspected permits.
    - - Big
      - Over 1,000 HS; Rarity 6+ or R
      - Life-altering debt to a senator or general; lasting vulnerability.
      - Lorica segmentata, a Cappadocian steed, a scorpio or ballista, forged customs seals.
  - type: h2
    text: Weapons
  - type: p
    style: body
    text: '**Gladius.** The short, broad stabbing sword of the legions — the weapon
      that conquered the world, designed for close, disciplined butchery behind a
      shield wall. Models include the Mainz-pattern infantry sword turned out by the
      Rhine frontier fabricae (*Fabrica Mogontiacensis*), the Pompeii-pattern straight
      blade stamped with the mark of *Statius of Puteoli*, and the high-carbon
      Celtiberian blade forged at Bilbilis (*ferrum Celtibericum*).'
  - type: p
    style: body
    text: '**Pugio.** The military dagger; a sidearm, a tool, and — famously — the
      blade of choice for assassinating emperors. Models include the bronze-damascened
      officer''s dagger of *Vindonissa*, the silver-inlaid sidearm carried by Praetorian
      Guardsmen, and the stamped iron trench knife issued to Danubian auxiliaries.'
  - type: p
    style: body
    text: '**Spatha.** A longer sword favored by cavalry and, later, the whole army;
      more reach than the gladius but less suited to the press of the shield wall.
      Models include the Celtic longsword adopted by auxiliary cavalry and a Syrian
      pattern built on a carved bone pommel.'
  - type: p
    style: body
    text: '**Hasta.** The thrusting spear, carried by auxiliaries, triarii of old,
      and guardsmen. Its reach keeps enemies at bay. Models include the Sabine ash
      shaft with an iron leaf-shaped tip and the plain spear held in the armories of
      the municipal watch.'
  - type: p
    style: body
    text: '**Pilum.** The heavy legionary javelin, hurled in a volley just before
      contact. Its soft iron shank bends on impact, fouling an enemy''s shield and
      rendering it useless — and it cannot easily be thrown back (see the *Pilum Volley*
      talent). Models include the Imperial arsenal standard issued at Aquileia and
      the heavy weighted lead-ball pattern (*pilum ballistarium*).'
  - type: p
    style: body
    text: '**Fuscina & Rete (Trident and Net).** The signature arms of the *retiarius*
      gladiator: a long trident for reach and a weighted net to entangle and trip
      a foe before the kill. Models include the Campanian armory trident with flared
      barbs and the weighted linen net of the Pozzuoli fishing *collegium*.'
  - type: p
    style: body
    text: '**Caestus.** A leather boxing-glove bound with iron or lead and sometimes
      studded with spikes — the brutal gauntlet of the arena pugilist.'
  - type: p
    style: body
    text: '**Flagellum.** The whip — a tool of overseers and animal-handlers, occasionally
      a weapon, better at humiliation and control than killing.'
  - type: p
    style: body
    text: '**Funda (Sling).** Cheap, silent, and in trained Balearic hands astonishingly
      deadly; hurls stones or cast-lead bullets.'
  - type: p
    style: body
    text: '**Arcus (Composite Bow).** The recurved bow of eastern auxiliaries — Syrian,
      Cretan, and Parthian archers who gave Rome its missile power.'
  - type: h2
    text: Armor & Shields
  - type: p
    style: body
    text: '**Lorica Segmentata.** The iconic banded iron plate of the Imperial legionary:
      excellent protection, issued by the army and rarely seen in civilian hands.
      Models include the Corbridge-type articulated iron plate of the imperial arms
      manufactories at Aquileia and the heavier Newstead-pattern cuirass.'
  - type: p
    style: body
    text: '**Lorica Hamata.** Mail; heavier but more flexible, worn by legionaries,
      auxiliaries, and the wealthy for centuries. Models include the Gallic
      double-shoulder mail (*lorica Gallica*), the riveted ring-mesh of Syrian
      auxiliaries, and a gilded parade cuirass made for equestrian cavalry prefects.'
  - type: p
    style: body
    text: '**Lorica Squamata.** Scale armor — bronze or iron scales sewn to a backing;
      flashy, favored by officers, standard-bearers, and some auxiliaries. Models
      include the Syrian scale cuirass stitched to a linen backing and the Danubian
      corselet set with brass scales.'
  - type: p
    style: body
    text: '**Galea.** The military helmet, with cheek-guards and neck-flare. (If a
      character already wears body armor granting Soak, the helmet''s benefit is included;
      worn alone it grants Soak +1.) Models include the Imperial Gallic helmet with
      its bronze brow reinforcement and neck guard, and the Weisenau-type iron helmet.'
  - type: p
    style: body
    text: '**Scutum.** The great curved rectangular shield — a wall of plywood and
      iron that is half the legion''s doctrine. It can also be punched into a foe''s
      face. Models include the curved plywood shield turned out by the *Fabri Tignuarii*
      of Rome and the frontier shield faced with rawhide.'
  - type: p
    style: body
    text: '**Parma / Gladiator Shield.** Smaller round or rectangular shields used
      by lighter troops and arena fighters, trading protection for mobility.'
  - type: p
    style: body
    text: '**Manica.** A segmented arm-guard worn by some gladiators and eastern legionaries;
      when worn, grant the fighter Defensive 1 with their weapon arm (does not stack
      with a shield''s defense).'
