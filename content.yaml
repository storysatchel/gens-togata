  - type: p
    style: small
    text: '**Adversaries:** *Street Tough* minion groups (both sides), *Lictor* (for
      *viatores* and any magistrate''s attendants), *Legionary* (Cominius''s veterans),
      *Senator / Patrician* (the nobles on the Senate-house steps). **Rewards:** 15–20
      XP. **Win** (ending A, or B with Heat never above 4): 20 XP; +1 Dignitas for
      the PC who carried the decisive appeal; a Favor from Titinius and one from the
      Quirina — a door open to the PCs in every village that sent men. **Costly win**
      (B with blood, or a law carried through D): 15–20 XP; +1 Dignitas with the plebs,
      a lasting enemy in Veturius''s house; any PC who struck Plautius or the augur
      loses 1 Dignitas instead. **Loss** (C or E): 15 XP and no Dignitas gained; claims
      honored still bank a Favor from that side, and every claim refused costs 1 Dignitas
      for breaking faith. Whoever holds Otacilius''s tablet at the end banks a Favor
      from Veturius — or the makings of a prosecution.'
  - type: endnotes
    title: Notes
    items:
    - 'The prodigy of 114 BCE, in which the knight''s daughter Helvia and her horse
      were struck down and stripped by lightning while travelling toward Apulia: Plutarch,
      *Roman Questions* 83; Orosius 5.15.20–22; Obsequens 37; Livy, *Periochae* 63.
      The narrative is in A. H. J. Greenidge, *A History of Rome During the Later
      Republic and Early Principate*, vol. 1 (1904), on the Vestal trials of 114–113
      BCE. On the haruspices'' reading (nakedness meaning a broken vow, the horse
      meaning the knights), and its timing just before the pontiffs took up the case,
      see Federico Santangelo, *Divination, Prediction and the End of the Roman Republic*
      (2013) (paraphrased).'
    - 'Cicero, *Pro Milone* 59: under no law were slaves examined against their master
      except in a case of incest (*de servis nulla lege quaestio est in dominum nisi
      de incestu*; some editors bracket the sentence). In 114 BCE the informer was
      the slave of a knight (the name is often restored as Barrus), and he named his
      own master: Plutarch, *Roman Questions* 83; Greenidge, *History of Rome*, vol.
      1. A slave of the orator M. Antonius was racked, scourged, and burned in the
      same affair without incriminating his master: Valerius Maximus 6.8.1.'
    - 'Livy 8.15.7–8 (337 BCE): the Vestal Minucia, first suspected for dressing more
      elegantly than was proper, was denounced to the pontiffs by a slave informer
      (*ab indice servo*). They ordered her to abstain from the rites and to keep
      her household in her power (*familiam in potestate habere*), and she was buried
      alive by the Colline Gate, to the right of the paved road, in the *Campus Sceleratus*.
      On the purpose of the order (to keep her slaves available for examination),
      see Robin Lorsch Wildfang, *Rome''s Vestal Virgins* (2006), on the *crimen incesti*
      (paraphrased). The witnesses in Domitian''s prosecution of Cornelia were tortured:
      Suetonius, *Domitian* 8.4.'
    - 'On the rows of shops along the Via Sacra and the Nova Via that belonged to
      the Atrium Vestae and were let for rent, some of them absorbed in the Flavian
      rebuilding: Wildfang, *Rome''s Vestal Virgins* (2006), on the order''s property
      (paraphrased). The knight who manages the leases is invented.'
    - 'Pliny the Younger, *Panegyricus* 42: Trajan is praised for freeing every household
      from the “domestic accuser” (*accusatore domestico*) and for ending what Pliny
      calls a “servile war,” a time when slaves had been the emperor''s friends and
      their masters had not.'
    - Pliny the Younger, *Letters* 4.11; Suetonius, *Domitian* 8.3–4. Domitian, as
      *Pontifex Maximus*, summoned the pontiffs to his Alban villa instead of the
      Regia and condemned the Chief Vestal Cornelia in her absence, without hearing
      her. Earlier in the reign, the Vestals Varronilla and the Oculatae sisters had
      been convicted and allowed to choose how they died, and their lovers were banished.
      The date of Cornelia's burial is disputed (c. 89–91 CE).
    - Pliny the Younger, *Letters* 4.11; Suetonius, *Domitian* 8.4. Valerius Licinianus,
      a man of praetorian rank, confessed while the case against him was still unproven,
      and he was granted exile rather than death.
    - 'Pliny the Younger, *Letters* 4.11, trans. William Melmoth, rev. F. C. T. Bosanquet,
      *Letters of Pliny* (Project Gutenberg #2811). The same letter declines to say
      whether Cornelia was innocent or guilty.'
    - Tacitus, *Annals* 2.34 (16 CE). Urgulania, a friend of Livia, refused to appear
      as a witness, and a praetor was sent to question her at home, even though by
      old custom the Vestal Virgins were heard in the Forum and the courts whenever
      they gave evidence.
    - Plutarch, *Numa* 10; Dionysius of Halicarnassus, *Roman Antiquities* 2.67; Livy
      8.15.8. The condemned Vestal was carried bound in a closed litter, as in a funeral
      procession, to the field by the Colline Gate. She went down a ladder into an
      underground chamber furnished with a bed, a lamp, and a little bread, water,
      milk, and oil, and the opening was filled in. Summarized in Wildfang, *Rome's
      Vestal Virgins* (2006) (paraphrased).
    - 'Pliny the Younger, *Letters* 4.11, trans. Melmoth, rev. Bosanquet (Project
      Gutenberg #2811).'
    - 'Pliny the Younger, *Letters* 4.11, trans. Melmoth, rev. Bosanquet (Project
      Gutenberg #2811), on the Roman knight Celer, scourged in the Forum as Cornelia''s
      alleged lover. On her lovers being whipped to death with rods in the Comitium,
      see Suetonius, *Domitian* 8.4, trans. Alexander Thomson, rev. T. Forester (Project
      Gutenberg #6400).'
    - Pliny the Younger, *Letters* 2.11 (the Senate's trial of Marius Priscus, proconsul
      of Africa, January 100 CE), trans. William Melmoth, rev. W. M. L. Hutchinson,
      Loeb Classical Library (1915) — the quotation is from this translation.
    - Vegetius, *Epitoma rei militaris* 4.39 — sailing uncertain and dangerous from
      mid-September, and the seas closed from the third day before the Ides of November
      (11 November) to the sixth day before the Ides of March (10 March).
    - 'Ovid, *Tristia* 5.11.15 — the relegated poet keeps his life, his wealth, and
      his citizenship. Deportation to an island as an innovation of Tiberius: paraphrasing
      Gordon P. Kelly, *A History of Exile in the Roman Republic* (Cambridge, 2006),
      ch. 2.'
    - 'Tacitus, *Annals* 4.20 — the accusers'' legal quarter of a condemned man''s
      estate. On informers hoping for that share: paraphrasing John S. McHugh, *Rome''s
      Enemies Within: Imperial Conspiracies and Assassinations in the Roman Empire
      during the First Century AD*.'
    - '*Digest* 48.19.5 pr. (Ulpian), reporting Trajan''s rescript to Julius Fronto
      that an absent man is not to be condemned on a criminal charge. The later practice
      of registering and holding an absent defendant''s property is described in *Digest*
      48.17.1 (Marcian); here it is moved a century early as Crispinus''s motion.'
    - Pliny the Younger, *Letters* 3.9 — the Senate's proceedings against the estate
      of Caecilius Classicus, proconsul of Baetica, who died before he could be tried.
      The Senate gave his daughter what he had owned before his governorship, divided
      the rest among his victims, and made his creditors repay what he had paid them
      since his return.
    - 'Cassius Dio, *Roman History* 56.27.2–3 — Augustus''s limits on an exile''s
      ships, slaves and freedmen, and fortune (12 CE). On the decree as a check on
      carrying wealth into exile: paraphrasing Kelly, *A History of Exile in the Roman
      Republic*.'
    - 'On transfers by written entry in a banker''s books, and the banker''s duty
      to keep complete accounts and produce them (*Digest* 2.13): paraphrasing Koenraad
      Verboven and Paul Erdkamp (eds.), *Law and Economic Performance in the Roman
      World* (Brill, 2022).'
    - '*Digest* 22.5.4 (Paul) — patron and freedman cannot be compelled to give criminal
      evidence against each other. Paraphrasing Egbert Koops, “Masters and Freedmen:
      Junian Latins and the Struggle for Citizenship,” in G. de Kleijn and S. Benoist
      (eds.), *Integration in Rome and in the Roman World* (Brill, 2014).'
    - Tabula Heracleensis (*CIL* I² 593), the clause on wagons in the streets of Rome
      — no wagon to be driven after sunrise or before the tenth hour of the day, with
      exceptions for building temples and public works, demolition under public contract,
      and the wagons of priests, triumphs, and games.
    - 'On the *naves codicariae* and the up-to-three-day haul from Portus to Rome:
      paraphrasing David J. Mattingly and Gregory S. Aldrete, “The Feeding of Imperial
      Rome: The Mechanics of the Food Supply System,” in J. Coulston and H. Dodge
      (eds.), *Ancient Rome: The Archaeology of the Eternal City* (Oxford, 2000).'
    - Gaius, *Institutes* 1.37 — under the *lex Aelia Sentia*, a manumission made
      to defraud creditors is void.
    - 'Kelly, *A History of Exile in the Roman Republic* — exiles'' devices against
      confiscation: buying costly slaves as portable wealth, estates in free cities,
      friends buying at the auction, and informal manumission before departure, as
      Cicero arranged in 58 BCE without being sure it would hold. Paraphrased.'
    - Pliny the Younger, *Letters* 3.9 (the case of Caecilius Classicus), trans. Melmoth,
      rev. Hutchinson, Loeb Classical Library (1915) — the quotation is from this
      translation.
    - Pliny the Younger, *Letters* 2.11 — the consul-designate Julius Ferox's motion
      to grant Priscus judges provisionally while summoning the men said to have bought
      innocent blood.
    - Pliny the Younger, *Letters* 2.11 — the consular Tuccius Cerealis demands that
      Priscus be notified to attend, and the matter is adjourned to the next meeting
      of the Senate.
    - Pliny the Younger, *Letters* 8.14 (to Titius Aristo, on the Senate's vote over
      the freedmen of Afranius Dexter), trans. William Melmoth, rev. F. C. T. Bosanquet
      (1895) — the quotation is from this translation. Pliny there insisted that death,
      banishment, and acquittal be counted as three separate opinions.
    - Aulus Gellius, *Attic Nights* 14.7.8, reporting Varro — a decree of the Senate
      made before sunrise or after sunset is not valid.
    - Pliny the Younger, *Panegyricus* 34–35 — Trajan's public punishment of the informers
      of Domitian's reign.
    - Pliny the Younger, *Letters* 2.11 — at the division on Priscus's sentence, those
      standing by the consuls' chairs went over to Cornutus Tertullus's motion, and
      the waverers followed.
    - Tacitus, *Annals* 12.23; Cassius Dio, *Roman History* 52.42.6 — senators might
      not leave Italy without the emperor's leave, except to visit Sicily and, from
      Claudius, Narbonese Gaul.
    - Appian, *Civil Wars* 1.27; George Willis Botsford, *The Roman Assemblies from
      Their Origin to the End of the Republic* (1909) — on the plebiscites after Gaius
      Gracchus's death that first let allottees sell their land and then, in 118 BCE,
      ended the distributions; A. H. J. Greenidge, *A History of Rome During the Later
      Republic and Early Principate*, vol. I (1904), on the later law of Spurius Thorius.
    - Plutarch, *Tiberius Gracchus* 10.2, trans. Bernadotte Perrin (Loeb Classical
      Library, 1921) — on Marcus Octavius's veto of the agrarian bill, 133 BCE.
    - Greenidge, *History of Rome*, vol. I (1904) — on Octavius's first veto. The
      same passage describes the country voters streaming into Rome for the vote and
      Octavius bidding the scribe be silent.
    - 'Botsford, *The Roman Assemblies* (1909) — on the contio: private speakers addressing
      the meeting from below the platform, the president''s control of the order and
      length of speeches, and adjournment. The fixed interval of three market days
      (*trinundinum*) between promulgation and vote was imposed by the lex Caecilia
      Didia of 98 BCE; see Francisco Pina Polo, *The Consul at Rome* (2011).'
    - Plutarch, *Tiberius Gracchus* 10–11 (Perrin); Greenidge, vol. I — the veto delivered
      by silencing the clerk, the meeting melting away, and, on the next voting day,
      the voting urns carried off by the party of the rich and a near-riot.
    - 'Botsford, *The Roman Assemblies* (1909) — on the tribal assembly: the lot for
      the tribe of the Latins and for the *principium*, ropes stretched to divide
      the assembly-place, and the rule that calling the principium ended the right
      of intercession and of announcing an omen seen while watching the sky.'
    - 'Ballot laws: the lex Gabinia (139 BCE, elections), lex Cassia (137, trials),
      and lex Papiria (c. 131/130, legislation); Marius''s law of 119 narrowing the
      gangways, Cicero, *De Legibus* 3.38–39. Botsford (1909) on the tablets marked
      for *uti rogas* and *antiquo*, the *cistae*, and the *custodes*. On the layout
      of the *pontes*: Antonio López García, *Running Rome and Its Empire* (2024),
      and Henrik Mouritsen, *Plebs and Politics in the Late Roman Republic* (2001).'
    - Botsford, *The Roman Assemblies* (1909) — the tribal returns proclaimed in an
      order usually drawn by lot; a vote without effect if the president halted the
      announcement before a majority; every session to begin and end between sunrise
      and sunset.
    - Plutarch, *Tiberius Gracchus* 9.5, trans. Perrin (1921) — from Tiberius Gracchus's
      speeches for the land bill.
    - Mouritsen, *Plebs and Politics* (2001) — on the *divisores*, first attested
      in the early first century BCE; on bribes given mostly as promises and aimed
      at the rural tribes; and on Verres summoning the distributors of every tribe
      to block Cicero's election as aedile (Cicero, *In Verrem* 1.22–23).
    - Greenidge, vol. I — on the urban voters of 133, indifferent or hostile to the
      land bill and many of them clients of the noble houses, and on the country voters
      scattering home once the vote was over.
    - Greenidge, vol. I; Botsford (1909) — on the laws against electoral bribery of
      181 BCE (the lex Baebia, ten years' disqualification from office), 166, and
      159 (the lex Cornelia Fulvia, a capital penalty, in practice exile), none of
      which ended the practice.
    - Plutarch, *Roman Questions* 81 — why a tribune wears no purple, and why his
      door stands open night and day; Daniel J. Gargola, *The Shape of the Roman Order*
      (2017), on the rule that tribunes of the plebs might not be absent from the
      city for more than one night.
    - Plutarch, *Tiberius Gracchus* 9.2 and 10.3 (Perrin) — the first bill paid holders
      the value of the land they surrendered; after Octavius's veto, Tiberius withdrew
      it for a harsher bill without compensation. Greenidge, vol. I, on the redrafting.
    - 'Botsford, *The Roman Assemblies* (1909) — on prohibitive omens: an attack of
      epilepsy vitiated an assembly''s business and forced an adjournment, hence the
      name *morbus comitialis*, the comitial sickness.'
    - 'Plutarch, *Tiberius Gracchus* 12 (Perrin); Greenidge, vol. I — the deposition
      of Octavius: the halt after seventeen tribes, the last appeal, Octavius looking
      to the men of wealth standing together, and his removal from the Rostra by one
      of Tiberius''s freedmen.'
    - Asconius, commentary on Cicero's *Pro Cornelio* (p. 72 Clark); Cassius Dio 36.30
      — the tribune Trebellius withdrew his veto of Gabinius's law in 67 BCE after
      seventeen tribes had voted to depose him. Mouritsen, *Plebs and Politics* (2001),
      on the limits of tribunician intercession.
    - 'Botsford, *The Roman Assemblies* (1909) — on *obnuntiatio*: a president was
      bound to dismiss the assembly on an augur''s or magistrate''s report of an evil
      omen, whatever their relative rank, and the Aelian and Fufian laws (c. 150 BCE)
      extended the device. For the augur''s *alio die*, Cicero, *De Legibus* 2.31
      and *Philippics* 2.83.'
    - Plutarch, *Tiberius Gracchus* 14–15 (Perrin); Greenidge, vol. I — Titus Annius's
      challenge to Tiberius over the deposition, and Tiberius's reply that a tribune's
      sanctity comes from the people and is forfeited by injuring them.
    - Plutarch, *Tiberius Gracchus* 19.6, trans. Perrin (1921) — the killing of Tiberius
      Gracchus and his supporters on the Capitol, 133 BCE.
    - Botsford, *The Roman Assemblies* (1909) — the Senate's annulment of Saturninus's
      measures (100 BCE) and of Sextus Titius's agrarian law (99 BCE) as passed by
      violence or against the intercession.
- title: 'Appendix I: Lexicon'
  part:
    title: Appendices
  blocks:
  - type: p
    text: 'A sprinkling of authentic Latin terminology brings the reality of ancient
      Rome alive at the gaming table. Treat Latin terms as diegetic vocabulary — the
      natural names for institutions, social ranks, architecture, and legal realities
      that have no exact modern equivalents:'
  - type: list
    items:
    - '**SPQR** — *Senatus Populusque Romanus*, “the Senate and People of Rome,” the
      state itself; stamped on legionary standards, coins, public monuments, and boundary
      markers.'
    - '**Princeps** — “first citizen,” the polite constitutional title of the Emperor,
      maintaining the legal fiction that Rome remains a Republic ruled by its foremost
      magistrate.'
    - '**Cursus honorum** — the “course of offices,” the rigid sequential ladder of
      public magistracies (quaestor, aedile, praetor, consul) an ambitious senatorial
      man climbs.'
    - '**Pomerium** — the augurally consecrated sacred boundary surrounding Rome,
      within which weapons of war and military *imperium* are ritually forbidden.'
    - '**Imperium** — supreme executive and military command over Roman citizens and
      legions, held exclusively by consuls, praetors, and the Emperor.'
    - '**Senatus consultum** — an official decree of the Senate, carrying immense
      moral and practical legal authority throughout the empire.'
    - '**Patronus & Cliens** — patron and client; the foundational reciprocal bond
      of protection, legal defense, and material support in exchange for deference,
      political votes, and personal service.'
    - '**Salutatio** — the formal morning greeting, wherein clients crowd into their
      patron''s *atrium* at dawn in clean togas to offer respects and receive the
      *sportula*.'
    - '**Sportula** — the daily gift, originally a food basket and later a standard
      cash handout (typically 25 sesterces or 6.25 denarii), distributed by patrons
      to their clients.'
    - '**Honestiores & Humiliores** — the fundamental imperial legal divide between
      elite citizens (senators, equestrians, decurions, veterans) who enjoy immunity
      from torture and shameful executions, and the lower classes who do not.'
    - '**Libertus** — a freedman, a person liberated from legal slavery who remains
      bound by lifelong duties of respect (*obsequium*) to his former master and patron.'
    - '**Servus** — an enslaved person, legally categorized as property (*res*) lacking
      civil personality, whose evidence in court is admissible only under torture.'
    - '**Insula** — a multi-story urban apartment building of timber, concrete, and
      brick, housing the common plebeian population in cramped rented rooms.'
    - '**Domus** — a luxurious private aristocratic townhouse built around a central
      atrium and open peristyle garden, housing a patrician family and their household.'
    - '**Atrium** — the public reception hall of a Roman domus, featuring a central
      roof opening (*compluvium*) and rainwater basin (*impluvium*).'
    - '**Thermae** — massive public bath complexes featuring hot rooms (*caldarium*),
      warm rooms (*tepidarium*), cold pools (*frigidarium*), exercise grounds, and
      libraries.'
    - '**Popina** — a popular street tavern and wine shop serving hot wine, sausages,
      and fried chickpeas to common plebeians and laborers.'
    - '**Annona** — the grain supply of Rome, including the free monthly grain dole
      (*annona civica*) distributed to eligible plebeian citizens.'
    - '**Praetor** — a senior magistrate wielding *imperium*, presiding over the civil
      and criminal courts and commanding military forces.'
    - '**Delator** — a professional public informer or prosecutor who brings charges
      of treason (*maiestas*) or corruption, rewarded with a statutory quarter-share
      of the condemned''s estate.'
    - '**Repetundae** — the crime of provincial extortion; the *quaestio de repetundis*
      is the standing jury court where provincial delegates seek recovery of funds
      extorted by governors.'
    - '**Maiestas** — the supreme crime of treason or diminishing the majesty of the
      Roman state or the Emperor, punishable by execution or exile with total confiscation
      of property.'
    - '**Sacramentum** — the inviolable military oath of loyalty sworn by soldiers
      to their commander, and by gladiators to their lanista upon entering the arena.'
    - '**Contubernium** — the eight-man legionary squad that shares a leather tent,
      mess kit, and mule on campaign, forming the brotherhood at the core of the legion.'
    - '**Centurio** — a professional company commander promoted from the ranks, carrying
      a vine-staff (*vitis*) with which he enforces iron discipline over eighty legionaries.'
    - '**Munera** — gladiatorial games and arena combats, originally staged as private
      funeral gifts to honor the dead, now grand state spectacles.'
    - '**Lanista** — a private owner, manager, and contractor of a gladiatorial school
      (*ludus*), infamous for trading in human blood yet essential to public spectacles.'
    - '**Murmillo** — a heavily armored gladiator equipped with a broad-crested fish
      helmet, large scutum shield, greave, and short stabbing sword (*gladius*).'
    - '**Retiarius** — an unarmored, agile gladiator armed with a weighted net, trident
      (*tridens*), and dagger (*pugio*), fighting with mobility and range.'
    - '**Biga / Quadriga** — a two-horse or four-horse chariot used in racing competitions
      at the Circus Maximus.'
    - '**Serica / Seres** — the Roman geographic term for the distant eastern lands
      and peoples associated with silk, situated along the Silk Routes beyond Parthia
      and India.'
    - '**Panem et circenses** — “bread and circuses,” the cynical formula coined by
      Juvenal describing the urban mob''s contentment with free food and public games.'
    - '**Roma invicta** — “Rome unconquered,” the enduring civic motto and imperial
      ideal celebrating the eternal, invincible destiny of the Roman state.'
  - type: p
    text: — *Roma invicta.* —
- title: 'Appendix II: Sources & Resources'
  blocks:
  - type: p
    style: lead
    text: This setting is built on real scholarship and the words of the Romans themselves.
      Everything here was drawn from the texts below — the same shelf a GM can raid
      to go deeper, settle an argument, or steal a plot. The digital tools at the
      end turn that reading into maps, journeys, and props at the table.
  - type: h3
    text: Primary Sources (the Ancient Voices)
  - type: list
    items:
    - '**Cato & Varro** — *Roman Farm Management*.'
    - '**Cicero** — *De Amicitia, Scipio''s Dream*.'
    - '**Lucretius** — *On the Nature of Things*.'
    - '**Seneca** — *Stoic Philosophy of Seneca*.'
    - '**Virgil** — *The Aeneid*.'
  - type: h3
    text: Modern Scholarship
  - type: list
    items:
    - '**Alexander, Michael C.** — *Trials in the Late Roman Republic, 149 BC to 50
      BC (Phoenix Supplementary Volumes 26)*.'
    - '**Armstrong, Jeremy; Fronda, Michael P. (eds.)** — *Romans at War: Soldiers,
      Citizens, and Society in the Roman Republic*.'
    - '**Astin, A.E.** — *Cato the Censor*.'
    - '**Bang, Peter Fibiger** — *The Roman Bazaar: A Comparative Study of Trade and
      Markets in a Tributary Empire*.'
    - '**Beard, Mary** — *SPQR: A History of Ancient Rome*.'
    - '**Beard, Mary; North, John; Price, Simon** — *Religions of Rome*.'
    - '**Botsford, George Willis** — *The Roman Assemblies from their Origin to the
      End of the Republic*.'
    - '**Bradley, Keith** — *Slavery and Society at Rome*.'
    - '**Campbell** — *The Ancient World (From the Dawn of History to the Conversion
      of Constantine)*.'
    - '**Casson, Lionel** — *Travel in the Ancient World*.'
    - '**DiLuzio, Meghan J.** — *A Place at the Altar: Priestesses in Republican Rome*.'
    - '**Draycott, Jane** — *Roman Domestic Medical Practice in Central Italy: From
      the Middle Republic to the Early Empire*.'
    - '**Driediger-Murphy, Lindsay G.** — *Roman Republican Augury: Freedom and Control*.'
    - '**Fagan, Garrett G.** — *The Lure of the Arena: Social Psychology and the Crowd
      at the Roman Games*.'
    - '**Futrell, Alison** — *Blood in the Arena: The Spectacle of Roman Power*.'
    - '**Gargola, Daniel J.** — *The Shape of the Roman Order: The Republic and Its
      Space*.'
    - '**Golyzniak, Pawel** — *Engraved Gems and Propaganda in the Roman Republic
      and under Augustus*.'
    - '**Goodman, Penelope J.** — *The Roman City and its Periphery: From Rome to
      Gaul*.'
    - '**Greenidge, A.H.J.** — *A History of Rome During the Later Republic and Early
      Principate*.'
    - '**Gruen, Erich S.** — *Culture and National Identity in Republican Rome*.'
    - '**Hudson, Jared** — *The Rhetoric of Roman Transportation: Vehicles in Latin
      Literature*.'
    - '**Marin, Pamela** — *Blood in the Forum: The Struggle for the Roman Republic*.'
    - '**Marquardt, Joachim (transl. Victor Henry)** — *La Vie Privée des Romains
      (Manuel des Antiquités Romaines, vol. XIV)*.'
    - '**McCall, Jeremiah** — *Clan Fabius, Defenders of Rome: A History of the Republic''s
      Most Illustrious Family*.'
    - '**Millar, Fergus** — *The Emperor in the Roman World*.'
    - '**Mommsen, Theodor** — *The History of Rome (Books 1-5)*.'
    - '**Morstein-Marx, Robert** — *Mass Oratory and Political Power in the Late Roman
      Republic*.'
    - '**Pearson, Elizabeth H.** — *Exploring the Mid-Republican Origins of Roman
      Military Administration: With Stylus and Spear*.'
    - '**Pennell, Robert Franklin** — *Ancient Rome: From the Earliest Times Down
      to 476 A.D.*.'
    - '**Pina Polo, Francisco** — *The Consul at Rome: The Civil Functions of the
      Consuls in the Roman Republic*.'
    - '**Robinson, O.F.** — *The Criminal Law of Ancient Rome*.'
    - '**Roselaar, Saskia T.** — *Public Land in the Roman Republic: A Social and
      Economic History of Ager Publicus in Italy, 396-89 BC*.'
    - '**Rosenstein, Nathan** — *Rome and the Mediterranean 290 to 146 BC: The Imperial
      Republic*.'
    - '**Rutledge, Steven H.** — *Imperial Inquisitions: Prosecutors and Informants
      from Tiberius to Domitian*.'
    - '**Sage, Michael M.** — *The Republican Roman Army: A Sourcebook*.'
    - '**Saller, Richard P.** — *Personal Patronage under the Early Empire*.'
    - '**Sandberg, Kaj** — *Magistrates and Assemblies: A Study of Legislative Practice
      in Republican Rome (Acta Instituti Romani Finlandiae)*.'
    - '**Scarre, Chris** — *The Penguin Historical Atlas of Ancient Rome*.'
    - '**Scheidel, Walter (ed.)** — *Rome and China: Comparative Perspectives on Ancient
      World Empires*.'
    - '**Talbert, Richard J.A.** — *The Senate of Imperial Rome*.'
    - '**van der Blom, Henriette; Gray, Christa; Steel, Catherine (eds.)** — *Institutions
      and Ideology in Republican Rome: Speech, Audience and Decision*.'
    - '**van der Blom, Henriette** — *Oratory and Political Career in the Late Roman
      Republic*.'
    - '**Watts, Edward J.** — *Mortal Republic: How Rome Fell into Tyranny*.'
    - '**Wildfang, Robin Lorsch** — *Rome''s Vestal Virgins*.'
  - type: h3
    text: Further Reading by Topic
  - type: p
    style: body
    text: For GMs who want to dig deeper — or settle a table argument — these are
      good next steps from the shelf above, grouped by subject. A star (★) marks works
      on the Imperial era, where the setting's default period is best served.
  - type: list
    items:
    - '**Republic & its fall** — Mommsen, *The History of Rome*; Watts, *Mortal Republic*;
      Marin, *Blood in the Forum*; Beard, *SPQR* ★.'
    - '**Oratory, the contio & assemblies** — Morstein-Marx, *Mass Oratory and Political
      Power*; van der Blom, *Oratory and Political Career in the Late Roman Republic*;
      Botsford, *The Roman Assemblies*.'
    - '**Senate & magistracies** — Piña Polo, *The Consul at Rome*; Sandberg, *Magistrates
      and Assemblies*; Talbert, *The Senate of Imperial Rome* ★.'
    - '**Law & the courts** — Alexander, *Trials in the Late Roman Republic*; Robinson,
      *The Criminal Law of Ancient Rome* ★.'
    - '**Religion & augury** — Driediger-Murphy, *Roman Republican Augury*; Wildfang,
      *Rome''s Vestal Virgins*; Beard, North & Price, *Religions of Rome* ★.'
    - '**Philosophy** — Seneca (Hadas, ed.), *Stoic Philosophy of Seneca*; Lucretius,
      *On the Nature of Things*.'
    - '**Household, slavery & family** — Draycott, *Roman Domestic Medical Practice*;
      Cato & Varro, *Roman Farm Management*; Bradley, *Slavery and Society at Rome*
      ★; McCall, *Clan Fabius*.'
    - '**Empire, patronage & informers** — Millar, *The Emperor in the Roman World*
      ★; Saller, *Personal Patronage under the Early Empire* ★; Rutledge, *Imperial
      Inquisitions* ★ (the *delatores*).'
    - '**Arena & games** — Fagan, *The Lure of the Arena* ★; Futrell, *Blood in the
      Arena* ★.'
    - '**Comparative empire** — Scheidel (ed.), *Rome and China* ★.'
  - type: h3
    text: Digital Tools & Resources
  - type: list
    items:
    - '**Itiner-e** (*itiner-e.org*) — A digital gazetteer of the roads of the Roman
      Empire — map a journey, province to province, along the roads your characters
      would actually walk.'
    - '**ORBIS** (*orbis.stanford.edu*) — Stanford''s geospatial network model of
      the Roman world: the time and cost of travel between cities by road, river,
      and sea, season by season.'
    - '**Pleiades** (*pleiades.stoa.org*) — The community gazetteer of ancient places
      — the canonical reference for where a town, road, or river actually was.'
    - '**Digital Atlas of the Roman Empire (DARE)** (*dh.gu.se/dare*) — A zoomable
      map of the empire''s cities, roads, and provinces, layered over modern geography.'
    - '**ToposText** (*topostext.org*) — Ancient texts geo-linked to every place they
      mention — read the sources and see the map at once.'
    - '**LacusCurtius** (*penelope.uchicago.edu/Thayer/E/Roman*) — A deep online library
      of Roman texts and topography, including Platner & Ashby''s *Topographical Dictionary
      of Ancient Rome*.'
    - '**Perseus Digital Library** (*perseus.tufts.edu*) — Greek and Latin primary
      texts with translations and commentary — the originals behind the quotations
      in this book.'
    - '**Vici.org** (*vici.org*) — A crowd-sourced archaeological atlas of classical
      antiquity: find the fort, villa, or temple nearest any point.'
    - '**OCRE: Online Coins of the Roman Empire** (*numismatics.org/ocre*) — Every
      imperial coin type, searchable — ready-made portraits, propaganda, and props
      for the table.'
    - '**Where the Romans Fought** (*iosiflazaridis.github.io/battles-of-the-romans*)
      — An interactive map and downloadable dataset of every named Roman battle, 753
      BCE–1475 CE: place, foe, result, commanders, the army that fought, and the sources
      — a trove for seeding campaigns and a veteran''s war stories.'
