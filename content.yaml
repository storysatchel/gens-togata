    - label: Skills
      text: Charm 2, Cool 3, Discipline 3, Knowledge (the Gods) 2, Knowledge (Rome)
        3, Negotiation 2
    - label: Talents
      text: Adversary 1; Stoic Discipline 2; Master Orator.
    - label: Abilities
      text: 'Counsel: as an action, grant an ally within earshot [[boost]] [[boost]]
        on their next social or Discipline check and remove a point of strain.'
    - label: Standing
      text: Dignitas 2 (the authority of wisdom, not of office).
    - label: Doctrine & the Good Death
      text: He holds that a providential cosmos governs all and that externals — wealth,
        pain, reputation, even bodily harm — are *things indifferent*. **Things Indifferent:**
        remove [[setback]] imposed by threats to his comfort or standing, and ignore
        strain from insult or mockery. **The Good Death:** cornered by a tyrant, he
        may choose a dignified suicide that denies the enemy the kill and preserves,
        even raises, his Dignitas — the Stoic's final freedom (Cato, Seneca).
    type: statblock
  - type: statblock
    name: Epicurean Philosopher (Advisor)
    kind: Rival
    desc: A serene teacher who holds the cosmos to be blind atoms and void, the soul
      mortal, and the gods wholly indifferent — so neither death nor omen is to be
      feared. He counsels withdrawal from the mad race for office.
