- title: 'Chapter 3: The Theater of Power'
  blocks:
  - type: h2
    text: The Arena of Status
  - type: p
    style: lead
    text: 'Genesys models a conversation as a kind of combat — opposed social checks,
      **strain** as the health bar of an argument, and **Motivations** as the soft
      points in a target''s guard. No historical setting rewards that framework like
      Rome, a civilization where a man could be destroyed in the Forum without a blade
      being drawn, and where the Senate, the law-court, and the dinner-couch were
      the real battlefields. This chapter supplies Roman tools that plug directly
      into the Social Encounters rules (Core Rulebook, Chapter 7): a reputation economy,
      four set-piece encounter structures (the **speech**, the **Senate**, the **court**,
      and the **salutatio**), Roman Motivation tables, new talents and gear, and purely
      social adversaries to be beaten with words.'
  - type: p
    style: body
    text: '*Everything here is an overlay on the standard rules.* Inflicting strain,
      compromise at half the strain threshold, capitulation above it, the [[advantage]]/[[triumph]]
      and [[threat]]/[[despair]] spends, learning a Motivation facet, and the group-size
      difficulty table all work exactly as written. The Roman flavor is in *which*
      skill fits, *which* Motivation is exposed, and *what the stakes are.*'
  - type: h3
    text: 'Dignitas & Auctoritas: The Reputation Economy'
  - type: p
    style: body
    text: A Roman was his reputation. **Dignitas** is a character's public standing
      — the accumulated weight of ancestry, offices held, favors owed, and victories
      won. It is an optional setting trait rated **0–5**, set at creation by status
      and changed in play.
  - type: table
    style: gear
    columns:
    - Starting Dignitas
    - Who
    - Dignitas
    rows:
    - - Slave / outlaw / infamis
      - No standing in law; an actor or gladiator is *infamis*
      - '0'
    - - Commoner / freedman / provincial
      - A free plebeian, a *libertus*, a *peregrinus*
      - '1'
    - - Equestrian / notable
      - A wealthy knight, officer, or respected local
      - '2'
    - - Senatorial family
      - A senator or his heir
      - '3'
    - - Ex-magistrate (consular)
      - One who has held the great offices; a famous general
      - '4'
    - - First men of the state
      - The *princeps senatus*, the imperial house
      - '5'
  - type: p
    style: body
    text: '**What Dignitas does:**'
  - type: list
    items:
    - '**It armors your reputation.** When another character makes a social check
      to *shame, discredit, insult, or publicly coerce* your character, they add [[setback]]
      equal to the amount your Dignitas exceeds theirs (to a maximum of two [[setback]]).
      The high and mighty are simply harder to bring low.'
    - '**It lends weight to authority.** When your character makes an *Ethos* appeal
      (see Oratory) or any social check that leans on their standing, add [[boost]]
      if their Dignitas is 3+, or [[boost boost]] if it is 5.'
    - '**It funds Auctoritas.** At the start of any social set-piece, your character
      gains a pool of **Auctoritas** equal to their Dignitas (minimum 1). Each point
      may be spent as an incidental to add [[boost]] to a social check, to a crowd/vote
      track, or to a favor — the influence their name buys in the room. The pool refreshes
      each set-piece.'
    - '**Revelatory Appeal** (*Logos*) — claim privileged knowledge the audience cannot
      check (Cicero''s ever-wakeful “I know their every plan”): add [[boost boost]]
      to the appeal, but a [[despair]] exposes the bluff and costs you Dignitas for
      the scene.'
  - type: p
    style: body
    text: '**Gaining and losing it.** The GM raises a character''s Dignitas by 1 for
      a landmark public success — winning a notorious trial, election to a great office,
      sponsoring magnificent games, a military triumph, saving a citizen''s life (the
      *corona civica*). It falls by 1 for *infamia*: losing such a trial, public cowardice
      or bankruptcy, a ruinous scandal, or conviction for a crime. Dignitas is slow
      to earn and ruinous to lose — which is precisely why Romans killed for it. **Optional
      — the hunger of prestige.** Pedigree alone never sustained a Roman house; standing
      had to be renewed each generation (by the early Empire, idle heirs of the Fabii
      were mocked for coasting on ancestral glory). A high-Dignitas character who
      wins no landmark success across a long stretch of play slowly loses a point
      of Dignitas, unless renewed by office, magnificent games, or martial glory.'
  - type: h3
    text: Roman Motivations
  - type: p
    style: body
    text: 'Give every recurring Roman NPC (and encourage players to give their characters)
      Motivations from the lists below, used exactly as in the Core Rulebook: work
      *with* a Strength or Flaw to add [[boost]]; work *with* a Desire or Fear to
      add [[boost boost]]; work against them to add [[setback]] or [[setback setback]].
      Players learn an NPC''s Strength/Flaw by spending [[advantage advantage]], a
      Desire/Fear with [[advantage advantage advantage]], or any facet with a [[triumph]].'
  - type: table
    style: motiv
    columns:
    - d10
    - Desire (what they chase)
    - Fear (what they dread)
    rows:
    - - '1'
      - '**Gloria** — fame that outlives them'
      - '**Obscurity** — to be forgotten, a nobody'
    - - '2'
      - '**The consulship** / high office'
      - '**Exile** — banishment from Rome'
    - - '3'
      - '**Wealth** — estates, slaves, silver'
      - '**Poverty & debt** — the shame of the ruined'
    - - '4'
      - '**Vengeance** on a rival house'
      - '**A powerful enemy''s malice**'
    - - '5'
      - '**Freedom** / citizenship (for the enslaved)'
      - '**The mob** — riot, lynching, the arena'
    - - '6'
      - '**Pleasure** — luxury, love, the table'
      - '**The Emperor''s suspicion**'
    - - '7'
      - '**The old Republic** / restoring virtue'
      - '**Impiety** — angering the gods, bad omens'
    - - '8'
      - '**Family** — heirs, the line''s honor'
      - '**Betrayal** by a friend or freedman'
    - - '9'
      - '**Knowledge** — philosophy, the mysteries'
      - '**Loss of face** before one''s peers'
    - - '10'
      - '**Power** for its own sake — the purple itself'
      - '**Death without a good name**'
  - type: table
    style: motiv
    columns:
    - d10
    - Strength (what steadies them)
    - Flaw (what undoes them)
    rows:
    - - '1'
      - '**Gravitas** — unshakeable dignity'
      - '**Pride** — cannot bear a slight'
    - - '2'
      - '**Eloquence** — a golden tongue'
      - '**Avarice** — greed clouds judgment'
    - - '3'
      - '**Loyalty** — to patron, legion, or friend'
      - '**Lust** / appetite — a notorious weakness'
    - - '4'
      - '**Piety** — the gods on their side'
      - '**Superstition** — ruled by omens'
    - - '5'
      - '**Cunning** — the long game'
      - '**Cruelty** — overreaches, makes enemies'
    - - '6'
      - '**Discipline** — Stoic self-command'
      - '**Rashness** — acts before thinking'
    - - '7'
      - '**Generosity** — a famous patron'
      - '**Vanity** — easily flattered'
    - - '8'
      - '**Industry** — tireless, competent'
      - '**Drink / the dice** — a vice to exploit'
    - - '9'
      - '**Courage** — faces down the mob'
      - '**A guilty secret** — a lever for blackmail'
    - - '10'
      - '**Nobility** — the weight of ancestors'
      - '**Naivety** — trusts the wrong people'
  - type: h3
    text: 'Oratory: The Set-Piece Speech'
  - type: p
    style: body
    text: 'Trained oratory was a Roman''s sharpest tool — but only one of several.
      Ancestry, wealth, patronage, military glory, and sheer *dignitas* carried as
      many arguments as eloquence did: Marius won seven consulships with almost no
      gift for speech, and Pompey and Antony leaned on reputation and spectacle over
      rhetoric. So treat a great speech as a force-multiplier for a strong position,
      not a substitute for one — a character rich in standing and connections can
      rule the Forum on a middling check. The Republican model is the **contio**,
      the non-voting public meeting a magistrate called to work the People before
      a vote; only a magistrate could summon one, so a private citizen needed a friendly
      magistrate''s invitation to speak — contio-access as a currency of alliance.
      Run a major speech as a short structured social encounter (3–5 rounds) against
      an **audience**, treated as a single target with a **strain threshold** set
      by its size and mood. Exceed the threshold and the audience is *won*; exceed
      half for a **partial** result. *(Under the emperors the contio and the voting
      assemblies lose their teeth; the imperial stages for this same mechanic are
      the crowd''s acclamation at the games and the Circus, and a general''s address
      to his troops.)*'
  - type: table
    style: gear
    columns:
    - Audience
    - Size
    - Check difficulty
    - Strain threshold
    rows:
    - - A dinner-table, a handful of senators
      - 2–5
      - Average ( ●● )
      - '10'
    - - A jury, a committee, a cohort
      - 6–15
      - Hard ( ●●● )
      - '14'
    - - The full Senate, a theatre
      - 16–50
      - Daunting ( ●●●● )
      - '18'
    - - The Forum mob, the Circus
      - 51+
      - Formidable ( ●●●●● )
      - '22'
  - type: p
    style: body
    text: 'Adjust the threshold by ±4 for an audience already hostile or already sympathetic.
      On each of the orator''s turns they make **one appeal** — a social check that
      inflicts strain as normal (1, plus 1 per uncanceled [[advantage]]). The three
      classical appeals map cleanly to Genesys social skills:'
  - type: list
    items:
    - '**Ethos — authority and character.** *Leadership* or *Charm.* “I, who have
      served Rome for thirty years, tell you…” Add the Dignitas bonus.'
    - '**Pathos — emotion.** *Charm* (to inspire love, hope, pity) or *Coercion* (to
      rouse fear, anger, hatred). The crowd''s favorite.'
    - '**Logos — reason and proof.** *Negotiation*, or first spend a maneuver on a
      *Knowledge (Law)* or *Knowledge (Rome)* check to marshal evidence and **upgrade**
      the following appeal.'
  - type: p
    style: body
    text: '**Working the audience''s Motivation** (give a crowd a collective Desire
      and Fear — the plebs *desire* grain and games, and *fear* hunger and foreign
      kings) adds [[boost boost]] as usual. A hostile orator may spend their turn
      **heckling** (an opposed Coercion or Deception check) to inflict strain back
      on the speaker and add [[setback]] to their next appeal.'
  - type: procedure
    title: The Five Parts (optional maneuvers & once-per-speech beats)
    steps:
    - '**Exordium** (opening): a maneuver — a disarming *captatio benevolentiae*.
      Add [[boost]] to the first appeal.'
    - '**Narratio** (the facts): a *Knowledge* maneuver that upgrades the next *Logos*
      appeal.'
    - '**Confirmatio** (proof): your strongest *Logos* appeal.'
    - '**Refutatio** (rebuttal): an action that removes an opposing orator''s banked
      [[advantage]] / crowd goodwill, or adds [[setback setback]] to their next appeal.'
    - '**Peroratio** (climax): a final *Pathos* appeal. If it generates a [[triumph]]
      or [[advantage advantage advantage advantage]], it lands as a **Critical Remark**
      (5 strain) — the moment the hall erupts.'
  - type: example
    text: 'Example — Marcus before the mob. The aedile Marcus (Dignitas 2) must calm
      a bread-riot (Forum mob: Formidable, threshold 22). **Round 1 — Exordium + Ethos:**
      he opens humbly (maneuver: [[boost]]) then invokes his record feeding them (Charm,
      +[[boost]] from exordium). He rolls 2 [[success]], 2 [[advantage]] → 3 strain,
      and spends the [[advantage advantage]] to learn the crowd''s Fear: *hunger*.
      **Round 2 — Narratio + Logos:** a Knowledge (Rome) maneuver recalls the grain-fleet''s
      arrival (upgrade), then Negotiation promising a distribution, now adding [[boost
      boost]] for playing to their Fear. The upgraded pool throws a [[triumph]] →
      a Critical Remark, 5 strain, “the ships are in the Tiber *tonight!*” Total 8+
      strain, past half-threshold — the riot sags into a wary cheer. One more good
      round and they are his.'
  - type: h3
    text: 'The Senate: A Contest of Blocs'
  - type: p
    style: body
    text: A Senate debate is a tug-of-war over a motion (a *senatus consultum*). Model
      the undecided house as 2–4 **bloc** minion groups — e.g., the *Old Guard* (traditionalists),
      the *Novi Homines* (ambitious new men), the *Military Clique*, and the *Emperor's
      Men* — each with a vote-weight and a Discipline/Cool to resist. Speakers (PC
      and NPC) take turns delivering appeals (as Oratory, above) aimed at a chosen
      bloc; inflicting strain past that bloc's wound threshold **commits** its votes
      to that side. When every bloc has committed (or the session ends), tally the
      votes.
  - type: p
    style: body
    text: 'Behind the bench-groups stand four standing interests, each answering to a
      faction type from the earlier chapters. **The Old Guard** (*optimates*) are
      traditionalist senators defending senatorial supremacy and ancestral custom,
      and they keep close to the great priestly colleges (*collegia sacerdotum*).
      **The Imperial Bureau** gathers senators and equestrians tied to the imperial
      house (*domus Augusta*), the Praetorian prefect, and the imperial secretariats
      for correspondence (*ab epistulis*) and petitions (*a libellis*); it is the
      largest bloc by patronage and the smallest by conviction. **The Financial
      Interest** is composed of senators holding shares in the tax-farming syndicates
      (*societates publicanorum*) and the grain contracts, who vote with the syndicates
      whose ledgers they share. **The Popular Tribunes** are magistrates and tribunes
      who carry the petitions and grain grievances of the neighborhood wards (*vici*)
      into the assembly.'
  - type: p
    style: body
    text: 'A character''s faction membership sets each bloc''s baseline stance. A
      publican''s ally begins friendly with the Financial Interest and at [[setback]]
      with the Old Guard; a priest''s household begins friendly with the Old Guard and
      at [[setback]] with the Popular Tribunes. A named patron''s favor can override
      that baseline for a single hearing, at the cost of the obligation described
      above. Alignment adjusts the difficulty of an appeal and the options open to
      the speaker; it never guarantees a vote.'
  - type: procedure
    title: Procedural Trump Cards
    steps:
    - '**Relatio & sententiae.** The presiding consul sets the motion and calls senators
      for their *sententiae* — the consuls-designate and senior *consulares* first,
      not by raw seniority. High standing literally speaks first and frames the debate
      (add [[boost]] to the opening side); under the Empire the consuls, and the emperor''s
      wishes, set the order.'
    - '**Intercessio — the Tribune''s veto.** In the Republic a Tribune of the Plebs
      may, once per session, veto the motion outright: a hard stop, answered only
      by winning him over, out-waiting him, or arranging his absence. *(By the High
      Empire this is a dead letter — the* princeps *himself holds* tribunicia potestas
      *and sacrosanctity, and the real veto is simply his known wish, below.)*'
    - '**Obnuntiatio & the auspices — the omens.** Most Romans believed the auspices
      truly spoke Jupiter''s will, so this is a weapon of faith, not mere theatre,
      and a man caught fabricating a sign faced ruin. Two moves: a magistrate who
      **“watches the sky”** (Knowledge (the Gods)) declares the day''s omens foul
      and *suspends all business for the day* (Bibulus paralysed Caesar''s consulship
      this way); an **augur''s formal ruling** that an act was taken *vitio* (flawed)
      can void a law already passed or compel a magistrate''s abdication — a harder
      check and a graver blow. Faking either is a desperate, capital gamble, and a
      fine plot hook.'
    - '**Filibuster.** Talk until nightfall ends the session with no vote (Cato''s
      trick). Resolve as an endurance contest — repeated Discipline or Resilience
      checks against rising difficulty.'
    - '**The Emperor''s known wish.** If the *princeps* is believed to favor a side,
      every check for the other side suffers [[setback]] — and generating a [[despair]]
      may earn a *delator''s* whispered report (see below).'
  - type: example
    text: 'Example — swinging the Old Guard. The PCs back a motion to grant a frontier
      command. The Old Guard bloc (threshold 12) leans against. A PC with Senatorial
      Connections opens with Ethos, inflicts 4, then spends [[advantage advantage
      advantage]] to learn the bloc''s collective Fear: *a new Caesar*. Next round,
      Logos reframes the command as temporary and defensive — [[boost boost]] for
      the Fear — 5 more strain, bloc committed. But a hostile Tribune raises *intercessio*;
      the party must spend a scene persuading (or compromising) him before the *discessio*
      (division) can be called.'
  - type: h3
    text: 'The Courtroom: Advocacy'
  - type: p
    style: body
    text: Run a Roman trial as a speech-contest with the **jury** (*iudices*) as the
      audience. Prosecutor and defender alternate appeals against the jury's strain
      threshold; exceed it to carry the verdict. Roman advocacy was gloriously dirty
      — the law mattered less than the performance.
  - type: p
    style: body
    text: '**Which court?** Roman justice ran across several tribunals, each a different
      flavour of this set-piece: the standing criminal courts (*quaestiones perpetuae*,
      the model for most trials), trials before the people (*iudicia populi*), and
      religious courts — a priest or a Vestal accused of *incestum* answered to the
      pontifical college, not a lay jury. In a sacral trial, swap **Knowledge (Law)**
      for **Knowledge (the Gods)** as the *Logos* skill and make the college the audience.'
  - type: list
    items:
    - '**Knowledge (Law)** as a maneuver marshals statute and precedent, upgrading
      the next appeal (your *Logos*).'
    - '**Witnesses & evidence** are banked [[boost]] (helpful) or [[setback]] (hostile)
      the GM hands out; discrediting a witness (opposed Coercion/Deception) flips
      one.'
    - '**Character assassination** — attack the opposing party''s reputation directly,
      targeting a known Flaw (Coercion/Deception) to inflict strain on *their* advocate
      and lower their Dignitas for the scene.'
    - '**Appeal to pity** — the weeping family, the old general baring his scars —
      is a *Pathos* appeal with a prop, adding [[boost boost]]. Cicero won cases this
      way.'
  - type: h4
    text: Trials as Factional Contests
  - type: p
    style: body
    text: 'Three standing charges turn the courtroom into an institutional collision.
      A prosecution for extortion (*repetundae*) pits a provincial delegation and the
      publican syndicates against a senatorial governor before an equestrian jury, so
      the jury''s own class interest is the real battlefield. A treason charge
      (*maiestas*) is a *delator* syndicate prosecuting a senatorial rival to seize
      his estate and standing, with the emperor as the only audience that matters. A
      sacral inquiry — *incestum*, or the desecration of a temple — has the pontifical
      college judge a Vestal or a shrine, and the verdict is religious while its
      consequence is political.'
  - type: p
    style: body
    text: 'Faction backing supplies each side''s pool of assets: witnesses, advocates,
      documentary evidence, procedural objections. A character''s own faction decides
      which of those assets are available without a check. A senatorial patron produces
      the advocate and the character witnesses; a syndicate produces the ledgers and
      the clerk who copied them; a ward produces the crowd outside the court and the
      men who will swear to anything. Roll for the rest — Knowledge (Law) to find the
      precedent, Negotiation to hold a wavering witness, Coercion or Deception to break
      one — and let a [[triumph]] produce the document the other side believed burned,
      a [[despair]] reveal that your patron has already settled with the prosecutor.'
  - type: h3
    text: The Salutatio & the Favor Economy
  - type: p
    style: body
    text: 'Every morning, clients call on their patron (the *salutatio*) to pay respects
      and ask favors; the patron hands out the *sportula* (a dole of coin or food)
      and banks their loyalty. Mechanize this web with **Favors**: tradeable tokens
      representing a specific obligation owed.'
  - type: p
    style: body
    text: '**Two kinds of bond.** Favors run *down* **clientela** (patron over client)
      and *across* **amicitia** — reciprocal “friendship” between near-equals that
      was itself a political institution: letters of recommendation, invitations,
      a magistrate''s leave to address a meeting. An *amicitia* Favor is called in
      between equals with no Dignitas-gap limit, but breaking one costs extra reputation,
      because it shames both parties.'
  - type: p
    style: body
    text: 'Faction attendance turns the morning greeting into a favor pool. A patron
      of senatorial or equestrian rank banks a number of small favors each session
      from the client base their Dignitas supports; the *Morning Clients* talent gives
      that rule. A client who attends a faction patron''s *salutatio* may bank one
      small favor from that patron''s faction per session — and the patron may then
      call on them in the same session, through the Story Point leverage described in
      character creation Step 6. The setting of the greeting fixes the kind of favor:
      senatorial *salutationes* generate political obligations, the *stationes* of the
      syndicates generate commercial ones, and a *vicus* crossroads shrine generates
      neighborhood ones.'
  - type: procedure
    title: Using Favors
    steps:
    - A character **banks a Favor** by doing a meaningful service, winning one in
      a social encounter (a capitulation can be “you owe me”), or via the *Client
      Network* / *Patronus* talents.
    - '**Spend a Favor** to call in a concrete, bounded help from that person: a letter
      of introduction, a sum of coin, a door opened, a witness produced, a vote in
      the Senate, a blind eye turned.'
    - 'Favors have a **face**: a Favor from a senator is worth more than one from
      a shopkeeper. The GM caps what any single Favor can buy by the grantor''s Dignitas
      and the risk involved.'
    - '**Breaking faith** — refusing a reasonable call on a Favor you owe — costs
      1 Dignitas and makes an enemy. Rome remembered.'
  - type: h3
    text: Convivium and Elections
  - type: p
    style: body
    text: The same frame runs the **convivium** (dinner party), where seating is position
      — the place of honor (*locus consularis*) grants its occupant [[boost]] to social
      checks — and the intimacy lets guests learn one another's Motivations a step
      cheaper; and the **election**, a canvass that targets the voting tribes as blocs,
      won with promises, games, the *sportula*, and (illegally) outright bribery —
      *ambitus*, a [[triumph]]-worthy gamble that courts a ruinous prosecution if
      a [[despair]] turns up.
- title: 'Chapter 4: The Roman World'
  blocks:
  - type: p
    text: 'Rome is two geographies at once: the city within the walls, carved into
      *regiones* and *vici*, and the empire beyond, carved into *provinciae*. This
      gazetteer gives you both at a glance — enough to place a scene, name a street,
      or send the party to the edge of the world.'
  - type: h3
    text: 'Rome: The Eternal City'
  - type: p
    text: 'Under Trajan and Hadrian, Rome is a roaring Mediterranean metropolis of
      over one million people. Concrete, brick, and marble rise five stories above
      the narrow streets, while hundreds of thousands of common citizens crowd into
      teetering apartment blocks. The city is defined by its sensory intensity: the
      smoke of blacksmith forges and bakeries, the stench of open drains, the sudden
      cool of vast public bathhouses, and the roar of public spectacles echoing from
      the valleys.'
  - type: p
    text: The master rule of Roman urban space is the *pomerium*, the sacred augural
      boundary that separates the consecrated city (*urbs*) from the military and
      agricultural territory (*ager*) outside. {{sidebar}}
    sidebar:
      type: sidebar
      title: 'The Pomerium: Rome''s Sacred Line'
      body:
      - 'The **pomerium** is not a wall but a line — the augurally-defined sacred
        boundary that separates the *urbs* (the holy city) from the *ager* (the land
        outside). It is the master rule of Roman space. Inside it, military *imperium*
        cannot be exercised: soldiers may not march under arms, weapons are set aside,
        a general lays down his command, and the dead may not be buried. Crossing
        it changes a magistrate''s powers and his dress. This is why a triumph-seeking
        general and his army wait on the Campus Martius, why the Senate meets commanders
        in temples outside the line, and why an armed intrusion into the city is not
        a mere crime but a sacrilege — a fact worth a whole adventure.'
  - type: p
    text: Through the center of the city winds the *Tiberis*, or Tiber, a swift, silt-laden
      river that acts as both highway and barrier. Cargo barges laden with grain,
      Spanish olive oil, and marble blocks are towed upriver from Ostia by teams of
      oxen along the riverbanks. The river is crossed by stone bridges such as the
      *Pons Fabricius* and *Pons Aemilius*, connecting the ancient seven hills on
      the left bank with the immigrant working quarters of Transtiberim. Heavy autumn
      rains in the Apennines frequently send brown floodwaters surging across the
      Campus Martius and the Forum Boarium, turning low-lying streets into canals.
  - type: h3
    text: The Districts of Rome
  - type: p
    text: Augustus divided the city into the **fourteen *regiones*** (numbered regions),
      each subdivided into local wards called **_vici_**. Each *vicus* maintains its
      own elected local magistrates (*vicomagistri*), public fountains, and crossroads
      shrines dedicated to the *Lares Compitales*, the guardian spirits of the neighborhood.
      While imperial administrators record transactions by numbered region, citizens
      continue to navigate by the iconic hills, valleys, and ancient monuments.
  - type: h4
    text: Forum Romanum
  - type: p
    text: '**Faction hold.** The Senatorial Order and the equestrian *societates
      publicanorum* hold this ground. The *Basilica Aemilia* is their
      exchange, where shares in tax-farming contracts change hands within
      sight of the courts, and a word under its arcades can price a province''s
      revenue before the Senate has voted. Their lever is the law itself,
      argued and bought in the same morning. The Palatine''s imperial bureau
      contests it, drawing petitions and appeals up the hill to secretariats
      that answer to no magistrate.'
  - type: p
    text: 'The paved valley between the Palatine and Capitoline hills forms the political,
      religious, and legal heart of the Mediterranean world (*Regio VIII Forum Romanum
      Magnum*). The *Via Sacra*, or Sacred Way, cuts through the plaza, lined by venerable
      sanctuaries: the Temple of Saturn housing the state treasury, the round Temple
      of Vesta with its eternal flame, and the Temple of Castor and Pollux. At the
      northwestern edge stand the *Curia Julia*, where the Senate convenes, the *Comitium*,
      and the ship-prowed *Rostra* speakers'' platform.'
  - type: p
    text: '**Notable Locations:** The *Curia Julia* (Senate house); the *Basilica
      Julia* and *Basilica Aemilia* (bustling civil law courts and banking halls);
      the *Lacus Curtius* (sacred pit in the forum paving); the *Golden Milestone*
      (*Milliarium Aureum*), measuring distances to all imperial roads.'
  - type: p
    text: '**Flavor & Adventure Seeds:** Senators in gleaming white togas confer with
      anxious equestrian financiers under the basilicas'' marble arcades; clerks scurry
      with parchment rolls; crowds gather around the Rostra to applaud or jeer public
      orators. *Adventure Seed:* A disgraced quaestor drops a wax tablet inscribed
      with coded treasonous correspondence near the Lacus Curtius, and several competing
      client gangs scour the crowded forum to recover it before the urban cohorts
      arrive.'
  - type: statblock
    name: Caecilia Attica
    kind: Nemesis
    desc: A freedwoman grown into one of the Forum's great *argentarii* (bankers).
      She lends to senators against their next province and keeps their secrets as
      collateral; her ledger is a map of who truly owns Rome.
    chars:
      Br: '1'
      Ag: '2'
      Int: '4'
      Cun: '4'
      Will: '3'
      Pr: '3'
    derived:
      Soak: '2'
      W.T.: '13'
      S.T.: '16'
      Def (M/R): 0/1
    fields:
    - label: Motivations
      text: 'Desire: security no patron can revoke. Fear: a defaulted magnate dragging
        her down. Strength: half the Senate is in her debt. Flaw: she cannot resist
        a profitable risk.'
    - label: Skills
      text: Negotiation 4, Knowledge (Law) 3, Knowledge (Rome) 3, Deception 3, Coercion
        2, Charm 2.
    - label: Talents
      text: Adversary 2; Morning Clients; a dossier on every client.
    - label: Abilities
      text: '**The Ledger:** she knows the true finances of the great, and can call
        a debt at the worst possible moment — add [[boost boost]] to any social check
        against a man who owes her. **Credit as a Weapon:** she can bankroll the party,
        or quietly cut off their rival''s line of credit.'
  - type: h4
    text: The Palatine
  - type: p
    text: '**Faction hold.** The Imperial Bureau holds this ground: the imperial
      house (*domus Augusta*), the secretariats for correspondence and
      petitions (*ab epistulis*, *a libellis*), and the Praetorian Guard at
      every archway. The lever is access — to the emperor''s ear, to the
      treasury''s signature, to the guard''s silence — and access decides which
      petitions are answered at all. Senatorial houses contest it, buying
      clients and informers among the palace freedmen to learn what the hill
      intends before the hill announces it.'
  - type: p
    text: Rising steeply above the Forum, the Palatine Hill (*Regio X Palatium*) is
      the premier residential quarter of the imperial family and the highest senatorial
      aristocracy. Here stands the sprawling imperial palace complex—the *Domus Augustana*
      and *Domus Flavia*—with terraced gardens, private libraries, banqueting halls,
      and colonnaded peristyles overlooking the Circus Maximus below. Guards from
      the Praetorian German bodyguard stand watch at every marble archway.
  - type: p
    text: '**Notable Locations:** The *Domus Augustana* (imperial residence); the
      *Temple of Apollo Palatinus* (housing Greek and Latin public libraries); the
      *Casa Romuli* (the sacred thatch-roofed hut of Romulus, preserved with religious
      veneration); the subterranean cryptoporticus passageways.'
  - type: p
    text: '**Flavor & Adventure Seeds:** Soft flutes and the scent of expensive Arabian
      incense drift from enclosed garden courtyards; armed Praetorian sentries challenge
      all visitors; Greek freedmen whisper imperial policy behind gilded doors. *Adventure
      Seed:* An invited guest at an elite banquet on the Palatine is poisoned by a
      rare Parthian draught; the PCs must uncover the killer among rival freedman
      secretaries before the palace prefect locks down the hill.'
  - type: statblock
    name: Hyacinthus
    kind: Nemesis
    desc: An imperial freedman, born a slave, who keeps the emperor's accounts as
      *a rationibus* — and therefore holds the purse of the world. Smooth, tireless,
      richer than most senators, and hated by all of them.
    chars:
      Br: '1'
      Ag: '2'
      Int: '4'
      Cun: '4'
      Will: '3'
      Pr: '3'
    derived:
      Soak: '2'
      W.T.: '13'
      S.T.: '18'
      Def (M/R): 0/1
    fields:
    - label: Motivations
      text: 'Desire: to be indispensable to the throne. Fear: a new emperor, a new
        favorite. Strength: he controls access and money. Flaw: a freedman''s hunger
        for the respect birth denies him.'
    - label: Skills
      text: Knowledge (Rome) 4, Knowledge (Law) 3, Negotiation 3, Deception 3, Charm
        2, Vigilance 3, Cool 2.
    - label: Talents
      text: Adversary 2; Plausible Deniability; Nobody's Fool.
    - label: Abilities
      text: '**The Keys to the Purse:** he can fund or ruin an enterprise with a stroke
        of the stylus, and adds [[success]] to any check turning on money or palace
        access. **The Emperor''s Ear:** a word from him carries the weight of the
        princeps — treat as the *Emperor''s known wish* against those he opposes.'
  - type: h4
    text: The Capitoline
  - type: p
    text: '**Faction hold.** The Civic Priesthoods hold this ground: the pontifical
      and augural colleges (*collegia sacerdotum*), the mint of Juno Moneta,
      and the *Tabularium*, whose bronze laws and decrees are the state''s
      memory. The lever is the sacral veto — an adverse omen (*obnuntiatio*)
      suspends public business for the day, and a priest who keeps the
      calendar decides what the state may lawfully do. The imperial bureau
      contests it, pressing to move the archives and the auspices into
      imperial hands.'
  - type: p
    text: The rugged double-crested citadel hill looming over the Forum (*Mons Capitolinus*)
      is Rome's supreme religious sanctuary. The southern summit (*Capitolium*) is
      crowned by the colossal Temple of Jupiter Optimus Maximus, shared with Juno
      and Minerva. The northern summit (*Arx*) holds the citadel and the Temple of
      Juno Moneta, beside the public mint. Facing the Forum stands the massive travertine
      *Tabularium*, holding the state archives of bronze laws and decrees.
  - type: p
    text: '**Notable Locations:** The *Temple of Jupiter Optimus Maximus*; the *Tabularium*
      (state archive building); the *Tarpeian Rock* (*Saxum Tarpeium*), a jagged cliff
      from which traitors and murderers are hurled to their deaths; the *Auguraculum*
      (sacred viewing hut where augurs read the heavens).'
  - type: p
    text: '**Flavor & Adventure Seeds:** The smell of burning fat from public sacrificial
      altars fills the steep ascent; solemn processions of magistrates climb the Clivus
      Capitolinus to offer vows on their first day of office. *Adventure Seed:* A
      condemned client of the PCs is scheduled to be cast from the Tarpeian Rock at
      dawn on trumped-up charges of sacrilege; the party has one night to break into
      the Tabularium and retrieve the true imperial decree proving his innocence.'
  - type: statblock
    name: Cornelia
    kind: Nemesis
    desc: 'The Chief Vestal (*Virgo Vestalis Maxima*), keeper of the sacred flame
      and of the wills Romans deposit with the Vestals. She has outlasted
      three emperors by never once appearing to choose between them.'
    chars:
      Br: '1'
      Ag: '1'
      Int: '3'
      Cun: '3'
      Will: '5'
      Pr: '4'
    derived:
      Soak: 2
      W.T.: '11'
      S.T.: '18'
      Def (M/R): 0/1
    fields:
    - label: Motivations
      text: 'Desire: the flame kept and the college''s authority intact. Fear:
        an emperor who treats the rites as an instrument of policy.
        Strength: she holds wills, secrets, and the calendar. Flaw: she
        will not bend a rite for politics.'
    - label: Skills
      text: 'Knowledge (the Gods) 4, Knowledge (Law) 3, Discipline 4, Cool 3,
        Charm 2, Vigilance 3.'
    - label: Talents
      text: 'Adversary 2; Nobody''s Fool; Temple Acolyte.'
    - label: Abilities
      text: '**Ritual Impediment:** she may halt any public proceeding — a
        court, an assembly, a contract signed in the forum — by declaring
        the day *vitio* and the rites polluted; only a Formidable
        Knowledge (the Gods) check or an explicit imperial order sets it
        aside. **The Vestals'' Sanctuary:** anyone she receives within the
        temple precinct cannot be lawfully seized there; the protection
        holds for one night and costs her a Favor from the college.'
  - type: h4
    text: The Subura
  - type: p
    text: '**Faction hold.** The Neighborhood Wards hold this ground: the *vici*
      and their *vicomagistri*, the craft *collegia*, and the crossroads
      shrines of the *Lares Compitales*. The lever is labour and the street —
      ward-masters can shutter the artisan shops on a morning''s notice and put
      a crowd on a corner before the watch arrives. The *lanistae* and the
      Circus colors contest it, recruiting the same young men for the arena
      and the faction gangs, and paying better.'
  - type: p
    text: Nestled in the low-lying depression between the Esquiline and Viminal hills
      (*Regio IV Templum Pacis* and *Regio VI Alta Semita*), the Subura is Rome's
      densest, loudest, and most notorious quarter. Narrow, unpaved alleys wind between
      towering timber-and-brick apartment blocks (*insulae*) that lean over the streets.
      The ground floors are packed with taverns (*popinae*), cheap cookshops, cobblers,
      dyers, and brothels (*lupanaria*). Waste is dumped from upper windows, and gang
      violence flares after sundown.
  - type: p
    text: '**Notable Locations:** The *Argiletum* entrance (lined with bustling booksellers
      and scribes); the *Lupanar of the Three Vipers*; the *Popina of Sulla''s Boot*
      (notorious underworld rendezvous); the crumbling *Insula Felicula*, rising six
      dangerous stories.'
  - type: p
    text: '**Flavor & Adventure Seeds:** Street hawkers shout the price of sausages
      and chickpeas; unwashed wool and sour wine reek in the summer heat; collegia
      toughs collect protection money from shopkeepers. *Adventure Seed:* A sudden
      fire breaks out in a crowded Subura tenement where the PCs are meeting a clandestine
      informant; as wooden stairwells collapse in flame, the party must fight off
      looters and guide trapped families to safety across the rooftops.'
  - type: statblock
    name: Rufio Scaeva
    kind: Nemesis
    desc: A scarred freedman who runs a *collegium* — nominally a burial-club and
      crossroads shrine, in truth the organized muscle of the quarter. He delivers
      votes, protection, arson, and silence, and the aediles look the other way.
    chars:
      Br: '3'
      Ag: '3'
      Int: '2'
      Cun: '4'
      Will: '3'
      Pr: '3'
    derived:
      Soak: '4'
      W.T.: '16'
      Def (M/R): 1/0
    fields:
    - label: Motivations
      text: 'Desire: to be the man the quarter needs. Fear: a rival collegium. Strength:
        a hundred clients who owe him. Flaw: pride in his own legend.'
    - label: Skills
      text: Brawl 3, Melee 2, Coercion 3, Streetwise 4, Deception 2, Knowledge (Rome)
        2, Vigilance 3.
    - label: Talents
      text: Adversary 2; Morning Clients; a standing minion group of *Street Toughs*.
    - label: Abilities
      text: '**The Quarter Is His:** anywhere in the Subura, Rufio adds [[boost boost]]
        to social and Streetwise checks and always knows who is new; strangers who
        cross him draw his toughs within a scene. **Fire as Argument:** he can arrange
        a “accidental” tenement fire as a threat or a distraction.'
  - type: h4
    text: The Aventine
  - type: p
    text: '**Faction hold.** The plebeian assembly and the trade *collegia* hold
      this ground: the *scholae* of the dockers, measurers, and potters, and
      the Temple of Ceres, which keeps the tribunes'' archives. The lever is
      the voting bloc — a guild that walks together to the assembly can carry
      a tribe, and its officers know exactly which names to call. Senatorial
      patrons contest it, buying those blocs with loans and legal favors and
      calling in the debt at election time.'
  - type: p
    text: Rising south of the Forum and overlooking the Tiber wharves, the Aventine
      Hill (*Regio XIII Aventinus*) has been the spiritual and political citadel of
      the plebeians since the earliest days of the Republic. Outside the ancient Servian
      pomerium until the reign of Claudius, it welcomes foreign deities and working-class
      guilds. The great Temple of Ceres, Liber, and Libera preserves the historical
      archives of the plebeian tribunes, while temples to Diana and Minerva shelter
      artisan associations.
  - type: p
    text: '**Notable Locations:** The *Temple of Ceres, Liber, and Libera* (plebeian
      religious center); the *Temple of Diana Aventina*; the *Baths of Suran*; the
      upper residential slopes overlooking the Tiber wharves.'
  - type: p
    text: '**Flavor & Adventure Seeds:** Dockers, stevedores, and grain-measurers
      gather in trade association headquarters (*scholae*); plebeian assemblies debate
      civic issues in tavern courtyards; foreign mystery initiates celebrate nocturnal
      rites. *Adventure Seed:* A powerful patrician landlord attempts to evict an
      entire guild of Aventine potters to build a luxury bath complex; the guild hires
      the PCs to find the lost Republican land-charter in the Temple of Ceres before
      hired thugs burn their kilns.'
  - type: statblock
    name: Gaius Vibidius
    kind: Rival
    desc: 'A patron of an artisan *collegium* and broker of a ward bloc on the
      Aventine. He sells the votes of his neighbours to whichever senator
      pays, and keeps a tally of who has paid late.'
    chars:
      Br: '2'
      Ag: '2'
      Int: '3'
      Cun: '5'
      Will: '3'
      Pr: '3'
    derived:
      Soak: 3
      W.T.: '13'
      S.T.: '15'
      Def (M/R): 0/0
    fields:
    - label: Motivations
      text: 'Desire: to be the man both sides must pay. Fear: a patron who
        decides he can be replaced. Strength: he owns the ward roll and
        knows every household on it. Flaw: he cannot resist selling one
        bloc twice.'
    - label: Skills
      text: 'Streetwise 4, Negotiation 3, Coercion 3, Deception 3, Knowledge
        (Rome) 2, Vigilance 3.'
    - label: Talents
      text: 'Adversary 2; Morning Clients; Client Network; a standing minion
        group of *Street Toughs*.'
    - label: Abilities
      text: '**Call the Ward:** once per session he puts a hundred neighbours
        into the street within the hour, adding [[boost boost]] to
        Coercion and Charm checks against anyone who must go on living
        there. **Shut the Street:** he can close a market street or a row
        of workshops for a day, starving a rival''s trade and forcing the
        argument to happen on his terms.'
  - type: h4
    text: The Esquiline, Quirinal, Viminal & Caelian
  - type: p
    text: '**Faction hold.** Spectacle Enterprises hold this ground: the
      gladiatorial barracks (*ludi*) on the Caelian and the trainers who
      supply the games, set among the senatorial gardens (*horti*) that cover
      the Esquiline slopes. The lever is the arena — a *ludus* lends muscle
      for a bodyguard contract and fills a bench with its own men, and the
      *lanista* decides which names fight and therefore which names the crowd
      will shout. The ward organizations contest it in the crowded quarters
      below, where the barracks and the *vici* recruit from the same families.'
  - type: p
    text: These four vast crescent hills form the eastern residential and garden arc
      of Rome (*Regiones II, III, V, and VI*). The Esquiline is a district of stark
      contrasts, where the opulent suburban gardens (*horti*) of senators like Maecenas
      border ancient potteries and pauper burial trenches. The Quirinal is an ancient,
      respectable patrician ridge dotted with old Sabine shrines. The Viminal is a
      dense residential hill of modest craftsmen, while the Caelian is a greener hill
      housing wealthy mansions, foreign military camps (*Castra Peregrina*), and gladiatorial
      barracks.
  - type: p
    text: '**Notable Locations:** The *Horti Maecenatis* (Gardens of Maecenas on the
      Esquiline); the *Temple of Quirinus*; the *Baths of Titus* and *Baths of Trajan*;
      the *Castra Peregrina* on the Caelian (housing provincial soldiers and frumentarii
      secret police).'
  - type: p
    text: '**Flavor & Adventure Seeds:** Shaded porticos, marble fountains, and cypress
      groves overlook the crowded city center below; well-to-do equestrians stroll
      through quiet residential streets carried in curtained litters (*lecticae*).
      *Adventure Seed:* A fugitive provincial rebel seeks asylum in the foreign garrison
      on the Caelian Hill; imperial agents and local gladiators both converge on the
      block, and the PCs must extract him before blood is shed in the street.'
  - type: statblock
    name: Verax the Thracian
    kind: Nemesis
    desc: A captured warrior turned champion of the arena — the finest blade in the
      ludus, one great bout from the wooden sword of freedom. Courteous, patient,
      and lethal; the crowd screams his name.
    chars:
      Br: '4'
      Ag: '4'
      Int: '2'
      Cun: '3'
      Will: '4'
      Pr: '2'
    derived:
      Soak: '5'
      W.T.: '18'
      Def (M/R): 1/1
    fields:
    - label: Motivations
      text: 'Desire: the *rudis* — freedom. Fear: dying unremembered. Strength: unmatched
        skill of arms. Flaw: a debt of honour to a fellow fighter.'
    - label: Skills
      text: Melee 4, Brawl 3, Athletics 3, Coordination 2, Cool 3, Resilience 3.
    - label: Talents
      text: Adversary 3; Gladiatorial Training; Parry 3; Feint.
    - label: Abilities
      text: '**Showman''s Kill:** when he wins a melee check he may spend [[advantage]]/[[triumph]]
        to work the crowd, swinging the race-day/arena mood and the editor''s *missio*
        vote. **The Crowd''s Favorite:** so long as the mob loves him, even his master
        dares not simply dispose of him.'
  - type: statblock
    name: Hermogenes
    kind: Rival
    desc: A Greek physician of the Hippocratic schools, a freedman attached to a great
      house — and thus privy to every illness, pregnancy, poisoning, and deathbed
      secret under its roof. Indispensable, and therefore dangerous.
    chars:
      Br: '1'
      Ag: '3'
      Int: '4'
      Cun: '3'
      Will: '3'
      Pr: '2'
    derived:
      Soak: '2'
      W.T.: '12'
      Def (M/R): 0/1
    fields:
    - label: Motivations
      text: 'Desire: knowledge, and a patron worth serving. Fear: being blamed for
        a death. Strength: his masters'' lives are in his hands. Flaw: intellectual
        vanity.'
    - label: Skills
      text: Medicine 4, Knowledge (the Gods) 2, Knowledge (Rome) 2, Deception 2, Vigilance
        2, Cool 2.
    - label: Talents
      text: Adversary 1; superb Medicine; knows every house's secrets.
    - label: Abilities
      text: '**The Healer''s Hand:** removes [[setback]] from Medicine and may heal
        strain or wounds beyond a kit''s normal use. **He Knows What Ails the House:**
        a reservoir of intimate secrets — and the quiet skill to make a death look
        natural, should he choose.'
  - type: h4
    text: The Campus Martius
  - type: p
    text: '**Faction hold.** The Civic Priesthoods hold this ground alongside the
      voting enclosures: the augurs read the sky here, and the *Saepta Julia*
      gathers the tribes for elections. The lever is the sacred calendar and
      the assembly ground — an augur''s ruling can void a voting day, and the
      *Saepta* can be opened, closed, or filled with the right faces. The
      Circus factions contest it, leasing the theaters and stadium space and
      turning a political crowd into an audience that cheers on cue.'
  - type: p
    text: 'The broad alluvial plain enclosed by the western bend of the Tiber (*Regio
      IX Circus Flaminius*), the Campus Martius lies entirely outside the sacred pomerium.
      Originally the military muster ground dedicated to Mars, it has been transformed
      by Augustus and his successors into an extraordinary showcase of imperial monumental
      architecture: monumental marble porticos, grand public baths, theaters, and
      temples.'
  - type: p
    text: '**Notable Locations:** The *Pantheon* (the great domed temple of all gods);
      the *Theater of Pompey* (Rome''s first permanent stone theater, connected to
      a vast colonnaded park); the *Ara Pacis Augustae* (Altar of Augustan Peace);
      the *Mausoleum of Augustus*; the *Saepta Julia* (grand marble voting enclosure);
      the *Circus Flaminius*.'
  - type: p
    text: '**Flavor & Adventure Seeds:** Citizens exercise, wrestle, and throw javelins
      on the grassy field; thousands flock to theatrical pantomimes and gladiator
      displays; foreign diplomats and triumphing generals wait in the colonnades before
      receiving senatorial audiences. *Adventure Seed:* During an evening performance
      at the Theater of Pompey, an assassin strikes down a visiting Armenian princeling
      beneath the statue of Pompey; the party must pursue the hooded killer through
      the endless shadow of the colonnades.'
  - type: statblock
    name: Lucius Calpurnius
    kind: Rival
    desc: 'An augur of the college who reads the auspices for a fee, and sells the
      reading that suits the buyer. His ruling can void an assembly day, which
      makes him worth more than his modest fees suggest.'
    chars:
      Br: '1'
      Ag: '2'
      Int: '4'
      Cun: '4'
      Will: '4'
      Pr: '4'
    derived:
      Soak: 2
      W.T.: '12'
      S.T.: '17'
      Def (M/R): 0/1
    fields:
    - label: Motivations
      text: 'Desire: to be believed. Fear: a rival augur with better luck and a
        straighter face. Strength: he reads the sky and names the lawful
        day. Flaw: he will sell the same omen to the higher bidder.'
    - label: Skills
      text: 'Knowledge (the Gods) 4, Knowledge (Rome) 3, Charm 3, Deception 3,
        Discipline 3, Perception 3.'
    - label: Talents
      text: 'Adversary 1; Temple Acolyte; Nobody''s Fool.'
    - label: Abilities
      text: '**Read the Sky:** once per session, when a check would decide an
        assembly, an election, or a court day, he forces a reroll of that
        check and adds [[setback]] to the second result; the second result
        stands. **Ancestral Custom:** invoking *mos maiorum*, he adds
        [[boost boost]] to a social check against any magistrate or
        senator who claims to defend the old ways — and a [[despair]] on
        that check leaves the claim exposed as hollow.'
  - type: h4
    text: Transtiberim
  - type: p
    text: '**Faction hold.** The foreign enclaves and the maritime transport
      corporations (*corpora naviculariorum*) hold this ground: the
      synagogues, the Iseum, the mystery cells, and the dockers who unload the
      grain fleet. The lever is the cargo — a shipper''s clerk knows what came
      ashore and what was never entered in the customs ledger (*portorium*),
      and a diaspora congregation can hide a man or a crate for a week. The
      *vigiles* and the grain prefect (*praefectus annonae*) contest it,
      raiding the wharves and counting the *annona*''s sacks.'
  - type: p
    text: Lying across the Tiber on the river's right bank (*Regio XIV Transtiberim*),
      this vibrant, polyglot quarter is home to Rome's foreign communities, sailors,
      river-boatmen, and manual laborers. Connected to the city proper by the *Pons
      Fabricius*, *Pons Cestius*, and *Tiber Island*, Transtiberim smells of tanning
      vats, fish oil, and pitch. Syrian merchants, Jewish congregations, Egyptian
      cultists, and Spanish shipping agents live side-by-side in narrow brick tenements.
  - type: p
    text: '**Notable Locations:** The *Tiber Island* (*Insula Tiberina*, sanctuary
      of Aesculapius and hospital for the sick and enslaved); the *Iseum Campense*
      and foreign shrines; the river wharves and salt storehouses; the Jewish synagogue
      quarter near the riverbend.'
  - type: p
    text: '**Flavor & Adventure Seeds:** The babble of Greek, Aramaic, Punic, and
      Latin mixes in open-air markets; dockers hoist heavy amphorae from river barges;
      the sick sleep in the colonnades of Aesculapius hoping for healing dreams. *Adventure
      Seed:* A clandestine shipment of uninspected goods from Alexandria containing
      forbidden astrological texts is unloaded at the Transtiberim docks; the PCs
      are hired to secure the cargo before river customs vigiles confiscate it.'
  - type: statblock
    name: Thaïs of the Iseum
    kind: Nemesis
    desc: A freedwoman priestess of Isis who presides over the dockside temple and,
      through it, the right-bank trade in secrets, contraband, and foreign gods. Serene,
      generous, and utterly informed.
    chars:
      Br: '1'
      Ag: '2'
      Int: '3'
      Cun: '4'
      Will: '4'
      Pr: '4'
    derived:
      Soak: '2'
      W.T.: '14'
      S.T.: '16'
      Def (M/R): 0/1
    fields:
    - label: Motivations
      text: 'Desire: a sanctuary for her people and her goddess. Fear: a crackdown
        on “foreign superstition.” Strength: a web of dockers, sailors, and devotees.
        Flaw: she will risk much for a fellow worshipper.'
    - label: Skills
      text: Charm 3, Deception 3, Knowledge (the Gods) 3, Knowledge (Rome) 2, Streetwise
        3, Vigilance 2.
    - label: Talents
      text: Adversary 2; Nobody's Fool; a Web-of-Letters among the docks.
    - label: Abilities
      text: '**What Comes Ashore:** once per session she can tell you who shipped
        what, and when — or make a cargo quietly disappear. **The Goddess Sees:**
        in a [[Fated]] Rome her omens feed the party''s Story Points; her devotees
        will hide a hunted man.'
  - type: h4
    text: 'The Commercial Quarters: Boarium, Velabrum & Argiletum'
  - type: p
    text: '**Faction hold.** The Financial Interest holds this ground: the
      money-changers of the Forum Boarium, the *stationes* of the trade
      corporations, and the grain measurers (*mensores frumentarii*) of the
      Emporium. The lever is credit — a banker''s refusal freezes a cargo at
      the wharf, and the measurers'' tally decides what a shipload is worth
      before it is sold. The Subura wards contest it over market turf, taxing
      the stalls and the porters in the name of the *vicus*.'
  - type: p
    text: These three low-lying quarters form the commercial connective tissue of
      central Rome (*Regio XI Circus Maximus* and neighboring valleys). The *Forum
      Boarium* is the ancient cattle market beside the Tiber, home to the round Temple
      of Hercules Victor and the Temple of Portunus. The *Velabrum* is a bustling
      valley market of oil, cheese, and food merchants connecting the Forum to the
      river. The *Argiletum* is the famous trade avenue of scribes, copyists, shoemakers,
      and booksellers leading up toward the Subura.
  - type: p
    text: '**Notable Locations:** The *Temple of Hercules Victor*; the *Temple of
      Portunus*; the mouth of the *Cloaca Maxima* (the monumental vaulted sewer discharging
      into the Tiber); the *Emporium* river wharves; the booksellers'' stalls of the
      Argiletum.'
  - type: p
    text: '**Flavor & Adventure Seeds:** Butchers slice beef under wooden awnings;
      money-changers clink silver denarii and copper sestertii at wooden counters;
      wagons rattle through the Velabrum after sundown. *Adventure Seed:* Counterfeit
      imperial silver coins stamped with Trajan''s likeness begin circulating through
      the money-tables of the Forum Boarium; the PCs trace the illicit dies down into
      the brick tunnels of the Cloaca Maxima.'
  - type: statblock
    name: Tiberius Iunius
    kind: Rival
    desc: 'An *argentarius* of the Forum Boarium and broker of grain contracts,
      whose letters of credit clear payment from Ostia to Alexandria. He has
      never shipped a cargo in his life and knows the price of every one.'
    chars:
      Br: '1'
      Ag: '2'
      Int: '4'
      Cun: '4'
      Will: '3'
      Pr: '3'
    derived:
      Soak: 2
      W.T.: '12'
      S.T.: '16'
      Def (M/R): 0/1
    fields:
    - label: Motivations
      text: 'Desire: a ledger no patron can audit. Fear: a run on his bank that
        paper cannot cover. Strength: every great house''s signature sits
        in his strongbox. Flaw: he trusts a written contract more than any
        man.'
    - label: Skills
      text: 'Negotiation 4, Knowledge (Rome) 3, Knowledge (Law) 3, Cool 3,
        Deception 2, Perception 2.'
    - label: Talents
      text: 'Adversary 1; Publican''s Agent; a web of correspondents in Ostia
        and Alexandria.'
    - label: Abilities
      text: '**Freeze the Credit:** once per session he refuses a draft or
        calls in a loan under pressure; the target''s purchase, contract,
        or bribe fails, and their next Negotiation check in that market
        adds [[setback setback]]. **Letters of Credit:** a *nomen* he
        signs clears payment in any port where his correspondents keep a
        *statio*, so the party can carry a fortune across the
        Mediterranean as paper.'
  - type: h4
    text: The Circus Maximus
  - type: p
    text: '**Faction hold.** Spectacle Enterprises hold this ground: the four
      circus factions (*factiones*) under their equestrian contractors
      (*domini factionum*), the stables, and the betting rings that fill the
      arcades. The lever is the crowd — a faction that controls the day''s
      program controls what 150,000 people chant, and a rigged race settles a
      debt no court would hear. The senatorial order contests it, staging
      games for political capital and reminding the factions who holds the
      games'' budget.'
  - type: p
    text: The vast stadium filling the long valley between the Palatine and Aventine
      hills (*Regio XI Circus Maximus*), the Circus Maximus is the entertainment engine
      of Rome. Accommodating over 150,000 roaring spectators, its track surrounds
      a central barrier (*spina*) decorated with Egyptian obelisks and turning posts
      (*metae*). The exterior arcades are packed with cookshops, wine bars, fortune-tellers,
      betting syndicates, and prostitutes.
  - type: p
    text: '**Notable Locations:** The *Spina* with the central obelisk; the starting
      gates (*carceres*); the imperial box (*pulvinar*) connected directly to the
      Palatine palace; the *Factions Stables* (Blues, Greens, Reds, Whites).'
  - type: p
    text: '**Flavor & Adventure Seeds:** The earth rumbles as four-horse chariots
      (*quadrigae*) tear around the hairpin turns; thousands of spectators wave faction
      banners and chant faction slogans; betting tickets change hands in frantic betting
      rings. *Adventure Seed:* A star charioteer of the Green faction collapses minutes
      before the consular race, frothing at the mouth; the faction manager hires the
      PCs to find the Blue poisoner and protect the backup driver from being murdered
      on the track.'
  - type: statblock
    name: Eutyches the Green
    kind: Rival
    desc: The reigning charioteer of the Green faction — a slave-born idol worth more
      than a senator's estate, cheered by tens of thousands who would riot at his
      death. Fearless to the point of madness.
    chars:
      Br: '3'
      Ag: '4'
      Int: '2'
      Cun: '3'
      Will: '3'
      Pr: '3'
    derived:
      Soak: '3'
      W.T.: '15'
      Def (M/R): 1/1
    fields:
    - label: Motivations
      text: 'Desire: freedom, and to be remembered. Fear: the fall that cripples.
        Strength: the adoration of the mob. Flaw: recklessness.'
    - label: Skills
      text: Driving 4, Athletics 3, Coordination 3, Cool 2, Charm 2.
    - label: Talents
      text: Adversary 1; Full Throttle; Defensive Driving.
    - label: Abilities
      text: '**Darling of the Crowd:** at the Circus the faithful are his — his word
        can calm or inflame a crowd of thousands (feed or spend the race-day mood
        pool). **No Fear of the Turn:** he may suffer strain to attempt driving stunts
        no sane man would.'
  - type: h3
    text: Italy and the Heartlands
  - type: p
    text: '**Italia** is not a province; it is the citizen core of the empire. Exempt
      from land tribute and governed under Roman municipal law rather than a provincial
      magistrate''s arbitrary command, Italy supplies the legionary citizen recruits
      and the senatorial order itself. The peninsula is united by language, law, and
      an extraordinary network of paved consular roads.'
  - type: h4
    text: Ostia and Portus
  - type: p
    text: Located sixteen miles southwest of Rome at the mouth of the Tiber, Ostia
      and its sister harbor complex, Portus, constitute the logistical lifeline of
      the capital. Claudius and Trajan carved vast artificial harbor basins into the
      coast, protected by monumental breakwaters and an iconic multi-story lighthouse
      (*pharos*). Here fleets of merchant ships (*corbitae*) discharge grain from
      Egypt, wine from Baetica, and timber from Gaul into mammoth multi-story warehouses
      (*horrea*). Guilds of stevedores (*saccarii*), divers (*urinatores*), and boatmen
      (*lenuncularii*) maintain powerful political trade halls around Ostia's *Piazzale
      delle Corporazioni*.
  - type: h4
    text: The Campanian Coast & Baiae
  - type: p
    text: South of Rome along the Bay of Naples lies Campania, the favored playground
      of Rome's senatorial elite. Blessed with fertile volcanic soil, rich vineyards,
      and thermal sulfur springs, the coast is dotted with opulent seaside villas
      boasting private harbors, oyster beds, and marble dining terraces. At Baiae,
      Roman aristocrats and wealthy freedmen indulge in luxury, thermal sulfur baths,
      yacht parties, and scandalous gossip away from the watchful moral eyes of the
      city.
  - type: statblock
    name: Fortunata
    kind: Nemesis
    desc: The *vilica* — slave-manageress — of a senator's vast country estate. She
      runs the storehouses, the cult, the slave gangs, and the accounts while the
      master is in Rome; nothing enters or leaves without her tally.
    chars:
      Br: '2'
      Ag: '2'
      Int: '3'
      Cun: '4'
      Will: '4'
      Pr: '2'
    derived:
      Soak: '3'
      W.T.: '15'
      Def (M/R): 0/0
    fields:
    - label: Motivations
      text: 'Desire: to make the estate (and herself) indispensable. Fear: a new overseer.
        Strength: she holds the keys and the rationing. Flaw: she rules the slave
        quarters as her own fief.'
    - label: Skills
      text: Knowledge (Rome) 2, Coercion 3, Negotiation 2, Survival 3, Vigilance 3,
        Discipline 3.
    - label: Talents
      text: Adversary 2; Morning Clients (among the estate's hands and freedmen).
    - label: Abilities
      text: '**Keeper of the Stores:** she controls food, tools, and the slave gangs
        — on her ground, nothing is done without her leave. **The Estate''s Memory:**
        she knows every debt, grudge, and hidden cache on the land, and rations both
        grain and mercy as tools.'
  - type: h4
    text: Consular Roads and the Latifundia
  - type: p
    text: 'Italy is bound together by the great consular highways: the *Via Appia*
      (“Queen of Roads”) stretching southeast to Capua and the port of Brundisium;
      the *Via Flaminia* cutting north across the Apennines to the Adriatic; the *Via
      Aurelia* running along the Tyrrhenian coast to Gaul. Paved with polygonal basalt
      stones, equipped with milestones and imperial courier posting stations (*mansiones*),
      these roads allow couriers and legionary columns to move with unprecedented
      speed. The Italian countryside is dominated by *latifundia*, vast agricultural
      estates worked by enslaved gangs producing luxury olive oil, Falernian wine,
      and wheat for urban markets.'
  - type: h3
    text: The Provinces of the Empire
  - type: p
    text: 'To a Roman, a *provincia* was originally not a place but a **task** — a
      sphere of administrative command assigned by the Senate to a magistrate. Under
      the Principate, provinces are split into two constitutional types, plus Egypt
      as a special imperial domain:'
  - type: list
    items:
    - '**Senatorial (public) provinces** — peaceful, civilized inner provinces (such
      as Asia, Africa, Baetica, and Narbonensis) administered by ex-consuls or ex-praetors
      titled *proconsuls*. They hold no standing legions and report to the Senate.'
    - '**Imperial provinces** — strategic frontier and armed territories (such as
      Syria, the Germanies, Pannonia, and Britannia) under the emperor''s direct imperium,
      governed by hand-picked senatorial legates (*legati Augusti pro praetore*) commanding
      the legions.'
    - '**Equestrian procuratorships** — smaller, turbulent regions (such as Iudaea,
      Noricum, and Mauretania) governed by equestrian procurators or prefects backed
      by auxiliary cohorts.'
  - type: h4
    text: The Western Provinces
  - type: p
    text: '**Gallia & Hispania.** Gallia Narbonensis in the south is thoroughly Romanized,
      famed for its amphitheaters and aqueducts. Caesar''s Three Gauls (Aquitania,
      Lugdunensis, Belgica) face the Rhine, their warrior nobility integrated into
      provincial councils while ancient druidic traditions simmer under the surface.
      In Hispania, the southern province of Baetica exports thousands of amphorae
      of olive oil, while northern Tarraconensis and Lusitania hold the richest gold
      and silver hydraulic mines in the Roman world.'
  - type: p
    text: '**Britannia.** The wild, rain-swept northwestern frontier at the edge of
      the known world. Conquered a generation after Claudius, Britannia requires three
      full legions to hold Celtic tribes in check. Garrison forts like Londinium and
      Eburacum border rebellious mountain tribes, while druidic rites still echo in
      remote oak groves.'
  - type: statblock
    name: Esico
    kind: Rival
    desc: A druid of the old faith, hunted since Rome put the sacred groves to the
      torch. He keeps the memory of free Britain and the old gods alive among the
      tribes, and a Roman column has never yet caught him.
    chars:
      Br: '2'
      Ag: '3'
      Int: '3'
      Cun: '4'
      Will: '4'
      Pr: '3'
    derived:
      Soak: '3'
      W.T.: '14'
      S.T.: '16'
      Def (M/R): 1/1
    fields:
    - label: Motivations
      text: 'Desire: to drive Rome back into the sea. Fear: the last grove felled.
        Strength: the tribes'' faith and the land itself. Flaw: he will spend lives
        — others'' and his own — for the cause.'
    - label: Skills
      text: Knowledge (the Gods) 3, Survival 4, Stealth 3, Charm 2, Coercion 2, Vigilance
        3.
    - label: Talents
      text: Adversary 1; Master of the land; a hidden network of believers.
    - label: Abilities
      text: '**The Old Gods Watch:** in a [[Fated]] or [[Mythic]] Britannia his curses
        and omens bite — inflict fear or bank [[threat]] against those who defile
        the groves. **He Knows the Land:** on his own ground Rome''s soldiers suffer
        [[setback]] to track or corner him, and the tribes shelter him.'
  - type: p
    text: '**The Rhine & Danube Frontier.** The armed edge of the Roman world: *Germania
      Superior*, *Germania Inferior*, Pannonia, and newly conquered Dacia. This massive
      river cordon holds the highest concentration of Roman legions on earth. Massive
      stone fortresses (*castra*) anchor legionary bases, surrounded by bustling civilian
      settlements (*canabae*) of merchants, blacksmiths, and soldiers'' informal families.'
  - type: statblock
    name: Lucius Petronius
    kind: Nemesis
    desc: 'The *primus pilus* — first-spear centurion — of a frontier legion: thirty
      years under arms, the iron spine of the camp, more feared and obeyed than the
      young senators who nominally command him.'
    chars:
      Br: '4'
      Ag: '3'
      Int: '2'
      Cun: '3'
      Will: '4'
      Pr: '3'
    derived:
      Soak: '5'
      W.T.: '20'
      Def (M/R): 1/1
    fields:
    - label: Motivations
      text: 'Desire: the honour of the eagle, and a rich retirement. Fear: a broken
        line. Strength: the legionaries obey him before any tribune. Flaw: contempt
        for soft city politics.'
    - label: Skills
      text: Melee 3, Ranged 3, Discipline 4, Leadership 3, Coercion 3, Knowledge (Warfare)
        3, Resilience 3.
    - label: Talents
      text: Adversary 2; Field Commander; Commanding Presence.
    - label: Abilities
      text: '**The Spine of the Legion:** troops under his eye gain [[boost]] and
        resist fear; he turns a wavering line. **The Soldiers Are His:** in a crisis
        the men look to Petronius, not the aristocrat in the fine cloak — a quiet,
        dangerous fact on a frontier far from Rome.'
  - type: h4
    text: The East
  - type: p
    text: '**Macedonia, Achaea & Asia.** The ancient Hellenic heartland. Achaea and
      Macedonia live on the cultural prestige of Athens, Sparta, and Corinth—drawing
      Roman aristocrats for philosophy, rhetoric, and the Olympic Games. Across the
      Aegean lies Asia, a wealthy province of proud Greek metropolises (Ephesus, Pergamon,
      Smyrna) competing fiercely for imperial favor, temples, and trade privileges.'
  - type: p
    text: '**Syria.** Rome''s premier military bastion in the East. Holding four veteran
      legions and headquartered in luxurious, cosmopolitan Antioch, the governor of
      Syria guards the Euphrates frontier against Parthia and oversees the fabulously
      rich desert caravan trade passing through the oasis kingdom of Palmyra.'
  - type: statblock
    name: Zabdibel of Palmyra
    kind: Nemesis
    desc: A caravan-prince of the desert city, lord of the routes that bring silk,
      spice, and incense from the East. He commands his own armed caravan-guard and
      treats with Rome and Parthia as a power, not a subject.
    chars:
      Br: '3'
      Ag: '3'
      Int: '3'
      Cun: '4'
      Will: '3'
      Pr: '4'
    derived:
      Soak: '4'
      W.T.: '16'
      Def (M/R): 1/1
    fields:
    - label: Motivations
      text: 'Desire: to keep Palmyra free and rich between two empires. Fear: a frontier
        war that closes the routes. Strength: wealth, his caravan-guard, and both
        empires'' need of him. Flaw: he trusts no empire, and both know it.'
    - label: Skills
      text: Negotiation 3, Knowledge (Rome) 2, Streetwise 3, Ranged 3, Coordination
        2, Leadership 3, Survival 3.
    - label: Talents
      text: Adversary 2; Field Commander (his caravan-guard are a trained minion group).
    - label: Abilities
      text: '**Lord of the Routes:** he can move goods — or people — across the eastern
        desert where Rome''s writ fades, and knows what crosses the Parthian line.
        **A Prince, Not a Subject:** on his own ground his standing rivals a governor''s;
        slight him and the caravans simply stop coming.'
  - type: p
    text: '**Iudaea.** A turbulent equestrian procuratorship annexed after the Great
      Jewish Revolt of 70 CE, which left the Jerusalem Temple destroyed and the Tenth
      Legion Fretensis encamped among its ruins. Religious tension runs high between
      Roman authorities, Hellenized elites, and zealot factions awaiting divine deliverance.'
  - type: h4
    text: Africa and Egypt
  - type: p
    text: '**Africa Proconsularis & Numidia.** The rebuilt coastal plains of destroyed
      Carthage have become Rome''s southern granary and greatest producer of olive
      oil. Behind the coastal cities, legionary fortress towns like Lambaesis patrol
      the desert fringes against nomadic Berber and Garamantian raids.'
  - type: p
    text: '**Aegyptus.** The personal private domain of the emperor, treated as the
      personal estate of Caesar. No senator or prominent equestrian may set foot in
      Egypt without explicit imperial permission. The Nile''s annual flood guarantees
      massive wheat harvests that supply one-third of Rome''s grain dole. In the teeming
      Greek metropolis of Alexandria, scholars at the Great Museum debate philosophy
      while violent ethnic riots erupt between Greek, Jewish, and native Egyptian
      factions.'
  - type: statblock
    name: Zenon of Alexandria
    kind: Nemesis
    desc: A Greek *navicularius* (shipping magnate) whose grain fleet is a sizeable
      share of the dole that keeps Rome fed and quiet. Suave, cosmopolitan, and keenly
      aware that he holds the city's hunger in his holds.
    chars:
      Br: '1'
      Ag: '2'
      Int: '4'
      Cun: '4'
      Will: '3'
      Pr: '3'
    derived:
      Soak: '2'
      W.T.: '13'
      S.T.: '16'
      Def (M/R): 0/1
    fields:
    - label: Motivations
      text: 'Desire: profit and standing in two worlds. Fear: the emperor''s prefect,
        who can ruin him. Strength: he can speed or stall the grain fleet. Flaw: he
        plays Rome and Alexandria against each other.'
    - label: Skills
      text: Negotiation 4, Knowledge (Rome) 3, Deception 3, Charm 3, Coordination
        2, Vigilance 2.
    - label: Talents
      text: Adversary 2; a web of factors in every eastern port.
    - label: Abilities
      text: '**Hold of the City''s Hunger:** by hastening or delaying his fleet he
        can ease or inflame the Roman grain price — and the mob''s temper with it.
        **Two Worlds:** equally at home in the Museum and the Forum, he adds [[boost]]
        to cross-cultural social checks.'
  - type: p
    text: '**At the table.** Provinces are where political reputations are forged
      or destroyed. A governorship offers immense legal authority, enormous profit,
      and the perpetual danger of a trial for provincial extortion (*repetundae*)
      upon returning to Rome. On the frontier, provincial commands provide the military
      glory that can launch a bid for the purple.'
  - type: h3
    text: Beyond the Limes
  - type: p
    text: Beyond the fortified rivers, watchtowers, and palisades of the imperial
      frontier (*limes*) lies the barbarian world — uncharted forests, arid deserts,
      and rival civilizations that Rome has never subdued.
  - type: h4
    text: Germania Magna
  - type: p
    text: 'East of the Rhine and north of the Danube lies Free Germany: a dark, trackless
      expanse of primeval oak forests (*Silva Hercynia*), impassable peat bogs, and
      scattered timber villages. Germanic tribes such as the Cherusci, Chatti, Suebi,
      and Marcomanni acknowledge no central king. Bound by personal oaths to charismatic
      war-chiefs, their ferocious warriors fight with iron-tipped frameae spears and
      wooden shields, using devastating ambushes from forest tracks to slaughter invading
      Roman columns.'
  - type: h4
    text: Caledonia
  - type: p
    text: North of the Forth and Clyde estuaries in Britannia, the mist-cloaked mountains,
      peat moors, and deep lochs of Caledonia have resisted every Roman advance. The
      Caledonian tribes, fighting with long iron broadswords and light wicker shields,
      fight as guerrilla raiders. Their war-bands descend from highland strongholds
      in sudden raids against auxiliary outposts before vanishing into the mountain
      mists.
  - type: h4
    text: The Parthian Empire
  - type: p
    text: The Arsacid Empire of Parthia is Rome's only geopolitical equal on earth.
      Ruling Iran and Mesopotamia from their royal capitals of Ctesiphon and Seleucia,
      the Parthian Great Kings field an all-cavalry military machine that has crushed
      more than one Roman army. Their cataphracts charge in full-body scale armor
      with heavy lances, while waves of nimble horse-archers execute feigned retreats,
      turning in the saddle to deliver the deadly “Parthian shot.” The buffer kingdom
      of Armenia remains a perpetual flashpoint of war between the two empires.
  - type: h4
    text: The Garamantes & Trans-Saharan Routes
  - type: p
    text: Deep in the Libyan desert of the Fezzan dwell the Garamantes, a powerful
      Saharan civilization of oasis farmers and master caravan traders. Utilizing
      sophisticated subterranean irrigation tunnels (*foggara*), they cultivate lush
      desert oases and control the trans-Saharan trade routes. Their camel caravans
      bring rock salt, gold dust, carbuncle gemstones, enslaved captives, and captured
      exotic wild beasts (lions, leopards, and ostriches) north to Roman ports for
      the amphitheaters.
  - type: h4
    text: Serica and the Silk Routes
  - type: p
    text: At the furthest eastern horizon of Roman knowledge lies *Serica*, the mysterious
      land of silk, reached by overland caravan routes through Central Asia and by
      Roman merchant fleets sailing across the Erythraean Sea (Indian Ocean) to southern
      India. Roman gold denarii flow eastward by the millions in exchange for rolls
      of Chinese raw silk, Malabar black pepper, cinnamon, pearls, and precious gems.
      Roman sailors and merchants occasionally push as far as Kattigara and the courts
      of the East, bringing back tales of distant civilized realms.
  - type: h3
    text: Dramatis Personae
  - type: p
    text: 'The Roman world is shaped by extraordinary personalities whose decisions
      move legions, alter laws, and dictate the fortunes of millions. The figures
      below represent the defining leaders, thinkers, and cultural icons of the Imperial
      era (c. 100–120 CE), ready to serve as patrons, rivals, or background figures
      in a campaign. Game statistics for archetypal Romans, provincial adversaries,
      and legendary historical figures (including Caesar, Pompey, Cato, Clodius, and
      Augustus) are detailed in **Chapter 5: Adversaries**.'
  - type: h4
    text: Imperator Caesar Nerva Traianus Augustus (Trajan)
  - type: p
    text: The reigning emperor, officially hailed by the Senate as *Optimus Princeps*
      (“Best of Princes”). Born in Italica in Hispania Baetica, Trajan is Rome's first
      provincial emperor and a consummate military commander. Direct, energetic, and
      beloved by both the legions and the Senate, he has expanded the empire to its
      territorial zenith through his conquest of Dacia and his eastern campaigns.
      In Rome, he transforms the urban landscape with his monumental Forum, Market,
      and public baths.
  - type: h4
    text: Pompeia Plotina
  - type: p
    text: The Empress, wife of Trajan. Renowned for her philosophical austerity, dignified
      modesty, and keen intellect, Plotina exercises discreet but profound influence
      over imperial policy. An ardent patron of the Epicurean philosophical school
      in Athens, she promotes ethical governance, supports provincial tax relief,
      and plays a decisive role in securing the succession of young Hadrian.
  - type: h4
    text: Publius Aelius Hadrianus (Hadrian)
  - type: p
    text: Trajan's younger kinsman, distinguished general, and prospective heir. Cultured,
      restless, and deeply enamored with Greek arts and philosophy (earning the nickname
      *Graeculus*, “the little Greek”), Hadrian is equally at home inspecting cold
      legionary outposts on the Danube or debating geometry in Athens. Complex, brilliant,
      and unpredictable, he represents the future cosmopolitan direction of the Roman
      state.
  - type: h4
    text: Gaius Plinius Caecilius Secundus (Pliny the Younger)
  - type: p
    text: Consular senator, celebrated courtroom orator, and imperial legate to Bithynia-Pontus.
      Pliny embodies the civilized, conscientious senatorial aristocracy of the high
      Principate. Master of correspondence, benefactor of civic schools, and careful
      magistrate, Pliny consults Trajan on every detail of provincial administration,
      from municipal aqueduct debts to the handling of illicit Christian sects.
  - type: h4
    text: Cornelius Tacitus
  - type: p
    text: Consular senator, orator, and the preeminent historian of the Imperial age.
      Having lived through the reign of terror under Domitian, Tacitus writes with
      biting, surgical insight about the psychological realities of autocracy, political
      servility, and the corruption of power in the Senate. His works examine both
      the lost liberties of the Republic and the fierce, uncorrupted virtues of the
      German tribes.
  - type: h4
    text: Decimus Junius Juvenalis (Juvenal)
  - type: p
    text: The bitter, razor-sharp satirical poet of the Roman streets. Writing from
      a modest rented apartment, Juvenal skewers the moral pretensions of the nobility,
      the swagger of wealthy Greek and Eastern freedmen, the collapse of civic virtue
      into “bread and circuses” (*panem et circenses*), and the everyday hazards of
      city life — collapsing tenements, night muggings, and chamber pots dumped on
      passers-by.
- title: 'Chapter 5: Adversaries'
  blocks:
  - type: p
    text: 'The people, beasts, and historical figures the characters will face in
      the streets, courts, arenas, and frontiers of the Roman world. As in all Genesys
      settings, adversaries are organized by thematic category and classified by threat
      level: Minions who fight or work in groups, Rivals who act as competent individual
      opponents, and Nemeses who command organizations and drive campaigns.'
  - type: p
    style: body
    text: 'Faction opposition is scattered across these categories rather than gathered
      under one heading. The financial and commercial syndicates appear among the
      criminals and the elites, as syndicate factors and as the officials they own;
      the neighborhood wards and their *collegia* appear among the citizens and the
      criminals; the spectacle enterprises and the circus factions appear among the
      gladiators of the arena. The civic priesthoods appear among the elites, as do
      the foreign enclaves, the mystery cults, and the dissident cells; the
      aristocratic patronage blocs and the senatorial factions appear among the
      elites and again among the historical nemeses. Where a faction''s own agent is
      missing from these categories, the profiles below supply one.'
  - type: h3
    text: Citizens and Plebeians
  - type: p
    text: The common citizens of Rome — artisans, shopkeepers, philosophers, and matrons
      — form the human fabric of the capital. While individual plebeians are rarely
      warriors, their sheer numbers, political guilds (*collegia*), and legal rights
      make them a force that even emperors respect.
