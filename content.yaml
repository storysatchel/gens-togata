    kind: Nemesis
    desc: |-
      A knight who prosecutes for profit and has never lost a case brought under a sign from the gods. **Wants:** Mettius Varus's estate, and the emperor's attention, which is worth more. **Toward the PCs:** polite and generous; he would rather buy them than fight them. **Secret:** the bedchamber details in Phileros's story came from Callityche, whom he keeps at Fidenae, and his freedman took the dead girl's ornaments. **Voice:** “I accuse no one. I only make sure the gods are heard.”
