  - type: h2
    text: Beasts & Vehicles
  - type: p
    style: body
    text: Roman “vehicles” move by muscle and wind. Profiles use the standard Genesys
      vehicle format (Silhouette, Speed, Handling, Defense, Armor, Hull Trauma, System
      Strain). Mounts use the animal rules, reading a horse's “system strain” as its
      fatigue.
  - name: Racing Chariot (Biga / Quadriga)
    desc: 'A light wicker-and-wood car drawn by two or four horses for the *Circus
      Maximus*: fast, unprotected, and prone to the wreck (*naufragium*) the crowds
      adore. Models include the ash *biga* of the circus wheelwrights and the
      *quadriga* tuned by Green faction stable-masters.'
    fields:
    - label: Sil
      text: '2'
    - label: Speed
      text: '4'
    - label: Handling
      text: +1 (biga) / −1 (quadriga)
    - label: Def
      text: '0'
    - label: Armor
      text: '0'
    - label: HT
      text: '4'
    - label: SS
      text: '4'
    - label: Control Skill
      text: Driving
    - label: Complement
      text: 1 driver
    - label: Passengers
      text: 0–1
    - label: Enc Cap
      text: '2'
    - label: Price/Rarity
      text: 2,000 / 5
    - label: Weapons
      text: none (the driver carries a knife to cut the reins lashed to his waist).
    - label: Note
      text: On a despair the chariot overturns; the driver, reins bound to his body,
        is dragged (see Chariot Racing).
    type: statblock
  - name: Travel Carriage & Ox-Cart (Raeda / Plaustrum)
    desc: The four-wheeled *raeda* carried people and baggage along the great roads;
      the ox-drawn *plaustrum* hauled freight at a crawl. Slow, but the lifeblood
      of overland trade. Models include the Cisalpine carriage built by the guild of
      Mediolanum and the heavy baggage *plaustrum* on iron-rimmed wheels.
    fields:
    - label: Sil
      text: '2'
    - label: Speed
      text: '1'
    - label: Handling
      text: −2
    - label: Def
      text: '0'
    - label: Armor
      text: '0'
    - label: HT
      text: '7'
    - label: SS
      text: '3'
    - label: Control Skill
      text: Driving
    - label: Complement
      text: 1 driver
    - label: Passengers
      text: up to 6
    - label: Enc Cap
      text: '75'
    - label: Price/Rarity
      text: 1,500 / 2
    type: statblock
  - name: Liburnian (Light Galley)
    desc: The fast, two-banked warship that became the workhorse of the Imperial navy
      — patrol, anti-piracy, and dispatch. Drawn from the pirate craft of Illyria.
      Models include the patrol galley laid down at the naval shipyards of Misenum and
      the Illyrian cedar runner, still the fastest hull of the pattern.
    fields:
    - label: Sil
      text: '4'
    - label: Speed
      text: '4'
    - label: Handling
      text: '0'
    - label: Def
      text: '1'
    - label: Armor
      text: '2'
    - label: HT
