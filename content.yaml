- title: Starter Scenarios
  blocks:
  - type: p
    style: lead
    text: |-
      Six ready-to-run scenarios, each drawn from a real episode of Roman history, and each built in the three-act shape of a published one-shot: a **synopsis** for the GM, **acts** broken into scenes with *read-aloud* boxes, GM notes on “what's really going on,” suggested skill checks, and a **conclusion** with rewards. Adversaries refer to the stat blocks earlier in this book; a scenario's named villain gets a quick custom profile. Together they exercise the whole toolkit — intrigue and the Senate, the law-court, the burning city, the pontifical college, the treasury's seals, and the voting assembly — and lean hard on the social engine in *The Theater of Power.*
  - type: p
    style: small
    text: |-
      **On era:** scenarios I–III belong to the late Republic and early Empire (70–63 BCE and 64 CE); IV is set under Domitian (*c.* 90 CE), V under Trajan (*c.* 103 CE), and VI in the Republic (117 BCE), because only a Republican assembly voted on laws. IV–VI use original characters against a documented background. Run each in its own period, or shift the older ones into the default High Empire by swapping “consul” for “Prefect,” “Senate vote” for “the Emperor's council,” and the named historicals for original figures — the bones work in any Roman century. **Rewards** assume 15–20 XP per scenario and note Dignitas/Favor changes that feed the reputation economy.
  - type: scenario
    text: I. The Enemy Within
  - type: synopsis
    text: |-
      Rome, 63 BCE. A bankrupt, charismatic aristocrat — Lucius Sergius **Catilina** — is plotting to murder the consuls, burn the city, and cancel all debts in the chaos. The consul Cicero knows something is afoot but cannot prove it. The PCs are his agents (or the city's *tresviri*/watch). Over three acts they survive an assassination, spring a trap to seize written proof, and then win — or lose — the **Senate debate** that decides whether captured conspirators die without trial. A showcase for investigation, intrigue, and the Senate rules.
  - type: p
    style: act
    text: Act I — The Knock at Dawn
  - type: readaloud
    text: |-
      Before cock-crow, a hammering at the door. Your patron's man is breathless: “Two strangers came to kill the consul in his bed this very hour — turned away at the door. The master wants you. There is a plot, and he must have proof before the Senate will believe a word of it.”
  - type: p
    style: body
    text: |-
      The PCs are set to uncover Catiline's conspiracy. Starting threads: question the would-be assassins' contacts in the Subura; shadow known malcontents — indebted nobles and Sulla's dispossessed veterans; trace a rumor that the plotters mean to rise in **Etruria** under the old centurion **Manlius**.
  - type: p
    style: body
    text: |-
      **What's going on:** Catiline is real, the plot is real, but he is untouchable — a senator with friends — until the PCs produce *physical, written* evidence. Combat here is a street ambush by hired muscle (*Street Tough* minions, 1 *Bandit/Latro* rival) meant to scare the PCs off.
  - type: p
    style: body
    text: |-
      **A clue you cannot buy.** A **Vestal Virgin** carries an omen no bribe can reach: at a December sacrifice the altar-flame suddenly flares, and she reads it as a warning — word goes to a sympathetic magistrate (or the PCs) to strike *now*. In a [[Fated]] Rome the portent feeds the party's Story Point pool. (Historically, Vestals including Fabia — once tried for *incestum* with Catiline himself, and acquitted — did exactly this in 63 BCE.)
  - type: p
    style: act
    text: Act II — The Trap at the Bridge
  - type: p
    style: body
    text: |-
      The PCs learn the conspirators are courting a visiting embassy of the Gallic **Allobroges** — promising them debt relief for a rebellion in Gaul. The envoys are wavering. The play: persuade the Allobroges to turn double-agent and demand *signed letters* from the plotters as “proof of good faith,” then intercept those letters as the envoys leave the city by night over the **Mulvian Bridge**.
  - type: readaloud
    text: |-
      The torches of the envoys' escort bob toward the Mulvian Bridge. Somewhere in a saddlebag ride letters sealed with the rings of men who dine at the best tables in Rome — enough to hang them all. Across the span, you hear the escort's hooves slow. It is time.
  - type: p
    style: body
    text: |-
      **What's going on:** this is the historical masterstroke — the plot was broken by paperwork, not swords. Reward clever capture of the sealed letters; a botched grab means the PCs must testify on their own word in Act III, with every check upgraded.
  - type: p
    style: act
    text: Act III — The Senate Decides
  - type: p
    style: body
    text: |-
      With ringleaders arrested and the letters read aloud, one question remains and it tears the Senate apart: **execute Roman citizens without trial?** Run this as the Senate contest from *The Theater of Power.* Blocs: the *Hardliners* (behind Cato, for death), the *Moderates* (behind Caesar, for life imprisonment), and the *Undecided*. The PCs speak, sway blocs, and manage the trump cards.
  - type: readaloud
    text: |-
      Cicero yields the floor. A young Gaius Julius Caesar rises: “Death is a release from suffering, not a punishment… I propose their property be seized and their persons confined.” A cold silence — then Marcus Cato, on his feet, voice like a hammer: “We have talked long enough. While we debate, the enemy is at the gates. These men are traitors. Let them die as traitors.” Every eye turns to you.
  - type: p
    style: body
    text: |-
      **The choice:** there is no “correct” outcome. Execution ends the crisis but stains everyone who voted for it (history hounded Cicero into exile for exactly this). Clemency is lawful but leaves live enemies. Let the PCs own the consequence.
  - name: Lucius Sergius Catilina
    kind: Nemesis
    desc: |-
      Ruined nobility turned revolutionary — magnetic, fearless, genuinely dangerous. If cornered in Rome he flees to Manlius's army in Etruria, to die sword in hand at **Pistoria** (a climactic battle, if your group wants one).
    chars:
      Br: '3'
      Ag: '3'
      Int: '3'
      Cun: '3'
      Will: '3'
      Pr: '4'
    derived:
      Soak: '5'
      W.T.: '16'
      S.T.: '16'
      Def: 1/1
    fields:
    - label: Motivations
      text: 'Desire: power / to remake Rome. Fear: obscurity & debt. Strength: courage. Flaw: pride.'
    - label: Skills
      text: Charm 3, Coercion 3, Cool 2, Deception 2, Leadership 3, Melee 3, Knowledge (Rome) 2.
    - label: Talents
      text: Adversary 2; Demagogue; Scathing Tirade.
    - label: Equipment
      text: gladius, the loyalty of desperate men.
    - label: Dignitas 3
      text: (falling fast).
    type: statblock
  - type: p
    style: small
    text: |-
      **Rewards:** 20 XP. Exposing the plot with hard proof: +1 Dignitas and a powerful Favor from Cicero. Botching the proof or siding with the losing Senate bloc: no Dignitas, and a watchful enemy among the survivors.
  - type: scenario
    text: II. The Trial of the Governor
  - type: synopsis
    text: |-
      70 BCE. **Gaius Verres** has returned from three years as governor of Sicily, having stripped the province of its art, its grain, and its justice — crucifying even a Roman citizen who dared appeal. The wronged Sicilians have hired the PCs (or an advocate they serve) to bring him to court. But Verres is rich, his jury is buyable, and his agents are already silencing witnesses. Two acts: build the case, then win the trial. A pure showcase for the **courtroom** rules and the social engine. This is the archetypal *repetundae* (provincial-extortion) case before the *quaestio de repetundis*, brought — as such cases were — the year after his command ended. Cicero's real victory came not from a grand oration but from burying Verres under witnesses and documents before the delaying tricks could push the trial into next year's friendlier court; the jury's composition (senators vs *equites*) was itself a political prize.
  - type: p
    style: act
    text: Act I — Building the Case
  - type: readaloud
    text: |-
      Sicily remembers. In a dim Syracusan portico a shipowner shows you the whip-scars; a priest weeps over an empty plinth where a god once stood in bronze; a widow presses a tally-stick of stolen grain into your hand. “He took everything,” she says. “Make them listen in Rome.”
  - type: p
    style: body
    text: |-
      The PCs gather witnesses, documents, and stolen treasures to exhibit. Verres's men work against them: bribing officials to “lose” records, intimidating or buying off witnesses, and — if that fails — arranging accidents.
  - type: p
    style: body
    text: |-
      **What's going on:** every secured witness and exhibit is banked [[advantage]] for Act II; every one lost or discredited becomes a [[setback]] the defense will wield. Verres's strategy is delay — drag the trial past the holidays and into next year's friendlier court.
  - type: p
    style: act
    text: Act II — The Court
  - type: p
    style: body
    text: |-
      Run the trial as the **courtroom** set-piece. The jury (Hard audience, strain threshold 14; raise it for every juror Verres has bribed) must be driven past its threshold to convict. Verres's defense is led by the most famous advocate in Rome; the PCs (or their patron) prosecute.
  - type: readaloud
    text: |-
      The benches are packed; half of Rome has come to watch the great advocate defend the indefensible. He smiles at you across the court, utterly confident. Then you do the unexpected: instead of a grand opening oration, you simply call your first witness, and let Sicily speak for itself.
  - type: p
    style: body
    text: |-
      **What's going on:** as in history, overwhelming evidence can break a defendant's nerve before the verdict — if the PCs land a [[triumph]] Critical Remark or drive Verres himself past a personal strain threshold, he may bolt into **voluntary exile** (to Massilia, with his loot) rather than face the vote. A full conviction is possible but harder.
  - name: Gaius Verres
    kind: Nemesis
    desc: |-
      A plump, pleasure-loving plunderer who believes money can buy anything — because so far it always has.
    chars:
      Br: '2'
      Ag: '2'
      Int: '3'
      Cun: '4'
      Will: '2'
      Pr: '3'
    derived:
      Soak: '2'
      W.T.: '12'
      S.T.: '14'
      Def: 0/1
    fields:
    - label: Motivations
      text: 'Desire: wealth & comfort. Fear: poverty / ruin. Strength: cunning. Flaw: avarice.'
    - label: Skills
      text: Charm 2, Coercion 2, Deception 3, Negotiation 3, Knowledge (Law) 2, Knowledge (Rome) 2.
    - label: Abilities
      text: |-
        Deep Purse — may spend a Story Point to pre-bribe one juror (+[[setback]] to a prosecution appeal) or to buy a thug.
    - label: Dignitas 3.
      text: |-
        Defended by a Stoic Philosopher-style advocate (use that stat block as the opposing orator).
    type: statblock
  - type: p
    style: small
    text: |-
      **Rewards:** 15 XP. A conviction or a flight-into-exile: +1 Dignitas for the lead prosecutor and the gratitude (Favors) of a whole province. Losing a bought jury: the Sicilians are ruined, and the PCs have made a rich, vindictive enemy.
  - type: scenario
    text: III. The City Burns
  - type: synopsis
    text: |-
      Rome, July 64 CE. Fire erupts near the Circus Maximus and races through the tinder-dry tenements. For six days and seven nights it devours the city. The PCs — *vigiles*, or simply people caught in it — fight the flames, save who they can, and then confront the ugly aftermath: a terrified city demanding someone to blame, an Emperor under suspicion, and a convenient scapegoat in a small, strange sect. Three fast acts of disaster, investigation, and moral weight; a showcase for the watch, crowds, and hard choices.
  - type: p
    style: act
    text: Act I — The Red Night
  - type: readaloud
    text: |-
      You smell it before you see it — then the sky over the Circus goes orange, and the screaming starts. The fire is already in the shops under the stands, running on the wind faster than a man. Narrow streets choke with people and carts. Somewhere above you, a tenement block of five storeys begins to burn, and it is full of families.
  - type: p
    style: body
    text: |-
      A disaster set-piece: the PCs fight fire and save lives. Use skill challenges, not a monster to kill — the enemy is the blaze, the crowd, and the clock.
  - type: p
    style: act
    text: Act II — Ash and Rumor
  - type: p
    style: body
    text: |-
      The fire dies. In the smoking ruin, the city gropes for a reason. Three rumors spread like a second fire: that it was an accident (lamp-oil and wind); that criminals set it to loot; and — most dangerous — that the **Emperor himself** ordered it, to clear ground for a golden palace. The authorities need another answer, fast.
  - type: readaloud
    text: |-
      A magistrate's man finds you in the ash. “The Prefect wants the truth — or something that will pass for it before the mob turns on the Palatine. There's a sect down by the river. Foreigners. They talk of the world ending in fire and a kingdom not of Rome. People are already saying it was them. Go and… confirm it.”
  - type: p
    style: body
    text: |-
      **What's going on:** the PCs will find the Christians are innocent. The pressure to say otherwise — from a frightened Prefect, a *Delator* smelling reward, and a mob that wants blood — is enormous.
  - type: p
    style: act
    text: Act III — The Scapegoats
  - type: p
    style: body
    text: |-
      The choice lands. The sect is to be rounded up and butchered in the arena and the imperial gardens — burned as living torches — “as if they were to blame for the great fire.” The PCs can go along with the lie (safe, rewarded, complicit); expose the truth (dangerous — it points back at the Palatine); or try to get innocents out of the city before the arrests (a tense extraction).
  - type: p
    style: body
    text: |-
      **What's going on:** there is no clean win, which is the point. History records the slaughter went ahead, and even bloodthirsty Romans came to pity the victims. Let the PCs' courage or complicity echo — in their Dignitas, in who owes them, and in who now watches them.
  - type: p
    style: small
    text: |-
      **Adversaries:** the fire (environmental), *Street Tough* looters and *Urban Cohort* watchmen, a *Delator*, and a crowd run with the *Demagogue*/mob rules. **Rewards:** 15–20 XP scaled to lives saved in Act I. Saving the innocent at real risk: +1 Dignitas with those who value honor (and a dangerous secret about the fire's true cause). Taking the safe, complicit path: coin and a Favor from the Prefect — and a quiet 1-point loss of Dignitas among those who know what you did.
  - type: scenario
    text: IV. The Lightning Girl
  - type: synopsis
    text: |-
      Rome and the Alban Hills, autumn, c. 90 CE, in the reign of Domitian — who is also *Pontifex Maximus*, head of the college that judges the Vestal Virgins. A storm on the Via Appia below Bovillae kills a knight's fourteen-year-old daughter as she rides a horse loosed from the family carriage. The bolt strips her body bare and kills the horse. The priests read the omen as their predecessors did in 114 BCE: a virgin's vow has been broken, and a knight shares the guilt.{{1}} Two days later a slave comes forward and offers to swear that his own master and the Vestal **Numisia Procula** have been lovers, and he names others, among them the PCs' patron. **Stakes:** if the charge stands, a Vestal is buried alive by the Colline Gate and the men are beaten to death with rods. If it is false, an informer has used the city's fear of the gods to take rich men's estates. **Hook:** find out who coached the slave before he swears his statement to the college. **Tone:** grim and paranoid. Nobody can be trusted, and fear of the emperor decides as much as the evidence does. **Length:** one long session, or two if Act II is played in full. **Showcases:** investigation against a clock, the Favor economy, Cross-Examine, and the sacral trial from *The Theater of Power* (a courtroom where the pontifical college is the audience). Several endings are possible, and none is clean. The Chief Vestal Cornelia stays off-stage. She has been acquitted once already, and this affair can lead into her own second trial.
  - type: p
    style: act
    text: Act I — The Road Below Alba
  - type: readaloud
    text: |-
      The storm has passed by the time you reach the twelfth milestone. A carriage stands in the ditch with its traces cut. Twenty paces off, under a cloak someone has thrown over her, lies a girl. Her clothes, her sandals, and the gold at her throat were torn from her and scattered across the paving. Near her is a dead bay mare, its harness split and burnt. A haruspex in a fringed cloak is pacing out a square around the place with cord and stakes. A man in a knight's narrow-striped tunic kneels in the mud and does not look up. On the road behind you a rider is already heading for Rome.
  - type: p
    style: body
    text: |-
      **What's going on:** the strike was a real accident. The use being made of it was planned in advance. **Gaius Turpilius Naso**, an informer (*delator*) who prosecutes for a share of condemned men's estates, has kept a coached witness ready for months and was waiting for a public sign to use him. When word came from the Appia, Naso's freedman reported the prodigy to the consuls' office before the girl's own father could, and he handed the priests the 114 BCE precedent written out on a tablet. A second rider reached the body before the haruspex and took the girl's scattered ornaments. Naso wants them in case he needs a “sign” to show the college later. The girl is **Herennia Paulla**, and her father is the knight **Lucius Herennius Macer**. He is broken with grief and wants someone to pay for it.
  - type: p
    style: body
    text: |-
      **The informer.** At dusk on the second day, **Phileros**, door-slave (*ostiarius*) to the knight **Aulus Mettius Varus**, presents himself at the house of the promagister of the pontiffs. He says his master has visited the House of the Vestals at night for two years and lain with Numisia Procula, and that other men came too. He names the PCs' patron, the praetorian senator **Lucius Sabidius Gallus**, who is also Numisia's cousin. Under Roman law a slave could not ordinarily give evidence against his master, but incest was the exception.{{2}} His sworn statement to the college is set for the Nones, three days off.
  - type: p
    style: body
    text: |-
      **Routes in:** *the patron* — Sabidius Gallus calls the PCs in before dawn: “I am named. Find who taught that slave his lines before the pontiffs hear them.” *A named PC* — a PC of Dignitas 2–3 is one of the men Phileros named, and their own neck is at stake. *The father* — Herennius Macer hires the PCs to find “who defiled the gods.” They start on the prosecution's side and find the frame from the inside. *The Atrium* — the Vestal's steward calls in a Favor the PCs owe the order. *The watch* — *Urban Cohort* PCs are posted to guard the lightning-ground, or to escort the informer to the promagister.
  - type: p
    style: body
    text: |-
      **Checks.** *At the road:* an **Average** ([[difficulty difficulty]]) Medicine check reads the body. The branching burns and the shredded seams are the work of lightning, and of nothing else. With [[advantage advantage]], the PC sees that her necklace, ear-drops, and bulla are missing; they were picked up, not blown away. A **Hard** ([[difficulty difficulty difficulty]]) Perception check finds the second rider's hoofprints, which come and go before the haruspex's. An **Average** ([[difficulty difficulty]]) Knowledge (the Gods) check predicts the reading the priests will give: nakedness means a broken vow, and the horse means a knight. A [[triumph]] notices that the haruspex is reading the old precedent off a tablet someone handed him. *In the city:* an **Average** ([[difficulty difficulty]]) Streetwise or Knowledge (Rome) check finds out who reported the prodigy first. A **Hard** ([[difficulty difficulty difficulty]]) Charm check with Herennius Macer gets him to talk instead of strike. He says a well-dressed stranger offered him “justice for the girl” that same night.
  - type: p
    style: body
    text: |-
      **Complications:** a [[despair]] at the road makes Macer take the PCs for agents of the polluted. He is then a hostile witness in Act III, and he adds a [[setback]] to every defense appeal. Country people gather at the stakes, and pushing through them in a hurry provokes a *Street Tough*-grade crowd.
  - type: procedure
    title: 'The Expiation Clock (start at 1; Act III opens at 6)'
    steps:
    - |-
      **Ticks:** +1 for each day that passes (a major investigative scene takes half a day). +1 for each [[despair]] on a public-facing check. +1 when Naso learns the PCs are working against him. +1 when the GM reports a new prodigy (a mule foaling, blood in a spring at Lanuvium). **−1, once:** a PC arranges and pays for a public expiatory sacrifice through a friendly pontiff. This takes a **Hard** ([[difficulty difficulty difficulty]]) Knowledge (the Gods) check and a Favor of senatorial weight.
    - |-
      **2 — Suspension.** The college suspends Numisia from the rites and orders her to keep her household under her own authority, so that none of her slaves can be sold or freed out of reach of torture.{{3}} Lictors watch the Atrium. From now on her slaves can be put to the question.
    - |-
      **3 — The Question.** Phileros is examined under torture to “confirm” his statement, since Roman courts valued a slave's evidence only when it was taken that way. If the PCs have not reached him yet, he keeps to the coached story through the pain, and every later attempt to shake it is upgraded once.
    - |-
      **4 — The Turn.** The emperor moves the hearing from the Regia to his villa at Alba (see the Midpoint Turn).
    - |-
      **5 — Arrests.** Mettius Varus is seized. Sabidius Gallus's house is watched, and he must decide whether to stay or leave Rome. The Atrium is searched.
    - |-
      **6 — The college sits.** Act III begins whether or not the PCs are ready.
  - type: p
    style: body
    text: |-
      **Advances:** finding the missing ornaments or the early report points the PCs at Naso's household, and they skip the first lead in Act II. If they also get the precedent tablet, it is banked as a [[boost]] for Act III, because it proves the omen was interpreted for the priests in advance. Failing every check means the PCs reach Rome with the clock at 2 and Naso aware of them.
  - type: p
    style: act
    text: Act II — The Porter's Story
  - type: readaloud
    text: |-
      The room is a storeroom behind the promagister's kitchen, and it smells of lamp-oil and onions. The slave sits on a grain jar with his hands folded. His tunic is new and much too clean. He recites without being asked: “My master went out after the second hour of night. I kept the door. He came home before the bakers' fires. He told me, 'You saw nothing.' But I saw.” He stops, then goes on, as if picking up a line he had dropped. “Her coverlet was saffron. The lamp was shaped like a ship.”
  - type: p
    style: body
    text: |-
      **What's going on:** Phileros has never been inside the House of the Vestals. He is telling the truth about his master's late returns, but the bedchamber details were taught to him. They came from **Callityche**, a former hairdresser of the Atrium whom Numisia freed and dismissed last year, and whom Naso now keeps on a farm near Fidenae on the Via Salaria. Mettius Varus did go to the Atrium after dark, because he manages the leases on the order's shops along the Via Sacra and the Nova Via and settles the rents at the end of the day.{{4}} Phileros has his own reasons: his master sold his woman to a fuller in Ostia. Naso has promised him his freedom and a purse. Under Domitian, slaves who accused their masters were encouraged and paid.{{5}}
  - type: p
    style: body
    text: |-
      **Threads (any order; each costs half a day):** *The informer* — the PCs need access to Phileros. They can spend a Favor of a pontiff or senator, pass a **Hard** ([[difficulty difficulty difficulty]]) Negotiation check with the promagister **Aulus Didius Pollio**, or bribe a guard with a **Daunting** ([[difficulty difficulty difficulty difficulty]]) Deception or Skulduggery check. Questioning him uses *Cross-Examine* against his rehearsed story. The tell is that he can describe the inside of her chamber but not the Atrium's own porter's lodge, which he would have had to pass. *The Atrium* — Numisia's household receives callers by day. An **Average** ([[difficulty difficulty]]) Charm check with a slave girl brings out that Callityche came by last month asking after her old mistress's rooms. *The master* — Mettius Varus is terrified and close to running. With an **Average** ([[difficulty difficulty]]) Negotiation or **Hard** ([[difficulty difficulty difficulty]]) Skulduggery check the PCs get his rent tablets, which date every night visit to a settlement day. *The money* — a banker in the Basilica Julia (use *Caecilia Attica*) shows that Phileros's savings (*peculium*) doubled this month, paid in by one of Naso's freedmen. That takes a **Hard** ([[difficulty difficulty difficulty]]) Streetwise check, or a Favor. *Fidenae* — the farm is guarded by four *Street Tough* minions. Callityche is frightened and badly fed. A **Hard** ([[difficulty difficulty difficulty]]) Charm check, together with a real promise of safety, persuades her to say who taught her what to tell.
  - type: p
    style: body
    text: |-
      **Naso's offer.** Once the clock reaches 3, or as soon as Naso notices the PCs, he invites them to dinner and speaks plainly. He wants Mettius Varus's estate. The Vestal is “the price the gods have set.” The patron can be “forgotten” if the PCs give the college one more piece of corroboration, or hand him whatever the Atrium search would have turned up. This is how the complicit ending begins. Run it as a social encounter in which he tries to learn each PC's Desire.
  - type: p
    style: body
    text: |-
      **The Midpoint Turn (clock 4, or after the PCs crack their first thread):** two things happen together. *First*, a rumor arrives from the Palatine. The emperor will not let the college meet in the Regia, and has summoned it to his Alban villa, where the accused will be judged in her absence. Historically, this was how Cornelia was condemned.{{6}} *Second*, Sabidius Gallus admits something to the PCs. He did go to the Atrium at night once, to collect letters Numisia had written him. In them she mourned the Vestals Domitian condemned at the start of his reign and called the emperor's justice impious. Some letters are still hidden in her rooms. They prove nothing about incest, but they could be read as treason against the emperor (*maiestas*). From here on, saving the patron and saving the Vestal may pull in different directions. Gallus suggests two ways out. He could confess to something and take exile, as a man of praetorian rank once did in the Cornelia affair.{{7}} Or the PCs could break into the House of the Vestals and burn the letters. That is a **Daunting** ([[difficulty difficulty difficulty difficulty]]) Stealth or Skulduggery check and a sacrilege if they are caught.
  - type: p
    style: body
    text: |-
      **Advances:** each thread that is cracked is banked for Act III. Callityche's testimony is worth [[boost boost]] and flips the informer, so Phileros becomes a [[setback]] for the prosecution. The rent tablets and the banker's entries are worth [[boost]] each. A recantation obtained from Phileros himself is worth [[success]] on the first defense appeal, but the PCs must keep him alive until the hearing. Each thread left unworked is a [[setback]] the prosecution can use. If the letters are still in the Atrium at clock 5, Naso has them, and that opens his Act III trump.
  - type: p
    style: act
    text: Act III — The College at Alba
  - type: readaloud
    text: |-
      The villa sits above the lake on the slope of the Alban Mount, and from its terrace you can see the Appia running down toward Bovillae. The pontiffs have come in their purple-bordered togas. Some have come from Rome by litter, and others from their own villas nearby, and none of them wants to be here. There is no chair for the accused. A freedman of the household reads out the slave's statement from a tablet. At the head of the room the emperor's chair stands empty, but nobody in the room acts as though it were.
  - type: p
    style: body
    text: |-
      **What's going on:** run the hearing as the courtroom set-piece in its sacral form. The audience is the college, a **Daunting** body with a strain threshold of 18, and Knowledge (the Gods) is the *Logos* skill. Naso presents the witness. The emperor wants an example; he is the kind of ruler who believes that “exemplary severities of this kind conferred lustre upon his reign.”{{8}} *The Emperor's known wish* adds a [[setback]] to every defense check until the PCs break it, either with a [[triumph]] Critical Remark or by producing proof the college cannot pretend not to have heard. **Getting in:** Praetorians guard the villa. The PCs can get in with Pollio's goodwill (a Favor, or his capitulation in Act II), as the patron's companions if he chooses to appear, or with a **Daunting** ([[difficulty difficulty difficulty difficulty]]) Deception check. **Numisia cannot speak**, because she is not there. A written statement from her, obtained in Act II, is an [[boost boost]] *Ethos* appeal read aloud. By old custom, Vestals were heard in person in the Forum and the courts whenever they gave evidence. Under Tiberius, a woman of the palace who refused to come to court still had a praetor sent to her house to take her evidence. Those precedents give a PC a **Hard** ([[difficulty difficulty difficulty]]) Knowledge (Law) argument that the accused must at least be heard.{{9}} **Naso's trump:** if he has the letters, he reads them, and the college's strain threshold rises by 4 against the defense. **Filibuster** buys time but nothing else, since an empty chair cannot be talked into going home.
  - type: p
    style: body
    text: |-
      **Endings.** *Testimony broken:* Callityche testifies, or Phileros recants before the college. The college finds Numisia “not proven” and returns her to the fire. Naso is not punished; under this emperor, informers seldom were. He notes the PCs' names, and Phileros is sent back to the master he accused. Unless the PCs buy him and get him out of Rome, he will be crucified. *Vestal saved, patron sacrificed:* Sabidius Gallus takes the letters on himself and goes into exile on an island. Without a senator to frame, Naso drops the slave's statement for a share of Gallus's confiscated estate, and the incest charge collapses. *Complicit:* the PCs give Naso what he asked for. Numisia is carried bound in a closed litter to the field by the Colline Gate and goes down a ladder into a chamber with a lamp, bread, and water. The entrance is then filled in.{{10}} Cornelia, carried the same way, kept calling out: “Is it possible that Cæsar can think me polluted, under the influence of whose sacred functions he has conquered and triumphed?”{{11}} Mettius Varus is beaten with rods in the Comitium and cries out, as a knight once did there: “What have I done?—I have done nothing.”{{12}} The patron survives and owes the PCs, and he knows the price they paid. *The clock runs out:* if the PCs never reach the college, everyone Phileros named is condemned without being present or heard.
  - type: p
    style: body
    text: |-
      In a [[Fated]] or [[Mythic]] Rome, the omen may have been true and simply misread. Another Vestal really has broken her vow, and the prodigies continue whatever the college decides. Whether the gods accept the wrong victim is left to the GM. The record of Cornelia's own case is no clearer: the man who wrote it down could not say whether the woman buried was innocent or guilty.{{8}}
