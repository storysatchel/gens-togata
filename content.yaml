      text: 'Desire: wealth taken from other men''s ruin. Fear: an informer who is
        better than he is. Strength: patience. Flaw: he cannot stop collecting.'
    - label: Skills
      text: Charm 2, Coercion 3, Deception 4, Knowledge (Law) 3, Knowledge (the Gods)
        1, Knowledge (Rome) 2, Streetwise 2, Vigilance 2.
    - label: Talents
      text: Adversary 2; Cross-Examine; Nobody's Fool 1.
    - label: Abilities
      text: '**Dossier of Dirt** and **Denunciation** (as *Delator*). **The Coach:**
        while Phileros testifies where Naso can see him, Phileros adds [[boost]] to
        checks to hold his story. Getting Naso out of the room is a maneuver-sized
        problem worth solving.'
    - label: Equipment
      text: Wax tablets in a strap, gold equestrian ring, a freedman runner, four
        *Street Tough* minions at Fidenae.
    - label: Look
      text: Thin grey hair combed forward; clean-shaven, long-nosed, pleasant smile;
        narrow-shouldered; knight's narrow-striped tunic under a plain fine toga;
        tablets always in hand.
    - label: Standing
      text: Dignitas 2, and rising with every man he ruins.
  - type: statblock
    name: Phileros
    kind: Rival
    desc: A Bithynian-born door-slave who has spent eleven years at Mettius Varus's
      door, chained to it for the first three. **Wants:** his freedom, and the woman
      his master sold to Ostia. **Toward the PCs:** frightened and stubborn; he thinks
      they serve the people he has accused. **Secret:** he has never set foot in the
      House of the Vestals. Everything he says about the inside of it he learned word
      for word at Fidenae. **Voice:** “I keep the door. I see who comes and goes.
      That is what a door-slave is for.”
    chars:
      Br: '2'
      Ag: '2'
      Int: '2'
      Cun: '2'
      Will: '1'
      Pr: '2'
    derived:
      Soak: '2'
      W.T.: '11'
      S.T.: —
      Def (M/R): 0/0
    fields:
    - label: Motivations
      text: 'Desire: freedom. Fear: the rack. Strength: a doorkeeper''s memory for
        faces and hours. Flaw: he believes promises from anyone who holds power over
        him.'
    - label: Skills
      text: Cool 1, Deception 1, Perception 2, Vigilance 2.
    - label: Abilities
      text: '**Coached:** on the rehearsed points (the chamber, the coverlet, the
        lamp), upgrade the difficulty of checks to shake him once. Questions off the
        script are not upgraded. **True Hours:** what he says about his master''s
        comings and goings is accurate, and a PC who checks it against the rent tablets
        turns his own evidence against Naso. **The Question:** after torture (clock
        3) he suffers 4 wounds and will repeat the story only to Naso, or to someone
        who can guarantee his freedom.'
    - label: Equipment
      text: A new tunic Naso gave him; the porter's key on a cord.
    - label: Look
      text: Close-cropped hair growing out; broad flat face, wary eyes; thick neck
        and heavy hands; an undyed tunic too clean for him; a pale ring of old chain-scar
        around one ankle.
    - label: Standing
      text: Dignitas 0.
  - type: statblock
    name: Numisia Procula
    kind: Nemesis
    desc: A Vestal who entered the order at seven and has kept the fire for twenty-four
      years. She is second in rank to the Chief Vestal. **Wants:** to keep her order's
      honor and her own life, in that order. **Toward the PCs:** haughty; she will
      not plead, and she will not be touched. **Secret:** her letters to her cousin
      Sabidius Gallus mourn the Vestals the emperor condemned and call his justice
      impious. They do not show she broke her vow, but they could still kill her.
      **Voice:** “I have kept the fire twenty-four years. Ask the fire.”
    chars:
      Br: '1'
      Ag: '2'
      Int: '3'
      Cun: '3'
      Will: '4'
      Pr: '4'
    derived:
      Soak: '2'
      W.T.: '12'
      S.T.: '20'
      Def (M/R): 1/1
    fields:
    - label: Motivations
      text: 'Desire: the pax deorum and her order''s honor. Fear: the Campus Sceleratus.
        Strength: composure. Flaw: pride that will not ask for help.'
    - label: Skills
      text: Cool 3, Discipline 3, Knowledge (the Gods) 3, Knowledge (Law) 2, Knowledge
        (Rome) 3, Negotiation 2, Vigilance 2.
    - label: Talents
      text: Adversary 2; Nobody's Fool 2; Patronus.
    - label: Abilities
      text: '**Sacrosanct** and **Keeper of Wills** (as *Vestal Virgin*). **Suspended:**
        from clock 2 she loses *Sacral Authority* and cannot free or sell her slaves.
        **Will Not Plead:** checks to make her beg, flatter, or confess suffer [[setback
        setback]]. A written statement in her own words, if the PCs earn it, becomes
        an [[boost boost]] *Ethos* appeal for the defense.'
    - label: Equipment
      text: White stola and woollen fillets; a ring of bronze keys to the will-chests;
        a lictor (not present after suspension).
    - label: Look
      text: Hair cropped short beneath the woollen fillets; long pale face, still
        eyes; tall and very upright; the white veil pinned at the throat with a brooch;
        the keys at her belt.
    - label: Standing
      text: Dignitas 4 (suspended from 2 on the clock).
  - type: statblock
    name: Aulus Didius Pollio
    kind: Nemesis
    desc: Promagister of the pontifical college, the elderly senator who runs its
      business while the emperor holds the office of *Pontifex Maximus*. **Wants:**
      to get through the reign with the college's dignity and his own life intact.
      **Toward the PCs:** wary but persuadable; he dislikes informers almost as much
      as he fears the emperor. **Secret:** he sat with the college that acquitted
      the Chief Vestal Cornelia. The Palatine has made it clear the college was too
      lenient, and he needs either a conviction or an acquittal so well documented
      that nobody can call it lax. **Voice:** “The college does not hurry. The college
      is not permitted to be wrong.”
    chars:
      Br: '2'
      Ag: '1'
      Int: '4'
      Cun: '3'
      Will: '3'
      Pr: '3'
    derived:
      Soak: '2'
      W.T.: '11'
      S.T.: '16'
      Def (M/R): 0/0
    fields:
    - label: Motivations
      text: 'Desire: correct procedure, on the record. Fear: the emperor''s displeasure.
        Strength: he knows every precedent. Flaw: caution that can look like cowardice,
        and sometimes is.'
    - label: Skills
      text: Cool 3, Discipline 2, Knowledge (the Gods) 4, Knowledge (Law) 3, Knowledge
        (Rome) 3, Negotiation 2, Perception 2.
    - label: Talents
      text: Adversary 1; Nobody's Fool 2.
    - label: Abilities
      text: '**The College''s Door:** he decides who may address the college and in
        what order. With his goodwill the defense speaks first and gains [[boost]];
        without it, the defense is heard last and in writing only. **Precedent:**
        a defense argument backed by a precedent he respects upgrades the next *Logos*
        appeal, as *Narratio*. Examples are Postumia, acquitted and told to dress
        more soberly; Minucia, condemned on a slave''s word; and Licinia, acquitted
        by the pontiffs and then condemned by a special commission.'
    - label: Equipment
      text: Purple-bordered toga; tablets of precedents copied from the pontiffs'
        records; two household attendants.
    - label: Look
      text: Sparse white hair; heavy-lidded, deeply lined face; stooped and thin;
        purple-bordered toga worn carefully; a stack of tablets bound with a cord.
    - label: Standing
      text: Dignitas 4.
  - type: p
    style: small
    text: '**Adversaries:** *Lictor* and *Praetorian Guardsman* at the Atrium and
      the villa; *Street Tough* minions at Fidenae; use *Senator / Patrician* for
      Sabidius Gallus, and the same profile at Dignitas 2 for Mettius Varus and Herennius
      Macer. **Rewards:** 20 XP for a full run, 15 if the clock ran out. *Testimony
      broken:* +1 Dignitas for the PC who spoke before the college, a Favor from Numisia
      (the order keeps the wills of the great), and Naso''s lasting enmity; he begins
      the next scenario knowing a Flaw of each PC. *Vestal saved, patron sacrificed:*
      the Vestal''s Favor; the PCs lose their patron and the Favors he owed them,
      and Gallus''s clients turn to the PCs; no Dignitas change. *Complicit:* coin,
      and a Favor of senatorial weight from Gallus; −1 Dignitas among those who know,
      and Naso now holds something over the PCs. *The clock runs out:* −1 Dignitas
      for each named PC who stayed in Rome, the patron''s Favors are lost, and the
      PCs have an enemy in Herennius Macer for having stood with the condemned.'
  - type: scenario
    text: V. Before the Verdict
  - type: synopsis
    text: 'Rome, the ninth of November, c. 103 CE — the sixth year of Trajan. **Publius
      Caesellius Varus**, the PCs'' patron and lately proconsul of Crete and Cyrene,
      stands accused by the Cyrenaeans of extortion (*repetundae*). Like Marius Priscus
      three years earlier, he has asked the Senate only for judges to assess what
      he must repay: a ruinous fine, but one a man survives. The province''s advocates
      and an ambitious co-accuser mean to prove more — that he took money to condemn
      an innocent man — which would put him before the full Senate on a charge that
      can end in deportation to an island, the loss of his citizenship, and the confiscation
      of everything he owns.{{13}} The Senate decides on the **Ides** (13 November).
      Varus will not wait for the answer. In four days the PCs must move his silver,
      his household, his freedmen, and his records beyond the treasury''s reach —
      or slow the Senate down — before the seals go on his doors. The sailing season
      is already closing, and the last ship he can hire will not wait past the dawn
      after the Ides.{{14}} **The hook:** the PCs eat at his table; if he falls, so
      do they. **Tone:** a heist run through counting-rooms, wharves, and the Curia,
      and morally grey, because Varus may well be guilty. **Length:** two sessions
      (Acts I–II, then Act III), or one long one-shot if the PCs commit early to moving
      or to stalling. **Showcases:** Favors and *clientela*, the Senate contest and
      its Procedural Trump Cards, and a heist run against a clock. It does not re-run
      the extortion trial of Scenario II: it covers the days before any verdict.'
  - type: p
    style: act
    text: Act I — Four Days to the Ides
  - type: readaloud
    text: 'By the second hour the atrium of the house on the Esquiline is usually
      loud with clients. This morning you can count them: nine, standing apart, none
      quite meeting your eye. Your patron receives you in a dark, unwashed toga, hair
      and beard let grow as an accused man''s should. He takes you into the tablinum
      and draws the folding doors shut. “They mean to make it a matter of blood,”
      he says. “If the House lets them, I lose everything — and so does everyone who
      eats at my table. I do not intend to be in Rome when they count the votes.”'
  - type: p
    style: body
    text: '**What''s going on:** Varus took a great deal of money in Cyrenaica, as
      many governors did, and the province can prove much of it. A plain extortion
      verdict costs him repayment and his seat in the Senate. The danger is the second
      charge. **Aristion**, a councillor of Cyrene, was flogged and sent to the quarries
      on Varus''s sentence and died there; his brother says the sentence was bought.
      The accusers will cite the precedent set against Priscus, whose advocates told
      the House that “the crimes alleged against Priscus were of too atrocious a nature
      to fall within the cognizance of a commission; for he was charged with accepting
      bribes to condemn, and even to execute, innocent persons.”{{13}} If the Senate
      agrees that Varus''s case is of that kind, he faces a full hearing and the heavier
      penalties. **Relegation** (*relegatio*) sends a man away but leaves him his
      citizenship and his property; **deportation** (*deportatio*) to an island strips
      both, and his estate goes to the treasury.{{15}} The co-accuser, the junior
      senator **Aulus Fadius Crispinus**, wants the second outcome: accusers have
      long expected a share of a condemned man''s estate.{{16}}'
  - type: p
    style: body
    text: '**Why run, and why now.** Trajan has ruled that an absent man is not to
      be condemned on a criminal charge.{{17}} Flight therefore saves Varus''s person
      — but not what he leaves behind. Crispinus''s motion for the Ides asks the House
      both to send the case to a full hearing and to have the estate inventoried and
      sealed by the prefects of the Treasury of Saturn until it is heard. The Senate
      has pursued a governor''s estate before, even after the governor himself was
      beyond its reach.{{18}} Whatever is still in the house when the seals go on
      is lost. And even a lawful exile may keep only so much: no more than twenty
      slaves and freedmen, half a million sesterces, one merchant ship, and two oared
      boats.{{19}} Varus means to keep more than that, under other men''s names.'
  - type: p
    style: body
    text: '**The four holdings.** Track each one as **Exposed** (still in reach),
      **Secured** (moved or protected), or **Sealed** (lost to the treasury). Each
      Secured holding pays off in Act III; each Sealed one costs someone.'
  - type: list
    items:
    - '**The Silver** — about 1,200,000 sesterces in coin and plate in the strongroom,
      and a deposit of 800,000 with the banker **Lucius Cominius Hilarus** at his
      counter in the Forum.'
    - '**The Household** — sixty-odd slaves. Varus wants a dozen of the skilled and
      trusted ones freed or taken with him; the rest would go under the auctioneer''s
      spear with the house.'
    - '**The Freedmen** — eleven freedmen and their families live on his patronage.
      With him gone they have no protector against the accusers'' questions or their
      own creditors. Their chief is the steward, **Publius Caesellius Eutychus**.'
    - '**The Records** — the household accounts, the letter-boxes (*scrinia*) from
      the province, and Varus''s will.'
  - type: procedure
    title: The Seal Clock (eight segments)
    steps:
    - '**Ticks.** Tick 1 at the dawns of the tenth, eleventh, and twelfth. Tick 1
      when a move made in public fails, or when a check to stay unseen shows [[threat
      threat threat]]; tick 2 on a [[despair]]. Crispinus can tick it himself (see
      his profile).'
    - '**Unticks.** Remove 1 for each successful stall: a senatorial Favor spent to
      have the consuls put the motion late in the Ides'' business, where it may run
      out of daylight; Theochrestos persuaded to ask for more time; or the informer
      in the household exposed. A [[triumph]] on any of these removes 2.'
    - '**3 — Watchers.** Crispinus''s hired men and the Cyrenaeans'' own freedmen
      watch the house, the banker''s counter, and the Emporium wharves. Add [[setback]]
      to every check to move a holding unseen.'
    - '**5 — Information laid.** Crispinus reports concealed property to the treasury
      prefects. Hilarus, and every banker in the Forum, now refuses a large transfer
      without a [[triumph]] or a senator''s Favor. At Portus, the shipmasters have
      heard the name Varus.'
    - '**7 — The prefects move.** Public slaves of the treasury, with an *Urban Cohort*
      escort, are ordered to the house at the next dawn to begin the inventory.'
    - '**8 — Sealed.** Seals on the strongroom and the doors. Every holding not yet
      Secured becomes Sealed. Varus can now leave only by the night run in Act III.'
  - type: p
    style: body
    text: '**Routes in.** The PCs can come at the problem from any of these directions,
      in any order. Each takes roughly half a day; Varus wants all four holdings attended
      to and will not say which matters most.'
  - type: list
    items:
    - '**The strongroom and the daybook.** Eutychus opens the accounts. An **Average**
      ([[difficulty difficulty]]) Perception or Knowledge (Rome) check reconciles
      coin against the book. With [[advantage advantage]], a PC notices that entries
      for one season of the governorship have been struck out and that the series
      of tablets has a gap — the first sign of a second ledger.'
    - '**The banker''s counter.** Hilarus can move the 800,000 to a correspondent
      at Corinth by an entry in his books, with no coin on the road — but a banker
      must keep complete accounts and produce them when a court orders it, and he
      knows those entries are exactly what the treasury will ask for.{{20}} Persuading
      him is a **Hard** ([[difficulty difficulty difficulty]]) Negotiation check;
      add [[boost]] if Varus signs a sale on paper to cover the transfer, [[setback]]
      at clock 3 or higher. Success Secures half the Silver and leaves a written trail.'
    - '**The freedmen''s dinner.** Varus''s freedmen gather in the steward''s quarters,
      frightened. An **Average** ([[difficulty difficulty]]) Charm or Leadership check
      steadies them; a Knowledge (Law) check of the same difficulty explains their
      position: a patron and his freedman cannot be compelled to give criminal evidence
      against each other.{{21}} The law does not protect them from creditors or from
      losing his protection. Securing the Freedmen takes a new protector: a Favor
      spent with a friendly senator who will receive them as clients, or a **Hard**
      ([[difficulty difficulty difficulty]]) Negotiation check to win one.'
    - '**Watching the watchers.** An **Average** ([[difficulty difficulty]]) Streetwise
      check near the Cyrenaean embassy''s lodgings by the Porta Capena, or on the
      steps of the Temple of Saturn where the treasury sits, shows who calls on Crispinus.
      With success, the PCs learn that the household''s doorkeeper, **Callistus**,
      sells him the house''s comings and goings.'
    - '**Meeting the accuser.** **Theochrestos**, the dead man''s brother and the
      province''s envoy, agrees to see the PCs at his lodging. He wants Varus to admit,
      before the Senate, that the sentence was bought. He refuses a bribe outright.
      Money paid to the city of Cyrene as restitution is another matter — an **Average**
      ([[difficulty difficulty]]) Charm or Negotiation check, against his Discipline,
      keeps that door open.'
  - type: p
    style: body
    text: '**Complications.** A client turns up at the door demanding his *sportula*
      loudly enough for the street to hear (an **Easy** ([[difficulty]]) Charm check,
      or tick the clock). Varus''s wife, **Vettia Procula**, will not let her own
      silver leave the house unless she goes with it. A [[despair]] at the counter
      or the lodging means Crispinus hears of the visit the same hour.'
  - type: p
    style: body
    text: '**Advances:** Each holding the PCs have a plan for can be moved in Act
      II without a fresh approach. Noticing the gap in the tablets lets the PCs see
      the Turn coming and act before Eutychus does. Unmasking Callistus removes 1
      from the clock — or, better, lets the PCs feed Crispinus a false location (an
      opposed Deception check against his Vigilance); if it works, his next tick lands
      on an empty storeroom. Leaving Theochrestos respected keeps the settlement open
      in Act III; insulting him closes it and gives the prosecution [[boost]] on every
      *Pathos* appeal on the Ides. Freedmen left without a protector stay Exposed
      into Act III.'
  - type: p
    style: act
    text: Act II — Carts After Dark
  - type: readaloud
    text: Rome's carts move at night. From dusk the streets fill with the grind of
      iron tyres and the shouts of drivers backing mules into lanes too narrow for
      them. Below the Aventine the Emporium quays are dressed stone, with iron rings
      set in them for the mooring lines; the river barges lying against them each
      carry a single towing-mast stepped far forward. The barge-master lifts one of
      your amphorae, feels the weight of what is packed in the straw, sets it down,
      and names a price three times what wine would cost.
  - type: p
    style: body
    text: '**What''s going on:** wagons may not be driven in Rome''s streets from
      sunrise to the tenth hour of the day, except for public building work,{{22}}
      so a train of carts after dark draws no notice — unless it leaves the house
      of a senator under accusation. The Tiber barges (*naves codicariae*) that haul
      cargo up from Portus take up to three days against the current, towed by men
      and animals along the bank;{{23}} downstream, a barge cast off at midnight is
      at Portus by the next evening. There, **Zenon of Corinth**, master of the merchantman
      *Euploia*, will make one last run to the Isthmus and will not sail later than
      the dawn after the Ides. Run each holding as its own short operation over the
      nights of the tenth, eleventh, and twelfth.'
  - type: list
    items:
    - '**The Silver run.** Load quietly (an **Average** ([[difficulty difficulty]])
      Stealth check, [[setback]] at clock 3 or higher), drive it down the Vicus Patricius
      and around the Palatine to the Emporium (**Average** ([[difficulty difficulty]])
      Driving; a Vigilance check spots the night fire-patrol, *Urban Cohort / Vigil*
      minions, before they spot the carts), and strike a bargain with the barge-master
      (**Hard** ([[difficulty difficulty difficulty]]) Negotiation, or pay double
      and skip the check). Success Secures the strongroom''s half of the Silver. A
      [[despair]] breaks an axle at a corner with the watch in sight.'
    - '**The Household.** Freeing slaves informally, by a declaration among friends
      at dinner, makes them free in fact and costs nothing at law that day. A formal
      manumission before a praetor is public and quick to be noticed. Either way,
      a manumission made to defraud creditors is void,{{24}} and Crispinus will argue
      that the treasury is a creditor. Framing the manumissions as rewards for long
      service, with dated documents, takes a **Hard** ([[difficulty difficulty difficulty]])
      Knowledge (Law) check. Men fleeing a verdict have used this device before; whether
      the freed could make their freedom stick was never certain.{{25}} The grey part:
      Varus''s list frees his cook, his secretaries, and his physician. It leaves
      out the old, the field hands — and Eutychus''s own partner and children.'
    - '**The Records.** The accounts can be burned (a **Hard** ([[difficulty difficulty
      difficulty]]) Skulduggery check to do it without the neighbours smelling a whole
      archive going up), hidden in a friend''s house, or sent down the river with
      the Silver. They matter more than they look. Another governor was convicted
      largely because “there was found among his papers an account under his own hand
      of the several sums he had taken, and upon what occasions.”{{26}} The will can
      be lodged with the Vestals, who keep the wills of the great (see the *Vestal
      Virgin*''s Keeper of Wills); that Secures it beyond any prefect''s seal.'
    - '**The Freedmen, again.** Any freedman not yet given a new protector can be
      brought along — but every one counts against the twenty souls an exile may keep
      — or sent out of Rome to Varus''s friends in Campania (an **Average** ([[difficulty
      difficulty]]) Leadership check to get eleven frightened families moving by morning).'
  - type: p
    style: body
    text: '**The Turn — the second ledger.** On the night of the eleventh (or as soon
      as the clock reaches 4), Eutychus is gone. He has taken a small codex of wax
      tablets bound in boards: his own account, in his own hand, of 250,000 sesterces
      paid by **Ptolemaios son of Ptolemaios**, Aristion''s rival in the council of
      Cyrene, for Aristion''s sentence, and of how the money was passed through two
      estates to reach Varus. Varus is guilty. Eutychus''s price is the freedom of
      his partner **Chloe** and their two children, still Varus''s slaves, who will
      be sold with the house if it is sealed. He has gone to the Cyrenaeans'' lodging
      by the Porta Capena — or, if the PCs treated him with contempt in Act I, to
      Crispinus''s door. No court can make Eutychus testify against his patron. With
      the ledger, it does not need him to.'
  - type: p
    style: body
    text: '**The choice.** Finding him is an **Average** ([[difficulty difficulty]])
      Streetwise check. Then: **take it back by force** (two groups of *Street Tough*
      minions hired by Crispinus are on the same errand; a fight in a dark lane, or
      a **Hard** ([[difficulty difficulty difficulty]]) Stealth or Skulduggery check
      to lift the codex first); **buy Eutychus** by making Varus free Chloe and the
      children tonight (a **Hard** ([[difficulty difficulty difficulty]]) Negotiation
      or Coercion check against Varus, who counts slaves as silver); **let it go**
      to the accusers, which turns Act III from a fight over proof into a fight over
      the penalty; or **keep it** as a lever to force Varus into the settlement. Confronted,
      Varus does not deny it: “Every proconsul in that province sold something. I
      sold one man''s sentence to another man. Ask Cyrene how many councillors it
      has buried.”'
  - type: p
    style: body
    text: '**Complications.** Crispinus''s men watch the Emporium after clock 3 and
      try to stop a loaded barge at the quay (*Street Tough* minions, his freedman
      as their leader). The barge-master sells word of a second run to whoever pays
      him. November rain raises the Tiber, and a fast river adds [[setback]] to any
      Operating check to bring a barge off the quay at night. A [[despair]] on any
      run puts a holding''s location in Crispinus''s tablets: tick the clock, and
      that holding can be Sealed at clock 7 even if moved.'
  - type: p
    style: body
    text: '**Advances:** Count the holdings: each Secured one gives the PCs one banked
      [[boost]] in Act III, to be spent in the Curia or on the road. Whoever holds
      the ledger sets the shape of the Ides: in the PCs'' hands, it is a lever on
      Varus; in Theochrestos''s hands, the prosecution''s *Logos* appeals are upgraded
      once; in Crispinus''s hands, he opens the debate with [[boost boost]]. The clock''s
      position carries over: at 5 or more, the prefects are ready to seal the same
      day the motion passes; at 7 or more, they have already begun.'
  - type: p
    style: act
    text: Act III — The Ides
  - type: readaloud
    text: The Curia doors stand open to the Forum, and the November light falls across
      the floor in a long bar. The consul has read the province's complaint again.
      Down the benches the senators who used to dine with your patron look at their
      hands. Crispinus is already standing, a set of tablets held against his chest.
      At the far end, a tall Greek in an unbleached cloak, beard untrimmed for a dead
      brother, waits to be called. Somewhere across the river, a barge is waiting
      too, and a ship that will not wait past tomorrow's dawn.
  - type: p
    style: body
    text: '**What''s going on:** the Ides runs on two fronts, and a split party can
      play both. **The Curia, by day:** run the Senate contest from *The Theater of
      Power*. **The road to Portus, by night:** if Varus means to go, he goes tonight.
      First, Varus decides whether to attend. **Present**, he speaks in his own defence
      and his friends'' bloc gains [[boost]], but he must leave by the night run.
      **Already gone**, his side''s *Ethos* appeals suffer [[setback]] — flight reads
      as guilt — but the *notice* trump card below becomes available.'
  - type: p
    style: body
    text: '**The motions.** Three *sententiae* are on the floor. **(1)** The consul-designate''s:
      grant Varus judges to assess repayment only. **(2)** Crispinus''s, carried by
      a consular friend: a full hearing, the witnesses summoned, and the estate inventoried
      and sealed. **(3)** A middle course on the Priscus precedent, where the House
      first granted judges provisionally and summoned the men said to have bought
      innocent blood:{{27}} judges for now, Ptolemaios summoned from Cyrene, and no
      seals today. Motion 3 buys Varus a winter; it does not acquit him.'
  - type: list
    items:
    - '**The Consulares** (weight 3, threshold 12). Desire: the House''s authority
      over its own members. Fear: a precedent that lets a governor buy a death and
      pay a fine for it. Lean toward motion 3.'
    - '**Varus''s friends** (weight 2, threshold 8). Desire: to protect one of their
      own. Fear: being named accessories, as the governor''s go-between was in Priscus''s
      case. Lean toward motion 1. If the ledger is in the accusers'' hands, their
      threshold drops by 4.'
    - '**The Emperor''s men** (weight 2, threshold 10). Desire: a reign seen to punish
      rapacious governors. Fear: being seen to bring back the informers. Undecided.'
    - '**The back-benchers** (*pedarii*, weight 3, threshold 10). They follow seniority.
      When the Consulares commit, the back-benchers suffer 4 strain toward the same
      side.'
  - type: procedure
    title: Trump Cards on the Ides
    steps:
    - '**Serve notice on the accused.** If Varus is absent, any senator may demand
      that he be formally summoned to answer; in Priscus''s case such a demand put
      the matter over to the next meeting.{{28}} An **Average** ([[difficulty difficulty]])
      Knowledge (Law) check and a consular''s Favor; success postpones motions 1–3
      and removes 2 from the clock — but Crispinus may still ask for the seals as
      an interim measure, and that runs as a short contest of its own.'
    - '**Divide the house.** When the harsh motion and the middle motion are counted
      together against the lenient one, insist on separate counts. The presiding consul
      calls the division with a set form: “You who are of such an opinion, come to
      this side; you who are of any other, go over to the side of him whose opinion
      you follow.”{{29}} A **Hard** ([[difficulty difficulty difficulty]]) Knowledge
      (Law) check, and an *Ethos* appeal to the consul himself, gets the three counted
      apart; the motion with the most committed weight then wins on its own.'
    - '**Talk out the day.** *Filibuster* as usual: a decree of the Senate made after
      sunset is not valid.{{30}} A filibuster kills the vote and the seals with it
      — and leaves Varus''s ship sailing at dawn without a decision behind it.'
    - '**The Emperor''s known wish.** The new reign made a public show of punishing
      the informers of the last one.{{31}} If a PC proves that Crispinus prosecuted
      under Domitian, his side suffers [[setback]] and he must pass a **Hard** ([[difficulty
      difficulty difficulty]]) Discipline check or withdraw as co-accuser. The wish
      cuts both ways: if the ledger is read aloud, every appeal for motion 1 suffers
      [[setback]].'
    - '**The consuls'' chairs.** At the division the senior men take their places
      first, and waverers drift to whichever side they stand on.{{32}} A PC with Dignitas
      3 or more who crosses the floor early adds [[boost]] to their side''s next appeal
      to the back-benchers.'
  - type: p
    style: body
    text: '**The road to Portus.** Out over the river by the Pons Aemilius, through
      Transtiberim, and some twenty miles of the Via Portuensis in the dark. An **Average**
      ([[difficulty difficulty]]) Driving or Riding check covers the road; a Vigilance
      check spots the *Urban Cohort* post or Crispinus''s men before they see the
      carriage. At the post by the river, a **Hard** ([[difficulty difficulty difficulty]])
      Deception or Negotiation check gets through — or a Coercion check that leans
      on a senator''s rank ([[boost]] for Dignitas 3 or more, as for any check that
      leans on standing), which works only until the seal order exists. At the quay,
      Zenon has heard that a senator may not leave Italy without the emperor''s leave,
      except for Sicily and Narbonese Gaul.{{33}} He wants a **Hard** ([[difficulty
      difficulty difficulty]]) Negotiation check or a fifth of what is aboard.'
  - type: p
    style: body
    text: '**Endings.** Combine as the dice fall; none of them is clean.'
  - type: list
    items:
    - '**Gone, with the silver.** Varus is aboard the *Euploia* at dawn with every
      Secured holding. Trajan''s ruling protects his person; his Italian lands and
      anything Sealed go on the treasury''s register. He will live at Athens on money
      held in his freedmen''s names. Freedmen left behind without a protector face
      creditors and questions alone.'
    - '**Relegated, solvent.** If the PCs broker it with Theochrestos, Varus stays,
      admits the extortion and the bought sentence, repays the Cyrenaeans, pays the
      price of Aristion''s sentence into the treasury, and accepts banishment from
      Italy — what the Senate imposed on Priscus. He keeps his citizenship and the
      rest of his estate, and his freedmen keep their patron. Crispinus gets nothing.'
    - '**Sealed.** Motion 2 passes with the holdings still Exposed. The prefects inventory
      the house; the slaves are sold at the treasury''s auction, Chloe and the children
      among them unless someone buys them first. Varus can still run, poor, or stay
      to be deported.'
    - '**Read into the record.** The ledger is read in the Curia. Varus faces a full
      hearing; present, he will likely be deported; absent, his estate is held against
      his return. Theochrestos has what he came for.'
    - '**The informer falls.** Crispinus is exposed and withdraws. His motion loses
      its advocate and the Emperor''s men harden against it — but the province''s
      case goes on, honestly, and Varus''s guilt is unchanged.'
  - type: statblock
    name: Publius Caesellius Varus
    kind: Rival
    desc: 'The PCs'' patron: a praetorian senator of fifty-five, able, generous to
      his people, and a governor who sold a man''s death. **Wants:** to leave Rome
      with his fortune, and to be remembered as a man who looked after his own. **Stance:**
      depends on the PCs utterly and says so; he gives orders as favors. **Secret:**
      the bought sentence, recorded in Eutychus''s ledger. **Voice:** “I have fed
      your families for twelve years. I am asking for four days.”'
    chars:
      Br: '2'
      Ag: '2'
      Int: '3'
      Cun: '3'
      Will: '2'
      Pr: '3'
    derived:
      Soak: '2'
      W.T.: '12'
      S.T.: —
      Def (M/R): 0/0
    fields:
    - label: Motivations
      text: 'Desire: wealth kept. Fear: poverty in exile. Strength: generosity to
        his own. Flaw: avarice.'
    - label: Skills
      text: Charm 2, Deception 2, Knowledge (Law) 2, Knowledge (Rome) 3, Leadership
        2, Negotiation 3.
    - label: Talents
      text: Adversary 1.
    - label: Abilities
      text: '**A Proconsul''s Seal:** his signet and letters add [[boost]] to checks
        with bankers and shipmasters — until the Seal Clock reaches 5, when his name
        adds [[setback]] instead. **Counts Slaves as Silver:** checks to make him
        free anyone not on his own list are **Hard** ([[difficulty difficulty difficulty]])
        at least.'
    - label: Equipment
      text: Signet ring, strongroom key on a cord, letters of credit drafted on a
        banker at Corinth.
    - label: Standing
      text: Dignitas 4 — for now.
    - label: Look
      text: Grey hair and a week's grey beard grown out in mourning; heavy jowls going
        slack under the stubble; broad build gone soft; a dark, unwashed toga; the
        signet he turns on his finger while he talks.
  - type: statblock
    name: Aulus Fadius Crispinus
    kind: Nemesis
    desc: A quaestorian senator of forty, co-accuser (*subscriptor*) beside the province's
      advocates, and a man who learned his trade under Domitian. Use the *Delator
      (Informer)* as his base. **Wants:** an informer's share of Varus's estate, to
      clear his own debts. **Stance:** courteous to the PCs and quietly building a
      case that they are Varus's accessories. **Secret:** he prosecuted two senators
      under Domitian, and under Trajan that record could finish him. **Voice:** “I
      accuse no one. I only ask the House to count what is in the strongroom before
      it walks to the river.”
    chars:
      Br: '2'
      Ag: '2'
      Int: '3'
      Cun: '4'
      Will: '3'
      Pr: '3'
    derived:
      Soak: '2'
      W.T.: '12'
      S.T.: '15'
      Def (M/R): 0/0
    fields:
    - label: Motivations
      text: 'Desire: wealth. Fear: his past under Domitian. Strength: patience. Flaw:
        debt.'
    - label: Skills
      text: Charm 2, Coercion 3, Deception 3, Knowledge (Law) 3, Knowledge (Rome)
        2, Streetwise 2, Vigilance 2.
    - label: Talents
      text: Adversary 1; Cross-Examine; Nobody's Fool 1.
    - label: Abilities
      text: '**Dossier of Dirt** (as the Delator). **Laying Information:** once per
        session, he may spend a Story Point to tick the Seal Clock once, naming a
        holding he has located. **The Old Reign:** see *The Emperor''s known wish*
        on the Ides.'
    - label: Equipment
      text: Wax tablets with an inventory of Varus's house bought from the doorkeeper;
        two groups of hired *Street Tough* minions led by his freedman; a creditor's
        letter he keeps hidden.
    - label: Standing
      text: Dignitas 2.
    - label: Look
      text: Black hair oiled flat; a smooth, pleasant face with a ready smile; slight
        and neat; a very white toga with the narrow senatorial stripe; a stylus always
        in his hand.
  - type: statblock
    name: Publius Caesellius Eutychus
    kind: Rival
    desc: Varus's freedman and steward for twenty years, who keeps every account in
      the house. **Wants:** freedom for his partner Chloe and their two children,
      still his patron's slaves. **Stance:** loyal and frightened; he will help the
      PCs as long as they treat his family as people, and he notices if they do not.
      **Secret:** the second ledger, kept as insurance since the governorship. **Voice:**
      “The master promised them their freedom every Saturnalia for six years. I wrote
      it down each time, like everything else.”
    chars:
      Br: '2'
      Ag: '2'
      Int: '3'
      Cun: '3'
      Will: '2'
      Pr: '2'
    derived:
