  - type: h3
    text: Beasts & Vehicles
  - type: p
    style: body
    text: |-
      Roman “vehicles” are drawn by muscle and wind. The profiles below use the standard Genesys vehicle format (Silhouette / Speed / Handling, Defense, Armor, Hull Trauma and System Strain thresholds). Mounts use the simplified animal rules; treat a horse's “system strain” as its fatigue.
  - name: Racing Chariot (Biga / Quadriga)
    desc: |-
