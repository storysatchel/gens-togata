      text: Adversary 1; Cross-Examine; Nobody's Fool 1.
    - label: Abilities
      text: |-
        **Dossier of Dirt** (as the Delator). **Laying Information:** once per session, he may spend a Story Point to tick the Seal Clock once, naming a holding he has located. **The Old Reign:** see *The Emperor's known wish* on the Ides.
    - label: Equipment
      text: Wax tablets with an inventory of Varus's house bought from the doorkeeper; two groups of hired *Street Tough* minions led by his freedman; a creditor's letter he keeps hidden.
    - label: Standing
      text: Dignitas 2.
    - label: Look
      text: Black hair oiled flat; a smooth, pleasant face with a ready smile; slight and neat; a very white toga with the narrow senatorial stripe; a stylus always in his hand.
  - type: statblock
    name: Publius Caesellius Eutychus
    kind: Rival
    desc: |-
      Varus's freedman and steward for twenty years, who keeps every account in the house. **Wants:** freedom for his partner Chloe and their two children, still his patron's slaves. **Stance:** loyal and frightened; he will help the PCs as long as they treat his family as people, and he notices if they do not. **Secret:** the second ledger, kept as insurance since the governorship. **Voice:** “The master promised them their freedom every Saturnalia for six years. I wrote it down each time, like everything else.”
    chars:
      Br: '2'
      Ag: '2'
      Int: '3'
      Cun: '3'
      Will: '2'
      Pr: '2'
    derived:
      Soak: '2'
      W.T.: '11'
      S.T.: '—'
      Def (M/R): 0/0
