  - type: h3
    text: Beasts & Vehicles
  - type: p
    style: body
    text: |-
      Roman “vehicles” are drawn by muscle and wind. The profiles below use the standard Genesys vehicle format (Silhouette / Speed / Handling, Defense, Armor, Hull Trauma and System Strain thresholds). Mounts use the simplified animal rules; treat a horse's “system strain” as its fatigue.
  - name: Racing Chariot (Biga / Quadriga)
    desc: |-
      A light wicker-and-wood car drawn by two or four horses, built for the *Circus Maximus*: terrifyingly fast, almost no protection, and prone to the spectacular wreck (*naufragium*) that the crowds adore.
    fields:
    - label: Sil
      text: '2'
    - label: Speed
      text: '4'
    - label: Handling
      text: +1 (biga) / −1 (quadriga)
    - label: Def
      text: '0'
    - label: Armor
      text: '0'
    - label: HT
      text: '4'
    - label: SS
      text: '4'
    - label: Control Skill
      text: Driving
    - label: Complement
      text: 1 driver
    - label: Passengers
      text: 0–1
    - label: Enc Cap
      text: '2'
    - label: Price/Rarity
      text: 2,000 / 5
    - label: Weapons
      text: none (the driver carries a knife to cut the reins lashed to his waist).
    - label: Note
      text: |-
        On a despair at speed, the chariot may overturn — the driver, reins bound to his body, is dragged (see Chariot Racing, GM Advice).
    type: statblock
  - name: Travel Carriage & Ox-Cart (Raeda / Plaustrum)
    desc: |-
      The four-wheeled *raeda* carried people and baggage along the great roads; the ox-drawn *plaustrum* hauled freight at a crawl. Slow, but the lifeblood of overland trade.
    fields:
    - label: Sil
      text: '2'
    - label: Speed
      text: '1'
    - label: Handling
      text: −2
    - label: Def
      text: '0'
    - label: Armor
      text: '0'
    - label: HT
      text: '7'
    - label: SS
      text: '3'
    - label: Control Skill
      text: Driving
    - label: Complement
      text: 1 driver
    - label: Passengers
      text: up to 6
    - label: Enc Cap
      text: '75'
    - label: Price/Rarity
      text: 1,500 / 2
    type: statblock
  - name: Liburnian (Light Galley)
    desc: |-
      The fast, two-banked warship that became the workhorse of the Imperial navy — patrol, anti-piracy, and dispatch. Drawn from the pirate craft of Illyria.
    fields:
    - label: Sil
      text: '4'
    - label: Speed
      text: '4'
    - label: Handling
      text: '0'
    - label: Def
      text: '1'
    - label: Armor
      text: '2'
    - label: HT
      text: '20'
    - label: SS
      text: '12'
    - label: Control Skill
      text: Operating
    - label: Complement
      text: ~2 officers, 80 rowers & marines (minion groups)
    - label: Passengers
      text: 40 troops
    - label: Enc Cap
      text: '150'
    - label: Price/Rarity
      text: — / 7 (R, military)
    - label: Weapons
      text: |-
        Bronze ram (fore; Gunnery; Dam 20; Crit 3; Range [Engaged]; Breach 2, Massive 1, Slow-Firing — requires a ramming maneuver). May mount 1–2 light ballistae (see below).
    type: statblock
  - name: Trireme (War Galley)
    desc: |-
      The classic three-banked galley of Mediterranean warfare — a floating battering-ram crewed by free oarsmen (Rome, unlike legend, rarely used slave rowers in its war fleets).
    fields:
    - label: Sil
      text: '5'
    - label: Speed
      text: '3'
    - label: Handling
      text: −1
    - label: Def
      text: '1'
    - label: Armor
      text: '3'
    - label: HT
      text: '35'
    - label: SS
      text: '20'
    - label: Control Skill
      text: Operating
    - label: Complement
      text: ~15 officers & sailors, 170 rowers, 40 marines (minion groups)
    - label: Enc Cap
      text: '300'
    - label: Price/Rarity
      text: — / 8 (R, military)
    - label: Weapons
      text: |-
        Bronze ram (fore; Gunnery; Dam 25; Crit 2; Range [Engaged]; Breach 3, Massive 2, Slow-Firing). Deck ballistae and a boarding-bridge (corvus) optional.
    type: statblock
  - name: Merchantman (Corbita)
    desc: |-
      The broad-bellied sailing freighter that carried Egyptian grain to feed the million mouths of Rome. Slow, unarmed, and a pirate's dream.
    fields:
    - label: Sil
      text: '5'
    - label: Speed
      text: '1'
    - label: Handling
      text: −2
    - label: Def
      text: '0'
    - label: Armor
      text: '1'
    - label: HT
      text: '30'
    - label: SS
      text: '10'
    - label: Control Skill
      text: Operating
    - label: Complement
      text: ~10 crew
    - label: Passengers
      text: 100+ (deck)
    - label: Enc Cap
      text: 2,000
    - label: Price/Rarity
      text: 40,000 / 4
    type: statblock
  - name: Warhorse / Riding Horse
    desc: |-
      Rome fought mainly on foot, but cavalry — auxiliary and allied — scouted, pursued, and flanked. Remember: no stirrups, so mounted fighting is harder than later eras.
    fields:
    - label: Sil
      text: '1'
    - label: Speed
      text: 3–4
    - label: Handling
      text: '+0'
    - label: Def
      text: '0'
    - label: Armor
      text: '0'
    - label: HT
      text: 5–7
    - label: Control Skill
      text: Riding
    - label: Enc Cap
      text: '25'
    - label: Price/Rarity
      text: 500 (riding) – 2,500 (warhorse) / 2–4
    - label: Note
      text: |-
        Without stirrups, upgrade the difficulty of melee checks made from horseback once unless the rider has a relevant talent or racial training.
    type: statblock
  - type: sidebar
    title: Siege Engines
    body:
    - |-
      **Scorpio** (bolt-thrower): Gunnery; Dam 10; Crit 2; Range [Extreme]; Pierce 3, Prepare 1. **Ballista:** Dam 12; Crit 3; Range [Extreme]; Breach 1, Cumbersome 4, Prepare 2. **Onager** (stone-thrower): Dam 18; Crit 4; Range [Extreme]; Blast 8, Breach 2, Cumbersome 5, Prepare 3, Limited Ammo — by stones at hand. Each legion fielded dozens of the lighter engines.
- title: Adversaries
  blocks:
  - type: p
    style: lead
    text: |-
      The people and beasts the characters will face, from the city watch to the war-band beyond the Rhine. As usual, scale an encounter by swapping Minion / Rival / Nemesis versions and adjusting ranks of *Adversary*. Characteristics are listed Brawn / Agility / Intellect / Cunning / Willpower / Presence.
  - type: h3
    text: The State & the Legions
  - name: Legionary
    kind: Minion
    desc: |-
      The professional heavy infantryman of a citizen legion: drilled, armored, and deadly in a block. Alone he is formidable; eight of him are a wall.
    chars:
      Br: '3'
      Ag: '2'
      Int: '2'
      Cun: '2'
      Will: '2'
      Pr: '2'
    derived:
      Soak: '7'
      W.T.: '5'
      Def (M/R): 1/0
    fields:
    - label: Skills (group only)
      text: Athletics, Discipline, Melee, Ranged (Light)
    - label: Abilities
      text: |-
        Shield Wall: while two or more legionaries are engaged together, each gains +1 melee defense.
    - label: Equipment
      text: |-
        Gladius (Melee; Dam 6; Crit 2; Pierce 1), 2 pila (Ranged [Light]; Dam 5; Crit 3; Short; Pierce 2), scutum (+1 def), lorica segmentata & galea (+2 soak, included).
    type: statblock
  - name: Auxiliary Archer
    kind: Minion
    desc: |-
      Non-citizen troops — Syrian, Cretan, or Balkan bowmen who gave the legions their missile reach.
    chars:
      Br: '2'
      Ag: '3'
      Int: '2'
      Cun: '2'
      Will: '2'
      Pr: '2'
    derived:
      Soak: '4'
      W.T.: '4'
      Def (M/R): 0/0
    fields:
    - label: Skills (group only)
      text: Ranged (Heavy), Survival, Vigilance
    - label: Equipment
      text: |-
        Composite bow (Ranged [Heavy]; Dam 7; Crit 3; Medium; Unwieldy 2), lorica hamata (+2 soak), dagger.
    type: statblock
  - name: Urban Cohort / Vigil (City Watch)
    kind: Minion
    desc: |-
      Rome's watchmen and firefighters — part police, part fire brigade. They keep order in the streets with clubs and buckets, and answer to the Urban Prefect.
    chars:
      Br: '2'
      Ag: '2'
      Int: '2'
      Cun: '2'
      Will: '2'
      Pr: '2'
    derived:
      Soak: '3'
      W.T.: '4'
      Def (M/R): 0/0
    fields:
    - label: Skills (group only)
      text: Brawl, Coercion, Perception, Vigilance
    - label: Abilities
      text: |-
        Sound the Alarm: once per encounter, a vigil may summon another watch minion group that arrives in two rounds.
    - label: Equipment
      text: Club (Brawl; Dam 4; Crit 5; Disorient 1), staff, fire-bucket & grapnel, leather (+1 soak).
    type: statblock
  - name: Centurion
    kind: Rival
    desc: |-
      The hard professional at the heart of the legion — promoted from the ranks, feared by his men, and carrying the vine-staff with which he beats them into line.
    chars:
      Br: '3'
      Ag: '2'
      Int: '2'
      Cun: '3'
      Will: '3'
      Pr: '3'
    derived:
      Soak: '8'
      W.T.: '16'
      Def (M/R): 1/0
    fields:
    - label: Skills
      text: |-
        Coercion 2, Cool 2, Discipline 3, Leadership 2, Melee 3, Ranged (Light) 2, Vigilance 2, Knowledge (Warfare) 2
    - label: Talents
      text: |-
        Adversary 1 (upgrade combat checks against him once); Centurion's Command (Maneuver: Average Leadership — allies within short range may take an immediate maneuver per success); Testudo.
    - label: Equipment
      text: |-
        Gladius (Dam 6; Crit 2; Pierce 1), vine-staff (vitis; Melee; Dam 4; Crit 5; Disorient 1), scutum (+1 def), transverse-crested galea & lorica (+2 soak, included).
    type: statblock
  - name: Praetorian Guardsman
    kind: Rival
    desc: |-
      The Emperor's household soldier: elite, pampered, and — when the price is right — a maker and unmaker of emperors.
    chars:
      Br: '3'
      Ag: '3'
      Int: '2'
      Cun: '2'
      Will: '3'
      Pr: '2'
    derived:
      Soak: '7'
      W.T.: '15'
      Def (M/R): 1/0
    fields:
    - label: Skills
      text: Brawl 2, Cool 2, Discipline 3, Melee 3, Ranged (Light) 2, Vigilance 3
    - label: Talents
      text: |-
        Adversary 1; Quick Strike (add [[boost]] to combat checks against targets that have not yet acted).
    - label: Equipment
      text: |-
        Gladius (Dam 6; Crit 2; Pierce 1), ornate scutum (+1 def), lorica (+2 soak), concealed pugio (Dam 4; Crit 3; Accurate 1).
    type: statblock
  - name: Praetorian Prefect
    kind: Nemesis
    desc: |-
      Commander of the Guard and often the second most powerful man in the Empire — Sejanus is the cautionary tale. He rarely draws a sword; he arranges for others to.
    chars:
      Br: '3'
      Ag: '3'
      Int: '3'
      Cun: '3'
      Will: '3'
      Pr: '3'
    derived:
      Soak: '7'
      W.T.: '18'
      S.T.: '16'
      Def (M/R): 1/1
    fields:
    - label: Skills
      text: |-
        Coercion 3, Cool 2, Deception 2, Discipline 3, Leadership 3, Melee 3, Ranged (Light) 2, Vigilance 3, Knowledge (Rome) 2, Knowledge (Warfare) 2
    - label: Talents
      text: |-
        Adversary 2; Imperator (allies within short range add [[boost]] to Discipline/Cool/fear checks); Field Commander (Maneuver: Average Leadership lets 3 allies take an immediate maneuver).
    - label: Abilities
      text: |-
        Command the Guard: once per encounter, summon a minion group of Praetorians (minions equal to the PCs) that arrives at the end of the round.
    - label: Equipment
      text: Gilded armor (+2 soak), gladius (Dam 6; Crit 2; Pierce 1), the Emperor's ear.
    type: statblock
  - name: Senator / Patrician
    kind: Nemesis
    desc: |-
      Among the richest men alive: lawmaker, patron, and intriguer. His weapons are the law, the dinner-party, the mob, and the hired knife — never his own hand.
    chars:
      Br: '2'
      Ag: '2'
      Int: '3'
      Cun: '3'
      Will: '3'
      Pr: '4'
    derived:
      Soak: '2'
      W.T.: '12'
      S.T.: '18'
      Def (M/R): 1/1
    fields:
    - label: Skills
      text: |-
        Charm 3, Coercion 2, Deception 3, Discipline 2, Knowledge (Law) 2, Knowledge (Rome) 3, Leadership 2, Negotiation 3
    - label: Talents
      text: |-
        Adversary 2; Nobody's Fool 2 (remove up to 2 [[setback]] from checks to deceive/coerce him); Scathing Tirade (Improved) (Average Coercion: enemies in short range suffer strain and add [[setback]] to checks).
    - label: Abilities
      text: |-
        Clientela: a Senator travels with a minion group of 2–4 clients/bodyguards. Let’s Make a Deal: if he knows an opponent’s Desire, when he inflicts strain on them they suffer 3 additional strain.
    - label: Equipment
      text: |-
        Toga & signet ring, concealed dagger, a purse that opens any door in Rome, bodyguards (use Bodyguard or Gladiator).
    type: statblock
  - name: Lictor
    kind: Rival
    desc: |-
      The magistrate's official attendant and enforcer, bearing the *fasces* — the bundle of rods and axe that is the naked symbol of the state's power to flog and behead.
    chars:
      Br: '3'
      Ag: '2'
      Int: '2'
      Cun: '2'
      Will: '2'
      Pr: '2'
    derived:
      Soak: '4'
      W.T.: '12'
      Def (M/R): 0/0
    fields:
    - label: Skills
      text: Coercion 2, Discipline 2, Melee 2, Vigilance 2
    - label: Talents
      text: Adversary 1.
    - label: Abilities
      text: |-
        By the Magistrate’s Authority: add [[boost]] to Coercion checks made to compel citizens in the magistrate’s name.
    - label: Equipment
      text: Fasces (Melee; Dam 5; Crit 3; Vicious 1), leather (+1 soak).
    type: statblock
  - type: h3
    text: The Arena & the Underworld
  - name: Gladiator (Murmillo)
    kind: Rival
    desc: |-
      The heavy ‘fish-man’ of the sand: big shield, short sword, crested helm. A crowd favorite built to grind down flashier opponents.
    chars:
      Br: '3'
      Ag: '2'
      Int: '2'
      Cun: '2'
      Will: '2'
      Pr: '3'
    derived:
      Soak: '5'
      W.T.: '14'
      Def (M/R): 1/0
    fields:
    - label: Skills
      text: Athletics 2, Brawl 2, Cool 2, Coordination 2, Melee 3, Resilience 2
    - label: Talents
      text: Adversary 1; Gladiatorial Training (sword); Arena Showmanship.
    - label: Equipment
      text: |-
        Gladius (Dam 6; Crit 2; Pierce 1), great shield (+1 def), manica (Defensive 1), galea (+1 soak).
    type: statblock
  - name: Gladiator (Retiarius)
    kind: Rival
    desc: |-
      The net-fighter: lightly armored, fast, and tricky, trying to tangle a heavier foe and finish him with the trident.
    chars:
      Br: '2'
      Ag: '3'
      Int: '2'
      Cun: '3'
      Will: '2'
      Pr: '2'
    derived:
      Soak: '3'
      W.T.: '12'
      Def (M/R): 0/0
    fields:
    - label: Skills
      text: Athletics 2, Coordination 3, Cool 2, Melee 3, Ranged (Light) 2, Vigilance 2
    - label: Talents
      text: Adversary 1; Net and Trident.
    - label: Equipment
      text: |-
        Fuscina (trident; Dam 4; Crit 3; Defensive 1, Pierce 1), rete (net; Ensnare 2, Knockdown), manica & shoulder-guard (galerus; +1 soak).
    type: statblock
  - name: Lanista / Crime Boss
    kind: Nemesis
    desc: |-
      Owner of a gladiator school or boss of a *collegium* gang — a dealer in violence who profits whether his fighters live or die, and whose reach runs through every tavern and dockside in the district.
    chars:
      Br: '3'
      Ag: '2'
      Int: '2'
      Cun: '4'
      Will: '3'
      Pr: '3'
    derived:
      Soak: '4'
      W.T.: '16'
      S.T.: '16'
      Def (M/R): 0/1
    fields:
    - label: Skills
      text: |-
        Coercion 3, Deception 2, Melee 2, Negotiation 2, Streetwise 3, Discipline 2, Knowledge (Rome) 2
    - label: Talents
      text: |-
        Adversary 1; Threaten 2 (after an ally is damaged, suffer 3 strain to inflict 4 strain on the attacker).
    - label: Abilities
      text: |-
        Criminal Assets 3: accompanied by a minion group of 3 (thugs or gladiators) at short range; may redirect a hit to one of them, eliminating it. Bribe: if cornered, offers up to 20,000 HS to walk free.
    - label: Equipment
      text: |-
        Flagellum (whip; Ensnare 1, Disorient 1), concealed dagger, strongbox, a stable of fighters.
    type: statblock
  - name: Street Tough / Collegia Thug
    kind: Minion
    desc: |-
      The muscle of the tenement districts: a gang member who smashes windows, collects ‘protection,’ and swings the vote at election time with fists.
    chars:
      Br: '2'
      Ag: '2'
      Int: '2'
      Cun: '3'
      Will: '1'
      Pr: '2'
    derived:
      Soak: '3'
      W.T.: '4'
      Def (M/R): 0/0
    fields:
    - label: Skills (group only)
      text: Brawl, Coercion, Melee, Streetwise
    - label: Equipment
      text: Cudgel (Brawl; Dam 4; Crit 5; Disorient 1), knife (Dam 3; Crit 3), ragged tunic.
    type: statblock
  - name: Bandit / Latro
    kind: Rival
    desc: |-
      Deserter, runaway, or desperate provincial turned highway robber. The roads between cities are only as safe as the nearest patrol.
    chars:
      Br: '2'
      Ag: '3'
      Int: '2'
      Cun: '3'
      Will: '2'
      Pr: '2'
    derived:
      Soak: '4'
      W.T.: '12'
      Def (M/R): 0/0
    fields:
    - label: Skills
      text: Coercion 2, Melee 2, Ranged (Light) 2, Stealth 3, Streetwise 2, Survival 2
    - label: Talents
      text: Adversary 1.
    - label: Abilities
      text: 'Ambush: add [[boost]] [[boost]] to the first check against a surprised target.'
    - label: Equipment
      text: Sword or spear (Dam 5–6; Crit 2–4), sling or bow, leather (+1 soak), stolen goods.
    type: statblock
  - name: Pirate
    kind: Rival
    desc: |-
      Though Pompey had broken the great pirate fleets, raiders still haunted the eastern seas and river deltas, preying on grain ships and coastal towns.
    chars:
      Br: '3'
      Ag: '3'
      Int: '2'
      Cun: '2'
      Will: '2'
      Pr: '2'
    derived:
      Soak: '4'
      W.T.: '12'
      Def (M/R): 0/0
    fields:
    - label: Skills
      text: Athletics 2, Coordination 2, Melee 2, Operating 2, Ranged (Light) 1, Vigilance 2
    - label: Talents
      text: Adversary 1.
    - label: Equipment
      text: Boarding axe or spatha (Dam 6; Crit 2), grapnels & rope, leather (+1 soak).
