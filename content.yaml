  - type: p
    style: small
    text: '**Rewards:** 15–20 XP — 15 for bringing the Ides to an outcome, +5 if three
      or more holdings were Secured or the settlement was struck. **Win** (Varus gone
      with his household intact, or relegated and solvent): a Favor from Varus, who
      still has money and friends if not a seat, and a Favor from each freedman family
      the PCs protected; +1 Dignitas for the PC who carried the Senate on the Ides
      in public. **Costly win** (the silver escapes but the household or freedmen
      are Sealed): the Favors from Varus, but each PC who left a freedman''s family
      to the auction loses 1 Dignitas among the clients who watched. **Loss** (seals
      before the move): no Favors, and Crispinus opens a Denunciation against one
      PC as Varus''s accessory. **Giving the ledger to the accusers** breaks faith
      with a patron (−1 Dignitas, as in *Using Favors*) but earns a Favor from the
      city of Cyrene and from Theochrestos. **Exposing Crispinus** earns a Favor from
      one of the Emperor''s men and leaves a Nemesis with nothing left to lose.'
  - type: scenario
    text: VI. The Veto
  - type: synopsis
    text: 'Rome, spring of 117 BCE — a fictional episode set sixteen years after Tiberius
      Gracchus died on the Capitol. A law of the previous year stopped the distribution
      of public land{{34}}, and the tribune **Gaius Titinius Calvus** has promulgated
      a bill to reopen it. The countrymen of the rural tribes have walked in from
      the hill farms to vote it, and they are camped in the porticoes around the Forum.
      Tomorrow at dawn his colleague **Aulus Plautius Venno** will forbid the reading
      of the bill, as Marcus Octavius forbade Gracchus''s — and in a Roman assembly
      “the wishes of the majority avail nothing if one tribune is in opposition.”{{35}}
      Overnight, money moves through the camp to pay men to go home before the vote.
      The PCs are clients with obligations on both sides, and both sides are calling
      them in.


      **Stakes:** a riot on the Comitium, or a bill that dies quietly while the countrymen
      walk home with nothing. **Hook:** every PC owes a Favor to someone for the bill
      and someone against it (Act I). **Tone:** tense and procedural; most of the
      danger is in the crowd. **Length:** a fast one-shot of 3–4 hours — one afternoon,
      one night, one dawn. **Showcases:** the speech and bloc rules from *The Theater
      of Power* applied to a voting assembly; the Procedural Trump Cards (*intercessio*,
      *obnuntiatio*, the Filibuster); Favors that pull two ways; and a crowd run with
      the *Demagogue* rules. It shares a toolkit with scenarios I and II but not their
      stage: here the audience votes with its feet.'
  - type: p
    style: act
    text: Act I — The Last Contio
  - type: readaloud
    text: The Comitium is a ring of stone steps below the Senate house, and this afternoon
      it is full and spilling out into the Forum. Men stand here who have walked three
      days from the hills, cloaks rolled on their shoulders, smelling of woodsmoke
      and mule. Above them on the Rostra, among the bronze beaks of old warships,
      the tribune Titinius finishes his speech, and the cheer comes up off the stones.
      Then a second man in a plain toga steps to the edge of the platform — Plautius,
      his colleague, his friend since boyhood — and the cheer dies away by stages
      until you can hear a dog barking on the Capitol. “Tomorrow,” he says, “when
      the scribe begins to read, I will forbid it.”
  - type: p
    style: body
    text: '**Two claims on every PC.** Before play, each PC chooses (or rolls d6 twice)
      one claim from each column below. Each claim is a Favor the PC *owes*. Honoring
      it discharges the debt; refusing it is **breaking faith** — 1 Dignitas lost
      and an enemy made (see *The Salutatio & the Favor Economy*). Claims are made
      this afternoon and called in by dawn. Some pairs can be honored together with
      ingenuity; some cannot.'
  - type: table
    style: motiv
    columns:
    - d6
    - Called in for the bill
    - Called in against the bill
    rows:
    - - '1'
      - Titinius's freedman Philargyrus asks you to serve as a *custos* at the Pollia
        tribe's gangway tomorrow and see the count is honest.
      - Veturius's steward Hermon asks you to carry a sealed purse to the distributor
        Otacilius before the first watch.
    - - '2'
      - Quintus Cominius, who carried you off the field at Numantia, asks you to find
        bread for two hundred men of the Quirina.
      - Your landlord is Veturius; his steward asks you to stand with the household's
        clients in front of the Rostra before dawn and hold the ground.
    - - '3'
      - Titinius's scribe, son of your father's friend, asks you to stand beside him
        tomorrow when he reads — and to keep him from being dragged down.
      - Vibia, Plautius's widowed mother and your family's patroness, asks you to
        keep her son alive and his name unshamed.
    - - '4'
      - Your kinsmen of the Teretina have walked in; they ask you to stand and vote
        with them as a tribesman.
      - Veturius, as augur, asks you to stand with his attendant at dawn, bear witness
        to any sign you see, and swear to it.
    - - '5'
      - Titinius asks you to carry one last offer to Plautius's open door tonight.
      - Otacilius Eros, who lent you money last winter, asks you to help him count
        the men who take his coin and leave.
    - - '6'
      - Cominius asks you to keep his younger men from answering the city clients'
        jeers with their fists.
      - A senator of Veturius's circle asks you to bring him word the moment anyone
        lays a hand on Plautius — and to remember who.
  - type: p
    style: body
    text: '**What''s going on:** Plautius''s veto is lawful, and it is enough. His
      generation still regarded the veto as a brake, not a weapon: “The veto was a
      mode of encouraging reflection; it might yield to a prolonged campaign, but
      it was regarded as a barrier against a hasty popular impulse which, if unchecked,
      might prove ruinous to some portion of the community.”{{36}} Titinius has no
      prolonged campaign left. The countrymen cannot stay away from their fields past
      this week, and his year of office ends in December. He has three answers: talk
      his colleague round, have the tribes strip him of office as Gracchus did to
      Octavius, or force the vote. The landholders behind the veto, led by the consular
      augur **Marcus Veturius Philo**, have two: pay the countrymen to go home tonight,
      and, failing that, stop the day with an omen at dawn. The veto holds only as
      long as Plautius does, and both sides know it.'
  - type: procedure
    title: The Order of a Tribal Assembly (117 BCE)
    steps:
    - '**Contiones.** A bill is posted and argued at public meetings called by a magistrate.
      A private citizen speaks only if the presiding magistrate invites him, from
      a step below the Rostra, for as long as the president allows. No fixed waiting
      period yet stands between posting and vote; that comes by law in 98.{{37}}'
    - '**The reading.** On voting morning the president''s scribe reads the bill aloud.
      This is where a colleague interposes: he bids the scribe be silent, and nothing
      can be put to the vote.{{38}}'
    - '**The division.** The president orders the citizens into their tribes; ropes
      divide the Comitium into thirty-five pens. A tribe is drawn by lot to vote first
      — the *principium*. **Once the principium is called, the right to veto and the
      right to announce an omen from watching the sky are both at an end.**{{39}}'
    - '**The ballot.** Since the ballot laws, each man takes a small tablet marked
      V (*uti rogas*, “as you propose”) or A (*antiquo*, “I keep the old law”), crosses
      the narrow gangway (*pons*), and drops it in the basket (*cista*) under the
      eyes of the *custodes*, who count it and report.{{40}}'
    - '**The announcement.** The president has the tribes'' results proclaimed in
      an order drawn by lot. Eighteen of thirty-five carries. If he halts the announcement
      before a majority, the vote is void. All business must begin and end between
      sunrise and sunset.{{41}}'
  - type: p
    style: body
    text: '**Ways into the scene.** The contio runs about an hour after Plautius speaks:
      Titinius answers him, then lets a few voices from the steps be heard. Let the
      PCs work it however they like:'
  - type: list
    items:
    - '**Hear it from the crowd.** An **Average** ([[difficulty difficulty]]) Perception
      check notices men with wax tablets moving among the rural contingents, stopping
      by one fire and then another, writing down names.'
    - '**Ask for the step.** Titinius''s invitation (an **Average** ([[difficulty
      difficulty]]) Charm or Negotiation check, or claim 3 or 5) lets a PC address
      the meeting. Run the speech set-piece against the crowd: Formidable, strain
      threshold 18 (22, less 4 for an audience already sympathetic). Exceeding half
      the threshold steadies the camp for the night.'
    - '**Meet the countrymen.** An **Average** ([[difficulty difficulty]]) Charm check
      with Quintus Cominius — sixty, a veteran of Numantia, leader of the Quirina
      men — earns his trust; [[advantage advantage advantage]] or a [[triumph]] learns
      the camp''s collective Motivations. **Desire:** land of their own before the
      sowing is over. **Fear:** walking home in debt with nothing to show, past their
      landlords'' gates. Their fathers heard it said on these steps that the men who
      fight for Italy “fight and die to support others in wealth and luxury, and though
      they are styled masters of the world, they have not a single clod of earth that
      is their own.”{{42}}'
    - '**Read the law.** **Average** ([[difficulty difficulty]]) Knowledge (Law):
      the principium rule above, and the precedent of 133. **Hard** ([[difficulty
      difficulty difficulty]]): a tribune has been deposed by the tribes exactly once,
      and most of the Senate calls it sacrilege. [[triumph]]: a tribune''s door must
      stand open all night.'
    - '**Watch the steps.** **Hard** ([[difficulty difficulty difficulty]]) Knowledge
      (the Gods): Veturius is an augur, and nothing forbids him to report a sign to
      tomorrow''s assembly.'
    - '**Work the edges.** **Average** ([[difficulty difficulty]]) Streetwise among
      the cookshops of the Forum: someone has paid the bakers along the Vicus Tuscus
      for tomorrow''s loaves in advance, and told them to keep the ovens cold tonight.'
  - type: p
    style: body
    text: '**Complications.** The city clients of the noble houses, packed on the
      Senate-house steps, jeer the countrymen as Gracchans and clodhoppers. An **Average**
      ([[difficulty difficulty]]) Leadership or Coercion check keeps the young Quirina
      men from answering; failure is a brawl with a *Street Tough* minion group of
      four, and blood on the steps. A [[despair]] on any Act I check means the PC
      is seen plainly helping one side: the other side''s claim on them is called
      in tonight, not at dawn.'
  - type: p
    style: body
    text: '**Advances:** **Bread** (Act II) starts at 5; a speech that passes half
      the crowd''s threshold, or Cominius''s trust, raises it to 6. **Heat** starts
      at 1, or 2 if blood was drawn. Knowing the principium rule removes [[setback]]
      from every Act III check to time an intervention; without it, the PCs learn
      the rule only when Titinius sends for them at midnight. Spotting the name-takers
      makes the first search for a distributor **Average** instead of **Hard**. Learning
      the camp''s Motivations adds [[boost boost]] to every appeal that works them.
      Finding the cold ovens is the lead for the bread scene. Knowing Veturius can
      report a sign points the PCs at his house.'
  - type: p
    style: act
    text: Act II — The Four Watches
  - type: readaloud
    text: The Forum after dark belongs to the countrymen. They sleep under the porticoes
      and on temple steps, around small fires the aediles' men keep telling them to
      put out. Somewhere a man sings a harvest song, badly, and is told to be quiet.
      A boy with a lantern moves between the sleepers — stopping, bending to whisper,
      moving on. When he straightens up from the third fire, a man rises, picks up
      his bundle, and walks away toward the Vicus Tuscus and the road.
  - type: p
    style: body
    text: '**What''s going on:** two engines run all night — Veturius''s money and
      Titinius''s anger. Otacilius and three other freedmen are paying men by name:
      a denarius and a place on a cart at first light, more for each kinsman brought
      along. (The trade will be called *divisores*, “distributors,” within a generation.){{43}}
      Under the secret ballot nobody can buy a vote and check the goods; absence can
      be checked, so absence is what is bought. Every countryman who leaves hands
      his tribe''s vote to the men still in the city who are enrolled in it — landholders,
      their stewards, their clients — and the city''s tribesmen lean the landholders''
      way.{{44}} The bribery statutes of the last sixty years were written for elections,
      and they have failed even there;{{45}} whether paying a man to skip a vote on
      a law is a crime is a question a prosecutor would enjoy. Meanwhile Titinius
      has his deposition motion drafted, and his freedman has three hundred cudgels
      in a storehouse below the Aventine.'
  - type: procedure
    title: 'The Night Clock: Bread and Heat'
    steps:
    - '**Two tracks.** **Bread** (0–6) is how many countrymen will still be standing
      in the pens at dawn. **Heat** (0–6) is how close the Forum is to blood. Start
      values come from Act I.'
    - '**Four watches.** Run the night as four watches. Each watch, each PC takes
      one scene (below). At the end of each watch, Bread falls by 1 — the loaves are
      gone and the fields are waiting — and by 1 more unless a PC stopped a distributor
      that watch.'
    - '**Moving the tracks.** A success in the camp or bread scenes restores Bread
      +1. Calming a confrontation lowers Heat by 1. A [[triumph]] on any night scene
      may do both; a [[despair]] raises Heat by 1. Heat also rises by 1 whenever blood
      is drawn, a purse is found in public, or the city clients jeer the camp unanswered.'
    - '**Heat 6** at any moment is a riot: skip to Act III, ending D.'
    - '**At dawn, Bread decides the pens.** The countrymen hold **10 + (2 × Bread)**
      of the 31 rural tribes: 22 at Bread 6, 18 at Bread 4, 12 at Bread 1. At Bread
      0 the Comitium is half empty and Titinius will not risk a vote (ending E).'
  - type: p
    style: body
    text: '**Night scenes** — the routes to the dawn. Each costs a PC their watch:'
  - type: list
    items:
    - '**The camp.** Sit with the men and talk them into staying: Leadership or Charm,
      **Hard** ([[difficulty difficulty difficulty]]), with [[boost boost]] for working
      their Desire or Fear. Success: Bread +1. A PC with *Demagogue* may instead give
      the whole camp one collective order — “sleep,” “stay,” or “march on Plautius''s
      door” (Heat +2).'
    - '**The bread.** An **Average** ([[difficulty difficulty]]) Negotiation check
      and 500 HS, or a Favor spent, buys a night''s baking from a mill-bakery on the
      Aventine slope: Bread +1. If the ovens were bought cold, the baker must be out-bid
      or shamed: **Hard** ([[difficulty difficulty difficulty]]).'
    - '**The money.** Find a distributor: Streetwise, **Hard** ([[difficulty difficulty
      difficulty]]), or **Average** with the Act I lead. Stopping him quietly is an
      opposed Coercion or Deception check against his Cool, and cancels this watch''s
      distributor tick; *Cross-Examine* catches his lies about whose money it is.
      Stopping him in front of the camp also cancels the tick, but raises Heat by
      1.'
    - '**The open door.** A tribune''s door stands open day and night for any citizen
      who needs him, and he may not spend more than a night away from the city.{{46}}
      Plautius receives the PCs in his atrium, under his ancestors'' death-masks.
      Run it as a social encounter against his Discipline. [[advantage advantage advantage]]
      learns his Fear; [[triumph]] learns his secret. He will accept one honorable
      way out: that Titinius restore a price paid to holders who must give up public
      land above the legal limit — the concession Gracchus''s first bill offered and
      his second took away{{47}} — and ask him for it in public. Agreed terms mean
      the veto can be withdrawn at dawn without a deposition.'
    - '**The presiding tribune.** Titinius holds court at his house on the Aventine
      with dockmen and freedmen. Getting him to offer the clause is a **Hard** ([[difficulty
      difficulty difficulty]]) Negotiation check; add [[setback]] for his pride unless
      the offer is framed as his own generosity. [[advantage advantage]] reveals the
      cudgels.'
    - '**The augur''s house.** Veturius receives the PCs on the Palatine and will
      not discuss the sky. A **Hard** ([[difficulty difficulty difficulty]]) Perception
      check in his hall, or an **Average** ([[difficulty difficulty]]) Streetwise
      check with his doorkeeper, turns up Hermon''s errand: a fuller from the Argiletum
      who suffers from the falling sickness has been paid to stand in the Teretina''s
      pen at dawn. A man seized by a fit vitiates the business of an assembly; the
      Romans called epilepsy the comitial sickness for that reason.{{48}} Finding
      the fuller is an **Average** ([[difficulty difficulty]]) Streetwise check; turning
      him takes coin, a Favor, or an opposed Coercion check.'
    - '**The cudgels.** Philargyrus''s storehouse by the river holds the staves and
      a *Street Tough* group who mean to use them. Taking or spoiling them quietly
      (**Hard** ([[difficulty difficulty difficulty]]) Skulduggery, or a Favor on
      Titinius) lowers Heat by 1. Left alone, they come to the Comitium at dawn.'
  - type: p
    style: body
    text: '**The Turn (end of the second watch).** Cominius''s men catch Otacilius
      in the Teretina''s camp with a purse in one hand and a wax tablet in the other:
      names, sums, and the impression of the seal under which each purse came. Forty
      of them carry him toward the great drain to drown him. Heat +2. Then Titinius,
      told the news on his doorstep, announces to the street that at dawn he will
      move the deposition first. Plautius hears within the hour. The PCs choose:'
  - type: list
    items:
    - '**Save him.** Leadership or Coercion against the group: **Daunting** ([[difficulty
      difficulty difficulty difficulty]]), with [[boost boost]] if Cominius trusts
      the speaker. Success lowers Heat by 1 and makes Otacilius owe the PC a Favor;
      failure leaves a corpse and Heat where it is.'
    - '**Take the tablet.** Whoever holds it has proof on wax. It can upgrade a Revelatory
      Appeal at dawn without risking the bluff, buy Veturius''s silence (an **Average**
      ([[difficulty difficulty]]) Negotiation check makes him forbid the fit and keep
      his report to himself), or discharge a claim by being handed to the patron who
      asked.'
    - '**Let it happen.** Otacilius dies in the drain. Veturius''s friends now call
      the countrymen murderers: add [[setback]] to every appeal for the bill at dawn,
      and the Senate has the violence it needs to call any law void.'
  - type: p
    style: body
    text: '**Advances:** at first light, record **Bread** (the tribes held), **Heat**
      (carried forward; at 4–5 add [[setback]] to every check to calm or hold a crowd,
      and any [[despair]] in Act III makes it 6), **Plautius** (firm, wavering if
      his Fear is known, or agreed if Titinius has promised the clause), **the fuller**
      (in place, turned, or exposed), **the tablet** (who holds it), and **the cudgels**
      (armed or spoiled). Every claim still owed is called in before the sun clears
      the Esquiline.'
  - type: p
    style: act
    text: Act III — Dawn at the Gangways
  - type: readaloud
    text: The sky is grey over the Esquiline when the ropes go up, thirty-five pens
      across the Comitium, and the men find their tribes by the shouting of their
      names. A slave carries the urn for the lot to the foot of the Rostra and sets
      it down with care. Up on the platform Titinius nods to his scribe. The scribe
      unrolls the bill and draws breath. Beside them Plautius lifts one hand, not
      high. “I forbid it,” he says. The scribe looks at Titinius, and Titinius looks
      out at the crowd.
  - type: procedure
    title: Dawn, Step by Step
    steps:
    - '**The morning contio.** Titinius holds the chair (see his stat block). Run
      the speech set-piece against the assembled crowd — Formidable, strain threshold
      18 if Bread is 4 or more, 22 if 3 or less, 26 if 1 or less. Veturius (or a *Senator
      / Patrician*) speaks for the veto; PCs speak only if the chair calls them. If
      Titinius denies the other side the floor, the day looks lawless: [[setback]]
      to every later appeal to the Wavering tribes. If he grants it, Plautius uses
      *Filibuster*: every 2 rounds he adds cost Bread 1 and add Heat 1, as the sun
      climbs and the men think of the road.'
    - '**The veto.** Plautius forbids the reading. Titinius now chooses, and the PCs
      may sway him: **accept the veto** (ending E); **offer the clause** in public,
      if Act II arranged it — if Plautius agreed, he lifts the veto at once (ending
      A); if he is only wavering, make the final appeal described under *Seventeen
      tribes* now, with the threat of deposition standing behind it; or **move the
      deposition**. Whichever way the veto falls, the bill itself then goes to the
      same pens and the same count: the countrymen''s tribes, plus the Wavering bloc
      if it was committed for the bill.'
    - '**The deposition vote.** The question “that Aulus Plautius be deprived of the
      tribunate” goes to the tribes. The countrymen hold the rural tribes Bread allows.
      The four urban tribes vote with the noble houses. Four tribes form a **Wavering**
      bloc, run with the Senate rules (Hard audience, threshold 14): commit it and
      it adds 4 tribes to the side that broke it; left uncommitted it votes no, as
      does every other rural tribe. A PC serving honestly as *custos* (claim 1) adds
      [[boost]] to appeals to the Wavering bloc — the men trust the count.'
    - '**Seventeen tribes.** If the deposition is carrying, Titinius halts the announcement
      at seventeen tribes and appeals to his colleague a last time, as Gracchus did
      in 133.{{49}} A PC at Plautius''s side may make the appeal: an opposed Charm
      or Negotiation check against his Discipline. Add [[boost boost]] for working
      his Fear, [[boost]] if the clause is on the table, [[boost]] if Vibia''s claim
      was honored. Add [[setback]] if Veturius and the nobles are standing together
      in his sight — in 133 Octavius looked at the men of wealth, and held. Success:
      he withdraws the veto, as a tribune facing seventeen tribes did in 67 BCE{{50}}
      — ending A. Failure: the eighteenth tribe is proclaimed — ending B.'
    - '**The omen.** Each vote of the day — the deposition, then the bill — has its
      own principium, and Hermon''s man waits for whichever vote is going against
      his master. If the fuller falls in his fit before that principium is called,
      Veturius reports it to the chair: *alio die*, “on another day.” The president
      is bound to dismiss the assembly{{51}} — ending C. To stop it, spot the fuller
      in the Teretina''s pen (**Hard** ([[difficulty difficulty difficulty]]) Perception)
      and get him out (Athletics or Coercion), or have Veturius forbid it (the tablet,
      or an appeal to his Piety upgraded by a Knowledge (the Gods) maneuver). Laying
      hands on an augur in the Comitium raises Heat by 2. In a [[Grounded]] game the
      fit is the only omen. In a [[Fated]] Rome, a clap of thunder from a clear sky
      as the lot is drawn belongs to Jupiter, and nobody paid for it.'
    - '**Heat 6.** Riot — ending D.'
  - type: p
    style: body
    text: '**Arguments both sides will reach for.** For the deposition: a tribune
      is sacred because he serves the plebs, and a tribune who acts against them has
      unmade his own sanctity — what the tribes gave, the tribes may take back. Against
      it: if a tribune who protects one citizen can be voted out for displeasing a
      colleague, the tribune''s protection is dead. Both were argued in the Forum
      in 133, and both still work as Logos appeals.{{52}}'
  - type: p
    style: body
    text: '**Endings.** **A. The veto withdrawn.** The bill passes with the clause;
      Plautius keeps his office and his name; the commissioners will measure land
      this summer. The quietest win, and the one the governing class can live with.
      **B. The tribune deposed.** The bill passes. Plautius, now a private man, will
      not leave the Rostra until Titinius''s *viator* drags him down (Heat +1). A
      tribune has been unmade a second time, and men who were on the Capitol in 133
      count the precedent; Titinius must now hold office or face what Gracchus faced.
      **C. Another day.** The fuller falls, Veturius says two words, the ropes come
      down. The countrymen have no other day — they go home to sow — and the bill
      dies quietly. If the PCs can prove the fit was bought, Veturius''s house is
      ruined, but the day is still lost. **D. Sticks and stones.** City clients with
      staves meet countrymen with cudgels (if the storehouse was left alone). Use
      *Street Tough* minion groups, the lictors of any magistrate present, and *Legionary*
      veterans under Cominius. The PCs'' work is to get people out alive — Athletics
      or Coordination to clear a pen, a **Hard** ([[difficulty difficulty difficulty]])
      Leadership check to turn a group — and to keep hands off Plautius, whose person
      is sacrosanct. In 133, “more than three hundred were slain by blows from sticks
      and stones, but not one by the sword.”{{53}} Any law carried in a riot may be
      voided by the Senate as passed by violence.{{54}} **E. The veto stands.** Titinius
      yields, or the pens are empty. Plautius kept his word, the countrymen walk home
      past their landlords'' gates, and nothing has changed except the price of bread.'
  - type: statblock
    name: Aulus Plautius Venno
    kind: Nemesis
    desc: Thirty-one, grave and exact, Titinius's friend since they learned their
      letters together; his family has farmed more public land in the Quirina's country
      than the law allows for three generations. **Wants:** to keep the pledge he
      gave the landholders without becoming the second Octavius. **Stance:** courteous
      to everyone; hears the PCs at his open door at any hour, and assumes they were
      sent. **Secret:** his late father borrowed heavily from Veturius, and the veto
      is the price of the creditor's patience; he will take any honorable way out
      that does not look bought. **Voice:** “I gave my word before I knew what it
      would cost. That is the only kind of word worth giving.”
