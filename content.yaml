  - type: h4
    text: Patronus
  - type: p
    style: body
    text: '**Tier:** 3   **Activation:** Passive   **Ranked:** No'
  - type: p
    style: body
    text: Charm, Leadership, and Knowledge (Rome) are career skills for your character.
