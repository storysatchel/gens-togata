  - type: statblock
    name: Numisia Procula
    kind: Nemesis
    desc: |-
      A Vestal who entered the order at seven and has kept the fire for twenty-four years. She is second in rank to the Chief Vestal. **Wants:** to keep her order's honor and her own life, in that order. **Toward the PCs:** haughty; she will not plead, and she will not be touched. **Secret:** her letters to her cousin Sabidius Gallus mourn the Vestals the emperor condemned and call his justice impious. They do not show she broke her vow, but they could still kill her. **Voice:** “I have kept the fire twenty-four years. Ask the fire.”
    chars:
      Br: '1'
      Ag: '2'
      Int: '3'
      Cun: '3'
      Will: '4'
      Pr: '4'
