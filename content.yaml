    - label: Abilities
      text: |-
        **The Chair:** as presiding tribune he decides who speaks, from where, and for how long; draws the lot for the principium; and may halt the proclamation of the tribes at any count. **Voice of the Mob:** as *Popularis Tribune*.
    - label: Equipment
      text: Plain toga, the master copy of the bill, a scribe, two *viatores*, a signet ring cut with a yoked ox.
    - label: Look
      text: Bald before forty under a sunburned scalp; quick black eyes and a heavy jaw; broad shoulders; toga hitched short for pacing the Rostra; a yoked-ox signet on a thick finger.
  - type: statblock
    name: Marcus Veturius Philo
    kind: Nemesis
    desc: |-
      Sixty, a consular and an augur for twenty years, holder of public land in three districts that his grandfather first leased from the state. He was on the Capitol in 133. **Wants:** to keep his family's land, and to keep Rome from another 133. **Stance:** treats the PCs as useful men, pays promptly, and never asks for anything he could be quoted on. **Secret:** the distributors' money is his, and his steward Hermon has hired the fuller to fall in a fit at dawn; Veturius has guessed and has not asked. He will not invent a sign, but he will report one he is given. **Voice:** “I was on the Capitol when they killed Gracchus. I did not pick up a bench-leg. I should like to die without having been asked to.”
