        **Cart Ride Home:** each watch he works unopposed is the distributor tick on the Night Clock (Bread −1). **The Tablet:** whoever holds it may upgrade one Revelatory Appeal against Veturius and ignores that appeal's [[despair]] penalty — the proof is in wax.
