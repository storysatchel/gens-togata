  - type: p
    text: Rome possesses no organized municipal police department. The narrow, unlit
      alleys of the Subura and Transtiberim belong after dark to street gangs, extortionists,
      and hired daggers. In the law-courts and political forums, professional informers
      (*delatores*) hunt wealthy aristocrats for a bounty on their estates.
