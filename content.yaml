chapters:
- title: Introduction
  blocks:
  - type: p
    style: opening
    text: '“Julius Kanus, a man of peculiar greatness, whom even the fact of his having
      been born in this century does not prevent our admiring, had a long dispute
      with Gaius, and when as he was going away that Phalaris of a man said to him,
      ‘That you may not delude yourself with any foolish hopes, I have ordered you
      to be executed,’ he answered, ‘I thank you, most excellent prince.’ I am not
      sure what he meant: for many ways of explaining his conduct occur to me. Did
      he wish to be reproachful, and to show him how great his cruelty must be if
      death became a kindness? or did he upbraid him with his accustomed insanity?
      for even those whose children were put to death, and whose goods were confiscated,
      used to thank him: or was it that he willingly received death, regarding it
      as freedom? Whatever he meant, it was a magnanimous answer.'
  - type: p
    style: opening
    text: 'Some one may say, ‘After this Gaius might have let him live.’ Kanus had
      no fear of this: the good faith with which Gaius carried out such orders as
      these was well known. Will you believe that he passed the ten intervening days
      before his execution without the slightest despondency? it is marvellous how
      that man spoke and acted, and how peaceful he was.'
  - type: p
    style: opening
    text: 'He was playing at draughts when the centurion in charge of a number of
      those who where going to be executed bade him join them: on the summons he counted
      his men and said to his companion, ‘Mind you do not tell a lie after my death,
      and say that you won;’ then, turning to the centurion, he said ‘You will bear
      me witness that I am one man ahead of him.’ Do you think that Kanus played upon
      that draught-board? nay, he played with it.'
  - type: p
    style: opening
    text: 'His friends were sad at being about to lose so great a man: ‘Why,’ asked
      he, ‘are you sorrowful? you are enquiring whether our souls are immortal, but
      I shall presently know.’ Nor did he up to the very end cease his search after
      truth, and raised arguments upon the subject of his own death. His own teacher
      of philosophy accompanied him, and they were not far from the hill on which
      the daily sacrifice to Caesar our god was offered, when he said, ‘What are you
      thinking of now, Kanus? or what are your ideas?’ ‘I have decided,’ answered
      Kanus, ‘at that most swiftly-passing moment of all to watch whether the spirit
      will be conscious of the act of leaving the body.’ He promised, too, that if
      he made any discoveries, he would come round to his friends and tell them what
      the condition of the souls of the departed might be.”{{1}}'
  - type: h2
    text: Welcome to Gens Togata
  - type: p
    style: lead
    text: 'In Rome, a person''s standing shapes what doors open, whose word is believed,
      and what a mistake may cost. A legionary, an advocate, a trader, and a freed
      artisan may have little in common, but each has ties to other people: a patron
      to satisfy, a household to protect, a rival to answer, or a favor to repay.
      Those ties can draw them into the same trouble.'
  - type: p
    style: body
    text: '**Gens Togata** is a setting supplement for **Genesys**, a tabletop roleplaying
      game. Its default setting is the High Empire, roughly the reigns of Trajan and
      Hadrian (*c.* 100–120 CE), though its material can be used elsewhere in the
      Principate. Player characters might serve together in a legion, pursue a case
      through the courts, keep a household''s affairs in order, trade across the provinces,
      or investigate a sign the gods have sent. Their adventures can move from a crowded
      street to a governor''s audience chamber, from a roadside shrine to the Senate.'
  - type: h2
    text: Roleplaying in Imperial Rome
  - type: p
    style: body
    text: A tabletop roleplaying game is a conversation in which a group imagines
      events together, using rules and dice to resolve uncertain outcomes. One person
      is the game master (GM), who describes the world and plays the people the group
      meets. The other participants are players; each controls a player character
      (PC), deciding what that character says and does. The GM describes what happens
      in response, and the group builds an ongoing story through those choices and
      their consequences.
  - type: p
    style: body
    text: '{{sidebar}} When an outcome is uncertain and consequential, the group uses
      a Genesys check: the dice establish whether the attempt succeeds and what advantages,
      complications, or other consequences accompany it. Those results change the
      situation, and play continues from there. A successful plea can win a hearing
      while making an enemy; a failed investigation can still uncover a useful lead.'
    sidebar:
      type: sidebar
      title: A Note on Slavery and History
      body:
      - 'Rome was built on slavery, conquest, and brutal spectacle. This book does
        not sanitize that, but it is a game played by friends: treat enslaved characters
        as people with agency and goals (many of this book''s archetypes and careers
        assume exactly that), keep the real cruelty at the “tasteful fade” your table
        prefers, and talk openly about lines and veils before you start. The horror
        is part of the drama; it is never the point.'
  - type: h3
    text: What is this book, and how do I use it?
  - type: p
    style: body
    text: '**Gens Togata** is a sourcebook and setting supplement for the **Genesys
      Core Rulebook**. To play a campaign set in the Roman world, you will need a
      copy of the **Genesys Core Rulebook** and a set of Genesys Roleplaying Dice
      (available in physical packs or through digital dice applications). This book
      serves as a backdrop and rules expansion for the stories you will tell using
      the Genesys Narrative Dice System.'
  - type: p
    style: body
    text: Genesys is the engine that runs your game; **Gens Togata** provides setting
      rules, character options, equipment, adversaries, and historical guidance tailored
      to ancient Rome. Whenever setting-specific rules in this book modify or expand
      general procedures in the **Genesys Core Rulebook**, the rules in this book
      take precedence for your campaign.
  - type: h3
    text: What is the Gens Togata setting?
  - type: p
    style: body
    text: The default setting is the High Empire, roughly the reigns of Trajan and
      Hadrian (*c.* 100–120 CE), though its historical material, archetypes, and systems
      adapt easily to earlier imperial reigns or the Late Republic. Rome is not an
      abstract fantasy kingdom; it is a meticulously documented historical society
      of monumental ambition, deep social inequality, and sophisticated legal order.
  - type: p
    style: body
    text: 'In this setting, player characters are neither invulnerable demigods nor
      isolated wanderers. They are people rooted in Roman society: soldiers, advocates,
      merchants, enslaved craftsmen, freed clerks, and patrician magistrates. They
      navigate a Mediterranean world bound together by paved military roads, maritime
      grain routes, provincial treaties, and the all-pervading currency of legal status
      and personal obligation.'
  - type: h3
    text: What will I find in this book?
  - type: p
    style: body
    text: 'This book is divided into six core chapters and supporting reference appendices:


      • **Chapter 1: Character Creation** guides you through creating a character
      step by step, introducing seven Roman archetypes, twelve careers, setting-specific
      Knowledge skills, Roman talents, the favor economy, and the major factions of
      the Roman world.


      • **Chapter 2: Equipment and Vehicles** details the currency of Rome (from copper
      asses to gold aurei), weapons, armor, artisan qualities, travel gear, social
      instruments, and beasts and conveyances from racing chariots to Mediterranean
      merchant galleys.


      • **Chapter 3: The Theater of Power** introduces the mechanics of Roman social
      conflict, including the reputation economy of *dignitas*, Roman motivations,
      set-piece oratory, senatorial debates, courtroom advocacy, and the morning *salutatio*.


      • **Chapter 4: The Roman World** provides an imperial gazetteer covering the
      city of Rome, its *regiones*, and the diverse provinces of the Mediterranean.


      • **Chapter 5: Adversaries** presents profiles and statblocks for Roman non-player
      characters and opponents, from street cutpurses and gladiator champions to praetorian
      guards and barbarian chieftains.


      • **Chapter 6: The Game Master** offers historical and thematic advice for running
      Roman campaigns, handling conspiracies, setting tone, and building adventures.'
  - type: h3
    text: Can I use this to make my own historical setting?
  - type: p
    style: body
    text: Yes! Genesys is designed as a modular, adaptable toolkit. The subsystems
      in this book—such as the status-based archetypes, the favor economy, reputation
      mechanics, and set-piece oratory encounters—can easily be lifted and adapted
      to other historical periods, antiquity campaigns, or low-magic historical fantasy
      settings where social standing and political patronage drive the drama.
  - type: h2
    text: What Rome Looked Like
  - type: p
    style: lead
    text: 'Rome was less a nation than a legal order laid over tens of millions of
      people. A person''s place in that order depended heavily on legal standing:
      free or enslaved, citizen or foreigner, independent head of a household or subject
      to another person''s authority. This chapter describes that world; later chapters
      translate its conditions into game mechanics, the rules used to play.'
  - type: sidebar
    title: A Brief Roman Timeline
    body:
    - '**Kingdom (traditionally 753–509 BCE).** Romans traced their city''s founding
      to Romulus and its early rule to a succession of kings. The dates and stories
      of this period belong partly to legend.'
    - '**Republic (traditionally 509–27 BCE).** After the kings, elected magistrates,
      the Senate, and citizen assemblies shared government unequally. Rome conquered
      Italy and expanded across the Mediterranean. Political violence and civil wars
      undermined the Republic; Julius Caesar''s assassination in 44 BCE did not end
      the fighting.'
    - '**Principate (27 BCE–later third century CE).** After defeating his rivals,
      Augustus established rule by an emperor while retaining Republican institutions.
      The transition was gradual; 27 BCE is a conventional starting date, not a single
      day on which every institution changed.'
    - '**The book''s present (about 100–120 CE).** Trajan rules until 117 CE; Hadrian
      succeeds him. This falls within the Principate and what historians often call
      the High Empire, a modern name for the earlier imperial period, not a separate
      form of government. Campaigns may also move to other reigns or to the Republic.'
    - '**Later empire.** Third-century civil wars and external threats preceded reforms
      under Diocletian, who became emperor in 284 CE. The western imperial court ended
      in 476 CE; Roman rule continued in the east, centred on Constantinople, until
      1453.{{2}}'
  - type: h3
    text: A World Run on Status
  - type: p
    style: body
    text: 'Roman law distinguished people by freedom, citizenship, family authority,
      and membership in privileged orders. These categories overlapped rather than
      forming one simple ladder: a plebeian could be wealthy, a provincial could be
      free without Roman citizenship, and a freedman could be a citizen while owing
      obligations to a former owner. The character archetypes use names such as Patrician,
      Equestrian, Plebeian, Freedman, Provincial, and Slave to bring different origins
      into play; they are not a complete list of Roman legal orders.'
  - type: p
    style: body
    text: The *paterfamilias*, the legally independent head of a Roman family, held
      *patria potestas*, legal authority over children and further descendants in
      his power, even after they became adults. That authority changed over time and
      was not identical to ownership of a slave. A father “might convey his son as
      well as his slave in property to a third person.”{{3}} Dress, name, and attendants
      could signal a person's standing before a conversation began.
  - type: h3
    text: Slavery
  - type: p
    style: body
    text: 'Roman law treated enslaved people as possessions, “looked upon in law as
      the property of the household and not as members of it.”{{4}} Advice to a landowner
      on clearing out a farm includes “the old and sick slaves, and if any thing else
      is superfluous you should sell that.”{{5}} Another Roman view challenged the
      reduction of people to their legal condition: “‘They are slaves,’ people declare.
      Nay, rather they are men.”{{6}} A *libertus*, a man freed from slavery, could
      become a Roman citizen when freed by a citizen under the appropriate legal conditions,
      but still owed duties and deference to his former owner.'
  - type: h3
    text: Patronage
  - type: p
    style: body
    text: '*Clientela*, the relationship between patron and client, connected people
      of unequal standing through obligations and assistance. A *cliens*, or client,
      might visit a patron''s house for the *salutatio*, the morning greeting, lend
      votes or public support, and receive protection, legal backing, loans, or introductions.
      The relationship carried religious as well as social obligations: in early Roman
      law, “if a patron violated his obligation to keep faith with his … dependent,
      the civil law had no penalty for such outrages, but the burden of the curse
      of the gods lay thenceforth on the head of the offender.”{{7}}'
  - type: h3
    text: The Law
  - type: p
    style: body
    text: Roman law regulated marriage, inheritance, contracts, property, and public
      conduct as well as crimes and penalties. The distinctions of freedom and citizenship
      described above shaped both legal capacity and treatment before the courts.
      Citizens had protections against some punishments, including flogging and crucifixion,
      though the protections varied over time and were not always respected. Enslaved
      people had severely restricted legal standing. In criminal proceedings, enslaved
      witnesses were ordinarily interrogated under torture; their proximity to owners
      made their testimony valuable, while a general prohibition on using it against
      those owners had exceptions.{{8}} Torture was not proof of truth, but a coercive
      practice built into the treatment of such witnesses.
  - type: h3
    text: The Crowd
  - type: p
    style: body
    text: 'Rome''s imperial population is uncertain: estimates range from several
      hundred thousand to around a million.{{9}} In crowded *insulae*, apartment buildings
      above shops and workshops, tenants lived alongside markets and monumental public
      spaces. Citizens gathered for grain distributions and spectacles as well as
      business and worship. In the Republic''s final decades, Clodius drew supporters
      from neighbourhood associations, including the *collegia compitalicia*, associations
      connected to crossroads shrines. His rival Milo deployed armed followers and
      hired gladiators; their clashes brought political violence into Rome''s streets.{{10}}
      Under emperors, grain distributions and games remained occasions when rulers
      and crowds encountered one another.'
  - type: p
    style: body
    text: Under the Principate, emperors held power while Republican institutions
      survived in altered form. Elections passed from the people to the Senate, and
      the *princeps*, the emperor as Rome's leading citizen, stood at the centre of
      an extensive network of patronage. Legal distinctions of birth and citizenship,
      slavery, the *salutatio*, and *patria potestas* all survived the Republic; adventures
      in this setting unfold within that enduring order.
  - type: h3
    text: Technology
  - type: p
    style: body
    text: Roman roads carried armies, traders, and travellers across the empire. The
      *vehiculatio*, a state transport system, moved officials and imperial business
      between stations where travellers could obtain fresh animals; later sources
      call the system the *cursus publicus*.{{11}} Aqueducts supplied cities with
      water, and baths and wealthy houses could be heated by a *hypocaust*, a system
      that circulated hot air beneath floors. Builders used concrete and arches; armies
      deployed siege engines and warships. Coinage, credit, and banking supported
      trade, while physicians drew on Greek medical learning and surgical instruments.
      Firearms, printing presses, mechanical clocks, and stirrups do not belong to
      the default setting.
  - type: h3
    text: Religion in the Empire
  - type: p
    style: body
    text: Public priesthoods honour Rome's gods and the emperor. Isis, whose worship
      began in Egypt, has temples and devotees across the empire; the mysteries of
      Mithras developed within the Roman imperial world and attracted followers including
      soldiers. Christians meet in communities of their own and may face official
      persecution. These communities differ in their practices and in their relationships
      with Roman authorities.{{12}}
  - type: h2
    text: Adventures in the Eternal City
  - type: p
    style: body
    text: 'An adventure in Rome rarely begins in an empty tavern. It begins when a
      client knocks at the patron’s door at first light, when a grain fleet from Alexandria
      fails to make port at Ostia, or when an unsigned denunciation is delivered to
      the urban prefect. The city offers rich soil for diverse campaign styles:'
  - type: p
    style: body
    text: '• **Political Intrigue & the Courts:** Player characters maneuver through
      senatorial rivalries, prosecute corrupt provincial governors before the *praetor*,
      or expose a conspiracy threatening the imperial household.


      • **Urban Underworld & Investigation:** Operating among the *insulae* of the
      Subura, characters solve murders, settle blood debts between rival *collegia*,
      or track contraband goods smuggled past the customs toll.


      • **Military & Frontier Duty:** Stationed along the Rhine, the Danube, or Hadrian’s
      Wall, characters hold the line against raiders, negotiate treaties with frontier
      chieftains, or uncover treason among the officer corps.


      • **Faith, Myth, & Mystery:** Delving into underground Mithraic shrines, investigating
      stolen temple treasures, or interpreting ominous portents sent by the gods before
      disaster strikes.'
  - type: h2
    text: Beyond the Frontier
  - type: p
    style: body
    text: Beyond the *limes*, the frontier zone, lie peoples and powers with varied
      relations to Rome. Germanic communities and Caledonians live north of imperial
      territory; Parthia rules a powerful empire to the east. South of Roman Africa,
      the Garamantes have a kingdom centred on Garama in the Sahara. Underground irrigation
      channels water their oasis fields, and trade routes connect them to Roman Africa
      and lands farther south. Their relations with Rome include diplomacy and trade
      as well as fighting.{{13}}
  - type: p
    style: body
    text: Farther east, Roman writers associated *Serica* and its people, the *Seres*,
      with silk. These names referred to distant lands and peoples as Roman writers
      understood them; they are not exact equivalents for Han China. Silk reached
      Roman markets through networks of merchants and intermediaries across Asia and
      by sea.{{14}}
  - type: h2
    text: Setting Rules
  - type: h3
    text: Species
  - type: p
    style: body
    text: Everyone is **Human** (use the Human profile from the Core Rulebook). What
      matters in Rome is not *species* but *status* — citizen or non-citizen, free
      or enslaved, patrician or plebeian, Roman or provincial. Those are role-played
      and reflected in the archetypes, careers, and talents below, not in different
      stat lines. If the group chooses a Mythic campaign with creatures from Roman
      myth, the GM may also admit fauns, nymphs, and the half-divine; see Dialing
      the Supernatural in Game Mastering Rome.
  - type: p
    style: body
    text: Gens Togata uses the rules in the Genesys Core Rulebook and adds character
      options and social rules for play in Roman settings. A character's legal standing
      and relationships can shape what they can attempt, the dice in a check, and
      the consequences; they do not replace the check.
  - type: p
    style: body
    text: Roman status is a starting point for play, not a substitute for a check.
      Citizenship, wealth, occupation, enslavement, and connections affect what a
      character can attempt, the difficulty or dice involved, and the stakes of success
      or failure. Reputation and favors can open opportunities or create obligations.
      Swords and law both have their place, and a dangerous situation need not end
      in a fight; agree together on the sort of risks and consequences the campaign
      will bring.
  - type: p
    style: body
    text: '**Dignitas** is an optional setting trait representing a character''s public
      standing. It is rated from 0 to 5 and can change as the character gains or loses
      reputation. The archetypes in Character Creation list starting values; The Theater
      of Power explains how Dignitas affects social checks and introduces related
      rules for influence and favors. Discuss those options with the group before
      creating characters.'
  - type: endnotes
    title: Notes
    items:
    - Seneca, *De Tranquillitate Animi* 14.4–9, trans. Aubrey Stewart, in *Minor Dialogues,
      Together with the Dialogue on Clemency* (London, 1889), pp. 280–281.
    - Chris Scarre, *The Penguin Historical Atlas of Ancient Rome* (1995); “Timeline
      of the Roman Empire,” *Encyclopaedia Britannica*, https://www.britannica.com/place/Timeline-of-the-Roman-Empire.
    - Theodor Mommsen, *The History of Rome*, trans. W. P. Dickson — on *patria potestas*,
      the power of the household head.
    - Mommsen, *The History of Rome* (Dickson) — on the legal standing of slaves as
      property of the household.
    - Cato the Elder, *De Agri Cultura* 2, trans. Fairfax Harrison, *Roman Farm Management*
      (1913).
    - Seneca, *Moral Letters to Lucilius* 47.1 and 47.10 (the cover motto), trans.
      Richard M. Gummere (Loeb Classical Library, 1917) — public domain.
    - Mommsen, *The History of Rome* (Dickson) — the archaic law of client-faith;
      cf. the Twelve Tables, *patronus si clienti fraudem fecerit, sacer esto*.
    - 'Elżbieta Loska, “Inconvenient Witnesses: Testimonies of Slaves in a Criminal
      Trial During the Republic and the Principate,” *Studia Iuridica Lublinensia*
      30, no. 1 (2021), 197–204, doi:10.17951/sil.2021.30.1.197-204.'
    - Glenn R. Storey, “The Population of Ancient Rome,” *Antiquity* 71 (1997), 966–978,
      doi:10.1017/S0003598X00085859.
    - Henrik Mouritsen, *Plebs and Politics in the Late Roman Republic* (2001), pp.
      66, 91, 150; Fergus Millar, *The Crowd in Republican Rome* (1998).
    - Lionel Casson, *Travel in the Ancient World* (1974), p. 192; Suetonius, *Augustus*
      49.3.
    - 'John North, “Religious Diversity,” in *Ancient Rome: The Archaeology of the
      Eternal City* (2000), pp. 592–607; Michael Kulikowski, *The Triumph of Empire*
      (2016), on Mithraic worship; Pliny, *Letters* 10.96–97.'
    - David J. Mattingly, *The Archaeology of Fazzan*, vol. 1, *Synthesis* (2003);
      “Garamantes,” *Livius*, https://www.livius.org/articles/place/garamantes/.
    - Lionel Casson, *Travel in the Ancient World* (1974), pp. 123–125; Strabo, *Geography*
      15.1.34.
- title: 'Chapter 1: Character Creation'
  blocks:
  - type: h2
    text: Creating Your Character
  - type: p
    style: lead
    text: 'Most inhabitants of the Roman world are ordinary subjects striving to survive
      from one harvest or market day to the next. In **Gens Togata**, you play a character
      drawn into the wider currents of the Mediterranean: an advocate arguing before
      magistrates, an equestrian merchant financing maritime trade, an enslaved artisan
      seeking manumission, a legionary holding the Rhine frontier, or a patrician
      defending a dynastic name.'
  - type: p
    style: body
    text: 'Character creation follows seven steps that mirror and expand upon the
      rules in the **Genesys Core Rulebook**:


      • **Step 1: Determine Background:** Establish where your character comes from,
      their family heritage, and what drove them into adventuring.


      • **Step 2: Select a Character Archetype:** Choose your character’s legal and
      social origin (Patrician, Equestrian, Plebeian, Freedman, Provincial, Slave,
      or Barbarian).


      • **Step 3: Choose a Career:** Select your character’s profession, granting
      eight career skills.


      • **Step 4: Invest Experience Points:** Spend starting experience points granted
      by your archetype to increase characteristics, train skills, and acquire talents.


      • **Step 5: Determine Derived Attributes:** Calculate wound threshold, strain
      threshold, defense, and soak value.


      • **Step 6: Determine Status & Favors:** Establish your starting Dignitas, Roman
      motivations, and initial favors owed to or by Roman factions.


      • **Step 7: Determine Starting Gear:** Outfit your character with currency,
      weapons, armor, and gear using your starting purse.'
  - type: h2
    text: 'Step 1: Determine Background'
  - type: p
    style: body
    text: 'Where does your character come from, and what ties bind them to the world?
      In Rome, nobody stands alone: ancestry, hometown, family obligations, and past
      services shape how others receive you. A character might be born to a noble
      line whose ancestral wax masks line the *atrium*, an immigrant from the Greek
      east seeking fortune in the capital, a soldier retired from the frontier legions,
      or a provincial whose family recently acquired citizenship through military
      service. Consider what personal ambition or patron’s call has propelled your
      character into action.'
  - type: h2
    text: 'Step 2: Select a Character Archetype'
  - type: p
    style: body
    text: Rome sorted people not by what they could do but by *what they were born*
      — free or enslaved, citizen or foreigner, highborn or common. The seven archetypes
      below capture that axis of status and origin. Each gives starting characteristics,
      derived thresholds, starting experience, one free skill rank (gained before
      spending XP, to a maximum of rank 2 at creation), a signature ability, and a
      **starting Dignitas** for the reputation economy (see *The Theater of Power*).
      This choice is permanent; spend your starting XP to raise characteristics, skills,
      and talents.
  - type: sidebar
    title: Archetype and Career Are Independent
    body:
    - 'Your **archetype** is who you were born; your **career** (next page) is what
      you have made of yourself. The two axes run orthogonally — *any archetype may
      take any career.* A Patrician who serves as a Legionary, a Slave trained as
      a Gladiator or a Medicus, a Freedman who argues as an Advocate, a Barbarian
      turned Explorator: all are classic Roman stories, and all are built by crossing
      one origin with one profession. Pick your origin here; pick your trade on the
      pages that follow.'
  - name: Patrician
    kind: Highborn
    desc: Born to one of the families whose ancestors' wax masks line the atrium.
      You have never wanted for anything but respect — and that you intend to earn,
      or seize.
    chars:
      Br: '1'
      Ag: '2'
      Int: '2'
      Cun: '2'
      Will: '2'
      Pr: '3'
    fields:
    - label: Wound Threshold
      text: 10 + Brawn
    - label: Strain Threshold
      text: 10 + Willpower
    - label: Starting XP
      text: '100'
    - label: Starting Dignitas
      text: '3'
    - label: Starting Skills
      text: One rank in Knowledge (Rome) or Charm (max 2 at creation).
    - label: Faction Ties
      text: Natural ties to the senatorial order (*ordo senatorius*), prestigious
        civic priestly colleges (*collegia sacerdotum*), and traditionalist faction
        blocs.
    - label: The Weight of Ancestors
      text: Once per session, when making a social check that leans on your name and
        lineage, add [[advantage]] [[advantage]]. Your blood opens doors that gold
        cannot. An opponent who publicly exposes a *fabricated* ancestor (the funeral
        *laudationes* were notorious for invented triumphs and false consulships)
        turns this against you — the [[advantage]] [[advantage]] becomes lost Dignitas
        for the scene, a natural use for a Dossier of Dirt.
    type: statblock
  - name: Equestrian
    kind: The Knightly Class
    desc: Of the *ordo equester* — rich enough to matter, not noble enough to be trusted
      with it. Yours is the class of financiers, officers, and tax-farmers who really
      make the Empire run.
    chars:
      Br: '2'
      Ag: '2'
      Int: '2'
      Cun: '3'
      Will: '1'
      Pr: '2'
    fields:
    - label: Wound Threshold
      text: 10 + Brawn
    - label: Strain Threshold
      text: 8 + Willpower
    - label: Starting XP
      text: '100'
    - label: Starting Dignitas
      text: '2'
    - label: Starting Skills
      text: One rank in Negotiation or Knowledge (Rome) (max 2 at creation).
    - label: Faction Ties
      text: Natural ties to corporate state-contracting syndicates (*societates publicanorum*),
        maritime transport shippers, and circus enterprise owners (*domini factionum*).
    - label: Men of Business
      text: Once per session, spend a Story Point to declare you have the capital,
        credit, cargo, or well-placed contact already arranged — the quiet machinery
        of money working on your behalf.
    type: statblock
  - name: Plebeian
    kind: Freeborn Commoner
    desc: A freeborn citizen of the teeming city — raised on the grain dole and the
      games, you know every alley and every man worth knowing, and you have survived
      them all.
    chars:
      Br: '2'
      Ag: '2'
      Int: '2'
      Cun: '2'
      Will: '2'
      Pr: '2'
    fields:
    - label: Wound Threshold
      text: 10 + Brawn
    - label: Strain Threshold
      text: 10 + Willpower
    - label: Starting XP
      text: '110'
    - label: Starting Dignitas
      text: '1'
    - label: Starting Skills
      text: One rank in each of two different non-career skills (max 2 at creation).
    - label: Faction Ties
      text: Natural ties to municipal neighborhood wards (*vici*), artisan guilds
        (*collegia fabrum*), mutual-aid burial funds, and partisan Circus colors.
    - label: A Nose for Trouble
      text: Once per session, as an out-of-turn incidental, move one Story Point from
        the GM's pool to the players' pool. The street always finds a way.
    type: statblock
  - name: Freedman
    kind: Libertus — Ex-Slave
    desc: Once property, now free — but the brand of servitude never quite fades.
      You owe duties still to the master who freed you, and you mean to make your
      sons his equals.
    chars:
      Br: '1'
      Ag: '2'
      Int: '3'
      Cun: '2'
      Will: '2'
      Pr: '2'
    fields:
    - label: Wound Threshold
      text: 8 + Brawn
    - label: Strain Threshold
      text: 12 + Willpower
    - label: Starting XP
      text: '100'
    - label: Starting Dignitas
      text: '1'
    - label: Starting Skills
      text: One rank in any single skill, reflecting the trade you were trained to
        (max 2 at creation).
    - label: Faction Ties
      text: Natural ties to ward magistracies (*vicomagistri*), the imperial cult
        of Augustus (*seviri Augustales*), and imperial bureaucratic secretariats.
    - label: The Master's Education
      text: Once per session, spend a Story Point as an incidental; during your next
        check that turn, count your ranks in the skill used as equal to your Intellect.
        They schooled you well — perhaps too well.
    type: statblock
  - name: Provincial
    kind: Peregrinus — Non-Citizen
    desc: A free man or woman of the provinces — Gaul, Syria, Egypt, Africa — living
      under Rome's peace without its citizenship, and quietly determined to earn,
      buy, or marry your way to it.
    chars:
      Br: '2'
      Ag: '3'
      Int: '1'
      Cun: '2'
      Will: '2'
      Pr: '2'
    fields:
    - label: Wound Threshold
      text: 10 + Brawn
    - label: Strain Threshold
      text: 10 + Willpower
    - label: Starting XP
      text: '100'
    - label: Starting Dignitas
      text: '1'
    - label: Starting Skills
      text: One rank in Ranged (Heavy), Riding, or Survival (max 2 at creation).
    - label: Faction Ties
      text: Natural ties to maritime shipping corporations (*corpora naviculariorum*),
        provincial trade embassies, and foreign enclaves in Portus or Trastevere.
    - label: Skills of the Frontier
      text: Once per encounter, add [[advantage]] to a Ranged, Riding, Survival, or
        Perception check in the field. Should your character gain Roman citizenship
        in play (by service, grant, or purchase), raise their Dignitas by 1.
    type: statblock
  - name: Slave
    kind: Servus — Property
    desc: In law you are a thing, not a person — yet the household turns on your skill
      and your silence. You endure, you watch, and you wait for the day the cap of
      freedom is set on your head.
    chars:
      Br: '2'
      Ag: '2'
      Int: '2'
      Cun: '2'
      Will: '3'
      Pr: '1'
    fields:
    - label: Wound Threshold
      text: 8 + Brawn
    - label: Strain Threshold
      text: 12 + Willpower
    - label: Starting XP
      text: '100'
    - label: Starting Dignitas
      text: '0'
    - label: Starting Skills
      text: One rank in Resilience, or in any single skill reflecting your duties
        (max 2 at creation).
    - label: Faction Ties
      text: Natural ties to urban household domestic retinues (*familia urbana*),
        imperial administrative secretariats, and gladiatorial training barracks (*ludi*).
    - label: Unbroken
      text: Add [[boost]] to Discipline and Resilience checks while enslaved, bound,
        imprisoned, or outnumbered. If your character is manumitted in play, they
        become a
    - label: Freedman
      text: (gaining its ability and Dignitas).
    type: statblock
  - name: Barbarian
    kind: From Beyond the Limes
    desc: A German, Briton, Dacian, or Parthian — brought to Rome by trade, treaty,
      or iron chains. To the Romans you are a savage; let them keep thinking so.
    chars:
      Br: '3'
      Ag: '2'
      Int: '2'
      Cun: '2'
      Will: '1'
      Pr: '2'
    fields:
    - label: Wound Threshold
      text: 12 + Brawn
    - label: Strain Threshold
      text: 8 + Willpower
    - label: Starting XP
      text: '100'
    - label: Starting Dignitas
      text: 0 (outsider)
    - label: Starting Skills
      text: One rank in Survival or Melee (max 2 at creation).
    - label: Faction Ties
      text: Natural ties to frontier auxiliary cohorts (*auxilia*), gladiatorial
        barracks troupes (*familiae gladiatoriae*), and tribal clans beyond the imperial
        frontiers (*limes*).
    - label: Untamed Fury
      text: Add [[boost]] to melee combat checks on any round in which your character
        first engages a new target. Civilization has not dulled you.
    type: statblock
  - type: h2
    text: 'Step 3: Choose a Career'
  - type: p
    style: body
    text: A career defines what your character is *trained* to do, independent of
      the archetype (origin) you chose above — cross any origin with any of these
      professions. Players can use any of the careers in the Core Rulebook, create
      their own at GM discretion, or select one of the careers below, each tuned to
      Roman life. As usual, before spending experience during character creation,
      a character may choose **four** of their eight career skills and gain one rank
      in each.
  - type: h4
    text: Advocate
  - type: p
    style: body
    text: 'The orator, lawyer, and teacher: trained in Greek rhetoric to sway juries,
      assemblies, and dinner-parties. Career skills: **Charm, Cool, Deception, Negotiation,
      Knowledge (Law), Knowledge (Rome), Perception, Discipline**. **Faction Connections:**
      Senatorial patronage networks, judicial magistrates, and neighborhood ward tribunals.'
  - type: h4
    text: Centurion / Decurion
  - type: p
    style: body
    text: 'The men (and, in the auxilia, sometimes the chieftains) who lead Rome''s
      soldiers and, often, its politics. Career skills: **Coercion, Cool, Discipline,
      Leadership, Melee, Ranged (Light), Vigilance, Knowledge (Warfare)**. **Faction
      Connections:** Legionary veteran associations, provincial military commands,
      and frontier governors.'
  - type: h4
    text: Cursor
  - type: p
    style: body
    text: 'The imperial post-runner, dispatch courier, and message-bearer — sprinting
      through crowded avenues, riding post-horses along the *viae*, and bearing sensitive
      letters of state or private intrigue. Career skills: **Athletics, Coordination,
      Cool, Discipline, Riding, Streetwise, Survival, Vigilance**. **Faction Connections:**
      The imperial vehicular post (*cursus publicus*), municipal ward-masters, and
      commercial dispatch syndicates.'
  - type: h4
    text: Gladiator
  - type: p
    style: body
    text: 'A fighter of the arena — condemned, enslaved, volunteer, or freed champion
      — schooled in a particular style of spectacular, lethal combat. Career skills:
      **Athletics, Brawl, Coordination, Melee, Charm, Cool, Resilience, Vigilance**.
      **Faction Connections:** Gladiatorial training barracks (*ludi*), equestrian
      troupe-masters (*lanistae*), and partisan circus colors.'
  - type: h4
    text: Medicus
  - type: p
    style: body
    text: 'The physician — army surgeon, arena doctor, or fashionable Greek practitioner
      — skilled in the limited but real medicine of the age. Career skills: **Cool,
      Knowledge (the Gods), Knowledge (Rome), Medicine, Perception, Resilience, Streetwise,
      Vigilance**. **Faction Connections:** Asclepiad healing sanctuaries, gladiatorial
      barracks retinues, and elite aristocratic households.'
  - type: h4
    text: Mercator
  - type: p
    style: body
    text: 'Trader, banker, ship-owner, or tax-farmer — the people who actually move
      the Empire''s wealth and know where every body is buried. Career skills: **Charm,
      Cool, Deception, Negotiation, Streetwise, Knowledge (Rome), Operating, Perception**.
      **Faction Connections:** State contracting syndicates (*societates publicanorum*),
      maritime shipping corporations (*corpora naviculariorum*), and Forum money-changers.'
  - type: h4
    text: Miles / Soldier
  - type: p
    style: body
    text: 'The backbone of the Empire: a professional soldier of a citizen legion,
      drilled in formation fighting, field engineering, and the long march. Career
      skills: **Athletics, Brawl, Discipline, Melee, Ranged (Light), Resilience, Survival,
      Knowledge (Warfare)**. **Faction Connections:** Frontier legionary camps, auxiliary
      cohorts, and veterans'' mutual-aid sodalities.'
  - type: h4
    text: Nobilis
  - type: p
    style: body
    text: 'The aristocrat climbing the *cursus honorum*: lawmaker, judge, provincial
      governor, spider at the center of a web of clients. Career skills: **Charm,
      Coercion, Deception, Leadership, Negotiation, Knowledge (Law), Knowledge (Rome),
      Discipline**. **Faction Connections:** The senatorial order (*ordo senatorius*),
      the imperial council (*consilium principis*), and ancestral client networks.'
  - type: h4
    text: Philosophus / Scholar
  - type: p
    style: body
    text: 'The philosopher, tutor, and keeper of Greek and Latin learning — steeped
      in Stoic or Epicurean ethics, logic, natural history, and disputation, often
      advising powerful households. Career skills: **Charm, Discipline, Knowledge
      (Rome), Knowledge (Law), Knowledge (the Gods), Leadership, Negotiation, Perception**.
      **Faction Connections:** Noble domestic academies, philosophical schools, and
      senatorial opposition circles.'
  - type: h4
    text: Sacerdos / Priest
  - type: p
    style: body
    text: 'Reader of omens, keeper of ritual, intermediary with the gods — and, not
      incidentally, a political power in their own right. Career skills: **Charm,
      Cool, Discipline, Knowledge (the Gods), Knowledge (Rome), Medicine, Vigilance,
      Leadership**. **Faction Connections:** The pontifical and augural colleges (*collegia
      sacerdotum*), civic temple sodalities, and foreign mystery cults.'
  - type: h4
    text: Scriba / Clerk
  - type: p
    style: body
    text: 'The professional secretary, public notary, or household accountant who
      records transactions, drafts official petitions, audits municipal taxes, and
      tracks administrative records. Career skills: **Cool, Deception, Discipline,
      Knowledge (Law), Knowledge (Rome), Negotiation, Perception, Skullduggery**.
      **Faction Connections:** Imperial administrative bureaus (*a libellis*, *ab
      epistulis*), municipal magistrates, and financial syndicates.'
  - type: h4
    text: Explorator
  - type: p
    style: body
    text: 'The scout, spy, and courier — eyes beyond the frontier and ears within
      it. Rome''s intelligence service wore many hats. Career skills: **Deception,
      Perception, Ranged (Light), Riding, Skullduggery, Stealth, Streetwise, Survival**.
      **Faction Connections:** Frontier intelligence units, provincial governors''
      staffs, and cross-border trade networks.'
  - type: sidebar
    title: Status, Not Species
    body:
    - 'Consider noting each character''s legal standing: [[Citizen]] (protected by
      Roman law, cannot lawfully be crucified or flogged), [[Peregrine]] (free provincial,
      not a citizen), [[Freedman]] (*libertus* — an ex-slave who owes duties to a
      former master), or [[Slave]] (property, with no legal person, but often skilled
      and trusted). Status feeds the dice rather than replacing them: it sets a social
      check''s difficulty, adds [[boost]] or [[setback]] before the roll, decides
      who will deign to deal with you at all, and raises or lowers the stakes of being
      caught — see GM Advice.'
  - type: h2
    text: New Skills
  - type: p
    style: lead
    text: Instead of a single general Knowledge skill, this setting uses four Knowledge
      skills tuned to the Roman world. They cover the specialized learning a Roman
      character is likely to have, and let players show different depths of expertise.
      All four are Knowledge skills linked to **Intellect**.
  - type: h3
    text: Knowledge (Rome)
  - type: p
    style: body
    text: The Empire itself — its geography, provinces, peoples, roads, trade, history,
      and the tangle of its politics and bureaucracy. If it concerns how the Roman
      world is put together and who runs it, it falls here.
  - type: h4
    text: Your character should use this skill if…
  - type: list
    items:
    - They want to recall which family controls a province, or who the current governor
      is.
    - They want to plot the fastest road or sea route between two cities.
    - They want to know the correct office to bribe, the right festival to exploit,
      or the going rate for grain.
  - type: h4
    text: Your character should NOT use this skill if…
  - type: list
    items:
    - They want to argue a point of law before a magistrate — use **Knowledge (Law)**.
    - They want to interpret an omen or name a god's festival — use **Knowledge (the
      Gods)**.
    - They want to recall the deployment of a legion in battle — use **Knowledge (Warfare)**
      (a fourth, optional skill for military campaigns; GMs may fold it into Knowledge
      (Rome) for non-military games).
  - type: h3
    text: Knowledge (Law)
  - type: p
    style: body
    text: Roman law was vast, precedent-bound, and the chief weapon of the ambitious.
      This skill covers statute, precedent, contracts, citizenship, inheritance, and
      courtroom procedure.
  - type: h4
    text: Your character should use this skill if…
  - type: list
    items:
    - They want to find the clause that voids a contract or frees a slave.
    - They want to recall whether an action is lawful — and what the penalty is if
      it is not.
    - They want to tie an opponent in procedural knots before a court.
  - type: h4
    text: Your character should NOT use this skill if…
  - type: list
    items:
    - They want to *persuade* a jury rather than cite the law — that is Charm, Coercion,
      or Negotiation (though a Knowledge (Law) check can add [[boost]] to it).
    - They want to recall a historical event — use Knowledge (Rome).
  - type: sidebar
    title: Using Knowledge (Law) in a Trial
    body:
    - Run a Roman trial as a social encounter. Let a successful Knowledge (Law) check
      (difficulty by the obscurity of the point) establish a fact, upgrade the next
      speaker's social check, or add [[setback]] to the opposing advocate. [[Triumph]]
      might unearth a devastating precedent that reframes the case; [[despair]] might
      reveal that your own client is guilty of something worse.
  - type: h3
    text: Knowledge (the Gods)
  - type: p
    style: body
    text: 'The crowded religion of Rome: the Olympian gods and their Roman forms,
      household and state cults, ritual, festivals, omens, the reading of entrails
      and the flight of birds, and the strange new faiths from the East.'
  - type: h4
    text: Your character should use this skill if…
  - type: list
    items:
    - They want to perform a rite correctly — a sacrifice, a purification, a funeral.
    - They want to read an omen, or recognize a bad one others have missed.
    - They want to identify a foreign cult, its practices, and who follows it.
  - type: h4
    text: Your character should NOT use this skill if…
  - type: list
    items:
    - They want to actually cast a spell in a [[Mythic]] Rome — that uses the relevant
      magic skill.
    - They want to heal the sick by mundane means — use Medicine.
  - type: sidebar
    title: Reading Omens (Fated / Mythic Rome)
    body:
    - In a Rome where the gods take a hand, let a character spend a maneuver and make
      a Knowledge (the Gods) check before a major undertaking. On success, the GM
      reveals one true thing about the near future (a boon or a warning); each [[advantage]]
      adds a [[boost]] the party may spend on a related check this session; [[triumph]]
      grants a free Story Point to the players' pool. On a [[despair]], the omen is
      misread — the GM gains a Story Point and a complication.
  - type: h3
    text: Knowledge (Warfare)
  - type: p
    style: body
    text: 'The science and practice of arms across the Mediterranean: legionary drill,
      siegecraft, auxiliary tactics, barbarian military customs, logistics, and naval
      warfare.'
  - type: h4
    text: Your character should use this skill if…
  - type: list
    items:
    - They want to assess enemy troop dispositions, fortifications, or marching order.
    - They want to construct a fortified marching camp, siege ramp, or ballista battery.
    - They want to recall the battle honors, doctrines, or historical campaigns of
      a specific legion.
  - type: h4
    text: Your character should NOT use this skill if…
  - type: list
    items:
    - They want to lead soldiers under direct fire in combat — use **Leadership**
      or **Discipline**.
    - They want to navigate provincial road networks or recall political borders —
      use **Knowledge (Rome)**.
  - type: h2
    text: New Talents
  - type: p
    style: lead
    text: The following talents suit Roman characters. They use the standard talent
      format; where a talent grants a career skill, it does so only when the character
      gains the talent.
  - type: h3
    text: Tier 1
  - type: h4
    text: Testudo
  - type: p
    style: body
    text: '**Tier:** 1   **Activation:** Active (Maneuver)   **Ranked:** No'
  - type: p
    style: body
    text: While your character is engaged with at least one ally who also has this
      talent, they may form a shield-wall. Until the start of your character's next
      turn, they and each such ally increase their melee and ranged defense by 1 (to
      a maximum of 2), but may not move.
  - type: h4
    text: Client Network
  - type: p
    style: body
    text: '**Tier:** 1   **Activation:** Passive   **Ranked:** No'
  - type: p
    style: body
    text: When your character takes this talent, they gain Streetwise or Knowledge
      (Rome) as a career skill. In addition, once per session they may call on a client
      or patron to collect a small favor — lodging, a meal, a message carried, a door
      left unlocked — even if none is owed.
  - type: h4
    text: Legion Veteran
  - type: p
    style: body
    text: '**Tier:** 1   **Activation:** Passive   **Ranked:** No'
  - type: p
    style: body
    text: When your character takes this talent, they gain Discipline or Melee as
      a career skill. In addition, once per session they may collect a small favor
      from a current or former soldier of the legions, even if none is owed.
  - type: h4
    text: Freedman's Hustle
  - type: p
    style: body
    text: '**Tier:** 1   **Activation:** Passive   **Ranked:** No'
  - type: p
    style: body
    text: When your character takes this talent, they gain Negotiation or Skullduggery
      as a career skill. In addition, once per session they may collect a small favor
      from a fellow freedman or slave in a Roman household, even if none is owed.
  - type: h4
    text: Gladiatorial Training
  - type: p
    style: body
    text: '**Tier:** 1   **Activation:** Passive   **Ranked:** No'
  - type: p
    style: body
    text: Your character treats one chosen arena weapon type (sword, trident, net,
      or shield) as having the Accurate 1 quality, and may re-roll the Critical Injury
      once when striking with it (keeping the result of their choice).
  - type: h4
    text: Morning Clients
  - type: p
    style: body
    text: '**Tier:** 1   **Activation:** Passive   **Ranked:** No'
  - type: p
    style: body
    text: 'At the start of each session, your character has a number of banked Favors
      equal to their Dignitas (minimum 1), gathered from the petty clients who attend
      their morning *salutatio*. This is a fresh allotment each session: unused Favors
      do not accumulate or carry over.'
  - type: h4
    text: Nomenclator's Whisper
  - type: p
    style: body
    text: '**Tier:** 1   **Activation:** Active (Incidental)   **Ranked:** No'
  - type: p
    style: body
    text: 'Once per social encounter, your character (or their accompanying *nomenclator*
      slave) recalls a stranger''s name, family, and weakness: make an Average Knowledge
      (Rome) check; on success, immediately learn one Strength or Flaw of a present
      character without spending [[advantage]].'
  - type: h4
    text: Publican's Agent
  - type: p
    style: body
    text: '**Tier:** 1   **Activation:** Passive   **Ranked:** No'
  - type: p
    style: body
    text: When your character takes this talent, they gain Negotiation or Knowledge
      (Rome) as a career skill. In addition, once per session they may collect a small
      favor from a commercial syndicate, tax bureau, or customs house (*portorium*),
      even if none is owed.
  - type: h4
    text: Circus Partisan
  - type: p
    style: body
    text: '**Tier:** 1   **Activation:** Passive   **Ranked:** No'
  - type: p
    style: body
    text: When your character takes this talent, they gain Athletics or Charm as a
      career skill. In addition, once per session they may collect a small favor from
      a circus faction (*factio*) or gladiatorial barracks (*ludus*), even if none
      is owed.
  - type: h4
    text: Temple Acolyte
  - type: p
    style: body
    text: '**Tier:** 1   **Activation:** Passive   **Ranked:** No'
  - type: p
    style: body
    text: When your character takes this talent, they gain Knowledge (the Gods) or
      Discipline as a career skill. In addition, once per session they may collect
      a small favor from a civic priestly college or consecrated temple, even if none
      is owed.
  - type: h4
    text: Initiate of the Mysteries
  - type: p
    style: body
    text: '**Tier:** 1   **Activation:** Passive   **Ranked:** No'
  - type: p
    style: body
    text: When your character takes this talent, they gain Knowledge (the Gods) or
      Streetwise as a career skill. In addition, once per session they may collect
      a small favor from an Isiac congregation, Mithraic cell, or foreign diaspora
      community, even if none is owed.
  - type: h3
    text: Tier 2
  - type: h4
    text: Pilum Volley
  - type: p
    style: body
    text: '**Tier:** 2   **Activation:** Active (Incidental)   **Ranked:** No'
  - type: p
    style: body
    text: Once per encounter, immediately before making a ranged combat check with
      a thrown javelin or *pilum*, your character may suffer 2 strain. If the attack
      hits, the target's shield (if any) is rendered useless until they spend a maneuver
      to free it, and the attack gains Pierce 2.
  - type: h4
    text: Field Engineer
  - type: p
    style: body
    text: '**Tier:** 2   **Activation:** Passive   **Ranked:** No'
  - type: p
    style: body
    text: Mechanics, Survival, and Knowledge (Warfare) are now career skills for your
      character. Once per session, given tools and an hour, they may improvise a bridge,
      rampart, ram, or siege work sufficient for the scene.
  - type: h4
    text: Senatorial Connections
  - type: p
    style: body
    text: '**Tier:** 2   **Activation:** Passive   **Ranked:** No'
  - type: p
    style: body
    text: Charm, Deception, and Knowledge (Rome) are now career skills for your character.
      Once per session, they may spend a Story Point to have a person of senatorial
      or equestrian rank owe them an audience.
  - type: h4
    text: Stoic Discipline
  - type: p
    style: body
    text: '**Tier:** 2   **Activation:** Passive   **Ranked:** Yes'
  - type: p
    style: body
    text: Once per encounter per rank of this talent, when your character suffers
      strain, they may reduce that strain by 2.
  - type: h4
    text: Captatio Benevolentiae
  - type: p
    style: body
    text: '**Tier:** 2   **Activation:** Active (Maneuver)   **Ranked:** No'
  - type: p
    style: body
    text: 'When your character opens a speech or social encounter, they may make this
      disarming overture: add [[boost boost]] to their first social check, and remove
      [[setback]] from it equal to their ranks in Charm.'
  - type: h4
    text: Cross-Examine
  - type: p
    style: body
    text: '**Tier:** 2   **Activation:** Active (Action)   **Ranked:** No'
  - type: p
    style: body
    text: Make an opposed Coercion or Deception check against a target. On success,
      you learn whether a statement they made is a lie, and inflict strain as normal;
      with [[advantage advantage]], flip one of the target's banked [[boost]] (a witness,
      an alibi) into a [[setback]].
  - type: h4
    text: Filibuster
  - type: p
    style: body
    text: '**Tier:** 2   **Activation:** Active (Action)   **Ranked:** Yes'
  - type: p
    style: body
    text: Your character may speak to run out the clock. Once per encounter per rank,
      make a Resilience check; each success adds a “round” to the time a formal body
      must wait before it can vote or act.
  - type: h3
    text: Tier 3
  - type: h4
    text: Centurion's Command
  - type: p
    style: body
