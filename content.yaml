  - type: h4
    text: Pater Patriae
  - type: p
    style: body
    text: '**Tier:** 5   **Activation:** Passive   **Ranked:** No'
  - type: p
    style: body
    text: Allies within earshot of your character add [[boost]] to all social checks,
      and treat crowds as one step more sympathetic. Once per session, your character
      may spend a Story Point to cause a hostile crowd or committee to grant them
