  - type: p
    style: small
    text: |-
      **Adversaries:** *Street Tough* minion groups (both sides), *Lictor* (for *viatores* and any magistrate's attendants), *Legionary* (Cominius's veterans), *Senator / Patrician* (the nobles on the Senate-house steps). **Rewards:** 15–20 XP. **Win** (ending A, or B with Heat never above 4): 20 XP; +1 Dignitas for the PC who carried the decisive appeal; a Favor from Titinius and one from the Quirina — a door open to the PCs in every village that sent men. **Costly win** (B with blood, or a law carried through D): 15–20 XP; +1 Dignitas with the plebs, a lasting enemy in Veturius's house; any PC who struck Plautius or the augur loses 1 Dignitas instead. **Loss** (C or E): 15 XP and no Dignitas gained; claims honored still bank a Favor from that side, and every claim refused costs 1 Dignitas for breaking faith. Whoever holds Otacilius's tablet at the end banks a Favor from Veturius — or the makings of a prosecution.
  - type: endnotes
    title: Notes
    items:
    - "The prodigy of 114 BCE, in which the knight's daughter Helvia and her horse were struck down and stripped by lightning while travelling toward Apulia: Plutarch, *Roman Questions* 83; Orosius 5.15.20–22; Obsequens 37; Livy, *Periochae* 63. The narrative is in A. H. J. Greenidge, *A History of Rome During the Later Republic and Early Principate*, vol. 1 (1904), on the Vestal trials of 114–113 BCE. On the haruspices' reading (nakedness meaning a broken vow, the horse meaning the knights), and its timing just before the pontiffs took up the case, see Federico Santangelo, *Divination, Prediction and the End of the Roman Republic* (2013) (paraphrased)."
    - "Cicero, *Pro Milone* 59: under no law were slaves examined against their master except in a case of incest (*de servis nulla lege quaestio est in dominum nisi de incestu*; some editors bracket the sentence). In 114 BCE the informer was the slave of a knight (the name is often restored as Barrus), and he named his own master: Plutarch, *Roman Questions* 83; Greenidge, *History of Rome*, vol. 1. A slave of the orator M. Antonius was racked, scourged, and burned in the same affair without incriminating his master: Valerius Maximus 6.8.1."
    - "Livy 8.15.7–8 (337 BCE): the Vestal Minucia, first suspected for dressing more elegantly than was proper, was denounced to the pontiffs by a slave informer (*ab indice servo*). They ordered her to abstain from the rites and to keep her household in her power (*familiam in potestate habere*), and she was buried alive by the Colline Gate, to the right of the paved road, in the *Campus Sceleratus*. On the purpose of the order (to keep her slaves available for examination), see Robin Lorsch Wildfang, *Rome's Vestal Virgins* (2006), on the *crimen incesti* (paraphrased). The witnesses in Domitian's prosecution of Cornelia were tortured: Suetonius, *Domitian* 8.4."
    - "On the rows of shops along the Via Sacra and the Nova Via that belonged to the Atrium Vestae and were let for rent, some of them absorbed in the Flavian rebuilding: Wildfang, *Rome's Vestal Virgins* (2006), on the order's property (paraphrased). The knight who manages the leases is invented."
    - "Pliny the Younger, *Panegyricus* 42: Trajan is praised for freeing every household from the “domestic accuser” (*accusatore domestico*) and for ending what Pliny calls a “servile war,” a time when slaves had been the emperor's friends and their masters had not."
    - "Pliny the Younger, *Letters* 4.11; Suetonius, *Domitian* 8.3–4. Domitian, as *Pontifex Maximus*, summoned the pontiffs to his Alban villa instead of the Regia and condemned the Chief Vestal Cornelia in her absence, without hearing her. Earlier in the reign, the Vestals Varronilla and the Oculatae sisters had been convicted and allowed to choose how they died, and their lovers were banished. The date of Cornelia's burial is disputed (c. 89–91 CE)."
    - "Pliny the Younger, *Letters* 4.11; Suetonius, *Domitian* 8.4. Valerius Licinianus, a man of praetorian rank, confessed while the case against him was still unproven, and he was granted exile rather than death."
    - "Pliny the Younger, *Letters* 4.11, trans. William Melmoth, rev. F. C. T. Bosanquet, *Letters of Pliny* (Project Gutenberg #2811). The same letter declines to say whether Cornelia was innocent or guilty."
    - "Tacitus, *Annals* 2.34 (16 CE). Urgulania, a friend of Livia, refused to appear as a witness, and a praetor was sent to question her at home, even though by old custom the Vestal Virgins were heard in the Forum and the courts whenever they gave evidence."
    - "Plutarch, *Numa* 10; Dionysius of Halicarnassus, *Roman Antiquities* 2.67; Livy 8.15.8. The condemned Vestal was carried bound in a closed litter, as in a funeral procession, to the field by the Colline Gate. She went down a ladder into an underground chamber furnished with a bed, a lamp, and a little bread, water, milk, and oil, and the opening was filled in. Summarized in Wildfang, *Rome's Vestal Virgins* (2006) (paraphrased)."
    - "Pliny the Younger, *Letters* 4.11, trans. Melmoth, rev. Bosanquet (Project Gutenberg #2811)."
    - "Pliny the Younger, *Letters* 4.11, trans. Melmoth, rev. Bosanquet (Project Gutenberg #2811), on the Roman knight Celer, scourged in the Forum as Cornelia's alleged lover. On her lovers being whipped to death with rods in the Comitium, see Suetonius, *Domitian* 8.4, trans. Alexander Thomson, rev. T. Forester (Project Gutenberg #6400)."
    - "Pliny the Younger, *Letters* 2.11 (the Senate's trial of Marius Priscus, proconsul of Africa, January 100 CE), trans. William Melmoth, rev. W. M. L. Hutchinson, Loeb Classical Library (1915) — the quotation is from this translation."
    - "Vegetius, *Epitoma rei militaris* 4.39 — sailing uncertain and dangerous from mid-September, and the seas closed from the third day before the Ides of November (11 November) to the sixth day before the Ides of March (10 March)."
    - "Ovid, *Tristia* 5.11.15 — the relegated poet keeps his life, his wealth, and his citizenship. Deportation to an island as an innovation of Tiberius: paraphrasing Gordon P. Kelly, *A History of Exile in the Roman Republic* (Cambridge, 2006), ch. 2."
    - "Tacitus, *Annals* 4.20 — the accusers' legal quarter of a condemned man's estate. On informers hoping for that share: paraphrasing John S. McHugh, *Rome's Enemies Within: Imperial Conspiracies and Assassinations in the Roman Empire during the First Century AD*."
    - "*Digest* 48.19.5 pr. (Ulpian), reporting Trajan's rescript to Julius Fronto that an absent man is not to be condemned on a criminal charge. The later practice of registering and holding an absent defendant's property is described in *Digest* 48.17.1 (Marcian); here it is moved a century early as Crispinus's motion."
    - "Pliny the Younger, *Letters* 3.9 — the Senate's proceedings against the estate of Caecilius Classicus, proconsul of Baetica, who died before he could be tried. The Senate gave his daughter what he had owned before his governorship, divided the rest among his victims, and made his creditors repay what he had paid them since his return."
    - "Cassius Dio, *Roman History* 56.27.2–3 — Augustus's limits on an exile's ships, slaves and freedmen, and fortune (12 CE). On the decree as a check on carrying wealth into exile: paraphrasing Kelly, *A History of Exile in the Roman Republic*."
    - "On transfers by written entry in a banker's books, and the banker's duty to keep complete accounts and produce them (*Digest* 2.13): paraphrasing Koenraad Verboven and Paul Erdkamp (eds.), *Law and Economic Performance in the Roman World* (Brill, 2022)."
    - "*Digest* 22.5.4 (Paul) — patron and freedman cannot be compelled to give criminal evidence against each other. Paraphrasing Egbert Koops, “Masters and Freedmen: Junian Latins and the Struggle for Citizenship,” in G. de Kleijn and S. Benoist (eds.), *Integration in Rome and in the Roman World* (Brill, 2014)."
    - "Tabula Heracleensis (*CIL* I² 593), the clause on wagons in the streets of Rome — no wagon to be driven after sunrise or before the tenth hour of the day, with exceptions for building temples and public works, demolition under public contract, and the wagons of priests, triumphs, and games."
    - "On the *naves codicariae* and the up-to-three-day haul from Portus to Rome: paraphrasing David J. Mattingly and Gregory S. Aldrete, “The Feeding of Imperial Rome: The Mechanics of the Food Supply System,” in J. Coulston and H. Dodge (eds.), *Ancient Rome: The Archaeology of the Eternal City* (Oxford, 2000)."
    - "Gaius, *Institutes* 1.37 — under the *lex Aelia Sentia*, a manumission made to defraud creditors is void."
    - "Kelly, *A History of Exile in the Roman Republic* — exiles' devices against confiscation: buying costly slaves as portable wealth, estates in free cities, friends buying at the auction, and informal manumission before departure, as Cicero arranged in 58 BCE without being sure it would hold. Paraphrased."
    - "Pliny the Younger, *Letters* 3.9 (the case of Caecilius Classicus), trans. Melmoth, rev. Hutchinson, Loeb Classical Library (1915) — the quotation is from this translation."
    - "Pliny the Younger, *Letters* 2.11 — the consul-designate Julius Ferox's motion to grant Priscus judges provisionally while summoning the men said to have bought innocent blood."
    - "Pliny the Younger, *Letters* 2.11 — the consular Tuccius Cerealis demands that Priscus be notified to attend, and the matter is adjourned to the next meeting of the Senate."
    - "Pliny the Younger, *Letters* 8.14 (to Titius Aristo, on the Senate's vote over the freedmen of Afranius Dexter), trans. William Melmoth, rev. F. C. T. Bosanquet (1895) — the quotation is from this translation. Pliny there insisted that death, banishment, and acquittal be counted as three separate opinions."
    - "Aulus Gellius, *Attic Nights* 14.7.8, reporting Varro — a decree of the Senate made before sunrise or after sunset is not valid."
    - "Pliny the Younger, *Panegyricus* 34–35 — Trajan's public punishment of the informers of Domitian's reign."
    - "Pliny the Younger, *Letters* 2.11 — at the division on Priscus's sentence, those standing by the consuls' chairs went over to Cornutus Tertullus's motion, and the waverers followed."
    - "Tacitus, *Annals* 12.23; Cassius Dio, *Roman History* 52.42.6 — senators might not leave Italy without the emperor's leave, except to visit Sicily and, from Claudius, Narbonese Gaul."
    - "Appian, *Civil Wars* 1.27; George Willis Botsford, *The Roman Assemblies from Their Origin to the End of the Republic* (1909) — on the plebiscites after Gaius Gracchus's death that first let allottees sell their land and then, in 118 BCE, ended the distributions; A. H. J. Greenidge, *A History of Rome During the Later Republic and Early Principate*, vol. I (1904), on the later law of Spurius Thorius."
    - "Plutarch, *Tiberius Gracchus* 10.2, trans. Bernadotte Perrin (Loeb Classical Library, 1921) — on Marcus Octavius's veto of the agrarian bill, 133 BCE."
    - "Greenidge, *History of Rome*, vol. I (1904) — on Octavius's first veto. The same passage describes the country voters streaming into Rome for the vote and Octavius bidding the scribe be silent."
    - "Botsford, *The Roman Assemblies* (1909) — on the contio: private speakers addressing the meeting from below the platform, the president's control of the order and length of speeches, and adjournment. The fixed interval of three market days (*trinundinum*) between promulgation and vote was imposed by the lex Caecilia Didia of 98 BCE; see Francisco Pina Polo, *The Consul at Rome* (2011)."
    - "Plutarch, *Tiberius Gracchus* 10–11 (Perrin); Greenidge, vol. I — the veto delivered by silencing the clerk, the meeting melting away, and, on the next voting day, the voting urns carried off by the party of the rich and a near-riot."
    - "Botsford, *The Roman Assemblies* (1909) — on the tribal assembly: the lot for the tribe of the Latins and for the *principium*, ropes stretched to divide the assembly-place, and the rule that calling the principium ended the right of intercession and of announcing an omen seen while watching the sky."
    - "Ballot laws: the lex Gabinia (139 BCE, elections), lex Cassia (137, trials), and lex Papiria (c. 131/130, legislation); Marius's law of 119 narrowing the gangways, Cicero, *De Legibus* 3.38–39. Botsford (1909) on the tablets marked for *uti rogas* and *antiquo*, the *cistae*, and the *custodes*. On the layout of the *pontes*: Antonio López García, *Running Rome and Its Empire* (2024), and Henrik Mouritsen, *Plebs and Politics in the Late Roman Republic* (2001)."
    - "Botsford, *The Roman Assemblies* (1909) — the tribal returns proclaimed in an order usually drawn by lot; a vote without effect if the president halted the announcement before a majority; every session to begin and end between sunrise and sunset."
    - "Plutarch, *Tiberius Gracchus* 9.5, trans. Perrin (1921) — from Tiberius Gracchus's speeches for the land bill."
    - "Mouritsen, *Plebs and Politics* (2001) — on the *divisores*, first attested in the early first century BCE; on bribes given mostly as promises and aimed at the rural tribes; and on Verres summoning the distributors of every tribe to block Cicero's election as aedile (Cicero, *In Verrem* 1.22–23)."
    - "Greenidge, vol. I — on the urban voters of 133, indifferent or hostile to the land bill and many of them clients of the noble houses, and on the country voters scattering home once the vote was over."
    - "Greenidge, vol. I; Botsford (1909) — on the laws against electoral bribery of 181 BCE (the lex Baebia, ten years' disqualification from office), 166, and 159 (the lex Cornelia Fulvia, a capital penalty, in practice exile), none of which ended the practice."
    - "Plutarch, *Roman Questions* 81 — why a tribune wears no purple, and why his door stands open night and day; Daniel J. Gargola, *The Shape of the Roman Order* (2017), on the rule that tribunes of the plebs might not be absent from the city for more than one night."
    - "Plutarch, *Tiberius Gracchus* 9.2 and 10.3 (Perrin) — the first bill paid holders the value of the land they surrendered; after Octavius's veto, Tiberius withdrew it for a harsher bill without compensation. Greenidge, vol. I, on the redrafting."
    - "Botsford, *The Roman Assemblies* (1909) — on prohibitive omens: an attack of epilepsy vitiated an assembly's business and forced an adjournment, hence the name *morbus comitialis*, the comitial sickness."
    - "Plutarch, *Tiberius Gracchus* 12 (Perrin); Greenidge, vol. I — the deposition of Octavius: the halt after seventeen tribes, the last appeal, Octavius looking to the men of wealth standing together, and his removal from the Rostra by one of Tiberius's freedmen."
    - "Asconius, commentary on Cicero's *Pro Cornelio* (p. 72 Clark); Cassius Dio 36.30 — the tribune Trebellius withdrew his veto of Gabinius's law in 67 BCE after seventeen tribes had voted to depose him. Mouritsen, *Plebs and Politics* (2001), on the limits of tribunician intercession."
    - "Botsford, *The Roman Assemblies* (1909) — on *obnuntiatio*: a president was bound to dismiss the assembly on an augur's or magistrate's report of an evil omen, whatever their relative rank, and the Aelian and Fufian laws (c. 150 BCE) extended the device. For the augur's *alio die*, Cicero, *De Legibus* 2.31 and *Philippics* 2.83."
    - "Plutarch, *Tiberius Gracchus* 14–15 (Perrin); Greenidge, vol. I — Titus Annius's challenge to Tiberius over the deposition, and Tiberius's reply that a tribune's sanctity comes from the people and is forfeited by injuring them."
    - "Plutarch, *Tiberius Gracchus* 19.6, trans. Perrin (1921) — the killing of Tiberius Gracchus and his supporters on the Capitol, 133 BCE."
    - "Botsford, *The Roman Assemblies* (1909) — the Senate's annulment of Saturninus's measures (100 BCE) and of Sextus Titius's agrarian law (99 BCE) as passed by violence or against the intercession."
- title: Lexicon
  part: { title: Appendices }
  blocks:
  - type: p
    style: body
    text: 'A sprinkling of Latin brings the table to Rome. A few of the most useful:'
  - type: list
    items:
    - |-
      **SPQR** — *Senatus Populusque Romanus*, “the Senate and People of Rome,” the state itself; stamped on standards, coins, and buildings.
    - |-
      **Serica / Seres** — the distant land of silk at the eastern edge of the world (China), and its people; known to Rome only through Parthian middlemen and wild rumor.
    - "**Princeps** — “first citizen,” the Emperor's polite title; he pretends not to be a king."
    - |-
      **Cursus honorum** — the “course of offices,” the fixed ladder of political posts (quaestor, aedile, praetor, consul) an ambitious man climbs.
    - |-
      **Patronus / Cliens** — patron and client; the bond of protection and loyalty that structures all society.
    - |-
      **Salutatio** — the dawn reception where clients call on their patron to pay respects and ask favors.
    - |-
      **Civis Romanus sum** — “I am a Roman citizen”; the phrase that demands legal protection and the right of appeal.
    - |-
      **Legio / Centuria / Contubernium** — legion (~5,000 men) / century (~80, led by a centurion) / tent-group (8, the squad).
    - "**Pilum / Gladius / Scutum** — javelin / short sword / shield: the legionary's core kit."
    - '**Testudo** — “tortoise,” the shield formation that covers a unit front and top.'
    - '**Limes** — the fortified frontier of the Empire.'
    - '**Auxilia** — non-citizen support troops; earn citizenship on discharge.'
    - |-
      **Denarius / Sesterce / As / Aureus** — the silver, brass, copper, and gold of Roman coinage (1 aureus = 25 denarii = 100 sesterces = 400 asses).
    - |-
      **Panem et circenses** — “bread and circuses”: the grain dole and public games that kept the mob content.
    - |-
      **Editor** — the sponsor who pays for and presides over the games; he decides *missio* (mercy) with the crowd.
    - |-
      **Missio / Rudis** — the reprieve of a defeated gladiator / the wooden sword awarded at his freedom.
    - '**Lanista / Familia / Ludus** — the owner-trainer / the troupe / the gladiator school.'
    - |-
      **Collegium** — a guild or association (trade, burial, religious) — and often a front for a street gang.
    - |-
      **Vigiles / Cohortes Urbanae** — the night-watch/fire-brigade and the city military police.
    - |-
      **Frumentarius** — a soldier-courier who doubled as the Empire's nearest thing to a secret agent.
    - '**Libertus / Peregrinus** — a freed slave / a free non-citizen provincial.'
    - '**Pater familias** — the male head of a household, with legal power over its members.'
    - |-
      **Toga / Tunica / Stola** — the citizen's formal wrap / everyday garment / a married woman's dress.
    - |-
      **Haruspex / Augur** — a reader of entrails / a reader of birds and omens; official diviners of the state.
    - |-
      **Imperium** — the formal power to command (armies, the law); held by consuls, praetors, governors, and the Emperor.
    - '**Ave / Vale / Salve** — “hail” / “farewell” / “be well” (a common greeting).'
  - type: p
    style: body
    text: — *Roma invicta.* —
- title: A Gazetteer of the Roman World
  blocks:
  - type: p
    style: lead
    text: |-
      Rome is two geographies at once: the city within the walls, carved into *regiones* and *vici*, and the empire beyond, carved into *provinciae*. This gazetteer gives you both at a glance — enough to place a scene, name a street, or send the party to the edge of the world.
  - type: h3
    text: 'The City: Regiones & Quarters'
  - type: p
    style: body
    text: |-
      Augustus divided the city into **fourteen *regiones*** (numbered regions), each cut into **_vici_** (neighborhood wards with their own local officials and crossroads shrines). Romans still navigate by the older landmarks, though — the seven hills, the Forum, and the river. Use *regio* as the in-world word for “district” and *vicus* for “neighborhood.”
  - type: p
    style: body
    text: |-
      **Forum Romanum (*the Forum*).** The paved heart of the city, in the valley below the Palatine and Capitoline. Temples, law-courts, shops, and senators jostle along the Via Sacra; at its head stand the *curia* (senate house), the *comitium*, and the *rostra* from which speakers work the crowd. *Every public drama happens here — elections, *contiones*, trials, the funerals of the great — and so does the bloodshed: more than one Roman generation has seen the Forum run red. Stage speeches, riots, and assassinations here.*
  - type: statblock
    name: Caecilia Attica
    kind: Nemesis
    desc: |-
      A freedwoman grown into one of the Forum's great *argentarii* (bankers). She lends to senators against their next province and keeps their secrets as collateral; her ledger is a map of who truly owns Rome.
    chars:
      Br: '1'
      Ag: '2'
      Int: '4'
      Cun: '4'
      Will: '3'
      Pr: '3'
    derived:
      Soak: '2'
      W.T.: '13'
      S.T.: '16'
      Def (M/R): 0/1
    fields:
    - label: Motivations
      text: |-
        Desire: security no patron can revoke. Fear: a defaulted magnate dragging her down. Strength: half the Senate is in her debt. Flaw: she cannot resist a profitable risk.
    - label: Skills
      text: Negotiation 4, Knowledge (Law) 3, Knowledge (Rome) 3, Deception 3, Coercion 2, Charm 2.
    - label: Talents
      text: Adversary 2; Morning Clients; a dossier on every client.
    - label: Abilities
      text: |-
        **The Ledger:** she knows the true finances of the great, and can call a debt at the worst possible moment — add [[boost boost]] to any social check against a man who owes her. **Credit as a Weapon:** she can bankroll the party, or quietly cut off their rival's line of credit.
  - type: p
    style: body
    text: |-
      **The Palatine (*Palatium*).** The hill above the Forum, the most fashionable address in Rome — dense with senatorial *domus* rather than tenements, and hung with the myth of Romulus, whose reed hut was piously preserved here. *Under the emperors this is *the* imperial residence (the word *palace* is its name); in the default era it is the seat of the ruling house. A PC invited up the Palatine has arrived — or is walking into a trap.*
  - type: statblock
    name: Hyacinthus
    kind: Nemesis
    desc: |-
      An imperial freedman, born a slave, who keeps the emperor's accounts as *a rationibus* — and therefore holds the purse of the world. Smooth, tireless, richer than most senators, and hated by all of them.
    chars:
      Br: '1'
      Ag: '2'
      Int: '4'
      Cun: '4'
      Will: '3'
      Pr: '3'
    derived:
      Soak: '2'
      W.T.: '13'
      S.T.: '18'
      Def (M/R): 0/1
    fields:
    - label: Motivations
      text: |-
        Desire: to be indispensable to the throne. Fear: a new emperor, a new favourite. Strength: he controls access and money. Flaw: a freedman's hunger for the respect birth denies him.
    - label: Skills
      text: |-
        Knowledge (Rome) 4, Knowledge (Law) 3, Negotiation 3, Deception 3, Charm 2, Vigilance 3, Cool 2.
    - label: Talents
      text: Adversary 2; Plausible Deniability; Nobody's Fool.
    - label: Abilities
      text: |-
        **The Keys to the Purse:** he can fund or ruin an enterprise with a stroke of the stylus, and adds [[success]] to any check turning on money or palace access. **The Emperor's Ear:** a word from him carries the weight of the princeps — treat as the *Emperor's known wish* against those he opposes.
  - type: p
    style: body
    text: |-
      **The Capitoline (*Capitolium & the arx*).** The steep citadel-hill looming over the Forum, crowned by the great Temple of Jupiter Optimus Maximus and the Temple of Concord; its northern summit, the *arx*, holds the *auguraculum* where the augurs read the sky. *The religious summit of the state: consuls take office and triumphs end here with a sacrifice to Jupiter. It has also been a killing-ground. A natural site for an omen, a vow, or a last stand.*
  - type: p
    style: body
    text: |-
      **The Subura (*Subura*).** The crowded, low-lying warren between the Esquiline, Viminal, and Quirinal: teetering *insulae*, workshops, taverns, brothels, and markets, loud and filthy and perpetually about to catch fire. Even Caesar grew up here. *Rome's great slum and underworld — the place for a fence, a hired knife, a safe house, or a chase across the rooftops. Fire is always one spark away.*
  - type: statblock
    name: Rufio Scaeva
    kind: Nemesis
    desc: |-
      A scarred freedman who runs a *collegium* — nominally a burial-club and crossroads shrine, in truth the organized muscle of the quarter. He delivers votes, protection, arson, and silence, and the aediles look the other way.
    chars:
      Br: '3'
      Ag: '3'
      Int: '2'
      Cun: '4'
      Will: '3'
      Pr: '3'
    derived:
      Soak: '4'
      W.T.: '16'
      Def (M/R): 1/0
    fields:
    - label: Motivations
      text: |-
        Desire: to be the man the quarter needs. Fear: a rival collegium. Strength: a hundred clients who owe him. Flaw: pride in his own legend.
    - label: Skills
      text: Brawl 3, Melee 2, Coercion 3, Streetwise 4, Deception 2, Knowledge (Rome) 2, Vigilance 3.
    - label: Talents
      text: Adversary 2; Morning Clients; a standing minion group of *Street Toughs*.
    - label: Abilities
      text: |-
        **The Quarter Is His:** anywhere in the Subura, Rufio adds [[boost boost]] to social and Streetwise checks and always knows who is new; strangers who cross him draw his toughs within a scene. **Fire as Argument:** he can arrange a “accidental” tenement fire as a threat or a distraction.
  - type: p
    style: body
    text: |-
      **The Aventine (*Mons Aventinus*).** The hill south of the Forum, outside the old pomerium, and from early times the plebeian quarter of the city. Home to the cults of Ceres and Diana and to the long memory of plebeian revolt; Gaius Gracchus made his last armed stand here. *The people's hill, the counterweight to the Palatine. Where a tribune raises the mob, where a secession begins, where the poor have numbers on their side.*
  - type: p
    style: body
    text: |-
      **The Esquiline, Quirinal, Viminal & Caelian (*the lesser hills*).** The remaining canonical hills: the Esquiline a place of contrasts (old paupers' graveyards on its edge, luxury *horti* within); the Quirinal a respectable temple-dotted ridge; the Viminal the quiet, small one; the Caelian a mixed quarter growing ever more aristocratic toward the Colosseum valley. *Good “filler” districts — residential, mixed, each with a different social flavour. Drop a patron's *domus*, a philosopher's rented rooms, or a quiet murder here.*
  - type: statblock
    name: Verax the Thracian
    kind: Nemesis
    desc: |-
      A captured warrior turned champion of the arena — the finest blade in the ludus, one great bout from the wooden sword of freedom. Courteous, patient, and lethal; the crowd screams his name.
    chars:
      Br: '4'
      Ag: '4'
      Int: '2'
      Cun: '3'
      Will: '4'
      Pr: '2'
    derived:
      Soak: '5'
      W.T.: '18'
      Def (M/R): 1/1
    fields:
    - label: Motivations
      text: |-
        Desire: the *rudis* — freedom. Fear: dying unremembered. Strength: unmatched skill of arms. Flaw: a debt of honour to a fellow fighter.
    - label: Skills
      text: Melee 4, Brawl 3, Athletics 3, Coordination 2, Cool 3, Resilience 3.
    - label: Talents
      text: Adversary 3; Gladiatorial Training; Parry 3; Feint.
    - label: Abilities
      text: |-
        **Showman's Kill:** when he wins a melee check he may spend [[advantage]]/[[triumph]] to work the crowd, swinging the race-day/arena mood and the editor's *missio* vote. **The Crowd's Favourite:** so long as the mob loves him, even his master dares not simply dispose of him.
  - type: statblock
    name: Hermogenes
    kind: Rival
    desc: |-
      A Greek physician of the Hippocratic schools, a freedman attached to a great house — and thus privy to every illness, pregnancy, poisoning, and deathbed secret under its roof. Indispensable, and therefore dangerous.
    chars:
      Br: '1'
      Ag: '3'
      Int: '4'
      Cun: '3'
      Will: '3'
      Pr: '2'
    derived:
      Soak: '2'
      W.T.: '12'
      Def (M/R): 0/1
    fields:
    - label: Motivations
      text: |-
        Desire: knowledge, and a patron worth serving. Fear: being blamed for a death. Strength: his masters' lives are in his hands. Flaw: intellectual vanity.
    - label: Skills
      text: Medicine 4, Knowledge (the Gods) 2, Knowledge (Rome) 2, Deception 2, Vigilance 2, Cool 2.
    - label: Talents
      text: Adversary 1; superb Medicine; knows every house's secrets.
    - label: Abilities
      text: |-
        **The Healer's Hand:** removes [[setback]] from Medicine and may heal strain or wounds beyond a kit's normal use. **He Knows What Ails the House:** a reservoir of intimate secrets — and the quiet skill to make a death look natural, should he choose.
  - type: p
    style: body
    text: |-
      **The Campus Martius (*the Field of Mars*).** The broad Tiber-bend plain *outside* the pomerium, sacred to Mars: muster-ground and drill-field, the *ovile* where the centuriate assembly votes, and the temples (Apollo, Bellona) where the Senate meets generals who may not enter the city under arms. *The threshold between war and the city. Armies assemble here, triumphs form up here, and a general who wants his triumph waits here — barred, like his soldiers, from crossing the sacred line.*
  - type: p
    style: body
    text: |-
      **Transtiberim (*Trans Tiberim*).** The working quarter on the right bank, across the river: docks, warehouses, tanneries, and a mixed immigrant population — Jews, Syrians, and sailors — connected by the bridges and the island. Augustus's fourteenth region. *The “wrong side of the river”: the port economy, foreign cults, smuggling, and communities that keep their own customs. A place to land cargo quietly or vanish into a crowd.*
  - type: statblock
    name: Thaïs of the Iseum
    kind: Nemesis
    desc: |-
      A freedwoman priestess of Isis who presides over the dockside temple and, through it, the right-bank trade in secrets, contraband, and foreign gods. Serene, generous, and utterly informed.
    chars:
      Br: '1'
      Ag: '2'
      Int: '3'
      Cun: '4'
      Will: '4'
      Pr: '4'
    derived:
      Soak: '2'
      W.T.: '14'
      S.T.: '16'
      Def (M/R): 0/1
    fields:
    - label: Motivations
      text: |-
        Desire: a sanctuary for her people and her goddess. Fear: a crackdown on “foreign superstition.” Strength: a web of dockers, sailors, and devotees. Flaw: she will risk much for a fellow worshipper.
    - label: Skills
      text: |-
        Charm 3, Deception 3, Knowledge (the Gods) 3, Knowledge (Rome) 2, Streetwise 3, Vigilance 2.
    - label: Talents
      text: Adversary 2; Nobody's Fool; a Web-of-Letters among the docks.
    - label: Abilities
      text: |-
        **What Comes Ashore:** once per session she can tell you who shipped what, and when — or make a cargo quietly disappear. **The Goddess Sees:** in a [[Fated]] Rome her omens feed the party's Story Points; her devotees will hide a hunted man.
  - type: p
    style: body
    text: |-
      **The Markets: Boarium, Velabrum & Argiletum (*the trade quarters*).** The commercial connective tissue of the lower city: the Forum Boarium (cattle market and river port beside the ancient temples of Hercules and Portunus), the Velabrum (a corridor of food- and oil-sellers), and the Argiletum (the “book street” of booksellers and craftsmen running up toward the Subura). *Where goods and gossip change hands. Shops, warehouses, a bookseller who copies more than he should, and the river wharves where everything enters the city.*
  - type: p
    style: body
    text: |-
      **The Circus Maximus (*Circus Maximus*).** The vast chariot-racing arena in the valley between Palatine and Aventine, ringed by shops, food-stalls, and bars, seating a crowd that can be counted in the hundreds of thousands. *The one place the whole city gathers and the ruler must show his face. Run the races (see *The Arena & the Races*), and remember that a crowd this size is a political force — acclamation here is the Imperial *contio*.*
  - type: statblock
    name: Eutyches the Green
    kind: Rival
    desc: |-
      The reigning charioteer of the Green faction — a slave-born idol worth more than a senator's estate, cheered by tens of thousands who would riot at his death. Fearless to the point of madness.
    chars:
      Br: '3'
      Ag: '4'
      Int: '2'
      Cun: '3'
      Will: '3'
      Pr: '3'
    derived:
      Soak: '3'
      W.T.: '15'
      Def (M/R): 1/1
    fields:
    - label: Motivations
      text: |-
        Desire: freedom, and to be remembered. Fear: the fall that cripples. Strength: the adoration of the mob. Flaw: recklessness.
    - label: Skills
      text: Driving 4, Athletics 3, Coordination 3, Cool 2, Charm 2.
    - label: Talents
      text: Adversary 1; Full Throttle; Defensive Driving.
    - label: Abilities
      text: |-
        **Darling of the Crowd:** at the Circus the faithful are his — his word can calm or inflame a crowd of thousands (feed or spend the race-day mood pool). **No Fear of the Turn:** he may suffer strain to attempt driving stunts no sane man would.
  - type: sidebar
    title: "The Pomerium: Rome's Sacred Line"
    body:
    - |-
      The **pomerium** is not a wall but a line — the augurally-defined sacred boundary that separates the *urbs* (the holy city) from the *ager* (the land outside). It is the master rule of Roman space. Inside it, military *imperium* cannot be exercised: soldiers may not march under arms, weapons are set aside, a general lays down his command, and the dead may not be buried. Crossing it changes a magistrate's powers and his dress. This is why a triumph-seeking general and his army wait on the Campus Martius, why the Senate meets commanders in temples outside the line, and why an armed intrusion into the city is not a mere crime but a sacrilege — a fact worth a whole adventure.
  - type: h3
    text: The Provinces of the Empire
  - type: p
    style: body
    text: |-
      To a Roman of the Republic, a *provincia* was not a place but a **task** — a sphere of command the Senate handed a magistrate: an army, a named enemy, an enemy homeland. Only slowly did the word harden into *territory*. By the age of the emperors the empire is a collection of provinces, and they come in two kinds, plus one that is neither.
  - type: list
    items:
    - |-
      **Imperial provinces** — the frontier commands where the legions stand. They are the emperor's, run for him by a *legatus Augustus pro praetore* who serves at his pleasure. Power, danger, and armies live here.
    - |-
      **Senatorial provinces** — the pacified interior, allotted by the Senate to an ex-consul or ex-praetor as *proconsul* for a single year, usually with no legion. Wealth and prestige, little force.
    - |-
      **Aegyptus (Egypt)** — neither: the emperor's private domain, run by an equestrian prefect. No senator may even enter without his leave, for whoever holds Egypt's grain holds Rome by the throat.
  - type: p
    style: body
    text: |-
      **Italia** — *the core, not a province.* The citizen heartland — no tribute, no governor, source of soldiers and legitimacy. Inside it lies Rome, and inside Rome the pomerium. **Rome wants:** Soldiers, legitimacy, grain, and the senatorial class itself.
  - type: statblock
    name: Fortunata
    kind: Nemesis
    desc: |-
      The *vilica* — slave-manageress — of a senator's vast country estate. She runs the storehouses, the cult, the slave gangs, and the accounts while the master is in Rome; nothing enters or leaves without her tally.
    chars:
      Br: '2'
      Ag: '2'
      Int: '3'
      Cun: '4'
      Will: '4'
      Pr: '2'
    derived:
      Soak: '3'
      W.T.: '15'
      Def (M/R): 0/0
    fields:
    - label: Motivations
      text: |-
        Desire: to make the estate (and herself) indispensable. Fear: a new overseer. Strength: she holds the keys and the rationing. Flaw: she rules the slave quarters as her own fief.
    - label: Skills
      text: Knowledge (Rome) 2, Coercion 3, Negotiation 2, Survival 3, Vigilance 3, Discipline 3.
    - label: Talents
      text: Adversary 2; Morning Clients (among the estate's hands and freedmen).
    - label: Abilities
      text: |-
        **Keeper of the Stores:** she controls food, tools, and the slave gangs — on her ground, nothing is done without her leave. **The Estate's Memory:** she knows every debt, grudge, and hidden cache on the land, and rations both grain and mercy as tools.
  - type: p
    style: body
    text: |-
      **Sicilia** — *senatorial.* Rome's first overseas conquest, a quiet grain-island of old Greek and Punic cities, long past its war-front days — but it remembers its slave revolts. **Rome wants:** Grain for the city, and the quiet corruption of the grain fleet.
  - type: p
    style: body
    text: |-
      **Sardinia et Corsica** — *imperial/senatorial.* Mountainous islands whose interior tribes — the *Barbaria* — were never truly subdued; a place of banditry, mines, and exiles. **Rome wants:** Grain, minerals, and a hold on the western sea.
  - type: p
    style: body
    text: |-
      **Hispania** — *imperial (Tarraconensis, Lusitania) & senatorial (Baetica).* Rome's hardest school of empire; two centuries of Celtiberian guerrilla war and legendary sieges. Now the greatest mines in the empire honeycomb its hills. **Rome wants:** Silver and gold above all, oil from Baetica, and hard northern soldiers.
  - type: p
    style: body
    text: |-
      **Gallia** — *senatorial (Narbonensis) & imperial (the Three Gauls).* Narbonensis is “Italy outside Italy”; beyond it Caesar's conquered Three Gauls face the Rhine, their druids driven under and their tribes gathered yearly at the great altar of Lugdunum. **Rome wants:** Manpower, grain and wine, and the roads to the Rhine and Britain.
  - type: p
    style: body
    text: |-
      **Africa** — *senatorial (with an imperial legion in Numidia).* The land of destroyed Carthage — ritually cursed, then refounded — now booming with oil-rich estates, with desert nomads raiding the frontier road. **Rome wants:** Grain and olive oil on a vast scale; the breadbasket beside Egypt.
  - type: p
    style: body
    text: |-
      **Asia** — *senatorial.* Rich western Anatolia, willed to Rome by the last king of Pergamon: a glittering string of proud Greek cities (Ephesus, Pergamon, Smyrna) that still remember the tax-farmers' extortions. **Rome wants:** Tax revenue, trade wealth, and the prestige of the richest proconsulship.
  - type: p
    style: body
    text: |-
      **Macedonia et Achaea** — *senatorial.* Greece: a land living on its glorious past — philosophy, the Games, and the great sanctuaries — with a still-restless northern frontier against Thracian raiders. **Rome wants:** Cultural prestige, tourists and students, and a northern buffer.
  - type: p
    style: body
    text: |-
      **Aegyptus** — *the emperor's domain.* Ancient, bureaucratic, and polyglot along the Nile, crowned by seething Alexandria and temples older than Rome. No senator enters without the emperor's word. **Rome wants:** Grain — a huge share of the city's dole — plus papyrus, glass, and the Red Sea trade.
  - type: statblock
    name: Zenon of Alexandria
    kind: Nemesis
    desc: |-
      A Greek *navicularius* (shipping magnate) whose grain fleet is a sizeable share of the dole that keeps Rome fed and quiet. Suave, cosmopolitan, and keenly aware that he holds the city's hunger in his holds.
    chars:
      Br: '1'
      Ag: '2'
      Int: '4'
      Cun: '4'
      Will: '3'
      Pr: '3'
    derived:
      Soak: '2'
      W.T.: '13'
      S.T.: '16'
      Def (M/R): 0/1
    fields:
    - label: Motivations
      text: |-
        Desire: profit and standing in two worlds. Fear: the emperor's prefect, who can ruin him. Strength: he can speed or stall the grain fleet. Flaw: he plays Rome and Alexandria against each other.
    - label: Skills
      text: Negotiation 4, Knowledge (Rome) 3, Deception 3, Charm 3, Coordination 2, Vigilance 2.
    - label: Talents
      text: Adversary 2; a web of factors in every eastern port.
    - label: Abilities
      text: |-
        **Hold of the City's Hunger:** by hastening or delaying his fleet he can ease or inflame the Roman grain price — and the mob's temper with it. **Two Worlds:** equally at home in the Museum and the Forum, he adds [[boost]] to cross-cultural social checks.
  - type: p
    style: body
    text: |-
      **Syria** — *imperial (great command).* The eastern military command facing Parthia — several legions far from Rome, every ambitious general's dream and every emperor's fear — astride the caravan trade through Palmyra. **Rome wants:** A strong frontier army, the eastern luxury trade, and the revenues of ancient cities.
  - type: statblock
    name: Zabdibel of Palmyra
    kind: Nemesis
    desc: |-
      A caravan-prince of the desert city, lord of the routes that bring silk, spice, and incense from the East. He commands his own armed caravan-guard and treats with Rome and Parthia as a power, not a subject.
    chars:
      Br: '3'
      Ag: '3'
      Int: '3'
      Cun: '4'
      Will: '3'
      Pr: '4'
    derived:
      Soak: '4'
      W.T.: '16'
      Def (M/R): 1/1
    fields:
    - label: Motivations
      text: |-
        Desire: to keep Palmyra free and rich between two empires. Fear: a frontier war that closes the routes. Strength: wealth, his caravan-guard, and both empires' need of him. Flaw: he trusts no empire, and both know it.
    - label: Skills
      text: |-
        Negotiation 3, Knowledge (Rome) 2, Streetwise 3, Ranged 3, Coordination 2, Leadership 3, Survival 3.
    - label: Talents
      text: Adversary 2; Field Commander (his caravan-guard are a trained minion group).
    - label: Abilities
      text: |-
        **Lord of the Routes:** he can move goods — or people — across the eastern desert where Rome's writ fades, and knows what crosses the Parthian line. **A Prince, Not a Subject:** on his own ground his standing rivals a governor's; slight him and the caravans simply stop coming.
  - type: p
    style: body
    text: |-
      **Britannia** — *imperial.* The wild northwestern frontier at the edge of the world: a three-legion island of mist, druids, and the burnt memory of Boudica's revolt. Hadrian's Wall is coming. **Rome wants:** Prestige and conquest-glory, metals, hides, slaves — though many doubt it ever pays for its legions.
  - type: statblock
    name: Esico
    kind: Rival
    desc: |-
      A druid of the old faith, hunted since Rome put the sacred groves to the torch. He keeps the memory of free Britain and the old gods alive among the tribes, and a Roman column has never yet caught him.
    chars:
      Br: '2'
      Ag: '3'
      Int: '3'
      Cun: '4'
      Will: '4'
      Pr: '3'
    derived:
      Soak: '3'
      W.T.: '14'
      S.T.: '16'
      Def (M/R): 1/1
    fields:
    - label: Motivations
      text: |-
        Desire: to drive Rome back into the sea. Fear: the last grove felled. Strength: the tribes' faith and the land itself. Flaw: he will spend lives — others' and his own — for the cause.
    - label: Skills
      text: Knowledge (the Gods) 3, Survival 4, Stealth 3, Charm 2, Coercion 2, Vigilance 3.
    - label: Talents
      text: Adversary 1; Master of the land; a hidden network of believers.
    - label: Abilities
      text: |-
        **The Old Gods Watch:** in a [[Fated]] or [[Mythic]] Britannia his curses and omens bite — inflict fear or bank [[threat]] against those who defile the groves. **He Knows the Land:** on his own ground Rome's soldiers suffer [[setback]] to track or corner him, and the tribes shelter him.
  - type: p
    style: body
    text: |-
      **The Rhine & Danube Frontier** — *imperial (Germania, the Danube provinces).* The empire's armed edge and densest concentration of legions since the lost eagles of Teutoburg: a continuous line of forts facing Germans and Sarmatians, with Trajan's gold-rich Dacia freshly won. **Rome wants:** Defense above all — this is where the army lives — plus Dacian gold and frontier recruits.
  - type: statblock
    name: Lucius Petronius
    kind: Nemesis
    desc: |-
      The *primus pilus* — first-spear centurion — of a frontier legion: thirty years under arms, the iron spine of the camp, more feared and obeyed than the young senators who nominally command him.
    chars:
      Br: '4'
      Ag: '3'
      Int: '2'
      Cun: '3'
      Will: '4'
      Pr: '3'
    derived:
      Soak: '5'
      W.T.: '20'
      Def (M/R): 1/1
    fields:
    - label: Motivations
      text: |-
        Desire: the honour of the eagle, and a rich retirement. Fear: a broken line. Strength: the legionaries obey him before any tribune. Flaw: contempt for soft city politics.
    - label: Skills
      text: |-
        Melee 3, Ranged 3, Discipline 4, Leadership 3, Coercion 3, Knowledge (Warfare) 3, Resilience 3.
    - label: Talents
      text: Adversary 2; Field Commander; Commanding Presence.
    - label: Abilities
      text: |-
        **The Spine of the Legion:** troops under his eye gain [[boost]] and resist fear; he turns a wavering line. **The Soldiers Are His:** in a crisis the men look to Petronius, not the aristocrat in the fine cloak — a quiet, dangerous fact on a frontier far from Rome.
  - type: p
    style: body
    text: |-
      **Iudaea** — *imperial (equestrian governor, backed by Syria).* A small, turbulent province whose people will die rather than set the emperor's image in their Temple; the Great Revolt ended with that Temple in ashes. **Rome wants:** Order and the security of the east, taxes and balsam — and above all, quiet.
  - type: p
    style: small
    text: |-
      **At the table.** Provinces are where careers are made and lost: a governorship is a licence to grow rich (and a *repetundae* trial waiting to happen — see Scenario II), a frontier command is a springboard to the purple (and to civil war), and the edge of the map is where a campaign can leave the city behind entirely.
  - type: h3
    text: Dramatis Personae
  - type: p
    style: lead
    text: |-
      The great names of the age — ready to walk into the Republican scenarios in this book, drop in as cameos, or serve as models for the patrons and rivals of your own cast. They are drawn from the research wiki's figures; several make the book's own point that eloquence is only one road to power (Pompey and Marius ruled with almost none).
  - type: statblock
    name: Marcus Tullius Cicero
    kind: Nemesis
    desc: |-
      The Republic's greatest orator — a *novus homo* who climbed to the consulship on his voice alone, and never lets anyone forget it. Vain, brilliant, and politically brave in bursts.
    chars:
      Br: '1'
      Ag: '2'
      Int: '4'
      Cun: '3'
      Will: '2'
      Pr: '4'
    derived:
      Soak: '2'
      W.T.: '13'
      S.T.: '16'
      Def (M/R): 0/1
    fields:
    - label: Motivations
      text: |-
        Desire: the Republic (and his own glory). Fear: obscurity and exile. Strength: unmatched eloquence. Flaw: vanity — flatter him and he talks.
    - label: Skills
      text: |-
        Charm 3, Coercion 2, Deception 3, Knowledge (Law) 3, Knowledge (Rome) 3, Leadership 2, Negotiation 3, Vigilance 2.
    - label: Talents
      text: Adversary 2; Master Orator; Nobody's Fool; Captatio Benevolentiae.
    - label: Abilities
      text: |-
        **The Superweapon of Eloquence:** once per encounter, when Cicero wins an oratorical appeal he may upgrade its effect twice; on a [[triumph]] he sways the entire audience at a stroke. **Appeal to Pity:** he wins trials with weeping families and bared scars — add [[boost boost]] to a Pathos appeal.
    - label: At the Table
      text: |-
        The advocate for — or against — the PCs in any courtroom (Scenario II); the consul racing to expose Catiline (Scenario I). A dangerous ally whose pride is a handle.
  - type: statblock
    name: Marcus Porcius Cato (the Younger)
    kind: Nemesis
    desc: |-
      The incorruptible Stoic, great-grandson of the Censor: rigid, fearless, and theatrically principled — yet capable of cold pragmatic alliance when the Republic needs it.
    chars:
      Br: '2'
      Ag: '2'
      Int: '3'
      Cun: '2'
      Will: '5'
      Pr: '3'
    derived:
      Soak: '3'
      W.T.: '15'
      S.T.: '18'
      Def (M/R): 0/1
    fields:
    - label: Motivations
      text: |-
        Desire: the *mos maiorum* restored. Fear: tyranny and corruption. Strength: integrity no coin can touch. Flaw: rigidity — he will break before he bends.
    - label: Skills
      text: |-
        Coercion 2, Cool 3, Discipline 4, Knowledge (Law) 2, Knowledge (Rome) 3, Leadership 2, Vigilance 2.
    - label: Talents
      text: Adversary 2; Stoic Discipline 2; Filibuster; Consular Gravitas.
    - label: Abilities
      text: |-
        **Unbuyable:** immune to bribery and to strain inflicted by insult, temptation, or flattery (*things indifferent*). **The Filibuster:** may talk out the Senate's clock to kill a motion without a vote. **The Good Death:** cornered, he will take his own life rather than submit — and the gesture only raises his Dignitas.
    - label: At the Table
      text: |-
        The conscience of the Senate and the hardest bloc to move (The Theater of Power). Use him to make the players *earn* a vote, or as the Stoic adversary given a name.
  - type: statblock
    name: Gaius Julius Caesar
    kind: Nemesis
    desc: |-
      The colossus: a patrician *popularis* of terrifying energy and charm whose oratory was merely the springboard for the fastest, boldest career Rome ever saw. The people adore him; the optimates are right to be afraid.
    chars:
      Br: '3'
      Ag: '3'
      Int: '4'
      Cun: '4'
      Will: '3'
      Pr: '4'
    derived:
      Soak: '4'
      W.T.: '18'
      S.T.: '18'
      Def (M/R): 1/1
    fields:
    - label: Motivations
      text: |-
        Desire: Dignitas above all — to be first in everything. Fear: to be any man's second. Strength: speed, genius, and the common people's love. Flaw: ambition, and a clemency that spares his killers.
    - label: Skills
      text: |-
        Melee 3, Ranged 2, Athletics 2, Charm 3, Coercion 3, Deception 3, Knowledge (Rome) 3, Knowledge (Warfare) 4, Leadership 4, Negotiation 3.
    - label: Talents
      text: Adversary 3; Master Orator; Commanding Presence; Patronus.
    - label: Abilities
      text: |-
        **Celeritas:** Caesar takes two actions on his turn where another takes one, in war and in politics alike. **The People's Champion:** against any attempt to check or shame him publicly, the plebs rally — add [[success]] and [[boost]] to his social checks before a crowd. **The Legions Are His:** his veterans' loyalty is to him, not the state.
    - label: At the Table
      text: |-
        The rising threat behind every late-Republican scene; a patron whose favour is intoxicating and ruinous. The event-horizon the whole setting bends toward.
  - type: statblock
    name: Gnaeus Pompeius Magnus
    kind: Nemesis
    desc: |-
      “The Great” — Rome's conquering hero, who reached unheard-of commands on military glory and patronage, not words. A reactive, uneasy public speaker who lets his reputation do the talking.
    chars:
      Br: '3'
      Ag: '3'
      Int: '3'
      Cun: '3'
      Will: '3'
      Pr: '3'
    derived:
      Soak: '4'
      W.T.: '20'
      S.T.: '16'
      Def (M/R): 1/1
    fields:
    - label: Motivations
      text: |-
        Desire: to be first citizen, and loved for it. Fear: a rival greater than himself (and there is one). Strength: an unmatched military record and a vast clientela. Flaw: vanity and indecision when the crowd is cold.
    - label: Skills
      text: Melee 2, Ranged 2, Leadership 4, Knowledge (Warfare) 4, Coercion 2, Cool 2, Negotiation 2.
    - label: Talents
      text: Adversary 3; Field Commander; Patronus.
    - label: Abilities
      text: |-
        **Reputation Precedes Him:** Pompey's Dignitas argues for him — add an automatic [[success]] to Leadership and first-impression checks. **But No Orator:** he is a reactive speaker; he suffers [[setback]] on improvised oratory before a hostile crowd, and must rely on spectacle, patronage, and his record instead.
    - label: At the Table
      text: |-
        The model of the general-statesman — proof that in Rome standing, not eloquence, often wins the Forum. A patron, a rival, or the looming power behind a command.
  - type: statblock
    name: Lucius Cornelius Sulla
    kind: Nemesis
    desc: |-
      The dictator who first marched a Roman army on Rome and proscribed his enemies by name — the precedent that haunts every civil war to come. Charming, cruel, and convinced of his own luck.
    chars:
      Br: '3'
      Ag: '2'
      Int: '3'
      Cun: '4'
      Will: '4'
      Pr: '3'
    derived:
      Soak: '4'
      W.T.: '18'
      S.T.: '18'
      Def (M/R): 1/1
    fields:
    - label: Motivations
      text: |-
        Desire: to restore the aristocracy's rule — by terror if need be. Fear: the mob and chaos. Strength: ruthlessness and uncanny fortune. Flaw: cruelty that outlives its usefulness.
    - label: Skills
      text: |-
        Melee 3, Ranged 2, Coercion 4, Deception 3, Knowledge (Warfare) 3, Leadership 3, Knowledge (Rome) 2.
    - label: Talents
      text: Adversary 3; Commanding Presence; fearsome reputation.
    - label: Abilities
      text: |-
        **Felix (the Fortunate):** once per session Sulla may reroll any one check, trusting his luck. **Proscription:** he can post a name to a public list and make murder legal — terror that adds [[setback setback]] to anyone who would oppose him openly.
    - label: At the Table
      text: |-
        The dark precedent and a towering past (or present) menace for Republican play — the man who proved the army could take the city.
  - type: statblock
    name: Marcus Antonius (Mark Antony)
    kind: Nemesis
    desc: |-
      The soldier's soldier and crisis careerist: blunt, brave, hard-drinking, a reactive orator who sways troops and mobs with spectacle and plain speech rather than polished rhetoric.
    chars:
      Br: '4'
      Ag: '3'
      Int: '2'
      Cun: '3'
      Will: '3'
      Pr: '4'
    derived:
      Soak: '5'
      W.T.: '20'
      S.T.: '16'
      Def (M/R): 1/1
    fields:
    - label: Motivations
      text: |-
        Desire: glory, pleasure, and a great man's favour. Fear: being sidelined. Strength: soldiers love him. Flaw: his appetites — wine, women, and loyalty to the wrong patron.
    - label: Skills
      text: |-
        Melee 3, Ranged 3, Brawl 2, Athletics 2, Charm 2, Coercion 3, Leadership 3, Knowledge (Warfare) 2.
    - label: Talents
      text: Adversary 2; Field Commander; a rousing, reactive speaker.
    - label: Abilities
      text: |-
        **The Soldier's Friend:** add [[boost boost]] to rally troops or a crowd with blunt words and spectacle (the funeral oration that turned Rome). **Hard to Keep Down:** reduce Critical Injury results against him by 10 (minimum 1).
    - label: At the Table
      text: |-
        Muscle with a name — a dangerous ally or enforcer, and the model of the general who leads by swagger rather than Senate-craft.
  - type: statblock
    name: Gaius Marius
    kind: Nemesis
    desc: |-
      The new man from Arpinum who held the consulship an unheard-of seven times, reformed the army, and saved Rome from the northern tribes — a military genius and a political blunt instrument.
    chars:
      Br: '4'
      Ag: '3'
      Int: '2'
      Cun: '3'
      Will: '4'
      Pr: '2'
    derived:
      Soak: '5'
      W.T.: '22'
      S.T.: '16'
      Def (M/R): 1/1
    fields:
    - label: Motivations
      text: |-
        Desire: recognition the nobles deny him. Fear: being despised as a jumped-up peasant. Strength: the legions are his creation and his own. Flaw: no gift for politics or speech — clumsy and resentful in the Forum.
    - label: Skills
      text: |-
        Melee 3, Ranged 2, Athletics 2, Leadership 4, Knowledge (Warfare) 4, Discipline 3, Resilience 3.
    - label: Talents
      text: Adversary 3; Field Commander; Commanding Presence.
    - label: Abilities
      text: |-
        **Third Founder of Rome:** in command of an army Marius is nearly unbeatable — add [[success]] to his Knowledge (Warfare) and Leadership checks in the field. **The New-Model Army:** his landless recruits are loyal to *him*, not the state — the seed of every civil war to follow. **No Orator:** [[setback setback]] to formal oratory.
    - label: At the Table
      text: |-
        The template of the people's general whose soldiers outrank the Senate — and living proof that Rome can be ruled with a sword and almost no rhetoric at all.
  - type: statblock
    name: Imperator Caesar Augustus
    kind: Nemesis
    desc: |-
      The first citizen — model for every emperor who follows. He rules absolutely while seeming to rule not at all, having rebuilt one-man power behind the restored forms of the Republic. Patient, cold, and almost impossible to out-wait.
    chars:
      Br: '1'
      Ag: '2'
      Int: '4'
      Cun: '5'
      Will: '4'
      Pr: '4'
    derived:
      Soak: '3'
      W.T.: '16'
      S.T.: '22'
      Def (M/R): 1/2
    fields:
    - label: Motivations
      text: |-
        Desire: a stable order — with himself at its centre. Fear: a return to the chaos of the civil wars. Strength: patience and concealment. Flaw: he must control everything, and trusts almost no one.
    - label: Skills
      text: |-
        Charm 3, Coercion 3, Deception 4, Negotiation 4, Knowledge (Rome) 4, Knowledge (Law) 3, Leadership 3, Vigilance 3, Cool 3.
    - label: Talents
      text: Adversary 3; Nobody's Fool 2; Plausible Deniability; Consular Gravitas; Pater Patriae.
    - label: Abilities
      text: |-
        **The Mask of the Republic:** Augustus's *known wish* is law — against any faction he opposes, every check suffers [[setback]] (the Emperor's trump card, made flesh). **The Long Game:** immune to being out-waited or pressured; he can defer any decision without losing face. **Auctoritas Without Equal:** no one in Rome may raise their Dignitas against his in a public contest.
    - label: At the Table
      text: |-
        In the default Imperial era his heirs sit the throne — use Augustus as the template for *your* princeps: the distant, all-seeing power whose favour makes careers and whose suspicion ends them.
- title: Sources & Resources
  blocks:
