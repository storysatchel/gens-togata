      Soak: '2'
      W.T.: '11'
      S.T.: '—'
      Def (M/R): 0/0
    fields:
    - label: Motivations
      text: 'Desire: freedom. Fear: the rack. Strength: a doorkeeper''s memory for faces and hours. Flaw: he believes promises from anyone who holds power over him.'
