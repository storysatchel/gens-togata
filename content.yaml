    style: lead
    text: |-
      This setting is built on real scholarship and the words of the Romans themselves. Everything here was drawn from the texts below — the same shelf a GM can raid to go deeper, settle an argument, or steal a plot. The digital tools at the end turn that reading into maps, journeys, and props at the table.
