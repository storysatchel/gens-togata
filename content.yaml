      text: Coercion 2, Discipline 2, Melee 2, Vigilance 2
    - label: Talents
      text: Adversary 1.
    - label: Abilities
      text: 'By the Magistrate’s Authority: add [[boost]] to Coercion checks made
        to compel citizens in the magistrate’s name. **Magisterial Imperium:** while
        he accompanies a magistrate and carries the fasces, he adds automatic
        [[advantage]] to Coercion and Leadership checks against citizens who must
        yield the road; the ability lapses if he is separated from the magistrate.'
    - label: Equipment
      text: Fasces (Melee; Dam 5; Crit 3; Vicious 1), leather (+1 soak).
    type: statblock
  - name: Senator / Patrician
    kind: Nemesis
    desc: 'Among the richest men alive: lawmaker, patron, and intriguer. His weapons
      are the law, the dinner-party, the mob, and the hired knife — never his own
      hand.'
    chars:
      Br: '2'
      Ag: '2'
      Int: '3'
