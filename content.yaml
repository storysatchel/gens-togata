        and stooped from the writing-desk; a plain tunic, the toga only on formal
        days; ink on the second finger of his right hand.
  - type: statblock
    name: Theochrestos son of Philon
    kind: Rival
    desc: Councillor of Cyrene, envoy of the province, and brother of the dead Aristion.
      **Wants:** Varus to say, in the Curia, that the sentence was bought. **Stance:**
