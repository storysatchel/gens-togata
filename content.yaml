    type: statblock
  - name: Popularis Tribune (Demagogue)
    kind: Nemesis
    desc: A tribune of the plebs who has learned that the mob is a weapon. He champions
      the poor, the grain dole, and land reform — sincerely, cynically, or both —
      and can veto the Senate and summon a riot in an afternoon. *(His independent
      veto and sacrosanctity are Republican; under the High Empire the* princeps *holds*
      tribunicia potestas *and a tribune can no longer check him.)*
    chars:
      Br: '2'
      Ag: '2'
      Int: '3'
      Cun: '3'
      Will: '4'
      Pr: '4'
    derived:
      Soak: '3'
      W.T.: '14'
      S.T.: '18'
      Def (M/R): 0/1
    fields:
    - label: Motivations
      text: 'Desire: power / the people''s love. Fear: obscurity. Strength: eloquence.
        Flaw: vanity.'
    - label: Skills
      text: Charm 3, Coercion 3, Deception 2, Knowledge (Rome) 2, Leadership 3, Negotiation
        2, Streetwise 2
    - label: Talents
      text: Adversary 1; Demagogue; Scathing Tirade.
    - label: Abilities
      text: 'Intercessio: once per Senate encounter, veto a motion outright (see The
        Senate). Voice of the Mob: may rally a Forum crowd to a single collective
        action.'
    - label: Standing
      text: Dignitas 3 (sacrosanct — his person is legally inviolable).
    type: statblock
  - type: statblock
    name: Provincial Governor (Praetor)
    kind: Nemesis
    desc: A senior Roman magistrate sent to govern a distant province with supreme
      judicial authority (*imperium*), balancing public duty against private enrichment.
