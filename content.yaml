meta:
  title: Gens Togata
  subtitle: Roleplaying in Imperial Rome
  tagline: Bread and circuses, the sword and the Senate.
  system: A setting for the Genesys Roleplaying Game
  legal:
  - |-
    This product was created under license. Genesys and its logo, and Genesys Foundry and its logo, are trademarks of Fantasy Flight Games.
  - |-
    Published under the Community Content Agreement for Genesys Foundry. Historical material is drawn from the public historical record. This is an unofficial, non-commercial fan supplement, not affiliated with or endorsed by any other publisher.
chapters:
- title: Introduction
  blocks:
  - type: p
    style: lead
    text: |-
      In Rome, a person's standing shapes what doors open, whose word is believed, and what a mistake may cost. A legionary, an advocate, a trader, and a freed artisan may have little in common, but each has ties to other people: a patron to satisfy, a household to protect, a rival to answer, or a favor to repay. Those ties can draw them into the same trouble.
  - type: p
    style: body
    text: |-
      **Gens Togata** is a setting supplement for **Genesys**. Its default setting is the High Empire, roughly the reigns of Trajan and Hadrian (*c.* 100–120 CE), though its material can be used elsewhere in the Principate. Players might serve together in a legion, pursue a case through the courts, keep a household's affairs in order, trade across the provinces, or investigate a sign the gods have sent. Their adventures can move from a crowded street to a governor's audience chamber, from a roadside shrine to the Senate.
  - type: p
    style: body
    text: |-
      At the table, the GM describes the world and portrays the people the characters meet; the players decide what their characters attempt. When an outcome is uncertain and consequential, the group uses a Genesys check: the dice establish whether the attempt succeeds and what advantages, complications, or other consequences accompany it. Those results change the situation, and play continues from there. A successful plea can win a hearing while making an enemy; a failed investigation can still uncover a useful lead.
  - type: sidebar
    title: A Note on Slavery and History
    body:
    - |-
      Rome was built on slavery, conquest, and brutal spectacle. This book does not sanitize that, but it is a game played by friends: treat enslaved characters as people with agency and goals (many of this book's archetypes and careers assume exactly that), keep the real cruelty at the “tasteful fade” your table prefers, and talk openly about lines and veils before you start. The horror is part of the drama; it is never the point.
  - type: p
    style: body
    text: |-
      Roman status is a starting point for play, not a substitute for a check. Citizenship, wealth, occupation, enslavement, and connections affect what a character can attempt, the difficulty or dice involved, and the stakes of success or failure. Reputation and favors can open opportunities or create obligations. Swords and law both have their place, and a dangerous situation need not end in a fight; agree together on the sort of risks and consequences the campaign will bring.
  - type: p
    style: body
    text: |-
      Start with the **Genesys Core Rulebook**, narrative dice, and character sheets. Players can choose an archetype and career in **Character Creation**, then consult the skills, talents, and equipment that interest them. The GM can use **Game Mastering Rome** for a campaign frame and **Starter Scenarios** for an adventure; **The Theater of Power** provides social-encounter options for everyone. The Gazetteer and Lexicon are references to visit as needed.
- title: Setting Overview
  blocks:
  - type: p
    style: lead
    text: |-
      Rome was less a nation than a legal order laid over tens of millions of people, and a person's place in it was fixed less by what they did than by what they were — free or enslaved, citizen or foreigner, the head of a household or someone owned by one. What follows sets out, plainly, the realities of that order; the chapters after it turn them into mechanics.
  - type: h3
    text: A World Run on Status
  - type: p
    style: body
    text: |-
      Birth set the baseline, not achievement. At the centre of every household stood the *paterfamilias*, its eldest living male, holding *patria potestas* — a power over children and dependants that the law scarcely limited: a father “might convey his son as well as his slave in property to a third person,” and “in reality the paternal and marital power was subject to no legal restrictions at all.”{{1}} Above the household, society was banded into fixed orders — senatorial, equestrian, ordinary citizen, freedman, free non-citizen, slave — and a Roman judged a stranger's rank from dress, name, and retinue before either of them spoke.
  - type: h3
    text: Slavery
  - type: p
    style: body
    text: |-
      Slaves were property, “looked upon in law as the property of the household and not as members of it.”{{2}} The farming manuals treat them exactly so: the standard advice on what a prudent owner should clear out each year ends with “the old and sick slaves, and if any thing else is superfluous you should sell that. The appetite of the good farmer is to sell, not to buy.”{{3}} That a moralist could feel the need to argue the contrary — “‘They are slaves,’ people declare. Nay, rather they are men”{{4}} — shows how total the ordinary contempt was. A freed slave (*libertus*) became a citizen, but still owed duties, and deference, to the master who had owned him.
  - type: h3
    text: Patronage
  - type: p
    style: body
    text: |-
      Roman society was tied together, top to bottom, by *clientela*. The client (*cliens*) came to his patron's house for the morning *salutatio*, lent him votes, voice, and presence, and received protection, legal backing, loans, and introductions in return. The bond was sworn and sacred, not a mere bargain: in the earliest Roman law, “if a patron violated his obligation to keep faith with his … dependent, the civil law had no penalty for such outrages, but the burden of the curse of the gods lay thenceforth on the head of the offender.”{{5}}
  - type: h3
    text: The Law
  - type: p
    style: body
    text: |-
      Roman law did not pretend to treat everyone alike; it was built on rank. A citizen could not lawfully be flogged or crucified, and could appeal against a magistrate's sentence; a slave had no legal person at all, and a slave's evidence was admissible only when extracted under torture. The principle “of the slave being completely destitute of legal rights … was maintained by the Romans with merciless rigour, and carried out to all its consequences.”{{6}} The same act — a blow, a theft, a killing — carried wholly different consequences according to who did it, and to whom.
  - type: h3
    text: The Crowd
  - type: p
    style: body
    text: |-
      The city of Rome held perhaps a million people, most of them poor and many idle. The free citizens among them were a political force in their own right: they voted in the assemblies, could be courted with grain-doles and games or inflamed in the Forum, and, in the Republic's last century, were organised into the street-gangs that rival politicians turned on one another.{{7}} The “bread and circuses” a later satirist sneered at were less decadence than statecraft — the standing cost of keeping a vast, armed-when-it-chose population quiet.
  - type: p
    style: body
    text: |-
      This book is set under the Principate, two generations into rule by one man. The outward machinery had shifted — genuine elections had passed from the people to the Senate, and the *princeps* now sat at the apex of patronage — but the substance beneath did not. Status by birth, chattel slavery, the *salutatio*, and *patria potestas* all outlived the Republic by centuries; the sources quoted above describe that enduring order, and this setting runs on it.
  - type: h3
    text: Technology Level
  - type: p
    style: body
    text: |-
      Classical antiquity (iron age, pre-gunpowder). **Notable technologies:** paved roads and the *cursus publicus* courier relay; aqueducts, hypocaust heating, and public baths; concrete (*opus caementicium*) and the arch; siege engines (*ballista*, *onager*, *scorpio*); war-galleys; coined money and sophisticated banking; Greek medicine and surgery. **Deliberately excluded:** firearms, the printing press, mechanical timekeeping, and the stirrup.
  - type: sidebar
    title: Dialing the Supernatural
    body:
    - |-
      [[Grounded:]] the gods are belief, politics, and theatre; omens and curses work only in the players' heads. [[Fated:]] Story Points are the will of the gods — omens, dreams, and auguries give real mechanical nudges (see GM Advice). [[Mythic:]] full Genesys magic, with priests, sibyls, and Egyptian sorcerers wielding it; monsters of myth stalk the provinces. Pick one before session zero.
  - type: h3
    text: Major Factions & Powers
  - type: list
    items:
    - |-
      **The Emperor & the *Domus*.** The *princeps* and his household, freedmen secretaries, and the Praetorian Guard. *Objective:* survive, be adored, and keep anyone else from becoming adored.
    - |-
      **The Senate.** Several hundred of the richest men alive, nostalgic for a Republic they would never actually restore. *Objective:* dignity, offices, and advantage — without being noticed wanting too much of it.
    - |-
      **The Legions.** Thirty-odd legions and their auxiliaries on the frontiers. *Objective:* pay, plunder, land on retirement — and loyalty to whichever general delivers them.
    - |-
      **The *Collegia* & the Mob.** Trade guilds, burial clubs, racing-faction supporters, and the gangs beneath them. *Objective:* grain, games, and turf.
    - |-
      **The Cults.** The old gods and their priesthoods, the Imperial Cult, and the rising “eastern” faiths — Isis, Mithras, the Christians. *Objective:* souls, status, and (for some) survival of persecution.
    - |-
      **Beyond the *Limes*.** Germans and Caledonians in the north, Parthia and its cataphracts in the east, desert tribes to the south — and, past them all, the half-legendary empires of the silk routes. *Objective:* raid, trade, or break Rome.
  - type: sidebar
    title: 'The Edge of the World: Serica'
    body:
    - |-
      At the far end of the silk routes lay *Serica* — the land of the *Seres*, the “Silk-People,” of whom Rome knew almost nothing and imagined almost everything. Roman writers reported them as atheists who lived more than two hundred years, who scraped silk from the leaves of trees, who were at once fierce and warlike and gentle and peaceful, blue-eyed and flaxen-haired, and who would never speak to a stranger. The road to them was said to be blocked by lions and tigers that devoured any party of fewer than a hundred armed men. The truth — a second vast empire of tens of millions, a mirror to Rome at the other end of the earth — never reached the Forum: Parthia sat astride the trade and jealously kept Roman and Eastern merchants from ever meeting. For a campaign this is a gift: the East is a place of rumor and fortune where the GM may invent freely, and a caravan that reaches *Serica* and returns is the stuff of legend.
  - type: h3
    text: Species
  - type: p
    style: body
    text: |-
      Everyone is **Human** (use the Human profile from the Core Rulebook). What matters in Rome is not *species* but *status* — citizen or non-citizen, free or enslaved, patrician or plebeian, Roman or provincial. Those are role-played and reflected in the archetypes, careers, and talents below, not in different stat lines. (In a [[Mythic]] Rome, the GM may of course admit fauns, nymphs, and the half-divine.)
  - type: endnotes
    title: Notes
    items:
    - |-
      Theodor Mommsen, *The History of Rome*, trans. W. P. Dickson — on *patria potestas*, the power of the household head.
    - |-
      Mommsen, *The History of Rome* (Dickson) — on the legal standing of slaves as property of the household.
    - |-
      Cato the Elder, *De Agri Cultura* 2, trans. Fairfax Harrison, *Roman Farm Management* (1913).
    - Seneca, *Moral Letters to Lucilius* 47.1, trans. Richard M. Gummere (Loeb Classical Library, 1917) — public domain.
    - |-
      Mommsen, *The History of Rome* (Dickson) — the archaic law of client-faith; cf. the Twelve Tables, *patronus si clienti fraudem fecerit, sacer esto*.
    - Mommsen, *The History of Rome* (Dickson) — on the slave's total absence of legal rights.
    - |-
      On the urban crowd as a political actor: Pamela Marin, *Blood in the Forum: The Struggle for the Roman Republic*; and Fergus Millar, *The Crowd in Republican Rome* (1998).
- title: Character Creation
  part: { label: Part I, title: Playing in Imperial Rome }
  blocks:
  - type: p
    style: lead
    text: |-
      Rome rewarded some kinds of person and ground down others. The archetypes below turn that truth into mechanics: seven concrete Roman origins, each with its own starting profile, a signature ability drawn from its place in the world, and a starting Dignitas that fixes where you stand before a word is spoken or a die is cast. Build a Roman character with one of these, or with any archetype from the Core Rulebook if your concept demands it.
  - type: h2
    text: Archetypes
  - type: p
    style: body
    text: |-
      Rome sorted people not by what they could do but by *what they were born* — free or enslaved, citizen or foreigner, highborn or common. The seven archetypes below capture that axis of status and origin. Each gives starting characteristics, derived thresholds, starting experience, one free skill rank (gained before spending XP, to a maximum of rank 2 at creation), a signature ability, and a **starting Dignitas** for the reputation economy (see *The Theater of Power*). This choice is permanent; spend your starting XP to raise characteristics, skills, and talents.
  - type: sidebar
    title: Archetype and Career Are Independent
    body:
    - |-
      Your **archetype** is who you were born; your **career** (next page) is what you have made of yourself. The two axes run orthogonally — *any archetype may take any career.* A Patrician who serves as a Legionary, a Slave trained as a Gladiator or a Medicus, a Freedman who argues as an Advocate, a Barbarian turned Explorator: all are classic Roman stories, and all are built by crossing one origin with one profession. Pick your origin here; pick your trade on the pages that follow.
  - name: Patrician
    kind: Highborn
    desc: |-
      Born to one of the families whose ancestors' wax masks line the atrium. You have never wanted for anything but respect — and that you intend to earn, or seize.
    chars:
      Br: '1'
      Ag: '2'
      Int: '2'
      Cun: '2'
      Will: '2'
      Pr: '3'
    fields:
    - label: Wound Threshold
      text: 10 + Brawn
    - label: Strain Threshold
      text: 10 + Willpower
    - label: Starting XP
      text: '100'
    - label: Starting Dignitas
      text: '3'
    - label: Starting Skills
      text: One rank in Knowledge (Rome) or Charm (max 2 at creation).
    - label: The Weight of Ancestors
      text: |-
        Once per session, when making a social check that leans on your name and lineage, add [[advantage]] [[advantage]]. Your blood opens doors that gold cannot. An opponent who publicly exposes a *fabricated* ancestor (the funeral *laudationes* were notorious for invented triumphs and false consulships) turns this against you — the [[advantage]] [[advantage]] becomes lost Dignitas for the scene, a natural use for a Dossier of Dirt.
    type: statblock
  - name: Equestrian
    kind: The Knightly Class
    desc: |-
      Of the *ordo equester* — rich enough to matter, not noble enough to be trusted with it. Yours is the class of financiers, officers, and tax-farmers who really make the Empire run.
    chars:
      Br: '2'
      Ag: '2'
      Int: '2'
      Cun: '3'
      Will: '1'
      Pr: '2'
    fields:
    - label: Wound Threshold
      text: 10 + Brawn
    - label: Strain Threshold
      text: 8 + Willpower
    - label: Starting XP
      text: '100'
    - label: Starting Dignitas
      text: '2'
    - label: Starting Skills
      text: One rank in Negotiation or Knowledge (Rome) (max 2 at creation).
    - label: Men of Business
      text: |-
        Once per session, spend a Story Point to declare you have the capital, credit, cargo, or well-placed contact already arranged — the quiet machinery of money working on your behalf.
    type: statblock
  - name: Plebeian
    kind: Freeborn Commoner
    desc: |-
      A freeborn citizen of the teeming city — raised on the grain dole and the games, you know every alley and every man worth knowing, and you have survived them all.
    chars:
      Br: '2'
      Ag: '2'
      Int: '2'
      Cun: '2'
      Will: '2'
      Pr: '2'
    fields:
    - label: Wound Threshold
      text: 10 + Brawn
    - label: Strain Threshold
      text: 10 + Willpower
    - label: Starting XP
      text: '110'
    - label: Starting Dignitas
      text: '1'
    - label: Starting Skills
      text: One rank in each of two different non-career skills (max 2 at creation).
    - label: A Nose for Trouble
      text: |-
        Once per session, as an out-of-turn incidental, move one Story Point from the GM's pool to the players' pool. The street always finds a way.
    type: statblock
  - name: Freedman
    kind: Libertus — Ex-Slave
    desc: |-
      Once property, now free — but the brand of servitude never quite fades. You owe duties still to the master who freed you, and you mean to make your sons his equals.
    chars:
      Br: '1'
      Ag: '2'
      Int: '3'
      Cun: '2'
      Will: '2'
      Pr: '2'
    fields:
    - label: Wound Threshold
      text: 8 + Brawn
    - label: Strain Threshold
      text: 12 + Willpower
    - label: Starting XP
      text: '100'
    - label: Starting Dignitas
      text: '1'
    - label: Starting Skills
      text: |-
        One rank in any single skill, reflecting the trade you were trained to (max 2 at creation).
    - label: The Master's Education
      text: |-
        Once per session, spend a Story Point as an incidental; during your next check that turn, count your ranks in the skill used as equal to your Intellect. They schooled you well — perhaps too well.
    type: statblock
  - name: Provincial
    kind: Peregrinus — Non-Citizen
    desc: |-
      A free man or woman of the provinces — Gaul, Syria, Egypt, Africa — living under Rome's peace without its citizenship, and quietly determined to earn, buy, or marry your way to it.
    chars:
      Br: '2'
      Ag: '3'
      Int: '1'
      Cun: '2'
      Will: '2'
      Pr: '2'
    fields:
    - label: Wound Threshold
      text: 10 + Brawn
    - label: Strain Threshold
      text: 10 + Willpower
    - label: Starting XP
      text: '100'
    - label: Starting Dignitas
      text: '1'
    - label: Starting Skills
      text: One rank in Ranged (Heavy), Riding, or Survival (max 2 at creation).
    - label: Skills of the Frontier
      text: |-
        Once per encounter, add [[advantage]] to a Ranged, Riding, Survival, or Perception check in the field. Should your character gain Roman citizenship in play (by service, grant, or purchase), raise their Dignitas by 1.
    type: statblock
  - name: Slave
    kind: Servus — Property
    desc: |-
      In law you are a thing, not a person — yet the household turns on your skill and your silence. You endure, you watch, and you wait for the day the cap of freedom is set on your head.
    chars:
      Br: '2'
      Ag: '2'
      Int: '2'
      Cun: '2'
      Will: '3'
      Pr: '1'
    fields:
    - label: Wound Threshold
      text: 8 + Brawn
    - label: Strain Threshold
      text: 12 + Willpower
    - label: Starting XP
      text: '100'
    - label: Starting Dignitas
      text: '0'
    - label: Starting Skills
      text: One rank in Resilience, or in any single skill reflecting your duties (max 2 at creation).
    - label: Unbroken
      text: |-
        Add [[boost]] to Discipline and Resilience checks while enslaved, bound, imprisoned, or outnumbered. If your character is manumitted in play, they become a
    - label: Freedman
      text: (gaining its ability and Dignitas).
    type: statblock
  - name: Barbarian
    kind: From Beyond the Limes
    desc: |-
      A German, Briton, Dacian, or Parthian — brought to Rome by trade, treaty, or iron chains. To the Romans you are a savage; let them keep thinking so.
    chars:
      Br: '3'
      Ag: '2'
      Int: '2'
      Cun: '2'
      Will: '1'
      Pr: '2'
    fields:
    - label: Wound Threshold
      text: 12 + Brawn
    - label: Strain Threshold
      text: 8 + Willpower
    - label: Starting XP
      text: '100'
    - label: Starting Dignitas
      text: 0 (outsider)
    - label: Starting Skills
      text: One rank in Survival or Melee (max 2 at creation).
    - label: Untamed Fury
      text: |-
        Add [[boost]] to melee combat checks on any round in which your character first engages a new target. Civilization has not dulled you.
    type: statblock
  - type: h2
    text: Careers
  - type: p
    style: body
    text: |-
      A career defines what your character is *trained* to do, independent of the archetype (origin) you chose above — cross any origin with any of these professions. Players can use any of the careers in the Core Rulebook, create their own at GM discretion, or select one of the careers below, each tuned to Roman life. As usual, before spending experience during character creation, a character may choose **four** of their eight career skills and gain one rank in each.
  - type: h4
    text: Legionary
  - type: p
    style: body
    text: |-
      The backbone of the Empire: a professional soldier of a citizen legion, drilled in formation fighting, field engineering, and the long march. Career skills: **Athletics, Brawl, Discipline, Melee, Ranged (Light), Resilience, Survival, Knowledge (Warfare)**.
  - type: h4
    text: Centurion & Officer
  - type: p
    style: body
    text: |-
      The men (and, in the auxilia, sometimes the chieftains) who lead Rome's soldiers and, often, its politics. Career skills: **Coercion, Cool, Discipline, Leadership, Melee, Ranged (Light), Vigilance, Knowledge (Warfare)**.
  - type: h4
    text: Gladiator
  - type: p
    style: body
    text: |-
      A fighter of the arena — condemned, enslaved, volunteer, or freed champion — schooled in a particular style of spectacular, lethal combat. Career skills: **Athletics, Brawl, Coordination, Melee, Charm, Cool, Resilience, Vigilance**.
  - type: h4
    text: Senator & Magistrate
  - type: p
    style: body
    text: |-
      The aristocrat climbing the *cursus honorum*: lawmaker, judge, provincial governor, spider at the center of a web of clients. Career skills: **Charm, Coercion, Deception, Leadership, Negotiation, Knowledge (Law), Knowledge (Rome), Discipline**.
  - type: h4
    text: Negotiator (Merchant)
  - type: p
    style: body
    text: |-
      Trader, banker, ship-owner, or tax-farmer — the people who actually move the Empire's wealth and know where every body is buried. Career skills: **Charm, Cool, Deception, Negotiation, Streetwise, Knowledge (Rome), Operating, Perception**.
  - type: h4
    text: Augur & Priest
  - type: p
    style: body
    text: |-
      Reader of omens, keeper of ritual, intermediary with the gods — and, not incidentally, a political power in their own right. Career skills: **Charm, Cool, Discipline, Knowledge (the Gods), Knowledge (Rome), Medicine, Vigilance, Leadership**.
  - type: h4
    text: Rhetor & Advocate
  - type: p
    style: body
    text: |-
      The orator, lawyer, and teacher: trained in Greek rhetoric to sway juries, assemblies, and dinner-parties. Career skills: **Charm, Cool, Deception, Negotiation, Knowledge (Law), Knowledge (Rome), Perception, Discipline**.
  - type: h4
    text: Medicus
  - type: p
    style: body
    text: |-
      The physician — army surgeon, arena doctor, or fashionable Greek practitioner — skilled in the limited but real medicine of the age. Career skills: **Cool, Knowledge (the Gods), Knowledge (Rome), Medicine, Perception, Resilience, Streetwise, Vigilance**.
  - type: h4
    text: Charioteer (Auriga)
  - type: p
    style: body
    text: |-
      Driver of the racing factions or the war-cart: idolized, short-lived, and the closest thing Rome has to a sports superstar. Career skills: **Athletics, Cool, Coordination, Driving, Operating, Mechanics, Streetwise, Vigilance**.
  - type: h4
    text: Explorator & Frumentarius
  - type: p
    style: body
    text: |-
      The scout, spy, and courier — eyes beyond the frontier and ears within it. Rome's intelligence service wore many hats. Career skills: **Deception, Perception, Ranged (Light), Riding, Skullduggery, Stealth, Streetwise, Survival**.
  - type: sidebar
    title: Status, Not Species
    body:
    - |-
      Consider noting each character's legal standing: [[Citizen]] (protected by Roman law, cannot lawfully be crucified or flogged), [[Peregrine]] (free provincial, not a citizen), [[Freedman]] (*libertus* — an ex-slave who owes duties to a former master), or [[Slave]] (property, with no legal person, but often skilled and trusted). Status feeds the dice rather than replacing them: it sets a social check's difficulty, adds [[boost]] or [[setback]] before the roll, decides who will deign to deal with you at all, and raises or lowers the stakes of being caught — see GM Advice.
- title: The Theater of Power
  blocks:
  - type: p
    style: lead
    text: |-
      Genesys models a conversation as a kind of combat — opposed social checks, **strain** as the health bar of an argument, and **Motivations** as the soft points in a target's guard. No historical setting rewards that framework like Rome, a civilization where a man could be destroyed in the Forum without a blade being drawn, and where the Senate, the law-court, and the dinner-couch were the real battlefields. This chapter supplies Roman tools that plug directly into the Social Encounters rules (Core Rulebook, Chapter 7): a reputation economy, four set-piece encounter structures (the **speech**, the **Senate**, the **court**, and the **salutatio**), Roman Motivation tables, new talents and gear, and purely social adversaries to be beaten with words.
  - type: p
    style: body
    text: |-
      *Everything here is an overlay on the standard rules.* Inflicting strain, compromise at half the strain threshold, capitulation above it, the [[advantage]]/[[triumph]] and [[threat]]/[[despair]] spends, learning a Motivation facet, and the group-size difficulty table all work exactly as written. The Roman flavor is in *which* skill fits, *which* Motivation is exposed, and *what the stakes are.*
  - type: h3
    text: 'Dignitas & Auctoritas: The Reputation Economy'
  - type: p
    style: body
    text: |-
      A Roman was his reputation. **Dignitas** is a character's public standing — the accumulated weight of ancestry, offices held, favors owed, and victories won. It is an optional setting trait rated **0–5**, set at creation by status and changed in play.
  - type: table
    style: gear
    columns:
    - Starting Dignitas
    - Who
    - Dignitas
    rows:
    - - Slave / outlaw / infamis
      - No standing in law; an actor or gladiator is *infamis*
      - '0'
    - - Commoner / freedman / provincial
      - A free plebeian, a *libertus*, a *peregrinus*
      - '1'
    - - Equestrian / notable
      - A wealthy knight, officer, or respected local
      - '2'
    - - Senatorial family
      - A senator or his heir
      - '3'
    - - Ex-magistrate (consular)
      - One who has held the great offices; a famous general
      - '4'
    - - First men of the state
      - The *princeps senatus*, the imperial house
      - '5'
  - type: p
    style: body
    text: '**What Dignitas does:**'
  - type: list
    items:
    - |-
      **It armors your reputation.** When another character makes a social check to *shame, discredit, insult, or publicly coerce* your character, they add [[setback]] equal to the amount your Dignitas exceeds theirs (to a maximum of two [[setback]]). The high and mighty are simply harder to bring low.
    - |-
      **It lends weight to authority.** When your character makes an *Ethos* appeal (see Oratory) or any social check that leans on their standing, add [[boost]] if their Dignitas is 3+, or [[boost boost]] if it is 5.
    - |-
      **It funds Auctoritas.** At the start of any social set-piece, your character gains a pool of **Auctoritas** equal to their Dignitas (minimum 1). Each point may be spent as an incidental to add [[boost]] to a social check, to a crowd/vote track, or to a favor — the influence their name buys in the room. The pool refreshes each set-piece.
    - |-
      **Revelatory Appeal** (*Logos*) — claim privileged knowledge the audience cannot check (Cicero's ever-wakeful “I know their every plan”): add [[boost boost]] to the appeal, but a [[despair]] exposes the bluff and costs you Dignitas for the scene.
  - type: p
    style: body
    text: |-
      **Gaining and losing it.** The GM raises a character's Dignitas by 1 for a landmark public success — winning a notorious trial, election to a great office, sponsoring magnificent games, a military triumph, saving a citizen's life (the *corona civica*). It falls by 1 for *infamia*: losing such a trial, public cowardice or bankruptcy, a ruinous scandal, or conviction for a crime. Dignitas is slow to earn and ruinous to lose — which is precisely why Romans killed for it. **Optional — the hunger of prestige.** Pedigree alone never sustained a Roman house; standing had to be renewed each generation (by the early Empire, idle heirs of the Fabii were mocked for coasting on ancestral glory). A high-Dignitas character who wins no landmark success across a long stretch of play slowly loses a point of Dignitas, unless renewed by office, magnificent games, or martial glory.
  - type: h3
    text: Roman Motivations
  - type: p
    style: body
    text: |-
      Give every recurring Roman NPC (and encourage players to give their characters) Motivations from the lists below, used exactly as in the Core Rulebook: work *with* a Strength or Flaw to add [[boost]]; work *with* a Desire or Fear to add [[boost boost]]; work against them to add [[setback]] or [[setback setback]]. Players learn an NPC's Strength/Flaw by spending [[advantage advantage]], a Desire/Fear with [[advantage advantage advantage]], or any facet with a [[triumph]].
  - type: table
    style: motiv
    columns:
    - d10
    - Desire (what they chase)
    - Fear (what they dread)
    rows:
    - - '1'
      - '**Gloria** — fame that outlives them'
      - '**Obscurity** — to be forgotten, a nobody'
    - - '2'
      - '**The consulship** / high office'
      - '**Exile** — banishment from Rome'
    - - '3'
      - '**Wealth** — estates, slaves, silver'
      - '**Poverty & debt** — the shame of the ruined'
    - - '4'
      - '**Vengeance** on a rival house'
      - "**A powerful enemy's malice**"
    - - '5'
      - '**Freedom** / citizenship (for the enslaved)'
      - '**The mob** — riot, lynching, the arena'
    - - '6'
      - '**Pleasure** — luxury, love, the table'
      - "**The Emperor's suspicion**"
    - - '7'
      - '**The old Republic** / restoring virtue'
      - '**Impiety** — angering the gods, bad omens'
    - - '8'
      - "**Family** — heirs, the line's honor"
      - '**Betrayal** by a friend or freedman'
    - - '9'
      - '**Knowledge** — philosophy, the mysteries'
      - "**Loss of face** before one's peers"
    - - '10'
      - '**Power** for its own sake — the purple itself'
      - '**Death without a good name**'
  - type: table
    style: motiv
    columns:
    - d10
    - Strength (what steadies them)
    - Flaw (what undoes them)
    rows:
    - - '1'
      - '**Gravitas** — unshakeable dignity'
      - '**Pride** — cannot bear a slight'
    - - '2'
      - '**Eloquence** — a golden tongue'
      - '**Avarice** — greed clouds judgment'
    - - '3'
      - '**Loyalty** — to patron, legion, or friend'
      - '**Lust** / appetite — a notorious weakness'
    - - '4'
      - '**Piety** — the gods on their side'
      - '**Superstition** — ruled by omens'
    - - '5'
      - '**Cunning** — the long game'
      - '**Cruelty** — overreaches, makes enemies'
    - - '6'
      - '**Discipline** — Stoic self-command'
      - '**Rashness** — acts before thinking'
    - - '7'
      - '**Generosity** — a famous patron'
      - '**Vanity** — easily flattered'
    - - '8'
      - '**Industry** — tireless, competent'
      - '**Drink / the dice** — a vice to exploit'
    - - '9'
      - '**Courage** — faces down the mob'
      - '**A guilty secret** — a lever for blackmail'
    - - '10'
      - '**Nobility** — the weight of ancestors'
      - '**Naivety** — trusts the wrong people'
  - type: h3
    text: 'Oratory: The Set-Piece Speech'
  - type: p
    style: body
    text: |-
      Trained oratory was a Roman's sharpest tool — but only one of several. Ancestry, wealth, patronage, military glory, and sheer *dignitas* carried as many arguments as eloquence did: Marius won seven consulships with almost no gift for speech, and Pompey and Antony leaned on reputation and spectacle over rhetoric. So treat a great speech as a force-multiplier for a strong position, not a substitute for one — a character rich in standing and connections can rule the Forum on a middling check. The Republican model is the **contio**, the non-voting public meeting a magistrate called to work the People before a vote; only a magistrate could summon one, so a private citizen needed a friendly magistrate's invitation to speak — contio-access as a currency of alliance. Run a major speech as a short structured social encounter (3–5 rounds) against an **audience**, treated as a single target with a **strain threshold** set by its size and mood. Exceed the threshold and the audience is *won*; exceed half for a **partial** result. *(Under the emperors the contio and the voting assemblies lose their teeth; the imperial stages for this same mechanic are the crowd's acclamation at the games and the Circus, and a general's address to his troops.)*
  - type: table
    style: gear
    columns:
    - Audience
    - Size
    - Check difficulty
    - Strain threshold
    rows:
    - - A dinner-table, a handful of senators
      - 2–5
      - Average ( ●● )
      - '10'
    - - A jury, a committee, a cohort
      - 6–15
      - Hard ( ●●● )
      - '14'
    - - The full Senate, a theatre
      - 16–50
      - Daunting ( ●●●● )
      - '18'
    - - The Forum mob, the Circus
      - 51+
      - Formidable ( ●●●●● )
      - '22'
  - type: p
    style: body
    text: |-
      Adjust the threshold by ±4 for an audience already hostile or already sympathetic. On each of the orator's turns they make **one appeal** — a social check that inflicts strain as normal (1, plus 1 per uncanceled [[advantage]]). The three classical appeals map cleanly to Genesys social skills:
  - type: list
    items:
    - |-
      **Ethos — authority and character.** *Leadership* or *Charm.* “I, who have served Rome for thirty years, tell you…” Add the Dignitas bonus.
    - |-
      **Pathos — emotion.** *Charm* (to inspire love, hope, pity) or *Coercion* (to rouse fear, anger, hatred). The crowd's favorite.
    - |-
      **Logos — reason and proof.** *Negotiation*, or first spend a maneuver on a *Knowledge (Law)* or *Knowledge (Rome)* check to marshal evidence and **upgrade** the following appeal.
  - type: p
    style: body
    text: |-
      **Working the audience's Motivation** (give a crowd a collective Desire and Fear — the plebs *desire* grain and games, and *fear* hunger and foreign kings) adds [[boost boost]] as usual. A hostile orator may spend their turn **heckling** (an opposed Coercion or Deception check) to inflict strain back on the speaker and add [[setback]] to their next appeal.
  - type: procedure
    title: The Five Parts (optional maneuvers & once-per-speech beats)
    steps:
    - |-
      **Exordium** (opening): a maneuver — a disarming *captatio benevolentiae*. Add [[boost]] to the first appeal.
    - '**Narratio** (the facts): a *Knowledge* maneuver that upgrades the next *Logos* appeal.'
    - '**Confirmatio** (proof): your strongest *Logos* appeal.'
    - |-
      **Refutatio** (rebuttal): an action that removes an opposing orator's banked [[advantage]] / crowd goodwill, or adds [[setback setback]] to their next appeal.
    - |-
      **Peroratio** (climax): a final *Pathos* appeal. If it generates a [[triumph]] or [[advantage advantage advantage advantage]], it lands as a **Critical Remark** (5 strain) — the moment the hall erupts.
  - type: example
    text: |-
      Example — Marcus before the mob. The aedile Marcus (Dignitas 2) must calm a bread-riot (Forum mob: Formidable, threshold 22). **Round 1 — Exordium + Ethos:** he opens humbly (maneuver: [[boost]]) then invokes his record feeding them (Charm, +[[boost]] from exordium). He rolls 2 [[success]], 2 [[advantage]] → 3 strain, and spends the [[advantage advantage]] to learn the crowd's Fear: *hunger*. **Round 2 — Narratio + Logos:** a Knowledge (Rome) maneuver recalls the grain-fleet's arrival (upgrade), then Negotiation promising a distribution, now adding [[boost boost]] for playing to their Fear. The upgraded pool throws a [[triumph]] → a Critical Remark, 5 strain, “the ships are in the Tiber *tonight!*” Total 8+ strain, past half-threshold — the riot sags into a wary cheer. One more good round and they are his.
  - type: h3
    text: 'The Senate: A Contest of Blocs'
  - type: p
    style: body
    text: |-
      A Senate debate is a tug-of-war over a motion (a *senatus consultum*). Model the undecided house as 2–4 **bloc** minion groups — e.g., the *Old Guard* (traditionalists), the *Novi Homines* (ambitious new men), the *Military Clique*, and the *Emperor's Men* — each with a vote-weight and a Discipline/Cool to resist. Speakers (PC and NPC) take turns delivering appeals (as Oratory, above) aimed at a chosen bloc; inflicting strain past that bloc's wound threshold **commits** its votes to that side. When every bloc has committed (or the session ends), tally the votes.
  - type: procedure
    title: Procedural Trump Cards
    steps:
    - |-
      **Relatio & sententiae.** The presiding consul sets the motion and calls senators for their *sententiae* — the consuls-designate and senior *consulares* first, not by raw seniority. High standing literally speaks first and frames the debate (add [[boost]] to the opening side); under the Empire the consuls, and the emperor's wishes, set the order.
    - |-
      **Intercessio — the Tribune's veto.** In the Republic a Tribune of the Plebs may, once per session, veto the motion outright: a hard stop, answered only by winning him over, out-waiting him, or arranging his absence. *(By the High Empire this is a dead letter — the* princeps *himself holds* tribunicia potestas *and sacrosanctity, and the real veto is simply his known wish, below.)*
    - |-
      **Obnuntiatio & the auspices — the omens.** Most Romans believed the auspices truly spoke Jupiter's will, so this is a weapon of faith, not mere theatre, and a man caught fabricating a sign faced ruin. Two moves: a magistrate who **“watches the sky”** (Knowledge (the Gods)) declares the day's omens foul and *suspends all business for the day* (Bibulus paralysed Caesar's consulship this way); an **augur's formal ruling** that an act was taken *vitio* (flawed) can void a law already passed or compel a magistrate's abdication — a harder check and a graver blow. Faking either is a desperate, capital gamble, and a fine plot hook.
    - |-
      **Filibuster.** Talk until nightfall ends the session with no vote (Cato's trick). Resolve as an endurance contest — repeated Discipline or Resilience checks against rising difficulty.
    - |-
      **The Emperor's known wish.** If the *princeps* is believed to favor a side, every check for the other side suffers [[setback]] — and generating a [[despair]] may earn a *delator's* whispered report (see below).
  - type: example
    text: |-
      Example — swinging the Old Guard. The PCs back a motion to grant a frontier command. The Old Guard bloc (threshold 12) leans against. A PC with Senatorial Connections opens with Ethos, inflicts 4, then spends [[advantage advantage advantage]] to learn the bloc's collective Fear: *a new Caesar*. Next round, Logos reframes the command as temporary and defensive — [[boost boost]] for the Fear — 5 more strain, bloc committed. But a hostile Tribune raises *intercessio*; the party must spend a scene persuading (or compromising) him before the *discessio* (division) can be called.
  - type: h3
    text: 'The Courtroom: Advocacy'
  - type: p
    style: body
    text: |-
      Run a Roman trial as a speech-contest with the **jury** (*iudices*) as the audience. Prosecutor and defender alternate appeals against the jury's strain threshold; exceed it to carry the verdict. Roman advocacy was gloriously dirty — the law mattered less than the performance.
  - type: p
    style: body
    text: |-
      **Which court?** Roman justice ran across several tribunals, each a different flavour of this set-piece: the standing criminal courts (*quaestiones perpetuae*, the model for most trials), trials before the people (*iudicia populi*), and religious courts — a priest or a Vestal accused of *incestum* answered to the pontifical college, not a lay jury. In a sacral trial, swap **Knowledge (Law)** for **Knowledge (the Gods)** as the *Logos* skill and make the college the audience.
  - type: list
    items:
    - |-
      **Knowledge (Law)** as a maneuver marshals statute and precedent, upgrading the next appeal (your *Logos*).
    - |-
      **Witnesses & evidence** are banked [[boost]] (helpful) or [[setback]] (hostile) the GM hands out; discrediting a witness (opposed Coercion/Deception) flips one.
    - |-
      **Character assassination** — attack the opposing party's reputation directly, targeting a known Flaw (Coercion/Deception) to inflict strain on *their* advocate and lower their Dignitas for the scene.
    - |-
      **Appeal to pity** — the weeping family, the old general baring his scars — is a *Pathos* appeal with a prop, adding [[boost boost]]. Cicero won cases this way.
  - type: h3
    text: The Salutatio & the Favor Economy
  - type: p
    style: body
    text: |-
      Every morning, clients call on their patron (the *salutatio*) to pay respects and ask favors; the patron hands out the *sportula* (a dole of coin or food) and banks their loyalty. Mechanize this web with **Favors**: tradeable tokens representing a specific obligation owed.
  - type: p
    style: body
    text: |-
      **Two kinds of bond.** Favors run *down* **clientela** (patron over client) and *across* **amicitia** — reciprocal “friendship” between near-equals that was itself a political institution: letters of recommendation, invitations, a magistrate's leave to address a meeting. An *amicitia* Favor is called in between equals with no Dignitas-gap limit, but breaking one costs extra reputation, because it shames both parties.
  - type: procedure
    title: Using Favors
    steps:
    - |-
      A character **banks a Favor** by doing a meaningful service, winning one in a social encounter (a capitulation can be “you owe me”), or via the *Client Network* / *Patronus* talents.
    - |-
      **Spend a Favor** to call in a concrete, bounded help from that person: a letter of introduction, a sum of coin, a door opened, a witness produced, a vote in the Senate, a blind eye turned.
    - |-
      Favors have a **face**: a Favor from a senator is worth more than one from a shopkeeper. The GM caps what any single Favor can buy by the grantor's Dignitas and the risk involved.
    - |-
      **Breaking faith** — refusing a reasonable call on a Favor you owe — costs 1 Dignitas and makes an enemy. Rome remembered.
  - type: p
    style: body
    text: |-
      The same frame runs the **convivium** (dinner party), where seating is position — the place of honor (*locus consularis*) grants its occupant [[boost]] to social checks — and the intimacy lets guests learn one another's Motivations a step cheaper; and the **election**, a canvass that targets the voting tribes as blocs, won with promises, games, the *sportula*, and (illegally) outright bribery — *ambitus*, a [[triumph]]-worthy gamble that courts a ruinous prosecution if a [[despair]] turns up.
- title: New Skills
  blocks:
  - type: p
    style: lead
    text: |-
      Instead of a single general Knowledge skill, this setting uses three Knowledge skills tuned to the Roman world. They cover the specialized learning a Roman character is likely to have, and let players show different depths of expertise. Use these in place of the generic Knowledge skill, splitting its uses as described below. All three are Knowledge skills linked to **Intellect**.
  - type: h3
    text: Knowledge (Rome)
  - type: p
    style: body
    text: |-
      The Empire itself — its geography, provinces, peoples, roads, trade, history, and the tangle of its politics and bureaucracy. If it concerns how the Roman world is put together and who runs it, it falls here.
  - type: h4
    text: Your character should use this skill if…
  - type: list
    items:
    - They want to recall which family controls a province, or who the current governor is.
    - They want to plot the fastest road or sea route between two cities.
    - |-
      They want to know the correct office to bribe, the right festival to exploit, or the going rate for grain.
  - type: h4
    text: Your character should NOT use this skill if…
  - type: list
    items:
    - They want to argue a point of law before a magistrate — use **Knowledge (Law)**.
    - They want to interpret an omen or name a god's festival — use **Knowledge (the Gods)**.
    - |-
      They want to recall the deployment of a legion in battle — use **Knowledge (Warfare)** (a fourth, optional skill for military campaigns; GMs may fold it into Knowledge (Rome) for non-military games).
  - type: h3
    text: Knowledge (Law)
  - type: p
    style: body
    text: |-
      Roman law was vast, precedent-bound, and the chief weapon of the ambitious. This skill covers statute, precedent, contracts, citizenship, inheritance, and courtroom procedure.
  - type: h4
    text: Your character should use this skill if…
  - type: list
    items:
    - They want to find the clause that voids a contract or frees a slave.
    - They want to recall whether an action is lawful — and what the penalty is if it is not.
    - They want to tie an opponent in procedural knots before a court.
  - type: h4
    text: Your character should NOT use this skill if…
  - type: list
    items:
    - |-
      They want to *persuade* a jury rather than cite the law — that is Charm, Coercion, or Negotiation (though a Knowledge (Law) check can add [[boost]] to it).
    - They want to recall a historical event — use Knowledge (Rome).
  - type: sidebar
    title: Using Knowledge (Law) in a Trial
    body:
    - |-
      Run a Roman trial as a social encounter. Let a successful Knowledge (Law) check (difficulty by the obscurity of the point) establish a fact, upgrade the next speaker's social check, or add [[setback]] to the opposing advocate. [[Triumph]] might unearth a devastating precedent that reframes the case; [[despair]] might reveal that your own client is guilty of something worse.
  - type: h3
    text: Knowledge (the Gods)
  - type: p
    style: body
    text: |-
      The crowded religion of Rome: the Olympian gods and their Roman forms, household and state cults, ritual, festivals, omens, the reading of entrails and the flight of birds, and the strange new faiths from the East.
  - type: h4
    text: Your character should use this skill if…
  - type: list
    items:
    - They want to perform a rite correctly — a sacrifice, a purification, a funeral.
    - They want to read an omen, or recognize a bad one others have missed.
    - They want to identify a foreign cult, its practices, and who follows it.
  - type: h4
    text: Your character should NOT use this skill if…
  - type: list
    items:
    - |-
      They want to actually cast a spell in a [[Mythic]] Rome — that uses the relevant magic skill.
    - They want to heal the sick by mundane means — use Medicine.
  - type: sidebar
    title: Reading Omens (Fated / Mythic Rome)
    body:
    - |-
      In a Rome where the gods take a hand, let a character spend a maneuver and make a Knowledge (the Gods) check before a major undertaking. On success, the GM reveals one true thing about the near future (a boon or a warning); each [[advantage]] adds a [[boost]] the party may spend on a related check this session; [[triumph]] grants a free Story Point to the players' pool. On a [[despair]], the omen is misread — the GM gains a Story Point and a complication.
- title: New Talents
  blocks:
  - type: p
    style: lead
    text: |-
      The following talents suit Roman characters. They use the standard talent format; where a talent grants a career skill, it does so only when the character gains the talent.
  - type: h3
    text: Tier 1
  - type: h4
    text: Testudo
  - type: p
    style: body
    text: '**Tier:** 1   **Activation:** Active (Maneuver)   **Ranked:** No'
  - type: p
    style: body
    text: |-
      While your character is engaged with at least one ally who also has this talent, they may form a shield-wall. Until the start of your character's next turn, they and each such ally increase their melee and ranged defense by 1 (to a maximum of 2), but may not move.
  - type: h4
    text: Client Network
  - type: p
    style: body
    text: '**Tier:** 1   **Activation:** Passive   **Ranked:** No'
  - type: p
    style: body
    text: |-
      When your character takes this talent, they gain Streetwise or Knowledge (Rome) as a career skill. In addition, once per session they may call on a client or patron to collect a small favor — lodging, a meal, a message carried, a door left unlocked — even if none is owed.
  - type: h4
    text: Legion Veteran
  - type: p
    style: body
    text: '**Tier:** 1   **Activation:** Passive   **Ranked:** No'
  - type: p
    style: body
    text: |-
      When your character takes this talent, they gain Discipline or Melee as a career skill. In addition, once per session they may collect a small favor from a current or former soldier of the legions, even if none is owed.
  - type: h4
    text: Freedman's Hustle
  - type: p
    style: body
    text: '**Tier:** 1   **Activation:** Passive   **Ranked:** No'
  - type: p
    style: body
    text: |-
      When your character takes this talent, they gain Negotiation or Skullduggery as a career skill. In addition, once per session they may collect a small favor from a fellow freedman or slave in a Roman household, even if none is owed.
  - type: h4
    text: Gladiatorial Training
  - type: p
    style: body
    text: '**Tier:** 1   **Activation:** Passive   **Ranked:** No'
  - type: p
    style: body
    text: |-
      Your character treats one chosen arena weapon type (sword, trident, net, or shield) as having the Accurate 1 quality, and may re-roll the Critical Injury once when striking with it (keeping the result of their choice).
  - type: h4
    text: Morning Clients
  - type: p
    style: body
    text: '**Tier:** 1   **Activation:** Passive   **Ranked:** No'
  - type: p
    style: body
    text: |-
      At the start of each session, your character has a number of banked Favors equal to their Dignitas (minimum 1), gathered from the petty clients who attend their morning *salutatio*. This is a fresh allotment each session: unused Favors do not accumulate or carry over.
  - type: h4
    text: Nomenclator's Whisper
  - type: p
    style: body
    text: '**Tier:** 1   **Activation:** Active (Incidental)   **Ranked:** No'
  - type: p
    style: body
    text: |-
      Once per social encounter, your character (or their accompanying *nomenclator* slave) recalls a stranger's name, family, and weakness: make an Average Knowledge (Rome) check; on success, immediately learn one Strength or Flaw of a present character without spending [[advantage]].
  - type: h3
    text: Tier 2
  - type: h4
    text: Pilum Volley
  - type: p
    style: body
    text: '**Tier:** 2   **Activation:** Active (Incidental)   **Ranked:** No'
  - type: p
    style: body
    text: |-
      Once per encounter, immediately before making a ranged combat check with a thrown javelin or *pilum*, your character may suffer 2 strain. If the attack hits, the target's shield (if any) is rendered useless until they spend a maneuver to free it, and the attack gains Pierce 2.
  - type: h4
    text: Field Engineer
  - type: p
    style: body
    text: '**Tier:** 2   **Activation:** Passive   **Ranked:** No'
  - type: p
    style: body
    text: |-
      Mechanics, Survival, and Knowledge (Warfare) are now career skills for your character. Once per session, given tools and an hour, they may improvise a bridge, rampart, ram, or siege work sufficient for the scene.
  - type: h4
    text: Senatorial Connections
  - type: p
    style: body
    text: '**Tier:** 2   **Activation:** Passive   **Ranked:** No'
  - type: p
    style: body
    text: |-
      Charm, Deception, and Knowledge (Rome) are now career skills for your character. Once per session, they may spend a Story Point to have a person of senatorial or equestrian rank owe them an audience.
  - type: h4
    text: Stoic Discipline
  - type: p
    style: body
    text: '**Tier:** 2   **Activation:** Passive   **Ranked:** Yes'
  - type: p
    style: body
    text: |-
      Once per encounter per rank of this talent, when your character suffers strain, they may reduce that strain by 2.
  - type: h4
    text: Captatio Benevolentiae
  - type: p
    style: body
    text: '**Tier:** 2   **Activation:** Active (Maneuver)   **Ranked:** No'
  - type: p
    style: body
    text: |-
      When your character opens a speech or social encounter, they may make this disarming overture: add [[boost boost]] to their first social check, and remove [[setback]] from it equal to their ranks in Charm.
  - type: h4
    text: Cross-Examine
  - type: p
    style: body
    text: '**Tier:** 2   **Activation:** Active (Action)   **Ranked:** No'
  - type: p
    style: body
    text: |-
      Make an opposed Coercion or Deception check against a target. On success, you learn whether a statement they made is a lie, and inflict strain as normal; with [[advantage advantage]], flip one of the target's banked [[boost]] (a witness, an alibi) into a [[setback]].
  - type: h4
    text: Filibuster
  - type: p
    style: body
    text: '**Tier:** 2   **Activation:** Active (Action)   **Ranked:** Yes'
  - type: p
    style: body
    text: |-
      Your character may speak to run out the clock. Once per encounter per rank, make a Resilience check; each success adds a “round” to the time a formal body must wait before it can vote or act.
  - type: h3
    text: Tier 3
  - type: h4
    text: Centurion's Command
  - type: p
    style: body
    text: '**Tier:** 3   **Activation:** Active (Maneuver)   **Ranked:** No'
  - type: p
    style: body
    text: |-
      Your character may make an Average Leadership check. For each [[success]], one ally within short range may perform an immediate maneuver as an out-of-turn incidental; for each [[advantage]], one such ally adds [[boost]] to their next combat check.
  - type: h4
    text: Arena Showmanship
  - type: p
    style: body
    text: '**Tier:** 3   **Activation:** Active (Incidental)   **Ranked:** No'
  - type: p
    style: body
    text: |-
      Once per encounter, after your character deals damage in melee with the crowd watching, they may make an Average Charm or Coercion check. On success, they recover strain equal to [[success]] rolled and add [[boost]] to their next check as the crowd roars their name.
  - type: h4
    text: Dirty Fighting
  - type: p
    style: body
    text: '**Tier:** 3   **Activation:** Passive   **Ranked:** No'
  - type: p
    style: body
    text: Your character's unarmed and improvised-weapon attacks gain the Disorient 2 quality.
  - type: h4
    text: Patronus
  - type: p
    style: body
    text: '**Tier:** 3   **Activation:** Passive   **Ranked:** No'
  - type: p
    style: body
    text: |-
      Charm, Leadership, and Knowledge (Rome) are career skills for your character. Once per session they may spend a Story Point to produce an appropriate client — a witness, a thug, a craftsman, a minor official — who owes them a Favor and arrives when needed.
  - type: h4
    text: Demagogue
  - type: p
    style: body
    text: '**Tier:** 3   **Activation:** Active (Action)   **Ranked:** No'
  - type: p
    style: body
    text: |-
      When addressing a crowd of 16 or more, your character may make a single Coercion or Charm check against the whole audience at once (using the group-size difficulty). On success the crowd takes one collective action your character names — cheer, disperse, march, or riot.
  - type: h3
    text: Tier 4
  - type: h4
    text: Master Orator
  - type: p
    style: body
    text: '**Tier:** 4   **Activation:** Active (Action)   **Ranked:** No'
  - type: p
    style: body
    text: |-
      Your character may make an opposed Charm, Coercion, or Negotiation check (vs. Discipline) against every listener within earshot at once, rather than one at a time. Resolve it as a single check; apply the result to each target individually.
  - type: h4
    text: Primus Pilus
  - type: p
    style: body
    text: '**Tier:** 4   **Activation:** Passive   **Ranked:** No'
  - type: p
    style: body
    text: |-
      Once per round, when an ally within short range of your character suffers a hit, your character may suffer 2 strain to let that ally increase their melee and ranged defense by 1 until the end of the round, barking orders to hold the line.
  - type: h4
    text: Consular Gravitas
  - type: p
    style: body
    text: '**Tier:** 4   **Activation:** Passive   **Ranked:** No'
  - type: p
    style: body
    text: |-
      Your character's Dignitas counts as 1 higher for the purpose of its armoring and authority effects, and when they speak first in a formal body, their side adds [[boost boost]] rather than [[boost]].
  - type: h4
    text: Devastating Peroration
  - type: p
    style: body
    text: '**Tier:** 4   **Activation:** Active (Action)   **Ranked:** No'
  - type: p
    style: body
    text: |-
      Once per encounter, when making a Pathos appeal, your character may suffer 3 strain to treat the check as having rolled one additional [[triumph]] for the purpose of landing a Critical Remark.
  - type: h3
    text: Tier 5
  - type: h4
    text: Will of Mars
  - type: p
    style: body
    text: '**Tier:** 5   **Activation:** Active (Incidental, out of turn)   **Ranked:** No'
  - type: p
    style: body
    text: |-
      Once per session, when your character or an ally within short range would be incapacitated or slain, your character may spend a Story Point: that character instead remains standing with 1 wound below their threshold and gains [[boost boost]] on their next check, as the war-god stays the blade.
  - type: h4
    text: Imperator
  - type: p
    style: body
    text: '**Tier:** 5   **Activation:** Passive   **Ranked:** No'
  - type: p
    style: body
    text: |-
      Allies within short range of your character add [[boost]] to all Discipline, Cool, and fear checks. Once per encounter, your character may spend a Story Point to let every ally within short range immediately recover strain equal to your character's Presence.
  - type: h4
    text: Pater Patriae
  - type: p
    style: body
    text: '**Tier:** 5   **Activation:** Passive   **Ranked:** No'
  - type: p
    style: body
    text: |-
      Allies within earshot of your character add [[boost]] to all social checks, and treat crowds as one step more sympathetic. Once per session, your character may spend a Story Point to cause a hostile crowd or committee to grant them a single hearing, no matter the circumstances — the authority of a living institution.
- title: Gear and Vehicles
  blocks:
  - type: p
    style: lead
    text: |-
      For the generic weapons and tools of a pre-gunpowder world, the Genesys Core Rulebook and its genre terminals serve well. This chapter describes the arms, armor, and equipment that give an Imperial Roman game its flavor, followed by the beasts and vehicles that carry Romans to war, to market, and around the race-track. Prices are given in **sesterces** (abbreviated HS). As a rough guide: 1 *denarius* = 4 sesterces = a laborer's daily wage; 1 gold *aureus* = 100 sesterces; a legionary earned about 900 sesterces a year before Domitian's raise.
  - type: h3
    text: Weapons
  - type: p
    style: body
    text: |-
      **Gladius.** The short, broad stabbing sword of the legions — the weapon that conquered the world, designed for close, disciplined butchery behind a shield wall.
  - type: p
    style: body
    text: |-
      **Pugio.** The military dagger; a sidearm, a tool, and — famously — the blade of choice for assassinating emperors.
  - type: p
    style: body
    text: |-
      **Spatha.** A longer sword favored by cavalry and, later, the whole army; more reach than the gladius but less suited to the press of the shield wall.
  - type: p
    style: body
    text: |-
      **Hasta.** The thrusting spear, carried by auxiliaries, triarii of old, and guardsmen. Its reach keeps enemies at bay.
  - type: p
    style: body
    text: |-
      **Pilum.** The heavy legionary javelin, hurled in a volley just before contact. Its soft iron shank bends on impact, fouling an enemy's shield and rendering it useless — and it cannot easily be thrown back (see the *Pilum Volley* talent).
  - type: p
    style: body
    text: |-
      **Fuscina & Rete (Trident and Net).** The signature arms of the *retiarius* gladiator: a long trident for reach and a weighted net to entangle and trip a foe before the kill.
  - type: p
    style: body
    text: |-
      **Caestus.** A leather boxing-glove bound with iron or lead and sometimes studded with spikes — the brutal gauntlet of the arena pugilist.
  - type: p
    style: body
    text: |-
      **Flagellum.** The whip — a tool of overseers and animal-handlers, occasionally a weapon, better at humiliation and control than killing.
  - type: p
    style: body
    text: |-
      **Funda (Sling).** Cheap, silent, and in trained Balearic hands astonishingly deadly; hurls stones or cast-lead bullets.
  - type: p
    style: body
    text: |-
      **Arcus (Composite Bow).** The recurved bow of eastern auxiliaries — Syrian, Cretan, and Parthian archers who gave Rome its missile power.
  - type: h3
    text: Armor & Shields
  - type: p
    style: body
    text: |-
      **Lorica Segmentata.** The iconic banded iron plate of the Imperial legionary: excellent protection, issued by the army and rarely seen in civilian hands.
  - type: p
    style: body
    text: |-
      **Lorica Hamata.** Mail; heavier but more flexible, worn by legionaries, auxiliaries, and the wealthy for centuries.
  - type: p
    style: body
    text: |-
      **Lorica Squamata.** Scale armor — bronze or iron scales sewn to a backing; flashy, favored by officers, standard-bearers, and some auxiliaries.
  - type: p
    style: body
    text: |-
      **Galea.** The military helmet, with cheek-guards and neck-flare. (If a character already wears body armor granting Soak, the helmet's benefit is included; worn alone it grants Soak +1.)
  - type: p
    style: body
    text: |-
      **Scutum.** The great curved rectangular shield — a wall of plywood and iron that is half the legion's doctrine. It can also be punched into a foe's face.
  - type: p
    style: body
    text: |-
      **Parma / Gladiator Shield.** Smaller round or rectangular shields used by lighter troops and arena fighters, trading protection for mobility.
  - type: p
    style: body
    text: |-
      **Manica.** A segmented arm-guard worn by some gladiators and eastern legionaries; when worn, grant the fighter Defensive 1 with their weapon arm (does not stack with a shield's defense).
