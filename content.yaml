  - type: h3
    text: Further Reading by Topic
  - type: p
    style: body
    text: |-
      For GMs who want to dig deeper — or settle a table argument — these are good next steps from the shelf above, grouped by subject. A star (★) marks works on the Imperial era, where the setting's default period is best served.
  - type: list
    items:
    - |-
      **Republic & its fall** — Mommsen, *The History of Rome*; Watts, *Mortal Republic*; Marin, *Blood in the Forum*; Beard, *SPQR* ★.
    - |-
      **Oratory, the contio & assemblies** — Morstein-Marx, *Mass Oratory and Political Power*; van der Blom, *Oratory and Political Career in the Late Roman Republic*; Botsford, *The Roman Assemblies*.
    - |-
      **Senate & magistracies** — Piña Polo, *The Consul at Rome*; Sandberg, *Magistrates and Assemblies*; Talbert, *The Senate of Imperial Rome* ★.
    - |-
      **Law & the courts** — Alexander, *Trials in the Late Roman Republic*; Robinson, *The Criminal Law of Ancient Rome* ★.
    - |-
      **Religion & augury** — Driediger-Murphy, *Roman Republican Augury*; Wildfang, *Rome's Vestal Virgins*; Beard, North & Price, *Religions of Rome* ★.
    - |-
      **Philosophy** — Seneca (Hadas, ed.), *Stoic Philosophy of Seneca*; Lucretius, *On the Nature of Things*.
    - |-
      **Household, slavery & family** — Draycott, *Roman Domestic Medical Practice*; Cato & Varro, *Roman Farm Management*; Bradley, *Slavery and Society at Rome* ★; McCall, *Clan Fabius*.
    - |-
      **Empire, patronage & informers** — Millar, *The Emperor in the Roman World* ★; Saller, *Personal Patronage under the Early Empire* ★; Rutledge, *Imperial Inquisitions* ★ (the *delatores*).
    - |-
      **Arena & games** — Fagan, *The Lure of the Arena* ★; Futrell, *Blood in the Arena* ★.
    - |-
      **Comparative empire** — Scheidel (ed.), *Rome and China* ★.
  - type: h3
    text: Digital Tools & Resources
  - type: list
    items:
    - |-
      **Itiner-e** (*itiner-e.org*) — A digital gazetteer of the roads of the Roman Empire — map a journey, province to province, along the roads your characters would actually walk.
    - |-
      **ORBIS** (*orbis.stanford.edu*) — Stanford's geospatial network model of the Roman world: the time and cost of travel between cities by road, river, and sea, season by season.
    - |-
      **Pleiades** (*pleiades.stoa.org*) — The community gazetteer of ancient places — the canonical reference for where a town, road, or river actually was.
    - |-
      **Digital Atlas of the Roman Empire (DARE)** (*dh.gu.se/dare*) — A zoomable map of the empire's cities, roads, and provinces, layered over modern geography.
    - |-
      **ToposText** (*topostext.org*) — Ancient texts geo-linked to every place they mention — read the sources and see the map at once.
    - |-
      **LacusCurtius** (*penelope.uchicago.edu/Thayer/E/Roman*) — A deep online library of Roman texts and topography, including Platner & Ashby's *Topographical Dictionary of Ancient Rome*.
    - |-
      **Perseus Digital Library** (*perseus.tufts.edu*) — Greek and Latin primary texts with translations and commentary — the originals behind the quotations in this book.
    - |-
      **Vici.org** (*vici.org*) — A crowd-sourced archaeological atlas of classical antiquity: find the fort, villa, or temple nearest any point.
    - |-
      **OCRE: Online Coins of the Roman Empire** (*numismatics.org/ocre*) — Every imperial coin type, searchable — ready-made portraits, propaganda, and props for the table.
    - |-
      **Where the Romans Fought** (*iosiflazaridis.github.io/battles-of-the-romans*) — An interactive map and downloadable dataset of every named Roman battle, 753 BCE–1475 CE: place, foe, result, commanders, the army that fought, and the sources — a trove for seeding campaigns and a veteran's war stories.
