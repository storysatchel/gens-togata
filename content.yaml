    - label: Abilities
      text: |-
        **Alio Die:** before the principium is called he may report an unfavorable sign to the presiding tribune, and the assembly must disperse (*obnuntiatio*; see *Procedural Trump Cards*). The report needs no roll; its cost comes later, if a lie is proved. **Deep Purse:** once per watch in Act II he may spend a Story Point to put a stopped distributor back to work. **Consular Standing:** Dignitas 4.
    - label: Equipment
